平顶帽、系红围巾的 Clawd 坐在左前景，手拿一枝黄水仙，排屋街一路通到谷底的井架和煤渣山；慢拉。（1s）\n2. 井架和转动的大轮特写，后面绿坡上爬满排屋；固定机位。（0.5s）\n3. 沿排屋街的横向跟拍：下工的矿工分三排往下走，脸上是煤灰，边走边唱；Clawd 走在前排，房子从身后滑过。（1s）"},{"h":"参考出处","t":["John Ford, 1941","Arthur C. Miller (cinematography)","Kyffin Williams","1941 poster"]}]},{"id":"O15","s":"O","cat":"彩色与战争 1939–1949","name":"忠勇之家","en":"Mrs. Miniver","desc":"二战英国本土战线的石印海报：砖红、深绿、奶油、灰蓝的有限套色，阴影是石版蜡笔颗粒。配影片结尾：被炸穿屋顶的乡村教堂里全村唱诗，喷火式战机从破洞上方飞过。","fit":"英国战时石印海报","prompt":"做成 1942 年英国战时的石印海报。造型简化有力，三版套印，略错位 1–3 像素：色版承载所有平涂；冷灰蓝蜡笔版压暗每一处阴影，带短而斜的石纹颗粒（不用网点）；墨绿黑轮廓版给每个形描一圈约画幅宽 1/500 的线，人物和云也要描。配色按用途：奶油 #EBDFC2 是纸色和亮部，灰蓝 #8497A6 是天空和阴影，砖红 #A23F2D 和深绿 #34503F 只作点缀，合计不超过画面四分之一；棕色和肤色由奶油加砖红调出；轮廓色 #1E2422。场景可以排满。天空用喷枪渐变，只有纸纹每秒 12 帧跳动。浅色光带顺着光源方向斜落，照到之处阴影版消失。人物正面站立，像海报里的人。镜头慢移带视差、上摇。对标 Frank Newbould、Abram Games。避免：网点阴影、干净的矢量边、大片饱和色。","prompt_en":"A 1942 British wartime stone-lithograph poster. Simple, strong shapes from three plates, 1-3 px off register: a colour plate with all flat fills; a grey-blue crayon plate darkening every shadow with short slanted stone grain; a green-black key line about 1/500 of frame width around every shape, figures and clouds included. Palette by role: cream #EBDFC2 paper and highlights, grey-blue #8497A6 sky and shadow, brick red #A23F2D and deep green #34503F as accents, at most a quarter of the frame; browns and skin mixed from cream and brick; key #1E2422. Scenes may be full. Airbrushed skies; only the paper grain boils at 12 fps. Pale light bands, angled from the source, cancel the shadow plate. Figures stand frontally. Camera: slow drifts, a tilt up. References: Frank Newbould, Abram Games. Avoid: dot screens, clean vector edges, big saturated fields.","file":"风格提示词/O_奥斯卡98部/O15_忠勇之家.md","img":"风格提示词/O_奥斯卡98部/O15_忠勇之家.jpg","year":"1942","tags":["2D"],"extra":[{"h":"技法关键词","t":["石印 + 蜡笔阴影版","Frank Newbould、Abram Games 二战海报","英国信息部海报配色"]},{"h":"导演说明","t":"Clawd 扮米尼弗夫人：花边草帽、赞美诗集和红色的「米尼弗夫人」玫瑰。全景里它在唱诗；切到近景时听见引擎声，停下抬头；第三个镜头是它的视线，穿过屋顶破洞看喷火式编队飞过。三个硬切，靠一个抬头的动作连起来。"},{"h":"成片里的分镜","t":"1. 全景，顺着被炸的教堂中殿看过去：村民站在长椅间唱诗，阳光成柱照下；Clawd 戴花边草帽坐在第一排，拿着赞美诗集和红玫瑰在唱。镜头微微后拉。（0.8s）\n2. Clawd 和玫瑰的近景：引擎声传来，它停下不唱，抬头看向屋顶。镜头轻推。（0.6s）\n3. 从教堂里垂直仰拍屋顶的破洞：断裂的椽子框住天空，喷火式战机排成 V 字飞过。镜头慢推并略微旋转。（1.1s）"},{"h":"参考出处","t":["William Wyler, 1942","Joseph Ruttenberg (cinematography)","Frank Newbould, Your Britain — Fight for it Now (1942)","Abram Games","Mrs. Miniver one-sheet (1942)"]}]},{"id":"O16","s":"O","cat":"彩色与战争 1939–1949","name":"卡萨布兰卡","en":"Casablanca","desc":"影片本身的样子：Arthur Edeson 的片厂黑白，画成精修剧照：带眼神光的柔焦特写、百叶窗投影、烟雾里的光柱。扮里克的 Clawd 是唯一的颜色。","fit":"好莱坞片厂柔光黑白","prompt":"40 年代好莱坞片厂黑白，画成精修剧照。形体是边缘干净的喷枪明暗块。人脸用短光位：主光照亮离镜头远的那半边脸，靠近镜头的脸颊落在暗部，留一块伦勃朗三角光；每只眼两个眼神光。条状影子借手边的东西（百叶窗、栏杆、树枝），斜落在物面上；光柱只在烟雾飘过处显形。明暗：三到四成画面是深黑，白色面积小而发光；外景天空中暗灰。调色：轻柔光溢出、S 曲线、细颗粒（±3%）、柔暗角、轻微闪烁；雾只在局部。只有故事围绕的那个主角的身体或衣服保留颜色（如 #D97757），皮肤和灯光都是灰阶。镜头：长运镜，推向一张脸，再拉远退进雾里。对标摄影师 Arthur Edeson（《卡萨布兰卡》，Michael Curtiz，1942）。避免：平光、整片灰雾、僵硬的胸像。","prompt_en":"1940s Hollywood studio black-and-white, painted like a retouched glamour still. Forms: smooth airbrushed tone blocks. Faces: short key (light on the face's far side from camera; the near cheek in shadow, holding a Rembrandt triangle of light), two catchlights per eye. Slatted shadows from anything at hand (blinds, railings, branches) fall diagonally across surfaces; light shafts show only in smoke or fog. Values: 30-40% of the frame deep black, whites small and glowing; outdoor skies mid-dark. Grade: diffusion glow, an S-curve, fine grain (±3%), soft vignette, faint flicker; fog stays local. Only the hero the story centres on keeps colour, on its body or costume (e.g. #D97757); skin and lamps stay grey. Camera: a long glide, a push to a face, a pull-back into fog. References: cinematographer Arthur Edeson (*Casablanca*, Michael Curtiz, 1942). Avoid: flat lighting, grey haze, stiff busts.","file":"风格提示词/O_奥斯卡98部/O16_卡萨布兰卡.md","img":"风格提示词/O_奥斯卡98部/O16_卡萨布兰卡.jpg","year":"1943","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["喷枪精修剧照人像","Arthur Edeson 片厂布光","柔光镜与银盐颗粒"]},{"h":"导演说明","t":"Clawd 扮里克：咖啡馆里是领结和香槟碟杯，机场上是软呢帽和竖起的风衣领。咖啡馆是一条不断的运镜，收在它举杯（\"Here's looking at you, kid\"）；正中那一拍是全段唯一的硬切，跳到机场，一个回头加一次长拉远收尾。"},{"h":"成片里的分镜","t":"1. 一条运镜穿过里克的咖啡馆：越过吊扇和烟雾滑到弹琴的萨姆和靠在琴上的伊尔莎，推向她泪光渐起的柔焦脸，再横移过整个房间，落到桌边系着领结的 Clawd，它举起香槟杯。（2.5s）\n2. 硬切到雾中机场：Clawd 戴软呢帽、竖着风衣领的近景，它回头一瞥；镜头长长地拉远，露出伊尔莎、雷诺上尉和雾里螺旋桨转动的 Electra 客机。（2.5s）"},{"h":"参考出处","t":["Michael Curtiz, 1942","Arthur Edeson (cinematography)","Casablanca one-sheet (1942)"]}]},{"id":"O17","s":"O","cat":"彩色与战争 1939–1949","name":"与我同行","en":"Going My Way","desc":"逆光的哥特彩色玻璃：铅条拼起的色玻璃、灰调描出的人脸、沙特尔蓝和宝石红边框，彩光洒在教堂地上。奥马利神父和唱诗班嵌在窗里，头顶是金色星章。","fit":"逆光哥特彩色玻璃窗","prompt":"逆光的哥特彩窗，占画面高度八到九成、宽度约六成，两边露出相邻发光的窗。每个形状是一块切好的玻璃：每块明度浮动约 8%，有流纹气泡和褐色内描边，外压黑铅条（宽约画幅宽 1/250）。天空和空地切成菱形格（每格约画幅宽 1/30）；边框是带圆珠的宝石红。主要人物至少占窗高一半，用尖细的深褐线描脸和衣褶。配色按用途：背景钴蓝 #1B3F9E，边框宝石红 #B3121F，高光金 #E3A526，铅条 #16161A；皮肤淡琥珀；景物用深绿、青绿。只有故事围绕的那个主角是橙色玻璃（如 #D97757）。亮玻璃光晕吃进铅条；彩光落在地面和窗台上。镜头：下摇、横摇，落到光斑上。对标沙特尔大教堂、Harry Clarke。避免：平涂、随意切割、窗四周大片暗墙。","prompt_en":"A backlit Gothic stained-glass window filling 80-90% of frame height and ~60% of width, neighbours glowing at edges. Every shape is cut glass: lightness varied ±8% per piece, streaks, seed bubbles, a brown edge mat, black lead (about 1/250 of frame width). Sky and empty ground: diamond quarries (about 1/30 of frame width); the border is ruby with beads. The main figure is at least half the window's height, in dark-brown grisaille line. Palette by role: background cobalt #1B3F9E, border ruby #B3121F, highlights gold #E3A526, lead #16161A; skin pale amber; scenery deep greens. Only the hero the story centres on is orange glass (e.g. #D97757). Bright glass blooms into the leads; coloured light spills onto floor and sill. Camera: tilt down, pan, settle on the pooled light. References: Chartres Cathedral; Harry Clarke. Avoid: flat fills, random cuts, dark empty wall.","file":"风格提示词/O_奥斯卡98部/O17_与我同行.md","img":"风格提示词/O_奥斯卡98部/O17_与我同行.jpg","year":"1944","tags":["2D"],"extra":[{"h":"技法关键词","t":["铅条拼色玻璃 + 灰调描绘","沙特尔蓝菱形格","Harry Clarke 宝石色"]},{"h":"导演说明","t":"Clawd 在玻璃画里扮奥马利神父：身体是最暖的陶土色玻璃，戴草帽和罗马领，拿指挥棒和歌本。它跟着拍子指挥，男孩们的口型各自错开。一个下摇从星章落到 Clawd，再硬切到唱诗班，最后落到地上的彩光。表演 1.8 倍速。"},{"h":"成片里的分镜","t":"1. 从金色八角星章和「SWINGING ON A STAR」飘带开始，沿尖拱窗往下摇，落到扮奥马利神父的 Clawd，它在玻璃里指挥男孩唱诗班。（1.3s）\n2. 玻璃唱诗班的中景：穿红袍白衣的男孩们在唱，镜头向右横摇，扫过 Clawd 举指挥棒的手。（0.6s）\n3. 切到教堂中殿：彩窗的颜色洒在长椅之间的大理石过道上，祭坛蜡烛亮着；镜头往地面下摇。（0.6s）"},{"h":"参考出处","t":["Leo McCarey, 1944","Going My Way one-sheet (1944)","Chartres Cathedral glass","Harry Clarke"]}]},{"id":"O18","s":"O","cat":"彩色与战争 1939–1949","name":"失去的周末","en":"The Lost Weekend","desc":"画面是打出来的：等宽字符落在 pica 网格上，灰阶靠字符疏密和叠打，色带墨色不匀。唐抱着打字机去当铺，于是整条街由打字机打出；Clawd 用橙色色带打。","fit":"打字机字符画","prompt":"所有画面都用打字机字符打出来：等宽粗体字逐个敲，落在固定网格上，格宽约画幅宽 1/150、格高是格宽两倍。85%–95% 的格子都要打字，只有最亮的光留纸白。灰阶靠字键分级（浅 . : -，中 = + o，深 X # M），暗部约占三成，用 M# 这样的叠打。形体靠边界清楚的字块和剪影读出。每种材质重复自己的字键（如竖向结构 I H，砖缝 _|，水 ~）。招牌或说明要打得能读。色带墨色不匀：半边缺墨，几个键总是偏高或偏低。纸 #EBE6DA，墨 #1D1C21；只有故事围绕的那个主角用红橙色带 #D4704F 打，至少占画面高度三分之一，影子仍是黑的。硬侧光投出边缘清楚的密集长影。画面在第一秒内打完，然后停住。对标 Paul Smith 的打字机画。避免：稀疏空白、看不出形的横向字条。","prompt_en":"Type every image: one bold monospaced glyph per keystroke, fixed grid, cells 1/150 of frame width wide, twice as tall. Strike 85-95% of cells; bare paper only for highlights. Grey from a key ladder (light . : -, mid = + o, dark X # M); darks (about 30%) are overstrikes like M#. Shapes read as crisp-edged fields, clear silhouettes. Each material repeats its own keys (e.g. I H verticals, _| courses, ~ water). Signs stay legible. Uneven ribbon: half-inked strikes, a few keys always high or low. Paper #EBE6DA, ink #1D1C21; only the hero the story centres on, at least 1/3 of frame height, is struck in red-orange #D4704F, its shadow black. Hard sidelight casts long, crisp, dense shadows. The picture types itself within the first second, then holds. Reference: Paul Smith's typewriter art. Avoid: sparse frames, shapeless streaks.","file":"风格提示词/O_奥斯卡98部/O18_失去的周末.md","img":"风格提示词/O_奥斯卡98部/O18_失去的周末.jpg","year":"1945","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["叠打的打字机字符画","Paul Smith、Flora Stacey","John F. Seitz 硬光黑白"]},{"h":"导演说明","t":"Clawd 扮唐·伯南：字符打出的软呢帽，提着想拿去当掉的打字机，四条腿逐帧交替迈步。街道像被打字机打出来一样在它身边出现；接着两个快速硬切，近景和 CLOSED 牌，把「当铺关门」交代完。表演 1.8 倍速。"},{"h":"成片里的分镜","t":"1. 第三大道高架铁下的一点透视全景：街景一行行打到纸上，戴软呢帽的 Clawd 提着打字机往前走；镜头微微后拉。（1.3s）\n2. Clawd 近景：字符打出的帽子、眼睛和身边灰色的打字机，背后是钢梁；镜头慢推。（0.6s）\n3. J. GOLDMAN 的 LOANS 当铺招牌特写，字母由字符拼成，下面挂着 CLOSED 牌；镜头慢推。（0.6s）"},{"h":"参考出处","t":["Billy Wilder, 1945","John F. Seitz (cinematography)","The Lost Weekend one-sheet (1945)","Paul Smith (typewriter art)","Flora Stacey"]}]},{"id":"O19","s":"O","cat":"彩色与战争 1939–1949","name":"黄金时代","en":"The Best Years of Our Lives","desc":"1946 年画报的新闻摄影跨页：铜版纸上的粗黑网点、中缝折痕、叠印的图片说明。深焦里拆光的 B-17 排到地平线；Clawd 单独印在专色橙版上，是唯一的颜色。","fit":"画报新闻摄影半调跨页","prompt":"每一帧当成 1946 年画报的新闻摄影跨页。先把场景按照片渲染成灰调（3D 或手绘都行）：低角度太阳、长影子、深焦，近处和地平线一样清楚。照片满版跨过两页，竖向中缝折痕从中间穿过，带一点阴影。再印成 45° 黑色网点，间距约画幅宽 1/250，米白铜版纸 #ECE6D8，墨 #1A1A1A，略有扩墨。从第一镜起，在安静的区域叠印一小块黑色标题和图说。只有故事围绕的那个主角走专色橙版（如 #D97757），换一个网角，错版 2–3 像素，黑版只留在它最深的暗部；主角至少占画面高度四分之一。镜头：走进全景，推进一个细节，再拉远，照片缩成一本摊开的杂志。对标摄影师 Gregg Toland、《生活》杂志战后摄影专题。避免：中缝切过主角，网点粗到照片碎掉。","prompt_en":"Each frame is a 1946 picture-magazine photo spread. Render the scene as a grey photo (3D or painted): low sun, long shadows, deep focus (near and far both sharp). The photo bleeds across both pages, crossed by a soft vertical gutter crease. Print as a 45° black halftone, dot pitch about 1/250 of frame width, ink #1A1A1A on off-white coated stock #ECE6D8. A short black headline and caption sit in a quiet area. Only the hero the story centres on, at least 1/4 of frame height, prints on its own spot-orange plate (e.g. #D97757) at another angle, 2-3 px off, black only in its deepest shadows. Camera: walk in, push to a detail, pull back to reveal an open magazine. References: cinematographer Gregg Toland; *Life* post-war photo essays. Avoid: the gutter cutting the hero, coarse dots that break the photo.","file":"风格提示词/O_奥斯卡98部/O19_黄金时代.md","img":"风格提示词/O_奥斯卡98部/O19_黄金时代.jpg","year":"1946","tags":["2.5D·B&W"],"extra":[{"h":"技法关键词","t":["45° 粗网点半调","Gregg Toland 深焦","1946 年画报跨页版式","专色橙版"]},{"h":"导演说明","t":"Clawd 扮弗雷德：上尉的船形帽和 B-3 飞行夹克的羊毛领。它沿着轰炸机走廊走，踩着拍子停下抬头；切进它望着的机头舱，再一路拉远，原来整个画面是 1946 年杂志上的一页。两个硬切，最后一镜是一次连续的拉远。"},{"h":"成片里的分镜","t":"1. 低机位深焦全景，飞机坟场：戴船形帽、竖着羊毛领的 Clawd 走到一架拆光的 B-17 机翼下，停步，抬头看玻璃机头；镜头右移并推近。（0.9s）\n2. 轰炸员的玻璃机头舱里往外看，一排排轰炸机伸向远山，Clawd 在画面左边缘；镜头慢推。（0.8s）\n3. 拉远：照片缩进一本摊开的杂志，标题 GRAVEYARD OF THE FORTRESSES，放在深色桌面上。（0.8s）"},{"h":"参考出处","t":["William Wyler, 1946","Gregg Toland (cinematography)","Life magazine post-war photo essays","The Best Years of Our Lives one-sheet (1946)"]}]},{"id":"O20","s":"O","cat":"彩色与战争 1939–1949","name":"君子协定","en":"Gentleman's Agreement","desc":"40 年代杂志插画式的石墨铅笔：先打构图线，再一遍遍平行排线，擦抹暗部、橡皮提亮。画面围绕酒店前台一次客气的拒绝逐步画出，只有 Clawd 是彩色铅笔。","fit":"40 年代杂志铅笔插画","prompt":"用石墨铅笔画成 40 年代杂志插画，画得完整、有控制。画面在前 1–1.5 秒内画成，然后停住：先淡淡的透视线和头部椭圆，再画两头轻中间重、转角出头的轮廓（宽约画幅宽 1/600），然后一到四遍近乎平行的排线（遍数越多越暗），间距约画幅宽 1/300，顺着形体走，再擦抹出平滑的过渡，用橡皮提亮。完成的画面几乎铺满：环境和背景都画充分，以中灰为主，深色约占一成半，只有最外一圈约十分之一淡成没画完的边角。纸 #F2EEE5 带轻齿纹，铅色 #2C2B2E。只有故事围绕的那个主角的衣服用彩铅（如 #D97757），皮肤仍是铅笔灰。戏在脸上。镜头：缓缓拉远，再切特写。对标插画家 Al Parker、Robert Fawcett。避免：交叉网格、潦草速写感、大片空白纸面。","prompt_en":"Graphite pencil like a 1940s magazine illustration, finished and controlled. The drawing builds in the first 1-1.5 s, then holds: faint perspective rays and head ovals, pressure-tapered contours (about 1/600 of frame width) overshooting at corners, then 1-4 near-parallel hatching passes (more for darker), about 1/300 of frame width apart, following the form, then rubbed tone and eraser lifts. The finished frame is toned nearly edge to edge: setting fully drawn in mid-greys, about 15% dark accents, only the outer tenth fading to loose margins. Paper #F2EEE5 with a light tooth; lead #2C2B2E. Only the hero the story centres on wears coloured pencil (e.g. #D97757) on its clothing; skin stays graphite. Faces carry the drama. Camera: a slow ease out, then cuts to close-ups. References: illustrators Al Parker and Robert Fawcett. Avoid: cross-hatch grids, scribbly sketching, a near-empty page.","file":"风格提示词/O_奥斯卡98部/O20_君子协定.md","img":"风格提示词/O_奥斯卡98部/O20_君子协定.jpg","year":"1947","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["石墨排线与擦抹","Al Parker、Robert Fawcett","彩色铅笔主体"]},{"h":"导演说明","t":"Clawd 扮记者菲尔：插 PRESS 卡的软呢帽、采访本和铅笔，站在前台不动。第一镜是画面在它身边被画出来；接着两个硬切给旁观者，经理客气的拒绝和女士斜过来的目光，意思全在这两张脸上。拍点落在剪切上。表演 1.8 倍速。"},{"h":"成片里的分镜","t":"1. 酒店大堂全景，画面当场被画出来，从构图线到排线：戴着插 PRESS 卡软呢帽的 Clawd 把采访本举到前台；镜头微微后拉。（1.1s）\n2. 从前台经理推到他的特写：微微欠身、微笑，眼睛却不笑，身后钥匙架上每把钥匙都还挂着。（0.8s）\n3. 固定机位中景：电梯旁披狐皮围脖的女士，眼睛回头瞟向 Clawd。（0.7s）"},{"h":"参考出处","t":["Elia Kazan, 1947","Gentleman's Agreement one-sheet (1947)","Al Parker","Robert Fawcett"]}]},{"id":"O21","s":"O","cat":"彩色与战争 1939–1949","name":"王子复仇记","en":"Hamlet","desc":"实时 3D 的艾尔西诺，高反差深焦黑白：体积雾、湿石头、碎成蕾丝白沫的海浪、银盐颗粒。照奥利维耶片中的城堡、雾中城垛和礁石来拍；Clawd 是唯一的颜色。","fit":"黑白 3D 雾中城堡","prompt":"真 3D 场景，40 年代末的深焦黑白。建筑是裸露的砌体，逐块砌出，带倒角和错缝（场景本有这类建筑时才用罗马式半圆拱）；湿的表面发黑发亮。阴天柔光，没有硬投影：深色实体衬着银灰天空。高度雾贴着画面下三分之一，成片里远景是 60%–70% 灰，中景清晰；云后亮天透出淡淡光柱。有水时：多层涌浪、蕾丝般的白沫、礁石上的水雾。后期：环境光遮蔽、轻辉光、高反差银色调色（有真黑，白不过曝），颗粒 ±3%，轻微闪烁。只有故事围绕的那个主角保留颜色（如 #D97757），所有光源都是灰的。镜头：慢慢漂近，沿高处横移，低机位仰拍主角。对标 Laurence Olivier《哈姆雷特》（1948）。避免：晴天硬影子、雾糊成一片白、贴图平铺。","prompt_en":"A real 3D scene in late-1940s deep-focus black-and-white. Built forms: bare masonry, block by block, bevelled, staggered (Romanesque arches only where the setting has them); wet surfaces dark and glossy. Soft overcast light, no hard shadows: dark masses against a silver sky. Low fog fills the lower third; the far background ends at 60-70% grey, the midground sharp; a bright patch behind cloud throws faint shafts. Water, if any: layered swells, lace foam, misty spray. Post: ambient occlusion, gentle bloom, high-contrast silver grade (true blacks, unclipped whites), grain (±3%), faint flicker. Only the hero the story centres on keeps its colour (e.g. #D97757); every light source stays grey. Camera: slow drift in, a track along a high edge, a low angle on the hero. Reference: Laurence Olivier, *Hamlet* (1948). Avoid: hard sunlit shadows, white-out fog, tiled textures.","file":"风格提示词/O_奥斯卡98部/O21_王子复仇记.md","img":"风格提示词/O_奥斯卡98部/O21_王子复仇记.jpg","year":"1948","tags":["3D·B&W"],"extra":[{"h":"技法关键词","t":["three.js 3D + 体积雾","Desmond Dickinson 深焦黑白","Roger Furse 光秃的罗马式布景"]},{"h":"导演说明","t":"Clawd 扮哈姆雷特：约里克的骷髅，海报上的白色蕾丝袖口、腰带和短剑。三个硬切走过这部片的三个画面：悬崖上的城堡、雾里的鬼魂、独白的礁石；最后一镜里骷髅踩着拍子举起来。表演 1.8 倍速。"},{"h":"成片里的分镜","t":"1. 从海上看的全景：海岬上的艾尔西诺，脚下浪花拍岸，Clawd 是右边礁石顶上的一个小身影；镜头缓缓漂近。（0.7s）\n2. 浓雾里的城墙步道：披甲的鬼魂从雾中显形、招手，Clawd 在近处看着它；镜头轻推。（0.8s）\n3. 低机位仰拍海边礁石：戴蕾丝袖口、挂短剑的 Clawd 在雾中城堡前举起约里克的骷髅；镜头慢推。（1.1s）"},{"h":"参考出处","t":["Laurence Olivier, 1948","Desmond Dickinson (cinematography)","Roger Furse (production design)","Hamlet one-sheet (1948)"]}]},{"id":"O22","s":"O","cat":"彩色与战争 1939–1949","name":"国王班底","en":"All the King's Men","desc":"南方竞选海报的木活字凸版：红、蓝、黑三色油墨印在米黄纸上，实地有木纹，供墨不匀，版间错位，肖像走半调网点。这是斯塔克的竞选集会，Clawd 用第四版橙墨印。","fit":"南方竞选木活字海报","prompt":"每帧都是木活字和刻版印的凸版海报。米黄纸 #EEE3C7 上印三色：蓝 #20488C 管天空、水和大块暗部，红 #C82C28 管暖色面和条纹，黑 #1E1B1E 管轮廓和字；只有故事围绕的那个主角多加一块专色（如 #D97757）。每色一版，错位 2–4 像素；实地挖空下层，只有网点处叠印。实地有木纹、缺墨针孔，边缘挤墨。中间调走粗网点（约画幅宽 1/200），各版网角不同，不超过画面三分之一。人物像麻胶版画：粗黑轮廓、刻刀白线、月牙阴影。画面约七成是图；一两行粗木活字短句写在图里的横幅和招牌上，带错位投影，字高约画面十分之一，用用户语言。镜头：小推，横移，重拍上特写一震（无音乐每 2 秒）。对标 Hatch Show Print。避免：碎灰调代替大块实地、套色精准得像电脑。","prompt_en":"A letterpress poster from wood type and cuts. Three inks on cream stock #EEE3C7: blue #20488C (sky, water, shadow masses), red #C82C28 (warm surfaces, stripes), black #1E1B1E (outlines, type); only the hero the story centres on gets a spot ink (e.g. #D97757). Each ink 2-4 px off register; solids knock out the inks beneath, halftones overprint. Wood grain, pinholed starved patches, squeezed edges. Mid tones: coarse dots (about 1/200 of frame width), varied angles, on at most a third of the frame. Figures as linocuts: heavy outlines, gouged white lines, crescent shadows. Picture fills about 70%; short wood-type lines (about 1/10 of frame height, user's language) with offset shadows sit on banners and signs. Camera: small pushes, a lateral track, a bump on each strong beat (or every 2 s). Reference: Hatch Show Print. Avoid: busy grey mid-tones, perfect registration.","file":"风格提示词/O_奥斯卡98部/O22_国王班底.md","img":"风格提示词/O_奥斯卡98部/O22_国王班底.jpg","year":"1949","tags":["2D"],"extra":[{"h":"技法关键词","t":["木活字凸版印刷","Hatch Show Print","麻胶版画人物","半调网点肖像"]},{"h":"导演说明","t":"Clawd 扮威利·斯塔克：往后推的软呢帽、拉松的红蓝领带，一只手里卷着讲稿。全景里拳头举到一半，中间一镜是人群的回应，特写里它踩着拍子一拳举到顶、再挥一次，镜头在出拳时轻轻一震。全部硬切。"},{"h":"成片里的分镜","t":"1. 小镇广场挂满彩旗的讲台全景：扮斯塔克的 Clawd 站在自己的巨幅半调肖像前，拳头举到一半，台下人群举着 STARK FOR GOVERNOR 牌子欢呼；镜头小幅推进。（0.9s）\n2. 切进人群：牌子上下挥动，拳头和喊叫的嘴，EVERY MAN A KING；镜头向右横移。（0.7s）\n3. Clawd 近景，软呢帽往后推、领带拉松：拳头一下举到顶，再挥一次；镜头在出拳那一下跟着一震。（0.9s）"},{"h":"参考出处","t":["Robert Rossen, 1949","Burnett Guffey (cinematography)","All the King's Men one-sheet (1949)","Hatch Show Print","Huey Long campaign posters"]}]},{"id":"O23","s":"O","cat":"宽银幕 1950–1959","name":"彗星美人","en":"All About Eve","desc":"艾尔·赫希菲尔德的百老汇漫画：粗细变化的流畅墨线、黑块对白、大量留白，每人只抓一个夸张特征。这部片讲剧场，派对就画成报纸剧场版漫画；Clawd 是唯一的颜色。","fit":"赫希菲尔德一笔画漫画","prompt":"画成 Al Hirschfeld 式的漫画，白纸黑墨。线条有弹性、长而连贯，能一笔画完的轮廓就一笔：两端约画幅宽 1/800，转弯处加粗到 1/250。深色衣服、头发和大件物体用实心黑块；灰调只用稀疏的平行排线。环境用细线画完整：建筑、家具、道具连同细节都画，物与物之间留白；约六成纸面留白，但绝不是空纸。每个人物靠姿态和比例夸张一个特征（长脖子、大头），五官具体。纸 #FBFAF6，墨 #131012；只有故事围绕的那个主角的身体或主要衣服用一种颜色平涂（如 #D97757），代替黑块。线条在第一秒内一笔笔写完，然后停住；留白处可有一句手写短句。镜头：拉远，横摇扫过场景，小推。避免：四肢僵直、火柴人、空荡荡的环境。","prompt_en":"An Al Hirschfeld-style caricature. Lines are elastic, long and continuous, one stroke per contour: about 1/800 of frame width at the ends, swelling to 1/250 on curves. Dark clothing, hair and big objects go solid black; grey only as sparse parallel hatching. The setting is fully drawn in thin line, architecture, furniture and props in detail, white kept between objects: about 60% paper white, never an empty page. Push one trait per figure (a long neck, a big head). Paper #FBFAF6, ink #131012; only the hero the story centres on has its body or main garment filled flat with one colour (e.g. #D97757) instead of black. Lines write on within the first second, then hold; a short hand-lettered line may sit in the white. Camera: ease back, pan across, push in. Avoid: stiff limbs, stick figures, a bare setting.","file":"风格提示词/O_奥斯卡98部/O23_彗星美人.md","img":"风格提示词/O_奥斯卡98部/O23_彗星美人.jpg","year":"1950","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["一笔墨线漫画","Al Hirschfeld 剧场漫画","手写台词"]},{"h":"导演说明","t":"Clawd 扮玛戈：一排黑色短卷发、一串珍珠、一杯马提尼，手搭在扶手上。第一镜是画面被画出来、台词被写出来；一个横摇找到角落里盯着她的伊芙；最后一个硬切后，玛戈踩着拍子举杯。表演 1.8 倍速。"},{"h":"成片里的分镜","t":"1. 玛戈家派对的全景一笔笔画出来：先是楼梯，再是宾客和钢琴；留白处手写出 \"FASTEN YOUR SEATBELTS, IT'S GOING TO BE A BUMPY NIGHT\"，扮玛戈的 Clawd 站在楼梯上；镜头微微拉远。（1.1s）\n2. 向右横摇扫过宾客：伯蒂、马克斯、艾迪森、卡斯韦尔小姐、钢琴师，停在角落里的伊芙。（0.8s）\n3. 楼梯上 Clawd 的近景：黑色卷发、珍珠项链，举起马提尼；镜头轻推。（0.7s）"},{"h":"参考出处","t":["Joseph L. Mankiewicz, 1950","All About Eve one-sheet (1950)","Al Hirschfeld"]}]},{"id":"O24","s":"O","cat":"宽银幕 1950–1959","name":"一个美国人在巴黎","en":"An American in Paris","desc":"拉乌尔·杜飞的水彩：快速的蓝黑墨线，底下是钴蓝、柠檬黄、玫瑰红的透明色块，线和色永远对不齐。影片结尾的芭蕾布景就是照杜飞画的，协和广场和舞者都用他的画法。","fit":"杜飞水彩芭蕾","prompt":"用拉乌尔·杜飞的水彩画法：先上色、后画线，两者永远对不齐。透明色块铺满大部分画面，带湿边、积色边和颗粒，比物体大一到四成，朝同一方向滑开约画幅宽 1/30：钴蓝 #2258CE 管天空和水，柠檬黄 #FCE02E 管光和地面，玫瑰红 #EC3A7C 管暖色面。重叠可混出紫或绿，绝不脏成棕，主角的色块别压在蓝上。再用蓝黑墨 #1E1E3A 快速细线把整个场景画满（线宽约画幅宽 1/700），有提按和甩尾：建筑、窗、人物、小配景；直边单独一笔、角上出头；树冠和云画成一串小圈。留白两到三成，皮肤是纸白。故事围绕的那个主角有自己的一块色（如 #D97757）。人物轻快有弹性。镜头：小推，踩拍子切（没有音乐约每 2 秒）。避免：颜色叠脏、线描死色块、线条稀疏。","prompt_en":"Paint in Raoul Dufy's watercolour manner: colour first, line second, never aligned. Transparent washes (wet edges, pooled rims, granulation) cover most of the frame, 10-40% oversized, slid one way by about 1/30 of frame width: cobalt #2258CE for sky and water, lemon #FCE02E for light and ground, rose #EC3A7C for warm planes. Overlaps mix violet or green, never brown; keep the hero's wash off blue. Then draw the whole scene densely in quick, thin blue-black ink (about 1/700 of frame width) with flicked ends: buildings, windows, figures, extras; straight edges overshoot corners; trees and clouds as looped strings. Ink #1E1E3A; bare paper 20-30%, skin included. The hero the story centres on gets its own wash (e.g. #D97757). Figures bounce. Camera: small pushes, cuts on the beat (or every 2 s). Avoid: muddy colour, lines tracing the colour, sparse line.","file":"风格提示词/O_奥斯卡98部/O24_一个美国人在巴黎.md","img":"风格提示词/O_奥斯卡98部/O24_一个美国人在巴黎.jpg","year":"1951","tags":["2D"],"extra":[{"h":"技法关键词","t":["松动墨线 + 错开的色块","拉乌尔·杜飞","明奈利的芭蕾布景","冷压水彩纸"]},{"h":"导演说明","t":"Clawd 扮海报上的杰瑞：往后歪的钴蓝软帽（吉恩·凯利那顶）、玫瑰红小领巾、甩出颜料带的画笔。三个镜头里它每一拍都在跳，舞步本身就是剪辑节奏：广场、和丽丝的近景、插满旗的街道。表演 1.8 倍速。"},{"h":"成片里的分镜","t":"1. 协和广场全景：舞者绕着喷泉旋转，后面是方尖碑和埃菲尔铁塔；扮杰瑞的 Clawd 戴钴蓝帽、拿画笔，在黄裙丽丝身边跳；镜头小幅推进。（1s）\n2. Clawd 跳在半空的近景，画笔甩出一条颜料带，丽丝的手臂伸进画面；镜头慢推。（0.8s）\n3. 切到插满三色旗的巴黎街道，楼面是粉、黄、蓝，Clawd 在街心行人之间蹦跳；镜头慢推。（0.8s）"},{"h":"参考出处","t":["Vincente Minnelli, 1951","Preston Ames and Irene Sharaff (ballet design)","Raoul Dufy, La Fée Électricité","Raoul Dufy, La Rue pavoisée","An American in Paris one-sheet (1951)"]}]},{"id":"O25","s":"O","cat":"宽银幕 1950–1959","name":"戏王之王","en":"The Greatest Show on Earth","desc":"Strobridge 马戏团彩色石印：铬黄、朱红、钴蓝平涂，粗黑轮廓，带网点、错版和石版颗粒。德米尔的大帐篷画成三圈海报，Clawd 扮塞巴斯蒂安做空中接人。","fit":"Strobridge 马戏团彩色石印","prompt":"19 世纪末马戏团彩色石印，仿 Strobridge 石印公司。平涂油墨加粗黑轮廓（约画幅宽 1/300）；阴影是月牙形加深，加排线；光从左上来。四块石版：铬黄 #F4C416、朱红 #D62C24、钴蓝 #1E4EA0、黑 #181210，印在暖奶油纸 #EBD9B4 上；叠印和浅网只能得到橙、绿、棕、土黄、浅蓝、灰。实地平印，只有天空、皮肤、地面这类渐变处挂网（网点约画幅宽 1/250），各版网角不同，错位 1–3 像素，带石版颗粒。故事围绕的那个主角用黄实地叠朱红实地，得到平的橙（如 #D97757）。构图用夸张透视：放射线汇向主要动作，几件事同时发生；有人群时画成许多可辨的小人，只有一个人物也成立。镜头：上摇，横移，在动作中切到高潮。避免：四色以外的颜色、只有圆点的人群、挂网挂成粉色的主角。","prompt_en":"A circus chromolithograph after the Strobridge Lithographing Co. (c. 1890). Flat ink, heavy black outlines (about 1/300 of frame width), crescent shadows, light from upper left. Four stones: chrome yellow #F4C416, vermilion #D62C24, cobalt #1E4EA0, key black #181210 on warm cream paper #EBD9B4; overprints and tints give only orange, green, brown, tan, pale blue, grey. Solids print flat; screens (dots about 1/250 of frame width) only on gradients (sky, skin, ground), each stone at its own angle, 1-3 px off register, stone grain. The hero the story centres on is solid yellow under solid vermilion, a flat orange (e.g. #D97757). Exaggerated perspective, radial lines converging on the action, several actions at once; any crowd is tiny individual figures, though a lone figure works. Camera: tilt up, lateral dolly, cut on action. Avoid: off-palette colours, dot-only crowds, a screened, pinkish hero.","file":"风格提示词/O_奥斯卡98部/O25_戏王之王.md","img":"风格提示词/O_奥斯卡98部/O25_戏王之王.jpg","year":"1952","tags":["2D"],"extra":[{"h":"技法关键词","t":["四色彩色石印","Strobridge 马戏团海报","平涂油墨 + 粗黑轮廓"]},{"h":"导演说明","t":"Clawd 扮伟大的塞巴斯蒂安：金色扇贝边的亮片斗篷，倒挂在秋千上。上摇找到秋千杠上的它，中间的大象横移让游行一直往前走，最后在动作中切到接人那一下，时间卡在秋千荡到右边、和海报构图一致的位置，它把手臂甩向观众。"},{"h":"成片里的分镜","t":"1. 大帐篷全景：三个表演圈、碗形看台、跑马道上的大象；沿帐篷往上摇，落到倒挂在最高秋千上的 Clawd。（0.8s）\n2. 横移跟拍大象游行：一头卷着一头的尾巴，背上坐着亮片舞女，前景是围栏和前排观众的后脑勺。（0.6s）\n3. 动作中切到接人：Clawd 披亮片斗篷、膝弯倒挂，一只手抓住粉衣女飞人，另一只手向观众甩开，秋千把它们荡向右边；镜头跟着微推并略微倾斜。（1s）"},{"h":"参考出处","t":["Cecil B. DeMille, 1952","The Greatest Show on Earth one-sheet (1952)","Strobridge Lithographing Co. circus posters"]}]},{"id":"O26","s":"O","cat":"宽银幕 1950–1959","name":"乱世忠魂","en":"From Here to Eternity","desc":"1953 年的高调黑白：硬朗阳光、压暗的天空、泛白的浪沫、映着天的湿沙，银盐颗粒和光晕。拍哈洛纳海湾浪里那一吻；坐在熔岩上吹军号的 Clawd 是唯一的颜色。","fit":"高调海滩黑白银幕","prompt":"50 年代初高调的黑白外景摄影，用 2D 画出照片感：不描线、不平涂，只用柔和渐变加细腻纹理（沙粒、岩石麻点、布纹）。明暗：约七成画面亮于中灰；天空浅中灰，只比亮云暗一档；深黑很少。默认正午硬朗的太阳，影子短而清楚；其他光线下仍保持浅天空和明亮结构。水、浪沫或雾在最亮处冲白，留住蕾丝细节；湿的表面映着天空。按印片收尾：柔和 S 曲线、略软的镜头、高光晕、每帧刷新的细颗粒（±4%）、轻暗角、轻微闪烁。只有故事围绕的那个主角整个人保留颜色（如 #D97757），明暗也有照片感。镜头：从天空下摇，平视紧框，再慢慢拉远。对标摄影师 Burnett Guffey（《乱世忠魂》）。避免：低调暗沉、死白一片、卡通平涂。","prompt_en":"Early-1950s high-key black-and-white photography, painted in 2D to read as a photo: no outlines or flat fills, only soft gradients plus fine texture (sand, rock pitting, cloth). Values: about 70% of the frame above mid-grey; sky light-mid grey, one step below the bright clouds; deep blacks small. Default: hard midday sun, short crisp shadows; under other light keep the pale sky and bright values. Water, foam and mist blow out at the peaks, keeping lace detail; wet surfaces mirror the sky. Print finish: gentle S-curve, slightly soft lens, halation, fresh fine grain (±4%), light vignette, flicker. Only the hero the story centres on keeps colour, whole figure (e.g. #D97757), shaded photographically. Camera: tilt down from the sky, tight level frame, slow pull-back. Reference: cinematographer Burnett Guffey (*From Here to Eternity*). Avoid: low-key frames, white blanks, cartoon fills.","file":"风格提示词/O_奥斯卡98部/O26_乱世忠魂.md","img":"风格提示词/O_奥斯卡98部/O26_乱世忠魂.jpg","year":"1953","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["1953 年高调黑白摄影","Burnett Guffey","银盐颗粒与光晕"]},{"h":"导演说明","t":"Clawd 扮普鲁伊特：橄榄色船形帽，拿着海报上那支军号。天空一镜往下摇进海湾，中间一镜海浪盖过那一吻，切到全景时 Clawd 踩着拍子把军号举到嘴边，像是在为这场戏吹号。"},{"h":"成片里的分镜","t":"1. 开在哈洛纳海湾上空，积云间飞过一队飞机；镜头往下摇到海面。（0.5s）\n2. 平视紧框浪里的恋人：浪头冲上来盖过他们，又退成蕾丝般的白沫，两人一直在吻；镜头慢推并向右漂移。（1.1s）\n3. 海湾全景：戴船形帽的 Clawd 坐在熔岩石台上，举起军号朝恋人吹响；镜头微微拉远。（0.9s）"},{"h":"参考出处","t":["Fred Zinnemann, 1953","Burnett Guffey (cinematography)","From Here to Eternity one-sheet (1953)"]}]},{"id":"O27","s":"O","cat":"宽银幕 1950–1959","name":"码头风云","en":"On the Waterfront","desc":"本·沙恩的社会现实主义：颤抖的转印墨线，下面是错开的平涂蛋彩色块，大手长脸的工人，颜色克制在灰蓝、砖红、赭黄。沙恩画的就是码头工人和工会，正是这部片的世界。","fit":"本·沙恩社会现实主义","prompt":"仿本·沙恩的社会写实蛋彩画。墨线（宽约画幅宽 1/500）会颤：细抖叠着慢摆，一个轮廓分两三笔、不闭合，偶有转印鬼线（旁边多一道偏移的淡线）。颜色是平涂蛋彩块，比墨线偏 2–4 像素，边缘毛糙，每块约三分之一面积带干笔拖痕，拖痕一笔宽（约画幅宽 1/100），不随色块放大；明暗只用同色深一档的硬边平色。配色按用途：灰蓝 #768492 管天空和冷色区，砖红 #9E4834、赭黄 #C89852 管房屋、土地和衣服，墨 #1F1A1A，底板暖白 #F0E9DA；皮肤浅赭；其他颜色由这几色加深或加灰。故事围绕的那个主角的主要衣服用唯一的暖色（如 #D97757）。人物头大手大、长脸重下巴，衣服下垂。镜头：短推，上摇，收在近景。避免：平滑渐变、干净闭合的轮廓、鲜亮讨喜的颜色。","prompt_en":"Ben Shahn's social-realist tempera. Ink lines (about 1/500 of frame width) jitter and wander, break each outline into two or three strokes, sometimes doubled by a fainter offset ghost (a blotted line). Flat tempera blocks sit 2-4 px off the line, rough-edged, dry-brush streaks (one brush wide, about 1/100 of frame width) over a third of each block; model form with a darker flat of the same hue. Palette by role: slate #768492 sky and cool areas, brick #9E4834 and ochre #C89852 ground, buildings, clothes, ink #1F1A1A, warm board #F0E9DA; skin pale ochre; other colours: these darkened or greyed. The hero the story centres on wears the one warm accent on its main garment (e.g. #D97757). Big heads and hands, long faces, heavy jaws, heavy clothes. Camera: short pushes, tilt up, close-up. Avoid: smooth gradients, clean closed outlines, cheerful colour.","file":"风格提示词/O_奥斯卡98部/O27_码头风云.md","img":"风格提示词/O_奥斯卡98部/O27_码头风云.jpg","year":"1954","tags":["2D"],"extra":[{"h":"技法关键词","t":["颤抖的转印墨线","平涂蛋彩色块","本·沙恩","50 年代美国社会现实主义"]},{"h":"导演说明","t":"Clawd 扮特里：深藏青针织帽、红黑格子的领子和袖口，手上停着一只鸽子。从码头上争抢的手硬切到安静的屋顶，两个镜头就把这部片的两个世界摆在一起；中间一镜鸽群飞起，近景停在 Clawd 和鸽子身上。表演 1.8 倍速。"},{"h":"成片里的分镜","t":"1. PIER B 门口清晨派工的中景：码头工人挤在门前，一双双手举起来抢铜工牌，Clawd 不在画面里；镜头轻推。（0.8s）\n2. 屋顶鸽舍全景：戴针织帽、立着格子领的 Clawd 举手托着一只鸽子，旁边是伊迪，身后是水塔和曼哈顿天际线，鸽群飞起；镜头慢推并略微上摇。（1s）\n3. Clawd 和手上灰鸽的近景，肩后是货轮、屋顶和天际线；镜头轻推。（0.8s）"},{"h":"参考出处","t":["Elia Kazan, 1954","Boris Kaufman (cinematography)","On the Waterfront one-sheet (1954)","Ben Shahn, Handball (1939)","Ben Shahn, Welders (1943)"]}]},{"id":"O28","s":"O","cat":"宽银幕 1950–1959","name":"君子好逑","en":"Marty","desc":"1955 年的电视录像，在布朗克斯暖色客厅的电视里播：扫描线、荧光晕、圆角凸屏、雪花，只有 Clawd 有颜色。原作是直播电视剧，所以当电视拍。","fit":"50 年代电视显像管录像","prompt":"把场景做成 50 年代木壳电视里播放的 kinescope 录像。屏幕里：黑白，冷色荧光调（白位约 #DCE6EA），画面发软（半分辨率再放大），有光晕、重影、撕裂带、缓慢滚动的暗带、少量雪花、抬起的黑位、闪烁和颗粒；只有故事围绕的那个主角保留颜色（如 #D97757），同样带这些瑕疵。显像管：圆角、四边外鼓，约 330 条扫描线，玻璃反光。屏幕外是暖色扁平插画风的客厅（赭黄墙纸、木家具、台灯），台灯打暖光，屏幕在附近墙面投出明显的冷蓝光。招牌镜头：电视占画面约六成，先停约 2 秒，再用 4–5 秒推进玻璃，直到节目铺满画面、扫描线还在，然后用演播室式稳定中景拍戏。对标导演 Delbert Mann 的 Philco 电视剧场直播剧。避免：雪花盖住画面、客厅沉闷平光。","prompt_en":"A 1950s kinescope playing on a wood-cabinet television. Inside the screen: black-and-white with a cool phosphor tint (#DCE6EA whites), soft (half resolution, scaled up), halation, ghosting, tearing bands, a rolling hum bar, light snow, lifted blacks, flicker, grain; only the story's hero keeps its colour (e.g. #D97757), under the same artefacts. Tube: rounded corners, sides bowing outward, about 330 scanlines, glass reflections. Outside, a warm flat-illustrated living room (ochre wallpaper, wood, a table lamp), lit warm by the lamp; the screen casts a clear cold-blue glow on nearby walls. Signature shot: hold about 2 s with the TV filling 60% of the frame, then push through the glass (4-5 s) until the broadcast fills the frame, scanlines visible, then steady TV-studio mid shots. Reference: director Delbert Mann's live Philco Television Playhouse dramas. Avoid: heavy snow, a dull, evenly lit room.","file":"风格提示词/O_奥斯卡98部/O28_君子好逑.md","img":"风格提示词/O_奥斯卡98部/O28_君子好逑.jpg","year":"1955","tags":["2D (B&W screen)"],"extra":[{"h":"技法关键词","t":["kinescope 黑白录像","圆角显像管与扫描线","暖色 50 年代客厅插画"]},{"h":"导演说明","t":"Clawd 扮马蒂：白色屠夫纸帽和一条条纹领带，害羞地靠在柱子边。推进玻璃把我们从客厅带进节目；双人镜头里它鼓起勇气穿过舞池，最后一个硬切落在邀舞上：它伸出手，克拉拉的笑随后才来。"},{"h":"成片里的分镜","t":"1. 妈妈的客厅：左边是台灯和转盘电话，右边是她的翼背椅，电视里在播星尘舞厅；镜头推进屏幕玻璃。（0.8s）\n2. 跨过舞池的双人镜头，扫描线仍在：戴屠夫纸帽、系条纹领带的 Clawd 从柱子边走向克拉拉；镜头向右跟移。（0.9s）\n3. 邀舞的中景：Clawd 伸出手，克拉拉抬眼看它，笑了；镜头轻推并向右漂移。（0.8s）"},{"h":"参考出处","t":["Delbert Mann, 1955","Philco-Goodyear Television Playhouse, Marty (1953)","Marty one-sheet (1955)"]}]},{"id":"O29","s":"O","cat":"宽银幕 1950–1959","name":"环游地球八十天","en":"Around the World in 80 Days","desc":"50 年代平面几何卡通：色块和墨线错位套印、墨线断续、奶油纸上的蜡笔颗粒。本片 6 分钟的片尾动画就出自 Saul Bass，正是这种现代主义画法。","fit":"50 年代 UPA 现代主义卡通","prompt":"50 年代 UPA 现代主义卡通。墨线 #221C19 约画面宽的 1/400，有粗细、偶尔断开；色块相对墨线统一朝一个方向错开约 1/300。物体由重叠的平面剪片拼成：一块受光面，加一块同色深约一成半的平色暗面。明亮通透：浅水绿天空和奶油纸 #F2E9D3 占大半画面，芥末黄 #E3A92B、青绿 #2B8C86、橙红 #D4452B 只作点缀；天空、草绿、灰蓝由这些色兑纸色得到。其他时段只改天空颜色。全画面轻蜡笔颗粒（亮度 ±5%），少量纸白斑点。海报构图：一个大图形（建筑、日轮或山峰），旁边是带轮廓的棱角人物。光束画成浅色平涂楔形。机位之间每一两秒硬切，段内慢视差。对标 UPA《Gerald McBoing-Boing》（1950）、Saul Bass《环游地球八十天》片尾（1956）。避免：渐变、套色太准、饱和色铺满画面。","prompt_en":"1950s UPA modernist cartoon. Uneven ink lines #221C19 about 1/400 of frame width, sometimes broken; colour blocks sit about 1/300 of frame width off them, all one way. Objects are overlapping flat cut-out facets: a lit face and a shadow face one flat step (about 15%) darker. Pale aqua sky and cream paper #F2E9D3 cover most of the frame; mustard #E3A92B, teal #2B8C86, orange-red #D4452B are accents; sky, greens and slate blues are these mixed toward paper. Other times of day change only the sky colour. Crayon grain ±5% brightness everywhere, few flecks. Poster layout: one big graphic shape (a building or sun disc), angular outlined figures beside it. Light beams: flat pale wedges. Hard cuts every 1–2 s; slow parallax drift. After UPA, *Gerald McBoing-Boing* (1950); Saul Bass, *Around the World in 80 Days* titles (1956). Avoid: gradients, perfect registration, saturated colour everywhere.","file":"风格提示词/O_奥斯卡98部/O29_环游地球八十天.md","img":"风格提示词/O_奥斯卡98部/O29_环游地球八十天.jpg","year":"1956","tags":["2D"],"extra":[{"h":"技法关键词","t":["UPA 有限动画","Saul Bass 片尾动画","1956 原海报配色","蜡笔颗粒印刷"]},{"h":"导演说明","t":"Clawd 扮福格：高礼帽、收起的雨伞、一杯香槟。每两拍一刀硬切：地图、全景、近景。红色航线绕地球跑一圈，气球飘过阿尔卑斯，近景落在路路通从雪峰上舀雪冰镇香槟。"},{"h":"成片里的分镜","t":"1. 地图插入镜头，定机位：青绿底上的地球仪转动，红色航线依次跑过伦敦、苏伊士、孟买、横滨、旧金山；右边一只小气球里坐着 Clawd。（0.9s）\n2. 全景：芥末黄配蓝色棋盘带的热气球飘过分面的阿尔卑斯和瑞士小镇，戴高礼帽的 Clawd 站在吊篮边；缓慢横移。（0.8s）\n3. Clawd 扮的福格近景：高礼帽、收起的雨伞、举着香槟杯，旁边路路通探身用冰桶从雪峰尖上舀雪；轻微推近。（0.8s）"},{"h":"参考出处","t":["Michael Anderson, 1956","Saul Bass (end-title animation)","UPA, Gerald McBoing-Boing (1950)","1956 original poster"]}]},{"id":"O30","s":"O","cat":"宽银幕 1950–1959","name":"桂河大桥","en":"The Bridge on the River Kwai","desc":"钉在绘图桌上的总布置图：普鲁士蓝底上的白线、折痕、水渍和红铅笔修改。电影讲一个执意把桥造好的上校，所以把桥画成他的工程图。","fit":"氰版工程蓝图","prompt":"青晒工程蓝图。图纸铺满画面（胡桃木绘图桌只在拉远时露出）：斑驳的普鲁士蓝纸 #143874，曝光不匀，边缘过曝发绿，有折痕和淡水渍。白线 #ECF4FF 锐利但是印出来的：轮廓约画面宽的 1/600，剖面线和尺寸线减半，曝光弱处断续，带几像素青色微晕。用制图语法把主体画得密：立面、剖面、详图圈、尺寸链、虚线、单线工程字、标题栏。批注和动作用红铅笔 #D63426，写用户的语言。唯一的主角是图上唯一手绘上色的东西，比图纸比例放大（至少占画面高五分之一），不透明水粉，一种暖色分几个深浅（比如橙 #D97757），其余没有暖色。镜头：推近时各层视差，再切详图。避免：霓虹发光、干净的数码蓝、空荡的图纸。","prompt_en":"Cyanotype engineering blueprint. The sheet fills the frame (the walnut drafting table shows only on a pull-back): mottled Prussian-blue paper #143874, uneven exposure, a greenish over-exposed margin, creases, faint water stains. White lines #ECF4FF, sharp but printed: outlines about 1/600 of frame width, hatching and dimensions half that, broken where exposure was weak, a slight cyan bloom. Draw the subject densely in drafting grammar: elevations, sections, detail circles, dimension chains, hidden lines, single-stroke lettering, a title block. Notes and actions in red pencil #D63426, in the user's language. The one hero subject is the only hand-painted element, drawn above scale (at least 1/5 of frame height), opaque gouache in one warm hue (e.g. orange #D97757); nothing else is warm. Camera: layered parallax push-in; cut to detail views. Avoid: neon glow, clean digital blue, sparse sheets.","file":"风格提示词/O_奥斯卡98部/O30_桂河大桥.md","img":"风格提示词/O_奥斯卡98部/O30_桂河大桥.jpg","year":"1957","tags":["2D"],"extra":[{"h":"技法关键词","t":["氰版晒图","木栈桥总布置图","红铅笔修改","水粉上色的主角"]},{"h":"导演说明","t":"Clawd 扮尼科尔森上校：英军大檐帽、军官短手杖，站在自己的桥上吹口哨。三个镜头讲因果：火车开上桥、引爆器手柄按下、桥跨炸断。爆炸也留在图纸里：红铅笔乱线成火球，排线画烟，不画真实的火光。"},{"h":"成片里的分镜","t":"1. 桥立面的中全景：Clawd（尼科尔森上校）站在桥面上吹口哨，音符往上飘，左下战俘列队行进，右边是引爆器，火车从最右边开上来；缓慢推近。（1s）\n2. 引爆器箱特写（PLUNGER – ONE PUSH）：T 形手柄按下，红铅笔引线通向炸药；轻微推近。（0.5s）\n3. 回到桥立面：炸药炸开，红铅笔乱线画成的火球裹在排线画的烟团里，桥跨和火车车厢落进河里；缓慢拉远。（1s）"},{"h":"参考出处","t":["David Lean, 1957","1957 original poster","Timber trestle engineering drawings"]}]},{"id":"O31","s":"O","cat":"宽银幕 1950–1959","name":"金粉世界","en":"Gigi","desc":"图卢兹-罗特列克式彩色石印：大块平涂、飞白轮廓、用喷溅墨点代替网点、讽刺漫画式面孔。琪琪的高光时刻是走进马克西姆餐厅、全巴黎回头盯着她，正是罗特列克画过的巴黎。","fit":"罗特列克美好年代石印","prompt":"罗特列克式美好年代彩色石印。大块平涂色版，边缘略手抖；人物和主要形体用饱蘸的笔刷勾轮廓，起笔钝、中段鼓、收尾分叉飞白，粗约画面宽的 1/250。牙刷弹的墨点只在背光面、投影和光晕处：1920×1080 下点径一到三像素，稀疏，合计不到画面一成半，颜色取底色深一档。大面用成组的同向干笔条纹。色板：黄 #F1C232、橙红 #E0602C、橄榄绿 #6E7036、黑 #1D1A16，底是带石版颗粒的奶油纸 #EFE3C3；另加灰暗的瓶绿和淡紫，肤色是橙红兑纸色。人物是夸张的讽刺侧脸，画出五官；前景放一个被画框裁掉的大人物。光平而匀，阴影也是平涂色版。镜头：浅视差，慢慢横摇过场景，落到中景。避免：慕夏式光环、平滑渐变、规整网点、满屏黑点。","prompt_en":"Belle Époque colour lithograph after Toulouse-Lautrec. Flat colour plates with wobbly edges; figures and main shapes outlined in a loaded brush (blunt start, swelling middle, split dry tail), about 1/250 of frame width. Crachis only on shadow sides, cast shadows and glows: 1–3 px dots at 1920×1080, sparse, under 15% of the frame, a darker step of the colour beneath. Large surfaces get grouped dry-brush streaks. Palette: yellow #F1C232, orange-red #E0602C, olive #6E7036, black #1D1A16 on cream stone-grained paper #EFE3C3, plus a muted bottle teal and greyed mauve; flesh is orange-red thinned with paper. Caricatured profiles with drawn faces; one large figure cropped by the frame edge in front. Flat, even light; shadows are flat plates. Camera: shallow parallax, a slow pan settling on a medium shot. Avoid: Mucha halos, smooth gradients, regular halftone, all-over speckle.","file":"风格提示词/O_奥斯卡98部/O31_金粉世界.md","img":"风格提示词/O_奥斯卡98部/O31_金粉世界.jpg","year":"1958","tags":["2D"],"extra":[{"h":"技法关键词","t":["彩色石印海报","图卢兹-罗特列克","牙刷喷墨点（crachis）","Cecil Beaton 服装"]},{"h":"导演说明","t":"Clawd 扮加斯东：高礼帽、白领结、手杖，琪琪挽着它。两人一直往里走，满屋的目光跟着转。三刀卡在拍子上：进门全景、横摇众人瞪眼、再回到两人，琪琪对镜头眨眼收尾。"},{"h":"成片里的分镜","t":"1. 马克西姆餐厅全景：戴高礼帽、白领结的 Clawd（加斯东）挽着琪琪走进来，两侧是被裁掉的前景剪影；最近的几桌客人开始回头；缓慢推近并向右漂移。（0.8s）\n2. 沿红丝绒卡座横摇：一张张讽刺漫画式的面孔转过来瞪着看，长柄眼镜举起，扇子停住。（0.7s）\n3. 两人继续往里走的中景；琪琪的目光转向镜头，眨了一下眼，和原海报一样；轻微右移。（1s）"},{"h":"参考出处","t":["Vincente Minnelli, 1958","Henri de Toulouse-Lautrec, Moulin Rouge: La Goulue (1891)","Toulouse-Lautrec, Divan Japonais (1893)","Cecil Beaton (costumes)","1958 MGM poster"]}]},{"id":"O32","s":"O","cat":"宽银幕 1950–1959","name":"宾虚","en":"Ben-Hur","desc":"程序生成的 3D 大竞技场，宽银幕史诗光感：沙漠烈日、沙尘、大理石和金色，特艺七彩调色加 65mm 颗粒。战车赛是全片最有名的段落，就直接拍比赛，头顶是海报上的金色巨神。","fit":"3D 大竞技场战车赛 · 65mm 史诗","prompt":"1959 年 65mm 宽银幕史诗，用 3D 搭。默认是硬朗的高太阳（约 50°），影子短而利，天空钴蓝、到地平线渐成沙白；太阳低时影子仍硬但拉长，天空转琥珀色。大理石、镀金、红花岗岩和沙色石头，做出线脚和槽柱，不能是光秃方盒。暖色尘雾约两成混进中景颜色。调色像 Technicolor 拷贝：暖、饱和、略高反差，不过曝不加辉光；细颗粒（±3%）、轻微片门晃动。核心是规模：背景布满宏伟建筑、雕像和重复元素，绝不空。唯一的主角（比如橙 #D97757）是画面里最饱和的东西；重复动作（步伐、轮、桨）节奏随速度。招牌镜头：全画幅等效 35 到 50mm，低机位贴着运动的主角跟拍；其次是大全景、正俯、近景、仰拍。避免：干净的 CG 光、空荡粗糙的布景、过曝。","prompt_en":"1959 65mm widescreen epic built in 3D. Default: hard high sun (about 50°), short crisp shadows, cobalt sky fading to sandy white; under a low sun shadows stay hard but long, the sky turns amber. Marble, gilt, red granite and sandstone, with mouldings and fluted columns, never bare boxes. Warm sunlit haze mixes about 20% into mid-distance colours. Technicolor-print grade: warm, saturated, slightly contrasty, no clipping or bloom; fine grain (±3%), slight gate weave. Scale is the point: monumental architecture, statues and repeated elements fill the background, never empty. The one hero subject (e.g. orange #D97757) is the most saturated thing in frame; any repeated motion (stride, wheel, oar) keeps time with speed. Signature shot: low tracking beside the moving hero, 35–50 mm full-frame; then wide, top-down, close-up, low angle. Avoid: clean CG light, empty or primitive sets, overexposure.","file":"风格提示词/O_奥斯卡98部/O32_宾虚.md","img":"风格提示词/O_奥斯卡98部/O32_宾虚.jpg","year":"1959","tags":["3D"],"extra":[{"h":"技法关键词","t":["程序生成 3D（three.js）","MGM Camera 65 宽银幕","特艺七彩印片调色","第二摄制组动作调度"]},{"h":"导演说明","t":"Clawd 扮犹大·宾虚：额上一条亚麻头带，一手握缰一手举鞭，驾四匹白马。五秒六个镜头，照 1959 年第二摄制组的拍法走一遍：起跑、弯道、跟拍、车轮、近景、海报构图。每个机位都跟着战车在动，节奏不掉。"},{"h":"成片里的分镜","t":"1. 起跑白线大全景：九辆四马战车并排，Clawd 的白马队在其中，身后看台坐满；车队冲出，镜头慢慢收紧。（0.9s）\n2. 东弯高位俯拍：战车绕过镀金转弯柱甩出去，身后扬起弧形尘土。（0.8s）\n3. 贴着 Clawd 的战车并行跟拍：白马全速奔跑、车辐飞转、尘土飞扬；镜头随车前移。（1.1s）\n4. 两车之间的低机位：梅萨拉的锯齿刀毂咬住 Clawd 的车轮，火花四溅；镜头跟车一起走。（0.6s）\n5. Clawd 在战车上挥鞭的近景，旁边是梅萨拉的黑马；缓慢推近。（0.8s）\n6. 海报构图：低角度侧拍，Clawd 的白马队在中央隔墙的金色坐像巨神下追平，身后是看台和总督看台；镜头慢慢放宽。（0.8s）"},{"h":"参考出处","t":["William Wyler, 1959","Yakima Canutt & Andrew Marton (chariot race)","Robert Surtees (cinematography)","1959 MGM poster"]}]},{"id":"O33","s":"O","cat":"摇摆年代 1960–1969","name":"桃色公寓","en":"The Apartment","desc":"Saul Bass 式的白线在黑底上滑入，搭出电影最有名的一点透视无尽办公大厅，再填上灰调。本片片头就是 Bass 做的；全画面唯一的暖色是 Clawd 和钥匙牌。","fit":"Saul Bass 线条片头 · 黑白","prompt":"把 Saul Bass 片头的线条做成布景，黑白加一个暖色。镜头从全黑开始：细白线（约画面宽的 1/800）滑入、向纵深长成网格；两三秒内灰面填满，灯一排排亮起。之后完成态停约三秒：中到浅灰，从 #140F0D 到 #F4F1E8 均匀分四五级平涂，每个形体有约画面宽 1/600 的深色轮廓。严格一点透视，灭点居中；一样的东西重复排向纵深（有人群时是桌子和人，单人时是柱子、路灯、窗格）。人物是两色平涂。唯一的暖色是橙红 #E2472A，只给唯一的主角和一件道具；所有光都是白的。轻颗粒、柔暗角。镜头：急推到主角，硬切到正上方俯视，网格变成图案。避免：草稿感的线、渐变、颜色渗入、透视歪、没填色的暗线框。","prompt_en":"Saul Bass title lines turned into a set. A shot opens on black: thin white lines (about 1/800 of frame width) slide in and grow into a grid; by 2–3 s grey planes fill in and lights switch on row by row. Then hold the finished frame 3 s: mid-to-light grey, flat fills in 4–5 even steps from #140F0D to #F4F1E8, every shape outlined in dark line about 1/600 of frame width. Strict one-point perspective, centred vanishing point; identical elements repeat into depth (desks and people, or posts, lamps, windows). Figures: flat two-tone shapes. The only warm colour is orange-red #E2472A, for the one hero subject and one prop; all light stays white. Camera: a fast push to the hero, a hard cut to top-down, the grid becoming pattern. Avoid: sketchy lines, gradients, colour leaks, skewed perspective, unfilled wireframe.","file":"风格提示词/O_奥斯卡98部/O33_桃色公寓.md","img":"风格提示词/O_奥斯卡98部/O33_桃色公寓.jpg","year":"1960","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["Saul Bass 片头设计","一点透视办公大厅","黑白胶片颗粒","唯一的暖色"]},{"h":"导演说明","t":"Clawd 扮 C.C. 巴克斯特：圆顶礼帽、挂着橙红牌子（51 W 67）的公寓钥匙，坐在前排桌沿。办公大厅一根线一根线画出来，第 2 拍举钥匙、镜头急推；最后切到俯视的桌阵网格，和下一部开场俯拍的曼哈顿街区网格做图形匹配。"},{"h":"成片里的分镜","t":"1. 一镜到底：白线从全黑里搭出无尽的办公大厅，灰调和天花灯一排排亮起；坐在前排桌沿的 Clawd（巴克斯特）在第 2 拍举起公寓钥匙，镜头急推过去。（1.9s）\n2. 硬切到正上方俯视：桌子排成一张网格，Clawd 仰面躺在自己桌上，手里是钥匙和牌子；缓慢推近。（0.6s）"},{"h":"参考出处","t":["Billy Wilder, 1960","Saul Bass (title sequence)","Joseph LaShelle (cinematography)","Alexandre Trauner (production design)"]}]},{"id":"O34","s":"O","cat":"摇摆年代 1960–1969","name":"西区故事","en":"West Side Story","desc":"红橙特艺七彩晚霞下的上西区 3D 街区，饱和、舞台化：红砖、之字形消防梯、屋顶水塔、能摆姿势的舞者人偶。重演电影的俯拍开场、Jets 打响指和海报上那一跃。","fit":"特艺七彩 3D 舞台","prompt":"Technicolor 3D 舞台布景，像 60 年代棚拍歌舞片。几何简化，每个面都细节密集（窗洞窗台、檐口、栏杆、梯子、绳线）；表面是有质感的砖、灰泥或岩石，不能素面。剧场布光：低角度暖阳斜扫表面拉出长影；冷补光约为主光四分之一。手绘天空以橙红 #E0481E 为主，云带镶金边，只在最上沿带一点紫；远处融进暖雾。唯一的主角用饱和橙 #D97757，至少占画面高六分之一，背后衬深色砖墙或加一圈黑边，不能化进天空。人物是木偶式假人。暖而饱和的调色，细颗粒（±3%）。招牌镜头：衬着橙色天空的低角度仰拍；其次一个连续镜头从高处降进布景、再贴地推进。避免：写实脏旧、紫粉天空、素面墙、动作跳变。","prompt_en":"Technicolor 3D stage set, like a 1960s studio musical. Simplified geometry, dense detail on every built surface (openings with sills, ledges, railings, ladders, strung lines); textured brick, plaster or rock, never plain. Theatrical light: a low warm sun rakes surfaces with long shadows; cool fill a quarter of the key. Painted sky of red-orange #E0481E, gold-edged cloud bands, violet only at the top edge; warm haze in the distance. The one hero subject in saturated orange #D97757, at least 1/6 of frame height, set against dark brick or given a black rim so it never melts into the sky. Puppet-like mannequin figures. Warm, saturated grade, fine grain (±3%). Signature shot: a low angle against the orange sky; then one continuous descent into the set and a ground-level push. Avoid: photoreal grime, violet-pink skies, plain walls, poses that pop.","file":"风格提示词/O_奥斯卡98部/O34_西区故事.md","img":"风格提示词/O_奥斯卡98部/O34_西区故事.jpg","year":"1961","tags":["3D"],"extra":[{"h":"技法关键词","t":["程序生成 3D（three.js）","特艺七彩晚霞调色","Boris Leven 布景","1961 海报：红天、黑消防梯"]},{"h":"导演说明","t":"Clawd 混进 Jets 帮，没有戏服，靠场景认片。响指卡在鼓点上；腾跃是一条干净的抛物线，从下蹲到落地缓冲一气呵成。开场俯拍呼应上一部的桌阵网格；结尾划亮的火柴在画面正中，正是下一部日出的位置，做匹配剪辑。"},{"h":"成片里的分镜","t":"1. 正上方俯拍西区街区网格（屋顶、水塔、操场球场），一路下降、抬头落进街道。（1.3s）\n2. 球场边低机位，Jets 帮在涂鸦墙前排成楔形打响指，Clawd 在前；一条连续的推镜绕过去推到 Clawd 近景，它的响指卡在鼓点上。（1.7s）\n3. 消防梯下仰拍：Clawd 下蹲、起跳，一条抛物线压在红天上，旁边是舞者的大跳；镜头随弧线抬起。（1.2s）\n4. 消防梯平台近景：Clawd 划亮火柴，镜头推近直到火苗停在画面正中，随后被吹灭。（0.8s）"},{"h":"参考出处","t":["Robert Wise & Jerome Robbins, 1961","Boris Leven (production design)","Saul Bass (end titles)","1961 original poster"]}]},{"id":"O35","s":"O","cat":"摇摆年代 1960–1969","name":"阿拉伯的劳伦斯","en":"Lawrence of Arabia","desc":"看得见笔触方向的史诗海报水粉，冷暖对比强烈：琥珀色沙漠对钴蓝天空。《阿拉伯的劳伦斯》原海报就是 Howard Terpning 用这种画法画的。","fit":"Terpning 史诗海报水粉","prompt":"60 年代手绘史诗电影海报，水粉打底、油彩提亮。先把形体画扎实再上色：铺不透明中间调底色，再用顺形体走的笔触（大面宽约画面宽的 1/80 到 1/50，脸和手用小笔），边缘柔和衔接；每个形体分亮、中、暗三级；干笔只用在尘土、布料和远处人物上；最后在受光边缘压锐利的暖奶油色高光。冷暖对比：钴蓝天空 #1F4D97 过渡到浅蓝 #A9C3D6，低垂的太阳周围转暖；地面 #EEC27A（任何地形），皮肤、泥土和衣服用赭红 #B56A33，远处阴影用紫 #6C6394。主角居中最大，一个斜向动作，布料飘起；身后可以有更小更松的人物退远。轻画板颗粒、暖暗角、雾气。运动：起伏、缓推到仰角近景、甩镜出画。避免：又碎又匀的刮擦线、平涂数码色、只有冷色。","prompt_en":"1960s hand-painted epic film poster, gouache with oil highlights. Draw forms solidly, then paint: an opaque mid-tone base, directional strokes following each form (1/80–1/50 of frame width on large areas, smaller on faces and hands), soft-blended edges; model every form in three values; dry-brush only on dust, cloth and distant figures; sharp warm-cream highlights last on lit edges. Warm–cool contrast: cobalt sky #1F4D97 to pale blue #A9C3D6, warming to cream near a low sun; ground #EEC27A (any terrain); ochre-red #B56A33 for skin, earth and costume; violet #6C6394 for distant shadows. The hero centred and largest, a diagonal gesture, cloth streaming; smaller, looser figures may recede behind. Light board grain (±3%), warm vignette, haze. Motion: bounce, slow push to a low close-up, a whip pan out. Avoid: scratchy uniform hatching, flat digital fills, cold-only colour.","file":"风格提示词/O_奥斯卡98部/O35_阿拉伯的劳伦斯.md","img":"风格提示词/O_奥斯卡98部/O35_阿拉伯的劳伦斯.jpg","year":"1962","tags":["2D"],"extra":[{"h":"技法关键词","t":["水粉加油彩海报画","Howard Terpning 1962 海报","Freddie Young 70mm 沙漠光"]},{"h":"导演说明","t":"Clawd 扮劳伦斯：白袍、白头巾、金色头箍，骑骆驼举弯刀。开场就是影史最有名的匹配剪辑：上一部的火柴火苗变成沙漠日出。整段冲锋恒定 1.5 倍速，弯刀卡拍举起、刀尖一闪，最后甩镜头出画，接《汤姆·琼斯》。"},{"h":"成片里的分镜","t":"1. 空旷沙漠的黎明大远景：一轮巨大的太阳在画面正中透过热浪升起，和上一部吹灭的火柴做匹配剪辑；缓慢推近。（0.7s）\n2. 跟拍车上的海报构图：Clawd（劳伦斯）骑骆驼混在冲锋的骑兵里奔来，弯刀先放低，卡拍举起、刀尖一闪；颠簸晃动，缓慢推近。（1s）\n3. 低角度推向高举的弯刀，然后向右甩镜头出画，接下一部。（0.8s）"},{"h":"参考出处","t":["David Lean, 1962","Howard Terpning (1962 poster)","Freddie Young (70mm cinematography)"]}]},{"id":"O36","s":"O","cat":"摇摆年代 1960–1969","name":"汤姆·琼斯","en":"Tom Jones","desc":"乔治王时代的讽刺版画：霍加斯式粗细变化的刻线和有方向的排线，上面刷罗兰森式鲜艳的手工淡彩，稍稍出线，再加一个对白气泡。电影本身就在模仿霍加斯笔下的 18 世纪英国。","fit":"手工上色讽刺铜版画","prompt":"乔治王时代讽刺版画：先刻铜版，印完再手工上色。墨只有棕黑色的线：雕刀轮廓约画面宽的 1/400，起伏鼓胀，背光一侧更粗；排线顺形体走、铺满每个面（线距约画面宽的 1/250），只在暗部交叉，平面用直尺排线。颜色几乎铺满整幅，清透但饱满：水色溢出墨线几像素，用酒红 #B3262E、黄铜 #D8A93A、肉色 #F0C4A4、石板蓝 #6D8AA6，大面用暖赭和棕褐。浅棕褐帘纹纸，淡霉点，版框印痕，刻线边框。按 William Hogarth 的方式布置：大鼻子的漫画人物，主体身边是旁观者或搞笑的道具、动物；一个手写斜体对话气泡，用用户的语言。镜头：全幅停两秒，急推，横滑到另一处细节，再给近景。避免：机械均匀的排线、大片空白纸、颜色严丝合缝填在线里、颜色发脏。","prompt_en":"Georgian satirical print: a copperplate engraving, hand-coloured. Brown-black line only: swelling burin outlines about 1/400 of frame width, heavier on the shadow side; hatching follows each form and covers every surface (spacing about 1/250 of frame width), cross-hatched in the darks, ruled on flat areas. Colour covers nearly the whole picture, clear but strong: washes spilling a few pixels off the line in claret #B3262E, brass #D8A93A, flesh #F0C4A4, slate blue #6D8AA6, warm ochre and umber on large surfaces. Sepia laid paper, foxing, plate mark, engraved border. Stage it like William Hogarth: big-nosed caricatures, bystanders or comic props and animals around the subject; one slanted handwritten speech balloon in the user's language. Camera: hold the full plate 2 s, whip in, glide to another detail, close-up. Avoid: even mechanical hatching, blank paper, colour exactly inside lines, muddy colour.","file":"风格提示词/O_奥斯卡98部/O36_汤姆·琼斯.md","img":"风格提示词/O_奥斯卡98部/O36_汤姆·琼斯.jpg","year":"1963","tags":["2D"],"extra":[{"h":"技法关键词","t":["霍加斯铜版线刻","罗兰森/吉尔雷式手工上色","讽刺画对白气泡"]},{"h":"导演说明","t":"Clawd 扮汤姆·琼斯：金边三角帽、脸上一个口红唇印、手拿鸡腿。不用正反打，用一次横滑：从隔桌的双人镜头滑到沃特斯夫人眨眼、冒出对白气泡。再切近景：心形眼、陶醉一晃，摘下三角帽扣向镜头，画面全黑，下一部从黑里开场。"},{"h":"成片里的分镜","t":"1. 从左边甩进隔着满桌菜的双人镜头，Clawd（汤姆）大口啃鸡腿；镜头横滑过桌面落到沃特斯夫人，她冒出对白气泡（Another Leg, Mr Jones?）并眨了一下眼。（1.3s）\n2. Clawd 近景：眼睛变成心形，陶醉地一晃，又啃一小口，然后摘下三角帽扣向镜头，画面变黑；缓慢推近。（1.2s）"},{"h":"参考出处","t":["Tony Richardson, 1963","William Hogarth, A Rake's Progress / Marriage A-la-Mode","Thomas Rowlandson","James Gillray"]}]},{"id":"O37","s":"O","cat":"摇摆年代 1960–1969","name":"窈窕淑女","en":"My Fair Lady","desc":"快速、带飞白的墨线，配粉色和品红水彩晕染、甩点，四周化进白纸。1964 年原海报就是 Bob Peak 的墨线加粉彩；场景是 Cecil Beaton 设计的黑白阿斯科特。","fit":"Bob Peak 时装插画","prompt":"仿 Bob Peak 的 60 年代时装插画。墨线很快：转弯处变粗、直线处变细，后段飞白，收笔一甩；粗细在画面宽的 1/600 到 1/250 之间，小弯处变细。深色衣服、帽子和条纹用实心墨块；脸留白纸 #FBF7F1。水彩是松散柔边的色池，干后边缘积色更深：粉 #EE84B2 做主色，品红 #CE3076 做热点，加玫瑰粉 #F4B2CC 和一点梅紫 #80285C；次要人物和阴影用暖灰；带方向的甩点。场景只用几根线和这几种水彩带过。横排人物是核心：修长侧身，九到十个头高，横向重复（主角加暖灰人物或重影），黑白图案压在粉色上；水彩盖住画面六到八成。镜头：沿人物慢横移；转场借图形遮罩。避免：轮廓粗细一样、平涂数码色、多边形硬边色块、空白页上孤零零一个人。","prompt_en":"1960s fashion illustration after Bob Peak. Fast ink line, thicker in turns, dry-brush tail, a flick off; 1/600–1/250 of frame width, thinning on tight curves. Solid black for dark clothing, hats and stripes; faces bare paper #FBF7F1. Loose, soft-edged watercolour pools, darker at drying edges: pink #EE84B2 as the main field, magenta #CE3076 for hot spots, rose #F4B2CC, a touch of plum #80285C; warm grey for secondary figures and shading; directional splatter. Settings are a few lines in these washes, not literal colour. The frieze is essential: slender profile figures 9–10 heads tall repeated across the frame (the hero plus grey-wash figures or echoes), black-and-white pattern over pink; washes cover 60–80% of the frame. Camera: slow drift along the figures; graphic-mask transitions. Avoid: even-width outlines, flat digital fills, polygon-edged washes, a lone figure on an empty page.","file":"风格提示词/O_奥斯卡98部/O37_窈窕淑女.md","img":"风格提示词/O_奥斯卡98部/O37_窈窕淑女.jpg","year":"1964","tags":["2D"],"extra":[{"h":"技法关键词","t":["快速墨线","粉色与品红水彩","Bob Peak 1964 海报","Cecil Beaton 阿斯科特服装"]},{"h":"导演说明","t":"Clawd 扮伊莉莎：巨大的白帽（条纹缎带、玫瑰、白鸵鸟羽），领口和裙边一圈蕾丝。开场从上一部的黑画面里掀起帽檐，结尾收进人群望远镜的两个圆圈，下一部《音乐之声》就在这两个圆里开场。三个镜头，节奏不急。"},{"h":"成片里的分镜","t":"1. 从黑里，阿斯科特大帽的帽檐抬起，露出 Clawd（伊莉莎）的近景；它把目光转向镜头，微微屈膝行礼，画面轻轻往后收。（0.8s）\n2. 阿斯科特全景：Clawd 站在两排穿 Beaton 黑白服装、僵立的贵族前面；缓慢横移，它抬起下巴。（0.6s）\n3. 沿僵立的人群横摇，所有人同时举起望远镜，最后画面收进两个望远镜圆圈。（1.1s）"},{"h":"参考出处","t":["George Cukor, 1964","Bob Peak (1964 poster)","Cecil Beaton (costume designs)"]}]},{"id":"O38","s":"O","cat":"摇摆年代 1960–1969","name":"音乐之声","en":"The Sound of Music","desc":"绘本感的 3D 程序阿尔卑斯：饱和的翠绿、钴蓝、雪白，雕塑感的山脊，棉花团积云，风吹过草地的草浪。重演开场的直升机航拍，最后落到山顶转圈的玛丽亚。","fit":"绘本感 3D 阿尔卑斯航拍","prompt":"绘本感的 3D 风景，60 年代宽银幕的饱和色，形体圆润光滑有雕塑感，不写实也不做低多边形。默认光：太阳高挂、略在镜头身后，大地满色：翠绿草地 #3FA33A、钴蓝天空 #2F6FD0、干净的白雪白云。风化山脊圆润，雪线顺坡，岩层暖灰赭，有云影。空气透视只加在最远的山脊，约两成半淡紫。积云是受光的白色棉花团。前景是齐膝密草和野花，随阵风弯伏。太阳低时只拉长影子、让云边变暖；其他场景也用这些颜色。一个连续镜头：前两秒高空飞越，再两秒降到草坡，之后贴草低机位环绕主体（每秒约 20°，主体约占画面高四分之一）。对标摄影师 Ted McCord（《音乐之声》，1965）和宫崎骏的草地。避免：泛紫、针尖山峰、写实灰岩、不动的草。","prompt_en":"Storybook 3D landscape in saturated 1960s widescreen colour: smooth sculpted forms, not low-poly or photoreal. Default light: bright sun high, a little behind the camera: emerald grass #3FA33A, cobalt sky #2F6FD0, clean white snow and clouds. Rounded ridges, snow lines following slope, grey-ochre rock bands, cloud shadows. Haze only on the farthest ridges, about 25% lilac. Cumulus are lit white cotton puffs. Knee-high grass and wildflowers fill the foreground, bending in gusts. A lower sun lengthens shadows and warms only cloud edges; other settings keep these colours. Camera: one continuous move: 0–2 s high flight, 2–4 s descent, then a low orbit through the grass around the subject (about 20° per second, subject about 1/4 of frame height). References: cinematographer Ted McCord (*The Sound of Music*, 1965); Miyazaki's meadows. Avoid: violet wash, needle peaks, grey photoreal rock, static grass.","file":"风格提示词/O_奥斯卡98部/O38_音乐之声.md","img":"风格提示词/O_奥斯卡98部/O38_音乐之声.jpg","year":"1965","tags":["3D"],"extra":[{"h":"技法关键词","t":["程序生成 3D 地形（three.js）","托德宽银幕色彩","Ted McCord 直升机开场","宫崎骏的草原"]},{"h":"导演说明","t":"Clawd 扮玛丽亚：头顶一朵雪绒花和一个小头巾结，照海报一手拎条纹毯包、一手拎吉他琴盒。转圈是一条贯穿三个镜头的连续曲线，每一刀都切在转到一半的时候；最后一拍双臂高举。"},{"h":"成片里的分镜","t":"1. 画面从上一部的两个望远镜圆圈里打开到全屏：高空航拍，穿过棉花团积云掠过雪峰。（0.7s）\n2. 下降逼近山顶草坡：Clawd 小小地在画面正中，已经甩着毯包和琴盒转起来，远处是森林和田地拼块；镜头朝它降下去。（0.8s）\n3. 贴着草的低机位，镜头环绕转了一整圈的 Clawd，毯包和琴盒甩开，身后是雪峰和积云；最后它双臂高举。（1s）"},{"h":"参考出处","t":["Robert Wise, 1965","Ted McCord (cinematography)","Howard Terpning (1965 poster)","Hayao Miyazaki (meadows)"]}]},{"id":"O39","s":"O","cat":"摇摆年代 1960–1969","name":"日月精忠","en":"A Man for All Seasons","desc":"古典大师油画肖像：平滑罩染塑形、一根根画出的毛领、天鹅绒高光、逐环刻画的金链，再加旧光油和龟裂纹。霍尔拜因 1527 年亲手画过托马斯·莫尔，这里用的就是他的构图。","fit":"霍尔拜因都铎肖像油画","prompt":"仿小汉斯·霍尔拜因的北方文艺复兴油画肖像。一层层画：带色底、顺明暗的笔触、柔和罩染、最后细笔；成品光滑，背景和布料隐约见笔触。每种材质各有画法：毛皮一根根画，天鹅绒褶子亮脊锐利，金属每件两个高光点，呢料和皮革画出柔和绒面。任何主体都画成穿自己衣服的正式半身像；它的场景从窗口露出，或由手里一件东西交代。色板：深绿帘幕 #1F4A26，黑 #141113、天鹅绒红 #6E0C15、金 #B0801E、毛皮棕 #3E2818；皮肤暖色、体积完整。柔光从左上来。招牌镜头：衬着绿帘的半身像；其次是材质特写，再慢慢拉远到暖色光池照亮的暗房间。收尾叠暖色光油和轻龟裂。避免：平涂、数码硬边、均匀亮光、没有体积的脸。","prompt_en":"Oil portrait after Hans Holbein the Younger. Paint in layers: a toned underlayer, directional strokes following light and shadow, soft glazes, fine detail last; smooth finish, brushwork faint in background and fabric. Render each material: fur hair by hair, velvet folds with sharp light ridges, metal with two highlights per piece, wool and leather with soft nap. Any subject becomes a formal half-length sitter in its own clothes; its setting shows through a window or in an object it holds. Palette: deep green curtain #1F4A26, black #141113, velvet red #6E0C15, gold #B0801E, fur brown #3E2818; warm, fully modelled skin. Soft light from upper left. Signature shot: the portrait against the curtain; then material close-ups, a slow pull back into a dark room lit by warm pools. Warm varnish, light craquelure. Avoid: flat fills, hard digital edges, even light, unmodelled faces.","file":"风格提示词/O_奥斯卡98部/O39_日月精忠.md","img":"风格提示词/O_奥斯卡98部/O39_日月精忠.jpg","year":"1966","tags":["2D"],"extra":[{"h":"技法关键词","t":["古典油画罩染","霍尔拜因《托马斯·莫尔爵士像》（1527）","烛光都铎室内"]},{"h":"导演说明","t":"Clawd 扮托马斯·莫尔：都铎扁帽、黑袍毛领、红天鹅绒袖子、SS 金链，手拿封了红蜡的信。接在转圈的草坡之后，这里是静：从大特写切到肖像只有一刀，之后一路拉远；蜡烛将熄，暗下来的画面接上下一部的夜。"},{"h":"成片里的分镜","t":"1. 脸和 SS 金链、都铎玫瑰吊坠的大特写：Clawd（莫尔）先看向一侧，再把目光转向镜头，眨一下眼；缓慢推近。（0.9s）\n2. 霍尔拜因肖像构图（都铎扁帽、毛领、红天鹅绒袖子、绿色锦缎帘幕、手里的信）：庄重地点一下头，目光落到信上，然后缓慢拉远，露出烛光下的都铎房间；烛火将熄，画面暗下去。（1.6s）"},{"h":"参考出处","t":["Fred Zinnemann, 1966","Hans Holbein the Younger, Sir Thomas More (1527)","Holbein, The Ambassadors (1533)","Ted Moore (cinematography)"]}]},{"id":"O40","s":"O","cat":"摇摆年代 1960–1969","name":"炎热的夜晚","en":"In the Heat of the Night","desc":"三色 Risograph 印刷：深蓝、海报橙红、荧光粉，带网点、颗粒和套色错位；光是用「少上墨」印出来的。呼应 1967 年海报的橙红热浪底和黑色剪影。","fit":"三色 Risograph 夜景","prompt":"三色专色 Risograph 印刷：橙红 #EC5032 是主场（约占画面六成，带竖向流淌痕），深蓝 #162C76 给剪影和阴影，荧光粉 #FF48B0 只给轮廓光和光晕，印在暖白纸 #F7F2E7 上。每色是各自网角的半调，点径约画面宽的 1/300，版间错位二到四像素；有墨粒、针孔，逐帧轻微抖动。蓝剪影底下挖掉橙色，印成纯蓝；只有最暗处两色叠成近黑。光就是没有墨：光束、灯和被照亮的地面露出纸白，外圈一道粉。人物是带粉色边缘光的蓝剪影，肤色用三到六成橙色网点加一级蓝暗部。时间偏冷时仍保留红场，只让蓝色升到天空顶部。镜头：手持跟在提着光源的人身后，一个反打近景，一次缓推。避免：蓝色占满画面、平滑渐变、第四种墨、套印太准。","prompt_en":"Three-ink Risograph: orange-red #EC5032 as the dominant field (about 60%, with drip streaks), deep blue #162C76 for silhouettes and shadows, fluorescent pink #FF48B0 only for rims and halos, on warm paper #F7F2E7. Each ink is halftoned at its own angle, dots 1/300 of frame width, plates misregistered 2–4 px; grain, pinholes, slight boil. Knock orange out under blue silhouettes so they print pure blue; only the darkest accents overprint to near-black. Light is the absence of ink: beams, lamps and lit ground show bare paper, ringed in pink. Figures: blue silhouettes, pink rims; skin is 30–60% orange with a blue shadow step. At cooler times keep the red field; blue rises only into the top of the sky. Camera: handheld behind someone carrying a light, a reverse close-up, a push. Avoid: blue-dominated frames, smooth gradients, a fourth ink, clean registration.","file":"风格提示词/O_奥斯卡98部/O40_炎热的夜晚.md","img":"风格提示词/O_奥斯卡98部/O40_炎热的夜晚.jpg","year":"1967","tags":["2D"],"extra":[{"h":"技法关键词","t":["Risograph 叠印","1967 海报橙红","Haskell Wexler 夜景","剪影式调度"]},{"h":"导演说明","t":"Clawd 扮维吉尔·蒂布斯：白衬衫领尖、深色窄领带、袖口，脚边一只手提箱。上一部熄灭的烛光把夜带进来。三个镜头堆出对峙：手电找到它、警长停下嚼口香糖、它挺直腰板，像在说「They call me MISTER Tibbs!」"},{"h":"成片里的分镜","t":"1. 黑暗中的手持手电主观镜头：副警长的光束扫过车站站台，找到手提箱旁的 Clawd（蒂布斯）；它抬头睁大眼，其他几束手电随即亮起。（0.8s）\n2. 反打警长吉莱斯皮近景：大檐帽、飞行员墨镜，嚼着口香糖，然后停住；缓慢推近。（0.5s）\n3. 对峙中全景：Clawd 站在副警长和警长之间，几束手电光交叉打在它身上，身后是蓝色警车和斯巴达镇水塔；它挺直身子、端平肩膀，镜头推近。（1.2s）"},{"h":"参考出处","t":["Norman Jewison, 1967","Haskell Wexler (cinematography)","1967 original poster","Tom Haugomat"]}]},{"id":"O41","s":"O","cat":"摇摆年代 1960–1969","name":"雾都孤儿","en":"Oliver!","desc":"维多利亚玩具纸剧场：手工上色的石印卡纸人物留着剪刀白边，景片分层插在滑杆上，镀金台口下的烛光脚灯把影子投上景片。《雾都孤儿》是歌舞片，正好搬上维多利亚家庭小舞台。","fit":"维多利亚玩具纸剧场","prompt":"维多利亚玩具纸剧场（Pollock's 式）。一切都是印出来的卡纸：黑色石印轮廓约画面宽的 1/400，每张剪纸一侧有稀疏蜡笔排线；手工上色是沉稳旧色：深红 #C8262C 和暗金 #E0AB36 用在台口和帷幔（金色不能是亮黄），蓝 #2F5A9A 给服装；布景、天空、水和肤色用发灰的棕、灰和奶油卡纸 #F4ECD6。每个人物和景片留一圈剪刀白边（约画面宽的 1/200）。景片是平行的 2.5D 层，层间视差，层内无透视。烛光脚灯把剪纸影子放大约一倍半投到后面景片上，柔边，随烛火闪动。镀金台口、红帷幔和画出来的包厢观众框住舞台，台口宽占画面八到九成。镜头：慢推、横移，近景微震；结尾拉远露出暗房间。避免：鲜艳矢量色、真 3D 纵深、柔和摄影光、没有剪边的人物。","prompt_en":"Victorian toy paper theatre (Pollock's), all printed card: black lithographic outlines about 1/400 of frame width, sparse crayon hatching on one side of each piece; muted antique hand colouring: deep red #C8262C and dull gold #E0AB36 on proscenium and curtains (never bright yellow), blue #2F5A9A for costumes; scenery, sky, water and skin in greyed browns, greys and cream card #F4ECD6. Every cut-out keeps a white scissor margin (1/200 of frame width). Flats are parallel 2.5D layers in parallax, flat within each plane. Candle footlights throw each cut-out's shadow onto the scenery behind, about 1.5× enlarged, soft, flickering. Gilt proscenium, red drapes and painted audience boxes frame a stage opening 80–90% of frame width. Camera: slow push, lateral tracking, shaky close-ups; a final pull-back shows the dark room. Avoid: bright vector colour, true 3D depth, soft studio light, figures without margins.","file":"风格提示词/O_奥斯卡98部/O41_雾都孤儿.md","img":"风格提示词/O_奥斯卡98部/O41_雾都孤儿.jpg","year":"1968","tags":["2.5D"],"extra":[{"h":"技法关键词","t":["Pollock's 玩具剧场","手工上色石印纸偶","剪卡与脚灯投影","Cruikshank 漫画人物"]},{"h":"导演说明","t":"Clawd 扮奥利弗：插在自己滑杆上的纸偶，手里举着空碗。全景、舞台、近景三种景别拉开层次：上前一步，卡拍举起空碗，班布尔一吼，它缩了一下，碗还是举着。"},{"h":"成片里的分镜","t":"1. 全景：暗房间里红木桌上的玩具剧场，「Theatre Royal」台口，桌上一张人物剪纸，旁边伸进来一只操偶的手；缓慢推近。（0.5s）\n2. 沿舞台横移，济贫院饭堂：Clawd（奥利弗）从一排孩子里走出来，举起空碗（Please, sir…），冒着热气的粥锅旁，班布尔的眉头皱起来；镜头随它向右跟。（0.9s）\n3. Clawd 和班布尔的近景：班布尔一声大吼，Clawd 缩了一下、发抖，碗还是举着；吼声那一下镜头轻震。（1.1s）"},{"h":"参考出处","t":["Carol Reed, 1968","Benjamin Pollock (toy theatre sheets)","George Cruikshank","Pollock's Toy Museum"]}]},{"id":"O42","s":"O","cat":"摇摆年代 1960–1969","name":"午夜牛郎","en":"Midnight Cowboy","desc":"沃霍尔的照片丝网：黑色网点照片层印得不匀，错位地压在松散的平涂色块上，底是银色，画面重复两次、三次。片里就有沃霍尔工厂式的派对，而他画的猫王正是牛仔。","fit":"沃霍尔照片丝网 · Double Elvis","prompt":"安迪·沃霍尔式照片丝网印。两块版：一块是 45° 的高反差黑色半调照片，网点约画面宽的 1/200，几乎没有中间调；下面是手刷平涂色块，相对照片错开约画面宽的 1/100，边缘歪扭：出租车黄 #F3BE14、肤粉 #F2A197、奶油 #EFE6CF、红 #E2462B，底是带柔和光泽的刷涂银漆 #BABCC0。唯一的主角用最强的那块颜色。刮板压力不匀：有的地方网点糊成墨团，有的地方拖成横向干笔条纹和针孔，底下隐约有画布纹。重复就是构图：同一个人物或物体全身，在空银底上并排印两次、再印三次，略有重叠。场景只以褪成银色的印样出现在重复里。镜头：手持晃动、推近、正面平面定格。对标沃霍尔《Double Elvis》（1963）。避免：干净均匀的网点、套色完全对齐、处处一样清晰。","prompt_en":"Andy Warhol photo-silkscreen. Two plates: a high-contrast black halftone photograph at 45°, dots about 1/200 of frame width, few mid-tones; and hand-painted flat colour blocks underneath, offset about 1/100 of frame width with wobbly edges: taxi yellow #F3BE14, skin pink #F2A197, cream #EFE6CF, red #E2462B, on brushed silver paint #BABCC0 with a soft sheen. The one hero subject takes the strongest block colour. Uneven squeegee pressure: dots flood into blotches in places, drag into dry horizontal streaks and pinholes elsewhere, over faint canvas weave. Repetition is the composition: the same figure or object, full-length, printed side by side two then three times, slightly overlapping, on empty silver. Settings appear only as drained-to-silver prints in the repeat. Camera: handheld shake, a push in, flat frontal tableaux. Reference: Andy Warhol, *Double Elvis* (1963). Avoid: clean even halftone, perfect registration, uniform crispness.","file":"风格提示词/O_奥斯卡98部/O42_午夜牛郎.md","img":"风格提示词/O_奥斯卡98部/O42_午夜牛郎.jpg","year":"1969","tags":["2D"],"extra":[{"h":"技法关键词","t":["照片丝网印","沃霍尔《Double Elvis》（1963）","银漆底","错位色块"]},{"h":"导演说明","t":"Clawd 扮乔·巴克：黑色斯泰森帽、红色领巾、手臂上的麂皮流苏。先演电影里那句「I'm walkin' here!」：出租车急刹、它往后一跳、拉索拍车头大吼。然后画面变成沃霍尔丝网，Clawd 摆出猫王的枪手站姿，先印两次，再印三次。"},{"h":"成片里的分镜","t":"1. 第六大道的人行横道：黄色出租车急刹冲进来，Clawd（乔·巴克）往后一跳、瞪着眼，拉索拍了一下车头；手持晃动，缓慢推近。（1.1s）\n2. 拉索的近景：叼着烟冲出租车大吼、手指着司机（I'm walkin' here!）；推近。（0.6s）\n3. 街景褪成银色，印成沃霍尔的 Double：两个戴斯泰森帽、手持左轮的 Clawd 叠在一起，再变成三个；正面平视的定格画面。（0.8s）"},{"h":"参考出处","t":["John Schlesinger, 1969","Andy Warhol, Double Elvis (1963)","Andy Warhol, Silver Car Crash (Double Disaster) (1963)","1969 original poster"]}]},{"id":"O43","s":"O","cat":"新好莱坞 1970–1979","name":"巴顿将军","en":"Patton","desc":"仿 1940 年代美军战争债券海报的石印画法：分级平涂的褶皱、深色轮廓、网点阴影、泛黄的纸。对应《巴顿将军》开场：小小的将军站在一面占满舞台的巨幅国旗前训话。","fit":"二战战争债券石印海报","prompt":"1940 年代美国战争债券石印海报。平涂油墨：红 #C2342C、海军蓝 #213261、橄榄绿 #5F5C31、卡其 #B7975E，印在米白 #E6D5B3 的纸上，有纤维、霉点和磨边。每个形体三档：留纸、平涂、油墨加网点，压成硬边色阶。棕黑轮廓线约画面宽的 1/500，最后压上；阴影是粗的 45° 网点带（点径约画面宽的 1/150），带蜡笔颗粒；色版错开约画面宽的 1/600。默认像舞台：对称正面，小主体站在占满大半画面的巨大图形前（旗帜、徽章、放射光芒），灯光是硬边浅色块或留纸；户外也一样，光落成地上的硬边浅斑。文字可有可无，用用户的语言。镜头慢推，配一次干脆的拉出。对标 1942–45 年美国战争债券海报。避免：喷枪渐变、套色完全对齐、网点细到像一片灰。","prompt_en":"1940s US war-bond lithograph poster. Flat inks: red #C2342C, navy #213261, olive #5F5C31, khaki #B7975E, on fibrous, foxed cream #E6D5B3 paper. Three values per form (bare paper, flat ink, ink plus halftone), posterised in hard steps. Brown-black key line about 1/500 of frame width, printed last; shadows as coarse 45° halftone bands (dots about 1/150 of frame width) with crayon grain; colour plates offset about 1/600 of frame width. Default: a symmetrical frontal stage, a small subject before a huge graphic shape filling most of the frame (flag, emblem, sunburst), lights as hard pale shapes or bare paper; outdoors too, light falling as a hard pale pool. Lettering optional, in the user's language. Camera: slow push-ins, one crisp pull-back. Reference: US war-bond posters, 1942–45. Avoid: airbrushed gradients, perfect registration, halftone so fine it reads grey.","file":"风格提示词/O_奥斯卡98部/O43_巴顿将军.md","img":"风格提示词/O_奥斯卡98部/O43_巴顿将军.jpg","year":"1970","tags":["2D"],"extra":[{"h":"技法关键词","t":["石印海报","1942–45 美军征兵与战争债券海报","45° 网点、套色错位"]},{"h":"导演说明","t":"Clawd 扮巴顿：四星钢盔、勋表和奖章、象牙柄左轮、马鞭。它在条纹下走到位，切进近景时啪地敬礼，停住，放下，马鞭拍进手心、一点头，像训话开始。两次硬切，最后的拉镜头让它在巨旗前缩成一个小点。"},{"h":"成片里的分镜","t":"1. 红白条纹铺满画面（接上一部沃霍尔网格的图形匹配），随即一个拉镜头，Clawd 从画面下方走上来，站到巨幅国旗前。（1s）\n2. 中近景，镜头带轻微抖动慢推：Clawd 在四星钢盔下啪地敬礼，停住，放下，马鞭拍进手心，用力一点头。（0.9s）\n3. 全景：镜头拉出，越过国旗看到整个空剧场：红幕、镀金台口、脚灯，Clawd 在舞台中央缩成一个小点。（0.5s）"},{"h":"参考出处","t":["Franklin J. Schaffner, Patton (1970)","Patton one-sheet (1970)","J. C. Leyendecker","US war-bond and recruiting posters, 1942–45"]}]},{"id":"O44","s":"O","cat":"新好莱坞 1970–1979","name":"法国贩毒网","en":"The French Connection","desc":"整条布鲁克林高架铁下的大街用 3D 建出来，再调成粗颗粒 16mm：冷灰、暗部偏青、高反差、片门抖动。这部片最有名的就是高架铁下的追车，3D 才拍得出那种速度。","fit":"高架铁下追车 · 16mm 颗粒 3D","prompt":"70 年代初粗粝的纪实感，放在细致的 3D 世界里，按增感冲洗的 16mm 收尾。调色：低饱和、高反差；中性冷灰 #7A7C7A、带青的暗部 #1E2A2C，砖、木头、车辆保持暖棕 #6E4A34，至少占四分之一画面，绝不整体泛蓝；唯一的主角（比如橙 #D97757）保持饱和。默认阴天，天空亮到近白，任何时段都一样；阳光穿过头顶格栅（轨道、桥、栈桥）落成硬边条纹。颗粒成团，约画面宽的 1/700，亮度 ±8%；片门晃动、闪烁、灰尘，亮处偶有淡重影。杂物多且符合地点。手持机位跟着动作走：18 到 25mm 低机位向前冲，重复物体频闪掠过；回看主体的跟拍机位；墙角广角。对标 William Friedkin《法国贩毒网》（1971）和摄影师 Owen Roizman。避免：干净的 CG 反光、整体泛蓝、空荡的方块场景、颗粒糊成一片。","prompt_en":"Gritty early-1970s documentary look in a detailed 3D world, finished as pushed 16mm. Grade: low saturation, high contrast; neutral-cold greys #7A7C7A, cyan shadows #1E2A2C, warm-brown mid-tones #6E4A34 in brick, wood, vehicles (at least a quarter of the frame), never an overall blue; the one hero (e.g. #D97757) stays saturated. Default overcast, sky near-white, at any time of day; sun through any overhead grid (track, bridge, pier) falls in hard stripes. Grain clumps about 1/700 of frame width, ±8% brightness; gate weave, flicker, dust, occasional faint ghosts of bright lights. Dense clutter fitting the place. Handheld cameras ride the action: a low 18–25 mm lens rushing forward as repeated objects strobe past, a rig looking back at the subject, a corner wide. References: William Friedkin, *The French Connection* (1971); cinematographer Owen Roizman. Avoid: clean CG shine, blue tint, empty places, mushy grain.","file":"风格提示词/O_奥斯卡98部/O44_法国贩毒网.md","img":"风格提示词/O_奥斯卡98部/O44_法国贩毒网.jpg","year":"1971","tags":["3D"],"extra":[{"h":"技法关键词","t":["three.js 3D 街景","16mm 纪录片颗粒","暗部偏青的冷灰印片调色"]},{"h":"导演说明","t":"Clawd 扮“大力水手”道尔：猪肉派帽、怒眼、双手握方向盘。追车的场景时间比屏幕时间跑得快得多，加速看起来就是车更快。三个硬切：路口甩尾 → 保险杠狂冲 → 驾驶员，中间不停。"},{"h":"成片里的分镜","t":"1. 路口全景：列车从头顶驶过，棕色庞蒂亚克甩尾冲上大街，后轮冒烟；镜头视角慢慢放宽。（0.8s）\n2. 片中有名的保险杠机位：超低机位带着运动模糊往前冲，高架铁的柱子一根根闪过。（0.8s）\n3. 中景，从车外透过摇下的车窗看 Clawd 扮的道尔：猪肉派帽、咬牙握着方向盘，身后高架铁和店面滑过，带车载抖动。（0.9s）"},{"h":"参考出处","t":["William Friedkin, The French Connection (1971)","Owen Roizman (cinematography)","The French Connection one-sheet (1971)"]}]},{"id":"O45","s":"O","cat":"新好莱坞 1970–1979","name":"教父","en":"The Godfather","desc":"深琥珀和赭褐的油画，只有顶光落下的地方是暖的：暗部是透明的薄罩染，受光边缘是厚涂。重现戈登·威利斯在“I believe in America”那间书房里的顶光。","fit":"伦勃朗顶光明暗油画","prompt":"伦勃朗、卡拉瓦乔式明暗油画，只有一盏顶光。约七成画面是看得出形体的暖暗部，大多是赭褐 #24150B，近黑 #070403 只在最深的角落。琥珀 #8F5D2A 中间调约两成；朝上的面亮到 #E2B673。主角整个站在光池里，受光部分至少占画面高的四分之一；眉骨把眼睛压进阴影。一处饱和的红 #9C1A1A。暗部薄而平滑地罩染，亮部是带亮笔脊的厚涂，笔触约画面宽的 1/100；过渡柔和，不用刮擦线条。琥珀光油，重暗角，细画布纹（±3%）。背景可有一处暖色亮口（窗、门洞、发亮的天边）；画内的小灯只是一小团光，不算第二个主光。镜头慢拉、慢推。对标 Francis Ford Coppola《教父》（1972），摄影师 Gordon Willis。避免：提亮暗部、平光、人脸跳出来、暗到看不清。","prompt_en":"Chiaroscuro oil painting after Rembrandt and Caravaggio, one overhead light. About 70% of the frame is readable warm dark, mostly umber #24150B, near-black #070403 only in the deepest corners. Amber #8F5D2A mid-tones about 20%; top planes reach #E2B673. The hero stands in the light pool, lit area at least 1/4 of frame height; brows shade the eyes. One red accent #9C1A1A. Darks thin smooth glazes; lights thick impasto, ridged strokes about 1/100 of frame width; modelling soft, never scratchy. Amber varnish, heavy vignette, canvas grain (±3%). A warm bright opening (window, doorway, horizon) may glow behind; a small lamp in frame is a small glow, not a second key. Camera: slow pull-backs and pushes. Reference: Francis Ford Coppola, *The Godfather* (1972), cinematographer Gordon Willis. Avoid: lifting the darks, flat light, faces popping out, frames too dark to read.","file":"风格提示词/O_奥斯卡98部/O45_教父.md","img":"风格提示词/O_奥斯卡98部/O45_教父.jpg","year":"1972","tags":["2D"],"extra":[{"h":"技法关键词","t":["明暗油画","戈登·威利斯的顶光","伦勃朗、卡拉瓦乔式罩染"]},{"h":"导演说明","t":"Clawd 扮唐·柯里昂：黑领结、翼领、红玫瑰、白袖口，一只手压在猫背上。12 拍全按 1 倍速，保留威利斯那种耐心的镜头；抚猫一下约 4 秒，中间眨一次眼。全部硬切，最后一镜让原海报的提线手降到它头上。"},{"h":"成片里的分镜","t":"1. 从暗处博纳塞拉的灰发开始，镜头缓缓拉出，露出坐在翼背椅里的教父和他膝前的猫。（1.7s）\n2. 近景：顶光下的 Clawd 缓缓抚摸灰色虎斑猫，领结和红玫瑰吃到光；镜头慢推。（1s）\n3. 推向百叶窗：窗外阳光下的婚礼，虚而过曝，左边是黑根的剪影。（0.8s）\n4. 书房全景，镜头略推：提线木偶的手从画面顶上降下来，提线在 Clawd 身上慢慢绷紧。（1.5s）"},{"h":"参考出处","t":["Francis Ford Coppola, The Godfather (1972)","Gordon Willis (cinematography)","Rembrandt, The Night Watch","Caravaggio","S. Neil Fujita, The Godfather poster logo"]}]},{"id":"O46","s":"O","cat":"新好莱坞 1970–1979","name":"骗中骗","en":"The Sting","desc":"Leyendecker、Rockwell 一路的杂志插画：块面受光、平行笔触、利落的深色轮廓。片中章节卡就仿《星期六晚邮报》封面，1936 年的下注厅也照这个画。","fit":"《星期六晚邮报》插画","prompt":"30 年代《星期六晚邮报》封面插画。写实人物，比例准确、表情生动，用块面塑造（受光、背光、下方暖色反光），块面里填顺着形体、长短不一的笔触，宽约画面宽的 1/150，柔和衔接，不成条纹。深色轮廓在背光一侧加粗，画面宽的 1/800 到 1/300。暖色主光从左上来。配色：灰泥 #E2C492、橡木 #764626、石板 #28322C、黄铜 #E2B046、墨 #341E18；橡木和墨色暗部约占三分之一画面；天空灰泥偏石板，水是浅石板，皮肤灰泥加黄铜。轻颗粒画板（±3%）加暖暗角。默认一点透视，时代细节，薄雾，故事有就加次要人物。每个人物只画一遍，整体移动（呼吸、摇摆、沿路径滑行）。镜头：一次长而平滑的推进。对标 J. C. Leyendecker、Norman Rockwell。避免：僵硬剪纸人物、粗细一样的轮廓、发脏的颜色。","prompt_en":"1930s Saturday Evening Post cover illustration. Realist figures, correct proportions, expressive faces, built from blocky planes (lit, shadow, warm bounce from below) filled with blended strokes about 1/150 of frame width, varied in length, following the form, never stripes. Dark contour thicker on the shadow side, 1/800–1/300 of frame width. Warm key from upper left. Palette: plaster #E2C492, oak #764626, slate #28322C, brass #E2B046, ink #341E18; oak and ink darks about a third of the frame; sky plaster cooled with slate, water light slate, skin plaster plus brass. Grainy board (±3%), warm vignette. Default one-point perspective, period detail, haze, secondary figures if the story has any. Each figure is drawn once and moves whole (breathing, sway, sliding along a path). Camera: one long, smooth push in. References: J. C. Leyendecker, Norman Rockwell. Avoid: stiff cut-out figures, even outlines, muddy colour.","file":"风格提示词/O_奥斯卡98部/O46_骗中骗.md","img":"风格提示词/O_奥斯卡98部/O46_骗中骗.jpg","year":"1973","tags":["2D"],"extra":[{"h":"技法关键词","t":["《星期六晚邮报》封面插画","Leyendecker 式块面塑形","Jaroslav Gebr 的章节卡"]},{"h":"导演说明","t":"Clawd 扮胡克：浅色礼帽、红领结、背带。整段不切，只有一个推镜头。推到位时它打出骗子们的暗号（手指贴鼻侧），接着压帽檐、冲镜头眨眼，像把观众拉进骗局。"},{"h":"成片里的分镜","t":"1. 一镜到底：从下注厅全景（赔率黑板、下注窗口、窗口里的冈多夫）一路推到扮胡克的 Clawd，它把手指贴到鼻侧打暗号，再冲镜头压一下帽檐。（2.5s）"},{"h":"参考出处","t":["George Roy Hill, The Sting (1973)","Jaroslav Gebr (chapter cards)","Richard Amsel (poster)","J. C. Leyendecker","Norman Rockwell"]}]},{"id":"O47","s":"O","cat":"新好莱坞 1970–1979","name":"教父2","en":"The Godfather Part II","desc":"世纪之交的调色银盐照片，手工刷色：棕褐调、柔焦、银盐颗粒、霉斑、裂角，局部淡淡的红、蓝、铜绿。画的是 1901 年少年维托抵达埃利斯岛，像 Lewis Hine 的照片。","fit":"手工上色棕褐老照片","prompt":"1900 年前后手工上色的棕褐银盐照片。先做受光的立体形体，柔光从左上来，再“印”出来：柔焦带轻微光晕，颗粒在中间调最重（±5%）；棕褐调从 #281A12 经 #987048 到 #EEE0C2 完整铺开，至少五分之一画面落到最深一端，任何光线下都一样。人物比例真实（头约七分之一身高），明暗柔和。透明颜料松松地刷，溢出边缘：唯一的主角最重（比如橙红 #D97757，不透明度六到八成），一两件道具轻点；颜色进暗部就被吞掉。做旧要轻：暗角、边缘银化（靠边暗部泛灰蓝金属光）、几个小霉点、细划痕，最多一个裂角。构图正面、纪实，人物静立面对镜头。镜头缓慢横摇扫过人脸。对标 Lewis Hine、Augustus Sherman 的埃利斯岛照片。避免：积木人物、数码填色、低反差雾灰、大片霉斑。","prompt_en":"A hand-coloured toned silver print from about 1900. Build lit 3D forms, soft key from upper left, then 'print' them: soft focus, light halation, grain heaviest in mid-tones (±5%), full sepia range #281A12, #987048, #EEE0C2; at least a fifth of the frame reaches the dark end, in any light. Figures: real proportions (head 1/7 of body), soft shading. Transparent dyes brushed loosely past edges: the one hero subject strongly (e.g. orange-red #D97757 at 60–80% opacity), a faint touch on one or two props; dyes die in shadow. Light ageing: vignette, silvered edges (grey-blue sheen in border darks), small foxing spots, fine scratches, at most one cracked corner. Frontal, documentary: figures stand still facing the lens. Camera: slow pan across faces. References: Lewis Hine; Augustus Sherman (Ellis Island). Avoid: toy figures, digital fill colour, low-contrast fog, big mould blotches.","file":"风格提示词/O_奥斯卡98部/O47_教父2.md","img":"风格提示词/O_奥斯卡98部/O47_教父2.jpg","year":"1974","tags":["2.5D"],"extra":[{"h":"技法关键词","t":["调色银盐照片","Lewis Hine 的埃利斯岛照片","手工刷色","光线步进的 3D 人物"]},{"h":"导演说明","t":"Clawd 扮少年维托：灰色粗花呢鸭舌帽，脖子上挂着纸名牌，夹在大人中间显得很小。平均 1.3 倍速，自由女神那一镜是 1 倍。三个硬切：人群 → 雕像（主观）→ 反应；最后的表演点是低头看自己的新名字，再抬头望向新的国家。"},{"h":"成片里的分镜","t":"1. 横摇扫过甲板上仰头的移民群像，画面随船身起伏。（0.8s）\n2. Clawd 的主观视角：自由女神从港口的雾里显出来，带一点铜绿色；镜头慢推。（0.7s）\n3. 近景：戴粗花呢鸭舌帽的少年维托（Clawd），胸前挂着“VITO ANDOLINI”名牌；它低头看名牌，又抬头踮脚；镜头略微拉开。（0.9s）"},{"h":"参考出处","t":["Francis Ford Coppola, The Godfather Part II (1974)","Gordon Willis (cinematography)","Lewis Hine, Ellis Island photographs","Augustus Sherman, Ellis Island portraits"]}]},{"id":"O48","s":"O","cat":"新好莱坞 1970–1979","name":"飞越疯人院","en":"One Flew Over the Cuckoo's Nest","desc":"仿爱德华·霍珀的安静写实：大块平整的淡绿墙面、低角度晨光投下的硬边平行四边形、彼此隔开的人。正合《飞越疯人院》的病房：日光灯下的秩序，被一次出逃打破。","fit":"霍珀式美国写实油画","prompt":"爱德华·霍珀式美国写实绘画。大块克制、偏浅的平面色：机构绿 #9EB8A0 和 #5E7C66、灰绿地面 #7E8876、奶油 #ECE6D2，看得见画布纹（±3%），每块拖几笔长笔触，宽约画面宽的 1/80，亮或暗百分之五到十。低角度阳光从一侧射来，在墙和地上投下硬边暖色平行四边形 #FCE6AC，压着窗框或栏杆的清晰影子，室内户外都一样。天空浅奶油绿，皮肤是提暖的奶油色，衣服用压暗的绿。人物由三四块边缘柔和的明暗色块叠成，不勾轮廓，比例写实；几个人时分开站。大部分时间静止，然后一件不到一秒的突发：甩镜或一阵强光。招牌镜头：一点透视的静止室内，地上有光块。对标霍珀《Office in a Small City》（1953）。避免：粗轮廓、矢量人物、深而饱和的墙、模糊光斑。","prompt_en":"Edward Hopper-style American realist painting. Large flat planes of restrained, pale colour: institutional greens #9EB8A0 and #5E7C66, grey-green floor #7E8876, cream #ECE6D2, on visible canvas (±3%), with a few long dragged strokes about 1/80 of frame width, 5–10% off the base. Low side sun throws hard-edged parallelograms of warm light #FCE6AC on walls and ground, crossed by crisp shadows of frames or railings, indoors or out. Sky pale cream-green; skin warmed cream; clothes darkened greens. Figures painted from 3–4 overlapping soft-edged value shapes, no outline, real proportions; several people stand apart. Stillness, then one sudden event under a second: a whip pan, a burst of light. Signature shot: a still one-point interior, light on the floor. References: Edward Hopper, *Office in a Small City* (1953). Avoid: heavy outlines, vector figures, dark saturated walls, fuzzy light patches.","file":"风格提示词/O_奥斯卡98部/O48_飞越疯人院.md","img":"风格提示词/O_奥斯卡98部/O48_飞越疯人院.jpg","year":"1975","tags":["2D"],"extra":[{"h":"技法关键词","t":["爱德华·霍珀式写实","硬边斜射窗光","平整油彩块面加拖笔"]},{"h":"导演说明","t":"Clawd 戴着麦克墨菲的黑色针织帽和格子领，演的是片尾那一下：把水疗台砸出窗外。屏幕时间等于场景时间：蹲下用力、举起、1.0 秒扔出、1.3 秒撞窗，闪光加碎玻璃飞向镜头，然后欢呼。用带运动模糊的甩镜代替剪切。"},{"h":"成片里的分镜","t":"1. 日间活动室里的一镜到底：Clawd 把大理石水疗台举过头顶扔出去，镜头跟着甩到后窗，玻璃炸开、晨光涌进来，再穿过光甩回 Clawd，它举起双臂欢呼。（2.5s）"},{"h":"参考出处","t":["Miloš Forman, One Flew Over the Cuckoo's Nest (1975)","Edward Hopper, Office in a Small City; Morning Sun","Edward Hopper, Nighthawks","Haskell Wexler and Bill Butler (cinematography)"]}]},{"id":"O49","s":"O","cat":"新好莱坞 1970–1979","name":"洛奇","en":"Rocky","desc":"清晨的费城整个做成 3D，从肉库到博物馆 72 级台阶，调成 70 年代 35mm：冷蓝天、低低的金色太阳、长影子、薄雾、细颗粒。跑上台阶和顶上的环绕升镜是这部片的记忆点。","fit":"费城台阶日出 3D · 35mm 调色","prompt":"70 年代 35mm 写实，放在细致的 3D 世界里，默认日出（日落同理）。太阳离地平线五到十度，暖橙 #F0A060，从侧面或前侧方照亮主角，让受光的身体和拉过地面的长影看得清；不要完全逆光。天空冷蓝 #7FA3CF，云底染粉 #E6B2AE；雾朝太阳一侧发金、背光一侧发蓝紫。调色：细颗粒（±3%），暗部偏冷、高光偏暖，不过曝；只有太阳入画时才有光晕和鬼影。镜头：低机位斯坦尼康从背后跟着主角爬上一段坡或台阶，到最高处接一个连续环绕，边转边升边退，六到八秒，转到受光的脸，直到整个地方在下面铺开。对标 John G. Avildsen《洛奇》（1976）、斯坦尼康操作者 Garrett Brown。避免：正午平光、没细节的剪影、高潮时机位不动、塑料感反光。","prompt_en":"1970s 35mm realism in a detailed 3D world, sunrise by default (sunset the same). Sun 5–10° up, warm orange #F0A060, lighting the hero from the side or three-quarter front so the lit body and long ground shadows read; no full backlight. Cool blue sky #7FA3CF, pink cloud undersides #E6B2AE; haze golden toward the sun, blue-violet away. Grade: fine grain (±3%), cool shadows, warm highlights, nothing clipped; flare and ghosts only with the sun in frame. Camera: a low Steadicam following the hero from behind up an ascent, then at the top one continuous orbit that circles, rises and pulls back over 6–8 s, showing the lit face, until the place spreads out below. References: John G. Avildsen, *Rocky* (1976); Steadicam operator Garrett Brown. Avoid: flat noon light, detail-less silhouettes, a static climax, plastic CG shine.","file":"风格提示词/O_奥斯卡98部/O49_洛奇.md","img":"风格提示词/O_奥斯卡98部/O49_洛奇.jpg","year":"1976","tags":["3D"],"extra":[{"h":"技法关键词","t":["three.js 3D 城市","70 年代 35mm 胶片调色","斯坦尼康跟拍与环绕升镜"]},{"h":"导演说明","t":"Clawd 扮洛奇：灰色卫衣兜帽戴起，肩上搭一条白毛巾。训练蒙太奇三个快切，约 1.7 倍速；上台阶以后回到 1 倍。硬切进斯坦尼康跟跑，之后不再切：跑到顶直接接环绕升镜，举臂一跳正好落在镜头开始升起的时候。"},{"h":"成片里的分镜","t":"1. 肉库中景，定机位：戴灰色兜帽的 Clawd 对着挂着的牛肉出拳，白瓷砖、裸灯泡。（0.4s）\n2. 更近一些，定机位：拳头打在牛肉上，牛肉晃荡。（0.4s）\n3. 黎明前的意大利市场，定机位：Clawd 迎着镜头慢跑，经过油桶火、果蔬摊和还亮着的路灯。（0.6s）\n4. 低机位斯坦尼康从背后追着 Clawd 跑上 72 级台阶，前方是博物馆的立柱。（1.5s）\n5. 到顶，Clawd 双臂举成 V 字一跳；镜头绕着它转、上升、后退，直到整条大道和城市在日出里铺开。（2.1s）"},{"h":"参考出处","t":["John G. Avildsen, Rocky (1976)","Garrett Brown (Steadicam)","James Crabe (cinematography)","Philadelphia Museum of Art, east façade"]}]},{"id":"O50","s":"O","cat":"新好莱坞 1970–1979","name":"安妮·霍尔","en":"Annie Hall","desc":"《纽约客》单格漫画：灵动的钢笔墨线、几块克制的淡彩、大量白纸，画下面一行手写图说。伍迪·艾伦的喜剧和这本杂志是一个调子，龙虾那场戏正好是一格笑话漫画。","fit":"《纽约客》单格漫画 · 墨线淡彩","prompt":"《纽约客》单格漫画，满版出血，不画格框。蘸水笔墨线直线处细到约画面宽的 1/1000，转弯处粗到约 1/300，收笔一甩；方盒子几笔分开画，角上交叉出头。淡水彩带积色边，铺在大部分物体上，溢出墨线不超过画面宽的 1/150：灰 #9698A0、海蓝 #78A0BE、沙色 #E2CCA0、铁锈 #C45C32，底是冷压纸 #FBF8F1，四边化成白。人物夸张、有表情、画出五官，周围有日常道具，留白但不空荡。画面下方一行手写说明，用用户的语言，字高约画面高的 1/30，逐字写出：一句冷面幽默。画面不动，活物微微颤动。镜头：轻微漂移和推近；画面可一分为二，左右并排两幅。对标 James Thurber、William Steig、桑贝。避免：浓重饱和的颜色、粗细一样的矢量线、白纸中间漂着一个小格子。","prompt_en":"New Yorker single-panel cartoon, full-bleed, no border. Nib-pen lines about 1/1000 of frame width on straights, swelling to 1/300 in turns, flicking off at the ends; box corners overlap. Pale watercolour washes with pooled edges over most objects, slipping past the lines by at most 1/150 of frame width: grey #9698A0, sea blue #78A0BE, sand #E2CCA0, rust #C45C32, on cold-press paper #FBF8F1 fading to white at the edges. Exaggerated, expressive figures with drawn faces among everyday props. One hand-lettered caption line under the action, in the user's language, about 1/30 of frame height, appearing letter by letter: a deadpan remark. The drawing holds still; living things wobble. Camera: small drifts and pushes; the frame may split into two side-by-side drawings. References: James Thurber, William Steig, Jean-Jacques Sempé. Avoid: saturated colour, uniform vector lines, a small framed panel floating in white.","file":"风格提示词/O_奥斯卡98部/O50_安妮·霍尔.md","img":"风格提示词/O_奥斯卡98部/O50_安妮·霍尔.jpg","year":"1977","tags":["2D"],"extra":[{"h":"技法关键词","t":["《纽约客》单格漫画","钢笔墨线","淡水彩","手写图说"]},{"h":"导演说明","t":"Clawd 扮安妮：黛安·基顿那顶宽檐帽、松垮的条纹领带和马甲，手里一台 35mm 相机。约 1.8 倍速，跳起来那一下接近 1 倍：两次闪光拍照，龙虾爬到脚边，吓得一跳，落地笑开。全部硬切，最后用分屏饭桌做一个图形化的出口。"},{"h":"成片里的分镜","t":"1. 冰箱后缝的大特写：一只龙虾慢慢探出头；镜头缓慢漂移。（0.6s）\n2. 厨房全景：扮安妮的 Clawd 边笑边给抱着汤锅的艾尔维拍闪光照；龙虾爬到脚边，它一跳，落地笑开，下方一笔笔写出“TALK TO HIM. YOU SPEAK SHELLFISH.”；镜头略微拉开，带一点手持晃动。（1.5s）\n3. 复活节饭桌分屏：左边安静的霍尔家，Clawd 坐在其中；右边吵闹的辛格家。（0.4s）"},{"h":"参考出处","t":["Woody Allen, Annie Hall (1977)","James Thurber","William Steig","Jean-Jacques Sempé","Annie Hall one-sheet (1977)"]}]},{"id":"O51","s":"O","cat":"新好莱坞 1970–1979","name":"猎鹿人","en":"The Deer Hunter","desc":"仿安德鲁·怀斯的蛋彩：干燥细密的交叉短笔，低饱和的草黄、赭褐、灰绿，草叶一根根画出来，天空苍白。怀斯是宾州画家，“一枪”猎鹿就在宾州钢铁小镇上方的山里。","fit":"安德鲁·怀斯蛋彩","prompt":"安德鲁·怀斯式石膏底板蛋彩画。干、哑光、极细：颜色全靠密密的交叉短笔叠出来，每笔长约画面宽的 1/400，细如发丝。低饱和配色：苍白阴天 #D9D5C6、草黄 #CDB27A、赭褐 #6A5234、灰绿远山 #8E938C、铁锈色 #8A4E32；水、石、衣服和皮肤都从这几色调出。强调色只给唯一的主角（比如一顶红帽）；画里的光源只是一个淡淡的小点，不带光晕。地面（默认枯草，其他地面同理）先铺大块深浅，再叠细笔、暗色草团，最后是被风梳过的单根草叶；岩石和房屋用短笔顺着各面排。空间空旷孤独，主体小而偏离中心。默认阴天软光，其他时段也保持苍白、不要暖光。镜头缓慢漂移、安静推近；圆形遮罩可作剪切点。避免：湿水彩晕染、饱和色、厚重发亮的笔触。","prompt_en":"Egg tempera on gesso panel after Andrew Wyeth. Dry, matte, very fine: colour built from dense cross-hatched strokes, each about 1/400 of frame width long, hairline thin. Muted palette: pale overcast sky #D9D5C6, straw grass #CDB27A, umber #6A5234, misty grey-green hills #8E938C, rust #8A4E32; water, stone, clothes and skin mixed from these. One accent colour, only on the one hero subject (e.g. a red cap); any light source is a small pale dot, no halo. Ground (dry grass by default, other ground alike): big light and dark patches, fine strokes, dark tufts, then single wind-combed blades; rocks, buildings hatched along their planes. Empty, lonely space; the subject small, off-centre. Soft overcast light; at other times of day stay pale, no warm glow. Camera: slow drift, quiet push; a circular iris may mark a cut. Avoid: wet watercolour blooms, saturated colour, thick shiny strokes.","file":"风格提示词/O_奥斯卡98部/O51_猎鹿人.md","img":"风格提示词/O_奥斯卡98部/O51_猎鹿人.jpg","year":"1978","tags":["2D"],"extra":[{"h":"技法关键词","t":["石膏底蛋彩","安德鲁·怀斯","细密交叉短笔"]},{"h":"导演说明","t":"Clawd 扮麦克：红色羊毛猎帽、带瞄准镜的猎枪。河谷 → 瞄准镜 → 鹿眼 → 猎人，四个硬切，平均约 1.24 倍速，安静、稳。表演点是那一枪没开：枪放下，闭眼，呼出一口气，再抬头看那头鹿。"},{"h":"成片里的分镜","t":"1. 河谷雾里的钢铁小镇全景：高炉、冒烟的烟囱、洋葱顶教堂；镜头缓慢横移。（0.6s）\n2. 瞄准镜视角：黑色圆形遮罩和十字线里，山脊上的雄鹿；画面随猎人的手微微晃动。（0.7s）\n3. 雄鹿头部和眼睛的特写；镜头慢推。（0.3s）\n4. Clawd 扮麦克站在花岗岩上，放下猎枪，闭眼呼出一口气，再抬头望向雄鹿；镜头拉开到整条山脊。（0.8s）"},{"h":"参考出处","t":["Michael Cimino, The Deer Hunter (1978)","Vilmos Zsigmond (cinematography)","Andrew Wyeth, Christina's World (1948)","Andrew Wyeth, Winter 1946"]}]},{"id":"O52","s":"O","cat":"新好莱坞 1970–1979","name":"克莱默夫妇","en":"Kramer vs. Kramer","desc":"孩子用蜡笔画的厨房：歪扭的线、用力涂进纸纹又涂出边界的颜色、标签和箭头、带笑脸的太阳。这是比利眼里他和爸爸做法式吐司的样子。","fit":"儿童蜡笔画","prompt":"认真的六到八岁孩子在白纸上画的蜡笔画。蜡笔只蹭到纸纹凸起；轻涂露出四到六成纸白，用力处填满；叠色时下层透出。轮廓用黑色或深棕蜡笔，蜡质、发抖，粗约画面宽的 1/300。填色是来回涂抹，每笔长约画面宽的 1/40、宽约 1/250，一排排涂、冲出轮廓，每块各有方向，间距和角度不均匀，不能排成规整的网。基础色：红 #E0382C、橙 #F28A1E、黄 #F7D23A、绿 #3AA345、蓝 #2E6BD8。儿童画惯例：地面线、压扁的透视、带箭头的标注、笑脸太阳、写反一个字母（中文写反一个偏旁）、图案一格格涂。文字用用户的语言、发抖的蜡笔笔画写，不用字体。镜头：先晃动近景，再平稳扫过全画。避免：大人式的工整画法、没细节的乱涂、均匀点状或网状肌理、平滑渐变。","prompt_en":"A careful 6–8-year-old's wax-crayon drawing on white paper. Crayon catches the paper grain's peaks; light pressure leaves 40–60% paper showing, heavy pressure fills it; overlaps show through. Outlines in black or dark-brown crayon, waxy, wobbling, about 1/300 of frame width. Fills are back-and-forth scribbles, strokes about 1/40 of frame width long and 1/250 wide, rows overshooting the outlines, each area in its own direction, spacing and angle uneven, never a regular mesh. Primary box: red #E0382C, orange #F28A1E, yellow #F7D23A, green #3AA345, blue #2E6BD8. Child conventions: a ground line, flattened perspective, arrowed labels, a smiling sun, one mirrored letter (in Chinese, a reversed stroke), patterns coloured cell by cell. Text in the user's language, in wobbly crayon strokes, not a typeface. Camera: shaky close-ups, then a calm drift. Avoid: neat adult rendering, random scrawl, uniform stipple or mesh, smooth gradients.","file":"风格提示词/O_奥斯卡98部/O52_克莱默夫妇.md","img":"风格提示词/O_奥斯卡98部/O52_克莱默夫妇.jpg","year":"1979","tags":["2D"],"extra":[{"h":"技法关键词","t":["纹理纸上的蜡笔","6–8 岁儿童画的画法","手写标签"]},{"h":"导演说明","t":"Clawd 扮泰德：系着蓝色围裙带，拿锅铲；比利站在椅子上打蛋。第一次和最后一次用同一口锅做匹配剪辑，父子关系在一次跳切里讲完。整体约 1.35 倍速；切进全景时正好接住吐司，接着小跳一下、看一眼镜头。"},{"h":"成片里的分镜","t":"1. 第一次做的平底锅大特写：焦吐司、黑色蜡笔烟、蛋壳；手持抖动，慢慢拉开。（0.7s）\n2. 匹配剪辑到片尾的同一口锅，干干净净：一片金黄的吐司从锅里翻起来。（0.4s）\n3. 标题“ME AND DADDY MAKE FRENCH TOAST”下父子并肩：Clawd 用锅铲接住吐司，比利笑开，冒出一颗红心，Clawd 得意地小跳一下；镜头往上漂到窗外的蜡笔天际线。（1.4s）"},{"h":"参考出处","t":["Robert Benton, Kramer vs. Kramer (1979)","Néstor Almendros (cinematography)","Kramer vs. Kramer one-sheet (1979)","Children's drawings, ages 6–8"]}]},{"id":"O53","s":"O","cat":"大片年代 1980–1989","name":"普通人","en":"Ordinary People","desc":"层层叠色的透明水彩：湿画法的天空和湖面、水渍边线、回流花、留白的纸当高光，秋天的金和锈红配上冷灰蓝。对上影片开场那个安静又带点忧伤的 Lake Forest 秋天。","fit":"秋日透明水彩","prompt":"透明水彩，在冷压纸上一层层罩色。先把形状画清楚，再罩两三层，每层更小更深，干后边缘积成深一点的水渍线；每帧两三处回流花，约画面宽的 1/10，只在大块湿画里，不落在人物上；颗粒轻沉进纸纹（±4%）。纸是最亮的白，浅色物体和高光留纸。天空和水面湿画，涟漪干笔。分工：秋金 #ECAA34、猩红 #E46030、锈色 #B8743C 给树叶和点缀，对着冷灰蓝的雾 #C2C6D2 和紫灰阴影 #8A8496；天空任何时段都浅而冷；地面浅绿赭。树冠：先铺淡色，叠扇贝边叶团，点深色，甩散叶；树少时暖色给灌木、屋顶、衣服。光从一侧来。镜头缓慢横摇、轻推，落叶从镜头前飘过。对标 Winslow Homer 的水彩。避免：水粉式覆盖、喷枪模糊、矢量硬边、脏色、饱和晚霞。","prompt_en":"Transparent watercolour in layered glazes on cold-press paper. Draw shapes crisply first, then two or three glazes, each smaller and darker, drying to a tide-mark edge; two or three blooms, about 1/10 of fra
