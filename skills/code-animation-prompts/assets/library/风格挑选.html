me width, inside large washes, never on figures; light granulation (±4%). Paper is the brightest white; light objects and highlights left as paper. Sky and water wet-in-wet, ripples dry-brush. Roles: autumn gold #ECAA34, scarlet #E46030, rust #B8743C for foliage and accents, against grey-blue mist #C2C6D2 and violet-grey shadows #8A8496; sky pale and cool at any time of day; ground pale green-ochre. Foliage: pale wash, scallop-edged clusters, dark dots, flicked leaves; with few trees, warm colours go to scrub, roofs, clothes. Light from one side. Camera: slow pan, gentle push, leaves drifting past the lens. Reference: Winslow Homer's watercolours. Avoid: opaque gouache, airbrushed blur, vector edges, muddy colour, saturated sunsets.","file":"风格提示词/O_奥斯卡98部/O53_普通人.md","img":"风格提示词/O_奥斯卡98部/O53_普通人.jpg","year":"1980","tags":["2D"],"extra":[{"h":"技法关键词","t":["透明水彩叠色","Winslow Homer 与 John Singer Sargent","HB 铅笔底稿"]},{"h":"导演说明","t":"Clawd 扮康拉德：一条藏青配奶白的长校园围巾被湖风吹起，背一只皮书包。全程 1.1 倍速，和帕赫贝尔卡农的慢开场一样慢。三个硬切：湖、回头看家的儿子、没有回应的母亲。它的目光从房子落到地上，就是全部表演。"},{"h":"成片里的分镜","t":"1. 黎明的密歇根湖空镜：灰蓝湖面上留白的太阳光路，镜头慢慢右摇到秋天的崖岸。（0.8s）\n2. 枫树下的街道：扮康拉德的 Clawd 围着长条纹围巾、背着书包，在人行道上停下，回头看那栋白色殖民地式房子（卡尔文在院里耙叶），又垂下眼睛转开；镜头缓慢右移并略微拉开。（1s）\n3. 门廊上的贝丝抱着双臂，神情冷淡；镜头慢慢推近她。（0.7s）"},{"h":"参考出处","t":["Robert Redford, Ordinary People (1980)","John Bailey (cinematography)","Winslow Homer (watercolours)","John Singer Sargent (watercolours)"]}]},{"id":"O54","s":"O","cat":"大片年代 1980–1989","name":"烈火战车","en":"Chariots of Fire","desc":"仿 Jean Droit 1924 巴黎奥运海报的四色石印：古典人体、有限油墨、成团的石版颗粒、参差套色。《烈火战车》讲的是 1924 年奥运，海滩长跑像那张海报活了过来。","fit":"1924 巴黎奥运石印海报","prompt":"20 年代石版印刷海报，四色：海蓝 #245A8C、赭黄 #D49640、深棕 #40271B、暖红 #E47E62，印在泛旧的奶油纸 #F1E7D1 上，每色错位约画面宽的 1/700。所有色调都由油墨颗粒组成，不平涂：颗粒约画面宽的 1/1000，聚成软团，浅色区覆盖两到四成，中间调五到八成，实色几乎满版、留针孔；空白纸上不能有零散孤点。分工：蓝给天空、水和冷阴影；赭黄给地面和皮肤；深棕给轮廓、暗部和衣服；红少量点缀。明暗安静偏浅。人物古典：受光侧赭黄，四肢顺一道深棕明暗交界线，头约身高八分之一；多人排成横列。动作慢，靠水花、尘土、头发、布料带出。镜头：长焦正面、贴地低机位；可加衬线字标题横带。对标 Jean Droit 的 1924 年巴黎奥运海报。避免：粗噪点、象形小人、矢量平涂。","prompt_en":"1920s stone lithograph poster in four inks: sea blue #245A8C, ochre #D49640, deep brown #40271B, warm red #E47E62, on aged cream #F1E7D1, misregistered about 1/700 of frame width. Every tone is ink grain, never a flat fill: specks about 1/1000 of frame width in soft clumps, covering 20–40% of pale areas, 50–80% of mid-tones, nearly all of solids (with pinholes); no stray specks on bare paper. Roles: blue for sky, water, cool shadow; ochre for ground and skin; brown for outlines, darks, clothes; red sparingly. Values calm and pale. Classical figures: ochre lit side, brown core-shadow line down each limb, head 1/8 of body; groups in a row. Slow motion carried by spray, dust, hair, cloth. Camera: long-lens front views, ground-level shots; optional serif title band. Reference: Jean Droit, 1924 Paris Olympics poster. Avoid: coarse speckle, pictogram figures, vector fills.","file":"风格提示词/O_奥斯卡98部/O54_烈火战车.md","img":"风格提示词/O_奥斯卡98部/O54_烈火战车.jpg","year":"1981","tags":["2D"],"extra":[{"h":"技法关键词","t":["四版石印","Jean Droit 的 1924 奥运海报","古典解剖人体"]},{"h":"导演说明","t":"Clawd 跑在队伍里：白头带、胸前别着 98 号码布。跑步按 1 倍速，看起来就是原片的慢镜头。四个硬切：面孔、脚、利德尔仰头的跑姿、侧面整队；最后一镜印上海报字框，把这场戏变成 1924 年的海报。"},{"h":"成片里的分镜","t":"1. 长焦正面：跑者队伍沿着浪边迎面跑来，Clawd 在其中，戴白头带、别着 98 号码布；镜头略微拉开。（0.7s）\n2. 贴地近景：赤脚踩进浅水溅起水花，湿沙上有倒影；镜头横向滑动。（0.6s）\n3. 利德尔的近景：仰头张嘴，亚伯拉罕斯在他身后；镜头略微拉开。（0.5s）\n4. 侧面看整队跑者，Clawd 在中间；镜头拉开时，“JEUX DE LA VIIIe OLYMPIADE · PARIS 1924”的海报字框印上画面。（0.8s）"},{"h":"参考出处","t":["Hugh Hudson, Chariots of Fire (1981)","Jean Droit, Jeux de la VIIIe Olympiade, Paris 1924 (poster)","Chariots of Fire one-sheet (1981)","Vangelis (score)"]}]},{"id":"O55","s":"O","cat":"大片年代 1980–1989","name":"甘地传","en":"Gandhi","desc":"棉布上的手工木刻印花：靛蓝、茜草红、姜黄加黑色雕版轮廓，版缝处套色错位，染料顺着经纬渗开。手纺土布是甘地的象征，所以食盐进军就印成一块布。","fit":"拉贾斯坦手工木刻印花布","prompt":"拉贾斯坦手工木刻印花布（Bagru、Sanganer）。本色棉布 #EEE5CF 是主底，占画面一半以上，也是皮肤色；靛蓝 #2A3A68 给水面或天空色带和纹样；茜草红 #AA322A 给边框、衣服和主角；姜黄 #DEA42C 给小纹样；黑色雕版 #281E1C 印轮廓。按雕版一块块盖（每块约画面高的 1/8），错位二到四像素，大色带也在版缝处轻微跳变；染料顺经纬微渗，上色不匀。泥防染冰裂纹只在靛蓝里，细而稀疏。轮廓像刻出来的，略毛糙，粗约画面宽的 1/300。平铺成横幅，外框是佩斯利和花藤；海浪是扇贝纹；人物取侧面，细密画式的脸，描黑的眼尾。镜头沿横幅横摇、推近；借转动的纹样转场。避免：矢量硬边、套色完全对齐、没有五官的人、满屏冰裂纹、靛蓝铺满画面。","prompt_en":"Hand block print on cotton, Rajasthan style (Bagru, Sanganer). Undyed cotton #EEE5CF is the ground, over half the frame, and the skin colour; indigo #2A3A68 for water or sky bands and patterns; madder red #AA322A for borders, clothing and the hero; turmeric #DEA42C for small motifs; black key block #281E1C for outlines. Stamp blocks about 1/8 of frame height, misregistered 2–4 px, tone jumping slightly at seams even in large bands; dye bleeds along the weave, fills unevenly. Mud-resist crackle only inside indigo, fine and sparse. Carved, rough outlines about 1/300 of frame width. Flat frieze in a paisley and vine border; waves as scallop rows; profile figures with miniature-painting faces, kohl-lined eyes. Camera: pan along the frieze, push in; cut on a turning motif. Avoid: vector edges, perfect registration, faceless figures, dense crackle, indigo flooding the frame.","file":"风格提示词/O_奥斯卡98部/O55_甘地传.md","img":"风格提示词/O_奥斯卡98部/O55_甘地传.jpg","year":"1982","tags":["2D"],"extra":[{"h":"技法关键词","t":["Bagru 泥防染靛蓝","Sanganer 木版印花边","拉贾斯坦细密画侧脸"]},{"h":"导演说明","t":"Clawd 扮甘地：圆框钢丝眼镜、土布披巾的边、竹杖、一把盐。全程 1.1 倍速，不做慢放。从队伍硬切到动作：弯腰、捧盐、举起，再转向队伍举得更高。最后用纺车转动的轮子做转场收尾。"},{"h":"成片里的分镜","t":"1. 沿海边的队伍横摇：穿白土布的志愿者、穿靛蓝和茜草红纱丽的妇女、自治旗；Clawd 在队伍最前面入画。（0.8s）\n2. 中近景，镜头慢推：戴圆框眼镜、披土布披巾的 Clawd 弯腰捧起一把盐，举起来盐粒闪光，再转向队伍举得更高。（1.1s）\n3. 村妇坐在纺车前纺线；镜头推向转动的纺车轮，接下一部。（0.6s）"},{"h":"参考出处","t":["Richard Attenborough, Gandhi (1982)","Gandhi one-sheet (1982)","Bagru dabu and Sanganer block prints","Rajasthani miniature painting"]}]},{"id":"O56","s":"O","cat":"大片年代 1980–1989","name":"母女情深","en":"Terms of Endearment","desc":"摊开的家庭相册，里面是褪色的宝丽来和柯达快照：发青的黑、奶油色高光、白边。其中一张宝丽来活过来，变成海滩飞车的追拍照片。《母女情深》讲的是母女三十年。","fit":"家庭相册宝丽来","prompt":"70 到 80 年代的生活快照，摊开在相册里。照片已褪色：黑色抬成偏青的灰（约 #2F3A3A），高光柔和发奶油色，略暖、略过曝，偏软，细颗粒（±4%），饱和度约正常的六成。宝丽来白边、照相馆四连拍条、圆珠笔手写说明（用用户的语言）。相册铺满画面，奶油色页面，从正上方看，光柔和均匀，淡淡塑料膜反光。照片里有东西在动就用追拍：背景横向拖糊，主体清晰；静止主体用浅景深。人物像拍的不像画的：比例真实、明暗柔和、轻微虚焦、脸不大。镜头：俯拍推进一张照片直到铺满（约三秒），切进活起来的场景、颜色恢复，再拉出。对标宝丽来 SX-70 和柯达彩色照片。避免：平面卡通造型、干净的现代色彩、光束、饱和的照片。","prompt_en":"1970s–80s snapshots in an open album. Faded dyes: blacks lifted to teal grey about #2F3A3A, creamy rolled-off highlights, mild warm cast, slight overexposure, softness, fine grain (±4%), saturation about 60% of normal. White Polaroid borders, photo-booth strips (four frames stacked), ballpoint captions in the user's language. The album fills the frame, cream pages seen from above in soft, even light, a faint plastic sheen. In a photo, a moving subject gets a panning-shutter look (background smeared sideways, subject sharp); still subjects get shallow depth of field. People look photographed: real proportions, soft shading, slight blur, small faces. Camera: an overhead push into one photo until it fills the frame (about 3 s), a cut into the living scene as colour returns, then a pull-back. References: Polaroid SX-70, Kodacolor prints. Avoid: flat cartoon shapes, crisp modern colour, light shafts, saturated prints.","file":"风格提示词/O_奥斯卡98部/O56_母女情深.md","img":"风格提示词/O_奥斯卡98部/O56_母女情深.jpg","year":"1983","tags":["2D"],"extra":[{"h":"技法关键词","t":["SX-70 与宝丽来 600 相片","柯达彩色快照","70–80 年代磁性相册","追拍拖影"]},{"h":"导演说明","t":"Clawd 扮退役宇航员加勒特，戴金色飞行员墨镜，身边坐着大笑的奥罗拉。整体约 1.8 倍速。推进相册以后直接切进照片里，褪色的调子回暖成新鲜的颜色；颜色回来时它举起双臂，最后的近景落在张开双臂的样子上。"},{"h":"成片里的分镜","t":"1. 俯拍胡桃木桌上摊开的相册，一路推进那张散放的加尔维斯顿宝丽来，直到照片铺满画面。（1.2s）\n2. 宝丽来活了过来：红色科尔维特冲过浪花，副驾的奥罗拉挥着手，颜色慢慢回来；镜头拉开到更宽的海滩。（0.8s）\n3. 近景：戴金色飞行员墨镜的 Clawd 扮加勒特，在座位后站起来张开双臂；镜头慢推。（0.5s）"},{"h":"参考出处","t":["James L. Brooks, Terms of Endearment (1983)","Terms of Endearment one-sheet (1983)","Polaroid SX-70 and Kodacolor snapshots","1970s magnetic-page photo albums"]}]},{"id":"O57","s":"O","cat":"大片年代 1980–1989","name":"莫扎特传","en":"Amadeus","desc":"黑纸剪成的侧面人像镶着金边，坐满马蹄形的金色包厢和红丝绒，对着星空布景的舞台。《莫扎特传》的高光是首演之夜，一个画面装下乐池、舞台、观众和暗处的萨列里。","fit":"洛可可剪影 · 烛光金色歌剧院","prompt":"18 世纪剪纸剪影，放在烛光照亮的洛可可室内。每个人物是实心黑侧影 #0B0705，各有自己的剪纸细节（发型、鼻子、蕾丝镂空、物件），朝最近烛火的一侧描 2–3px（按 1920×1080）亮金边 #F7E3A0，顺衣褶勾几根细金线。金色浮雕 #B88A2E 和红丝绒 #6E0F14 像包厢一样框住画面；户外题材画成舞台上被照亮的布景，剪纸人物站在布景前。红与金占画面大半，夜蓝 #0C1A3A 只用于远处天空。只有主角侧影里的脸是画出来、有颜色的。烛火轻微跳动（亮度±5%），暖光晕约五个火苗宽，薄烟、暗角、细颗粒。招牌镜头：前景剪影框住远处亮着的舞台，慢横移再推进。对标剪影 Edouart、Miers，摄影师 Miroslav Ondříček（《莫扎特传》，1984）。避免：没有剪纸细节的黑块；复制粘贴的侧影；蓝色墙面；频闪的烛火。","prompt_en":"18th-century cut-paper silhouettes. Each figure: a solid black profile #0B0705 with its own cut detail (hair, nose, lace holes, props), a 2–3 px pale-gold rim #F7E3A0 (at 1920×1080) toward the nearest flame, and hairline gold lines along clothing folds. Gilt relief #B88A2E and red velvet #6E0F14 frame the scene like an opera box; an outdoor subject becomes a lit painted backdrop on a stage, cut-paper figures in front. Reds and golds fill most of the frame; night blue #0C1A3A only for the far sky. Only the hero gets a painted, coloured face. Candles flicker gently (±5%), warm halos about five flames wide; light haze, vignette, fine grain. Signature shot: silhouettes framing a bright stage far back; slow lateral glide, then push. References: silhouettists Edouart, Miers; cinematographer Miroslav Ondříček (*Amadeus*, 1984). Avoid: plain black blobs; copy-pasted profiles; blue walls; strobing flames.","file":"风格提示词/O_奥斯卡98部/O57_莫扎特传.md","img":"风格提示词/O_奥斯卡98部/O57_莫扎特传.jpg","year":"1984","tags":["2D"],"extra":[{"h":"技法关键词","t":["18 世纪剪影肖像","洛可可金色浮雕","烛光泛光","申克尔的星空布景"]},{"h":"导演说明","t":"Clawd 扮莫扎特：白色扑粉假发配粉色发带、蕾丝领巾，指挥棒跟着音乐打拍子。一个运镜从乐池升到舞台，正好落在夜后的高音上，然后硬切到暗处看着的萨列里。1:1 时间，不放慢。"},{"h":"成片里的分镜","t":"1. 沿着烛光乐池横移到挥棒指挥的 Clawd，再越过它升起、后拉，落到星空舞台上，夜后抬臂唱高音。（1.6s）\n2. 硬切到萨列里的暗包厢：一排剪影里只有他的脸是画出来的，被一支蜡烛从下面照亮；缓慢推进。Clawd 不在画面里。（0.9s）"},{"h":"参考出处","t":["Miloš Forman, Amadeus (1984)","Miroslav Ondříček (cinematography)","Karl Friedrich Schinkel, Queen of the Night set (1815)","Augustin Edouart","John Miers"]}]},{"id":"O58","s":"O","cat":"大片年代 1980–1989","name":"走出非洲","en":"Out of Africa","desc":"实时 3D 的低空飞行：铬黄色双翼机掠过苏打湖，上万只火烈鸟惊起，琥珀色薄雾光。这部片最被记住的就是丹尼斯带凯伦飞越肯尼亚，和她向后座伸出的那只手。","fit":"3D 双翼机飞越东非裂谷","prompt":"实时 3D，像 80 年代宽银幕实景摄影：模型按真实比例、细节到位（如支柱、拉线、铆钉）；地形平滑，不要低多边形碎面。默认光：从镜头看，低斜的太阳在主角身后（逆光），奶油色淡天空，琥珀薄雾，远山分三四层渐淡，赭黄大地上长长的柔影。整体明亮：七成画面在中高调，阴影暖灰不深褐；近白不超过五分之一。胶片曲线、低饱和、细颗粒、轻暗角。上千只实例化的鸟或动物（如粉 #F3B3AE 配深红 #DF3F55），主角经过时一波波错开起飞或散开。招牌镜头：越过移动中主角的肩膀看远景；其次是离地 10–20 米的追拍和一个对着太阳的逆光镜头。对标摄影师 David Watkin（《走出非洲》，1985）。避免：冷而干净的 CG 日光；发暗的棕褐调；整齐划一的鸟群。","prompt_en":"Real-time 3D like 1980s widescreen location photography: true-scale models with fine detail (e.g. struts, wires, rivets); smooth terrain, not low-poly. Default light: late-afternoon sun low behind the hero as seen from camera, pale cream sky, amber haze, distant ridges in 3–4 paler layers, ochre ground with long soft shadows. Pale overall: about 70% of the frame in light mid-tones, shadows warm grey, not deep brown; under a fifth near-white. Grade: filmic curve, low saturation, light grain, soft vignette. Thousands of instanced birds or animals (e.g. pink #F3B3AE with crimson #DF3F55) lift or scatter in staggered waves as the hero passes. Signature shot: over the moving hero's shoulder across open land; then a high chase 10–20 m up and one shot into the sun. Reference: cinematographer David Watkin (*Out of Africa*, 1985). Avoid: cold clean CG daylight; dark sepia; lockstep flocks.","file":"风格提示词/O_奥斯卡98部/O58_走出非洲.md","img":"风格提示词/O_奥斯卡98部/O58_走出非洲.jpg","year":"1985","tags":["3D"],"extra":[{"h":"技法关键词","t":["three.js 实时 3D","David Watkin 的航拍","暖调胶片调色","实例化的火烈鸟群"]},{"h":"导演说明","t":"Clawd 坐在凯伦的前座：皮飞行帽、黄铜护目镜、白丝巾。两个外景镜头硬切，交代火烈鸟湖上的速度和空间；最后的座舱镜头留给片中那个动作：Clawd 转身向后伸手，丹尼斯握住，落在最后几拍。飞行时间是屏幕时间的 1.5–1.6 倍。"},{"h":"成片里的分镜","t":"1. 贴着湖面仰拍追机：黄色双翼机从头顶掠过，Clawd 小小地坐在前座探身往外看，火烈鸟从水面腾起掠过镜头。（0.8s）\n2. 硬切到正对太阳的逆光全景：飞机迎面飞来，两侧是正在升起的粉色鸟群。（0.7s）\n3. 从后座往前的机上镜头：戴皮飞行帽、黄铜护目镜、白丝巾在风里飘的 Clawd 转身向后伸手，丹尼斯戴手套的手握住它。（1s）"},{"h":"参考出处","t":["Sydney Pollack, Out of Africa (1985)","David Watkin (cinematography)","Out of Africa (1985) poster","de Havilland DH.60G Gipsy Moth G-ABAK"]}]},{"id":"O59","s":"O","cat":"大片年代 1980–1989","name":"野战排","en":"Platoon","desc":"快而有力的钢笔线，橄榄绿、土黄、烟灰和火光橙的淡彩，速写本纸四边留白。像随军画家在现场画下的，贴近这部片从步兵眼里看越战的视角。","fit":"越战随军速写 · 钢笔淡彩","prompt":"现场报道式钢笔淡彩速写。钢笔用暖黑，线宽约画面宽度的 1/600，快而肯定，收笔甩出，转角冲出头；暗部用快速排线和折线，人物和地面都排线。淡彩透明而大胆：边缘湿软、有回流花、深浅不匀（不要硬边多边形），铺满画面约七成，整体错开线稿 2–4px（按 1920×1080）。颜色：橄榄绿 #70783E、土黄 #CEA054、烟灰 #706C70，加一个热烈点缀色 #F0822E 给天空和光源；肤色用淡土黄；暖米色速写本纸 #F2ECDE。只有最亮处、四边窄条和笔刷漏掉处留纸，纸纹很轻。角落用用户的语言潦草写一句铅笔速记（地点、时间、天气），字高约画面 1/40。分层便于横移；换视角硬切，像翻页。对标美国陆军越战战地艺术计划（1966–70）。避免：插画式精修；空着的纸；发脏的淡彩；重噪点。","prompt_en":"Reportage pen-and-wash field sketch. Pen: warm black, fast confident lines ~1/600 of frame width, flicked ends, overshooting corners; quick hatching and zigzags for shadow, on figures and ground. Bold transparent washes with soft wet edges, blooms and uneven pigment (not flat polygons) cover about 70% of the frame, shifted 2–4 px (at 1920×1080) off the line. Colours: olive #70783E, ochre #CEA054, smoke grey #706C70, one hot accent #F0822E for sky and light sources; skin in diluted ochre; sketchbook paper #F2ECDE. Bare paper only in highlights, a thin edge band and brush gaps; light grain. A scrawled pencil note (place, time, weather) in a corner, 1/40 of frame height, in the user's language. Layer for lateral tracks; hard cuts like turning a page. Reference: US Army Vietnam Combat Artists Program (1966–70). Avoid: polished finish; empty page; muddy washes; heavy noise.","file":"风格提示词/O_奥斯卡98部/O59_野战排.md","img":"风格提示词/O_奥斯卡98部/O59_野战排.jpg","year":"1986","tags":["2D"],"extra":[{"h":"技法关键词","t":["快速钢笔线","透明淡彩","速写本纸","美国陆军越战战地艺术计划"]},{"h":"导演说明","t":"Clawd 扮伊莱亚斯：丛林帽、狗牌。两个硬切从地面到空中再回到地面，每个镜头像速写本里的另一页；切到最后一个镜头，双臂随即猛地张成海报姿势，直升机拉起时手臂微微垂下。场景以 1.1 倍速播放。"},{"h":"成片里的分镜","t":"1. 横移跟着在象草里前进的巡逻队；戴丛林帽、挂狗牌的 Clawd 站在中间，士兵从它身边走过。（0.8s）\n2. 硬切到从休伊直升机舱门往下看：燃烧的着陆区、被旋翼压平的草和直升机自己的影子，Clawd 小小地站在空地上；镜头缓慢拉远。（0.8s）\n3. 硬切到 Clawd 的近景，拉回海报构图：它在凝固汽油弹的橙色火光下双臂张成 V 字，两侧士兵跑过，直升机拉起离开。（0.9s）"},{"h":"参考出处","t":["Oliver Stone, Platoon (1986)","Platoon (1986) poster","US Army Vietnam Combat Artists Program (1966–70)"]}]},{"id":"O60","s":"O","cat":"大片年代 1980–1989","name":"末代皇帝","en":"The Last Emperor","desc":"绢本上的铁线描和层层渲染的石青、石绿、朱砂、泥金，界画的宫殿，几千名跪拜的百官。小皇帝的登基是清宫仪典，就用清宫画师记录仪典的画法来画。","fit":"工笔重彩 · 绢本宫廷画","prompt":"绢本工笔重彩（清代宫廷画法）。由远到近画，每个形：平涂底色 → 分染（沿下缘和被遮处加深）→ 均匀铁线描（深褐，线宽约画面 1/900）→ 提金、提白；最后全画面叠三成浓度的暖赭罩染，线仍清楚。矿物色：朱砂 #C23A22、石青 #2C5A9A、石绿 #3A8A6A、藤黄 #E8B830、泥金 #CAA04A，被罩染压稳；地面和天空是中等明度的暖赭绢色，不要近白，不画饱和蓝天和橙色落日，时段变化只靠整体冷暖。不画投影和眩光。水用细线水纹。建筑用界画，瓦片一片片画出；有人群时人人不同，单人也行。绢纹淡（±3%），褐色暗角。一点透视、左右对称，大人物在前，身后深远规整。缓推。对标清代宫廷长卷，如《康熙南巡图》。避免：复制粘贴人物；不分染的平涂；写意水墨；海报式饱和色。","prompt_en":"Chinese gongbi zhongcai (fine-line, heavy-colour court painting) on aged silk. Far to near, each form: flat base, a wash darkening its lower, overlapped edges, an even iron-wire outline (dark brown, ~1/900 frame width), gold and white lifts. Last, a 30% warm ochre glaze over everything, lines still clear. Minerals: cinnabar #C23A22, azurite #2C5A9A, malachite #3A8A6A, gamboge #E8B830, gold #CAA04A, muted by the glaze; ground and sky mid-value warm silk ochre, never near-white, saturated blue or orange; time of day shows only as overall warmth. No cast shadows or glare. Fine-line water ripples. Ruled-line architecture, every tile drawn; crowds all differ; a lone figure works. Faint silk weave (±3%), brown vignette. Symmetrical one-point composition: a large figure before a deep, ordered space. Slow pushes. Reference: Qing court scrolls, e.g. *Kangxi's Southern Inspection Tour*. Avoid: copy-pasted figures; unwashed flat fills; loose ink wash; poster saturation.","file":"风格提示词/O_奥斯卡98部/O60_末代皇帝.md","img":"风格提示词/O_奥斯卡98部/O60_末代皇帝.jpg","year":"1987","tags":["2D"],"extra":[{"h":"技法关键词","t":["工笔重彩","界画","清代宫廷画卷","Storaro 的色彩"]},{"h":"导演说明","t":"Clawd 扮小溥仪：红缨朝冠、朝珠、马蹄袖。帘幕分开，Clawd 踩着节拍走出来；硬切到百官叩首的波浪，最后几拍落在海报式的全景上。场景以 1.1 倍速播放。"},{"h":"成片里的分镜","t":"1. 绣着团龙的黄色绸帘占满画面，帘子分开，戴红缨朝冠的 Clawd 走上丹陛；镜头微微后拉。（1s）\n2. 硬切到低机位横移，扫过跪着的百官，一排排穿补服的官员波浪般叩首。（0.6s）\n3. 硬切到海报构图并慢慢拉宽：Clawd 大大地站在丹陛上，身后是跪满百官的广场和金色重檐，前景是蝈蝈罐。（0.9s）"},{"h":"参考出处","t":["Bernardo Bertolucci, The Last Emperor (1987)","Vittorio Storaro (cinematography)","The Last Emperor (1987) poster","Kangxi Southern Inspection Tour scrolls","Qianlong's Grand Review"]}]},{"id":"O61","s":"O","cat":"大片年代 1980–1989","name":"雨人","en":"Rain Man","desc":"平滑的喷枪渐变、硬边遮罩、镀铬高光和粉绿霓虹，叠一层细细的青色计数标注。80 年代画风配上雷蒙眼里的世界：82、82、82，共 246 根牙签，还有牌桌算牌。","fit":"80 年代喷枪插画 + 雷蒙的计数","prompt":"80 年代喷枪插画，叠一层工程制图标注。每个形是硬边遮罩里喷出的平滑渐变，边缘 1–2px（按 1920×1080）细飞沫。明亮高调：薄荷绿 #79BDA6 的墙或天空、奶油白，霓虹粉 #F58CB5 和品红 #C9467F 点缀，地面铺黑白棋盘格；紫色和夜色不超过两成，其他时段仍是薄荷绿奶油底，晚霞用粉色画。人物学 Patrick Nagel：苍白平整的皮肤、少而利落的线、成块深色头发，粉与薄荷绿轮廓光，但保留本人的年龄衣着。金属玻璃学空山基镀铬：天空色带、硬地平线、十字星光。最上层是细青色标注 #56E6FF、白字 #D9FBFF（字高约画面 1/40）：圆点引线、虚线圈组、尺寸线；像《雨人》的雷蒙，等宽数字数故事里要数的东西，圈一组滚一次。慢推或慢拉。避免：合成波式的条纹太阳；UI 框；发糊的边。","prompt_en":"1980s airbrush illustration with a drafting overlay. Every shape: a hard-edged mask filled with a smooth sprayed gradient, 1–2 px overspray rim (at 1920×1080). Bright, high-key: mint #79BDA6 walls or sky, cream, neon pink #F58CB5 and magenta #C9467F accents, black-and-white checker floor or ground; purple and night under 20%; at other times of day keep mint and cream; pink carries any sunset. Figures à la Patrick Nagel (flat pale skin, few crisp lines, dark hair masses, pink and mint rim light), keeping their own age and dress. Metal and glass in Hajime Sorayama chrome: banded sky reflection, hard horizon line, cross-star glints. Overlay: thin cyan callouts #56E6FF, near-white text #D9FBFF (1/40 frame height), dotted leaders, dashed rings, dimension lines; monospace numbers count whatever the story counts, Rain Man style, as each group is circled. Slow push/pull. Avoid: synthwave suns; UI boxes; soft edges.","file":"风格提示词/O_奥斯卡98部/O61_雨人.md","img":"风格提示词/O_奥斯卡98部/O61_雨人.jpg","year":"1988","tags":["2D"],"extra":[{"h":"技法关键词","t":["80 年代喷枪插画","Patrick Nagel 式人物","空山基式镀铬","工程图标注"]},{"h":"导演说明","t":"Clawd 扮雷蒙：扣到顶的格子领、胸袋里插着几支笔和一支铅笔。剪辑跟着计数走：开头几拍圈出三堆牙签，246 出来时它歪头，然后硬切到拉斯维加斯，每张牌落下都跳出一个计数标记。场景以 1.1 倍速播放。"},{"h":"成片里的分镜","t":"1. 俯拍黑白格的餐馆地面：撒了一地的牙签一堆堆被圈出来，数字滚动计数，镜头缓慢拉远，让顶上的 246 进画。（1s）\n2. 硬切到 Clawd 的中近景：格子衬衫领、胸袋里一排笔，歪着头看地上标着 82 的牙签堆，头越歪越低；镜头缓慢拉远。（0.8s）\n3. 硬切到拉斯维加斯的 21 点牌桌，越过荷官肩膀拍：牌从牌靴里飞出，旁边跳出 Hi-Lo 标记和累计点数；Clawd 坐在 Nagel 式女人和查理之间。（0.7s）"},{"h":"参考出处","t":["Barry Levinson, Rain Man (1988)","John Seale (cinematography)","Patrick Nagel","Hajime Sorayama"]}]},{"id":"O62","s":"O","cat":"大片年代 1980–1989","name":"为黛西小姐开车","en":"Driving Miss Daisy","desc":"扎实温暖的洛克威尔写实：边缘干净、笔触可见，午后阳光穿过橡树，邻居各忙各的。这部片就是 50 年代亚特兰大一辆车里的两个人，本身就像一张《星期六晚邮报》封面。","fit":"洛克威尔式油画插画","prompt":"洛克威尔式 50 年代美国杂志封面油画。人物接近写实：头约占身高 1/7，脸和手用三四块明暗面塑出、不靠描线，表情读得出。塑形平滑，笔触隐约：宽约画面 1/150，顺形体走，每笔与底色只差±5%。默认光：左上方暖色午后阳光，地上有清楚的投影和树影，阴影冷蓝灰；别的光也保持暖主光冷阴影。中等饱和：奶油天空 #E6DCC2、砖红 #9A4A38、叶绿、瓶绿 #1F3A24、柔和肤色。光面映出环境。背景有小故事：有人处路人各忙各的，主角独处就靠物件。轻画布纹、暖光油、柔和暗角。镜头：有纵深的四分之三全景缓推，越切越近，落在手或脸上。对标洛克威尔 1940–50 年代《星期六晚邮报》封面。避免：卡通脸；重纹理滤镜；无笔触的数码平涂；空背景。","prompt_en":"Norman Rockwell-style mid-century magazine-cover oil illustration. Near-realistic figures: head about 1/7 of body height, faces and hands modelled from 3–4 value planes, not outlines; readable expressions. Smooth modelling; faint strokes about 1/150 of frame width, following form, each within ±5% of the colour beneath. Default light: warm afternoon sun from the upper left, clear cast and dappled shadows in cool blue-grey; other light keeps a warm key and cool shadows. Palette: cream sky #E6DCC2, brick red #9A4A38, leaf greens, bottle green #1F3A24, soft skin. Gloss reflects surroundings. Background storytelling: busy bystanders where there are people, telling objects when the hero is alone. Light canvas texture, warm varnish, soft vignette. Camera: deep three-quarter wide, slow push, closer cuts ending on a hand or face. Reference: Rockwell's *Saturday Evening Post* covers (1940s–50s). Avoid: cartoon faces; texture filters; flat digital shading; empty backgrounds.","file":"风格提示词/O_奥斯卡98部/O62_为黛西小姐开车.md","img":"风格提示词/O_奥斯卡98部/O62_为黛西小姐开车.jpg","year":"1989","tags":["2D"],"extra":[{"h":"技法关键词","t":["诺曼·洛克威尔油画插画","《星期六晚邮报》封面","3D 建模的车再铺油画笔触"]},{"h":"导演说明","t":"Clawd 扮霍克，戴藏青色司机帽。三个硬切从车外到车里再到后视镜，一个比一个近；结果留到最后：镜子里黛西小姐的板脸在最后几拍慢慢松成微笑。场景时间平均是屏幕时间的 1.8 倍左右，车仍然开得从容。"},{"h":"成片里的分镜","t":"1. 墨绿色 1949 年哈德逊的四分之三前侧，车沿着橡树成荫、红砖房和白门廊的街道慢慢开来；戴司机帽的 Clawd 握着方向盘，黛西小姐板着脸坐在后窗里；缓慢推进。（0.9s）\n2. 硬切到后座往前拍的定机位：前景是黛西小姐的大侧脸，后面是开车的 Clawd 的背影，街景从车窗外流过。（0.8s）\n3. 硬切到后视镜特写，也就是海报构图：左边是帽檐下 Clawd 的眼睛，右边是黛西小姐，慢慢露出一点笑；镜头轻推。（0.8s）"},{"h":"参考出处","t":["Bruce Beresford, Driving Miss Daisy (1989)","Driving Miss Daisy (1989) poster","Norman Rockwell, Saturday Evening Post covers"]}]},{"id":"O63","s":"O","cat":"世纪末 1990–1999","name":"与狼共舞","en":"Dances with Wolves","desc":"一个军人的野外日记：轻重有变化的铅笔线、透明水彩、泛黄的布浆纸、墨水手写和页边的铅笔批注。邓巴在片中一直写画日记，所以草原是从他的速写里活过来的。","fit":"邓巴日记 · 铅笔 + 透明水彩","prompt":"一本活过来的 19 世纪野外日记：看得见铅笔线的满幅透明水彩。铅笔底稿 #3A363A 有轻重和断笔，暗部轻排线，透过颜色仍读得出。水彩边缘湿软，有回流花、积色深边和颗粒（不要平涂多边形），铺满约八成画面，浓郁偏暖。默认魔幻时刻：灰玫瑰色天空 #C88F76 往上转淡紫，玫瑰色条云，低太阳，赭金大地 #DEBE87，远处紫，长投影；朝太阳的边缘点几笔不透明浅金。泛黄布浆纸 #F0E4C8，淡水渍霉斑，纸色透出来。铁胆墨水 #34221C 写小字草书标注和箭头。招牌动作只在开头约两秒：先只有铅笔，镜头推进时颜色从远到近一块块铺上；之后每帧满彩。对标 Karl Bodmer、George Catlin 的野外速写。避免：灰脏或发白的淡彩；均匀数码描边；开头后仍只有铅笔。","prompt_en":"A 19th-century field journal come to life: full-colour watercolour over visible pencil. Pencil under-drawing #3A363A, pressure-varied and broken, lightly hatched in shadow, readable through the washes. Brushed washes with soft wet edges, blooms, pooled rims and granulation (not flat polygons) cover about 80% of the frame in rich warm colour. Default magic hour: dusty-rose sky #C88F76 turning lavender above, streaky rose clouds, low sun, ochre-gold land #DEBE87, violet distance, long shadows, opaque pale-gold lifts on sun-facing edges. Yellowed rag paper #F0E4C8, faint stains and foxing, showing through. Iron-gall ink #34221C for small labels and arrows. Signature move, once at the opening (about 2 s): bare pencil, then colour arrives wash by wash, far to near, during a push-in; after that, full colour. References: Bodmer and Catlin field sketches. Avoid: grey, muddy or pale washes; uniform digital outlines; later pencil-only frames.","file":"风格提示词/O_奥斯卡98部/O63_与狼共舞.md","img":"风格提示词/O_奥斯卡98部/O63_与狼共舞.jpg","year":"1990","tags":["2D"],"extra":[{"h":"技法关键词","t":["铅笔底稿","透明水彩","铁胆墨水手写","Bodmer、Catlin 的野外水彩"]},{"h":"导演说明","t":"Clawd 扮邓巴：带金色帽绳的黑色骑兵宽檐帽，一手日记本、一手铅笔。推近页面和上色是同一个动作；切到活过来的草原落在乐句中间，抬帽致意落在最后几拍。1:1 时间。"},{"h":"成片里的分镜","t":"1. 推近日记的右页：Clawd 的自画像和狼「双袜」一开始只是铅笔底稿，水彩一笔笔铺上来，先是天空，最后才是 Clawd。（1.2s）\n2. 切到活成满幅彩色的日落草原：一个推镜从平原推到对望的 Clawd 和双袜，身后野牛群奔过；Clawd 抬帽致意。（1.3s）"},{"h":"参考出处","t":["Kevin Costner, Dances with Wolves (1990)","Dean Semler (cinematography)","Dances with Wolves (1990) poster","Karl Bodmer","George Catlin"]}]},{"id":"O64","s":"O","cat":"世纪末 1990–1999","name":"沉默的羔羊","en":"The Silence of the Lambs","desc":"细密的铜版排线和点刻，上面薄薄地手工上色，图版编号和拉丁文标签印在泛黄的纸上。海报上的鬼脸天蛾本就该钉在标本图版上，同样冷峻的铜版画法一直延伸到莱克特的囚室。","fit":"手工上色的博物学铜版画","prompt":"手工上色的博物学铜版画。所有物体用暖黑褐刻线画：密集平行线和交叉排线（线距约画面宽度 1/400，暗处线更粗），柔和过渡用点刻，物下有排线投影；天空留纸色或只几道稀疏横线。线内平涂水彩，中等饱和、颜色认得出：纸 #EFE3C4、赭褐 #5A3A22、铁锈红 #B4431E、黄 #E6AD24、灰紫 #7D6F8E。图版：主体作图 1 居中，约占版面高六成，四周 3–6 个编号小图（局部或相关物件），各约五分之一高；上方字距拉开的小型大写标题，下方编号图注，压印斜边版框，淡霉斑。默认均匀日光，时段变化只调着色冷暖；暗室内转冷，侧面硬光。镜头：静止图版里只有一样东西在动（虫、叶、手），再匀速慢推到关键细节。对标 Moses Harris《The Aurelian》（1766）。避免：平滑渐变；刺眼的颜色；主体缩成小晕影。","prompt_en":"A hand-coloured natural-history copperplate. Every object in engraved warm black-brown line: dense parallel and cross-hatching (spacing about 1/400 of frame width, thicker in darks), stipple for soft tones, hatched shadows beneath; sky bare or sparsely lined. Flat watercolour tints inside the line, medium saturation, clearly coloured: paper #EFE3C4, umber #5A3A22, rust #B4431E, yellow #E6AD24, grey-violet #7D6F8E. Plate: the subject as Fig. 1 in the centre, about 60% of plate height, 3–6 numbered part or object figures around it, each about 1/5 high; spaced small-caps title, numbered legend, bevelled plate mark, light foxing. Even daylight; time of day only shifts the tints' warmth; dark interiors go cold, hard side light. Camera: a still plate where one thing moves (insect, leaf, hand), then a slow push to a key detail. Reference: Moses Harris, *The Aurelian* (1766). Avoid: smooth gradients; garish colour; a tiny vignetted subject.","file":"风格提示词/O_奥斯卡98部/O64_沉默的羔羊.md","img":"风格提示词/O_奥斯卡98部/O64_沉默的羔羊.jpg","year":"1991","tags":["2D"],"extra":[{"h":"技法关键词","t":["铜版雕刻排线","手工上色","维多利亚昆虫学图版","Moses Harris《The Aurelian》"]},{"h":"导演说明","t":"Clawd 先是图版上的「图 4」，再扮别着 FBI 学员证的克拉丽丝。飞蛾在开头几拍落下；硬切到囚室，推向莱克特的镜头一气呵成、中间不切，他的笑留到最后才出来。场景时间约为屏幕时间的 1.8 倍。"},{"h":"成片里的分镜","t":"1. 整张昆虫学图版「Acherontia styx」：一只活的鬼脸天蛾从茄科植物上飞起，落在 Clawd 头顶；镜头轻推。（0.9s）\n2. 硬切到地下监区：别着 FBI 学员证的 Clawd（克拉丽丝）站在玻璃前；接着一个连续的推镜向右、向里推，直到莱克特的脸占满画面，嘴角露出一丝笑。（1.6s）"},{"h":"参考出处","t":["Jonathan Demme, The Silence of the Lambs (1991)","Tak Fujimoto (cinematography)","The Silence of the Lambs (1991) poster","Moses Harris, The Aurelian"]}]},{"id":"O65","s":"O","cat":"世纪末 1990–1999","name":"不可饶恕","en":"Unforgiven","desc":"两种调子的厚涂西部油画：雷明顿金红晚霞下的平原，和他晚年被暖黄窗光点亮的蓝绿夜景。《不可饶恕》以夕阳下坟前的剪影开场和收尾，决战发生在雨夜的小镇。","fit":"雷明顿西部油画 · 晚霞与雨夜","prompt":"弗雷德里克·雷明顿式西部油画。主调是晚霞，天黑透之前都用：橙到深红的金红天空用长横笔触，太阳压在地平线上，大地和人物是暗暖剪影，向阳一侧一道细暖轮廓光。第二种调子只在天黑透后用：蓝绿夜景（天 #17333A，月光边 #9CC4BC），暖黄窗光 #FFCC6A 铺在深色地面 #1E1C16 上，加雨。先画清楚的大形，再上笔触：每笔宽约画面宽度 1/80、长为宽的三到六倍，颜料饱满、笔端松散；每笔与底色明暗只差±6%，顺着各个面走。画布纹要轻。地平线低，天空占五到六成，人物小到中等。镜头：从剪影大全景慢推到人物。对标雷明顿晚年夜景画、摄影师 Jack N. Green（《不可饶恕》，1992）。避免：平滑渐变；硬边色带；打碎形体的满屏笔触；暖场景人物发灰；大幅横摇。","prompt_en":"Frederic Remington-style Western oil painting. Primary register, for anything before full dark: sunset, a red-gold sky (orange into deep red) in long horizontal strokes, the sun on the horizon, land and figures dark warm silhouettes, thin warm rim sunward. Second register, only after dark: a blue-green nocturne (sky #17333A, moonlit edges #9CC4BC, warm window light #FFCC6A on dark ground #1E1C16, rain). Broad, readable shapes first, then loaded strokes about 1/80 of frame width wide, 3–6 times as long, soft broken ends, each within ±6% brightness of the colour beneath, following the surface. Light canvas texture. Low horizon, sky 50–60% of the frame, figures small to medium. Camera: one slow push from a silhouetted wide to the figure. References: Remington's late nocturnes; cinematographer Jack N. Green (*Unforgiven*, 1992). Avoid: smooth gradients; hard-edged flat bands; shattered shapes; grey figures in warm scenes; wide pans.","file":"风格提示词/O_奥斯卡98部/O65_不可饶恕.md","img":"风格提示词/O_奥斯卡98部/O65_不可饶恕.jpg","year":"1992","tags":["2D"],"extra":[{"h":"技法关键词","t":["雷明顿的暖色平原","雷明顿晚年的夜景","厚涂油彩","开场字幕的剪影"]},{"h":"导演说明","t":"Clawd 扮威廉·芒尼：黑色宽檐帽、长雨衣立领、一支步枪。开场剪影到坟前是一个镜头，推到位时它正好抬头；唯一的一刀硬切到雨夜，Clawd 骑马进镇。1:1 时间，不放慢。"},{"h":"成片里的分镜","t":"1. 一个推镜从整片晚霞（木屋、风车、孤树、挡在太阳前的十字架）推到坟边的 Clawd（芒尼）；它抬起头，把步枪横到身前。（1.4s）\n2. 硬切到雨夜的大威士忌镇：Clawd 骑一匹兔褐马走过泥街，旁边是亮着窗的 Greeley's 酒馆，镜头推向它滴水的帽檐。（1.1s）"},{"h":"参考出处","t":["Clint Eastwood, Unforgiven (1992)","Jack N. Green (cinematography)","Unforgiven (1992) poster (Bill Gold)","Frederic Remington, nocturnes"]}]},{"id":"O66","s":"O","cat":"世纪末 1990–1999","name":"辛德勒的名单","en":"Schindler's List","desc":"冷灰、高反差的黑白，粗颗粒，高光晕开；只有小女孩的红大衣和 Clawd 的橙色有颜色。这正是斯皮尔伯格的手法：红大衣和安息日烛火是全片仅有的彩色。","fit":"黑白胶片 · 唯一的红大衣","prompt":"黑白电影质感：冷中性灰，强 S 曲线（黑接近 #111，白接近 #EEE），高光在雾里泛光晕，略软的老镜头，逐帧变化的银盐颗粒（±6%），轻微闪烁，偶有灰尘，暗角。全画面是灰的，只有故事围绕的那个主角是饱和色，以衣服为主（如陶土橙 #D97757）；可再有一个红色故事道具（#A3241F–#C9463C）。灯和火保持灰色，除非“火苗先灰后转暖”是剧情节点。长焦压缩空间，前景虚焦树枝；有人群时，体型、衣色和步态人人不同。默认阴天中间调，暗部不死黑。招牌镜头：长焦俯看许多走动的小人，带色的那个在其中；没有人群就让主角很小地落在大片灰里。对标摄影师 Janusz Kamiński（《辛德勒的名单》，1993）。避免：棕褐或偏蓝调色；无颗粒的干净灰；超过两样有颜色的东西。","prompt_en":"Black-and-white film look: cold neutral greys, a strong S-curve (blacks near #111, whites near #EEE), highlights haloing in haze, a soft old lens, silver grain re-rolled every frame (±6%), slight flicker, rare dust, vignette. Everything is grey except the one hero the story centres on, saturated, mainly clothing (e.g. terracotta #D97757); optionally one red story object (#A3241F–#C9463C). Lamps and fires stay grey, unless a flame turning from grey to warm is the story beat. Long-lens compression, soft foreground branches; in a crowd, no two people alike in build, tone or gait. Default: overcast mid-key, shadows open. Signature shot: high long-lens view of many small walking figures, the coloured one among them; without a crowd, the hero tiny in wide grey space. Reference: cinematographer Janusz Kamiński (*Schindler's List*, 1993). Avoid: sepia or blue toning; grain-free greys; more than two coloured things.","file":"风格提示词/O_奥斯卡98部/O66_辛德勒的名单.md","img":"风格提示词/O_奥斯卡98部/O66_辛德勒的名单.jpg","year":"1993","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["高反差黑白胶片","粗颗粒银盐","局部留色","Janusz Kamiński"]},{"h":"导演说明","t":"Clawd 扮辛德勒：灰色软呢帽、手握缰绳，坐在马上往下看。四个硬切跟着他的目光走：山坡、长焦主观镜头、街面，最后收在蜡烛上，每个镜头约一拍半。全程克制：人只是在走，不出现任何暴力。"},{"h":"成片里的分镜","t":"1. 山坡上骑着深色马的 Clawd（辛德勒），坡下的街道挤满被驱赶的人群，人群里有一个红点；镜头轻推。（0.7s）\n2. 硬切到辛德勒的长焦主观镜头，跟住独自走在人群空当里的红大衣小女孩。（0.6s）\n3. 硬切到街面：横移镜头和小女孩同速，三排人从店铺前往左走，一件虚焦的大衣从镜头前掠过。（0.6s）\n4. 硬切到黑暗里的两支安息日蜡烛：火苗先亮成灰白，再变成彩色；缓慢推进。Clawd 不在画面里。（0.6s）"},{"h":"参考出处","t":["Steven Spielberg, Schindler's List (1993)","Janusz Kamiński (cinematography)","Schindler's List (1993) poster"]}]},{"id":"O67","s":"O","cat":"世纪末 1990–1999","name":"阿甘正传","en":"Forrest Gump","desc":"平行折立起来的印刷卡片，白色纸芯、灰色纸板边、层与层之间的投影和浅景深，放在胡桃木书桌上。阿甘坐在长椅上把一生讲成故事，翻开一页就立起一段经历。","fit":"立体书 · 真实书桌上的纸艺","prompt":"一本放在书桌上实拍的立体书。每个元素是平的模切卡片，靠平行折立在打开成 90° 的背景页前，印着透明水彩和带纸纹的彩铅排线，切口露出白纸芯和灰纸板边。默认光：左上方窗户进来的明亮日光，层间柔和投影。卡面（天蓝、暖沙、绿）和房间都保持日光，故事在任何时段都一样；时段只画在印刷画面里（如低太阳、夜空）。胡桃木书桌 #6B3E1E，后面的房间虚成暖色柔光。物理景深，焦点在主角那层。招牌镜头：高机位四分之三角度看整个跨页。一个连续镜头：钻进一页、拉远到整本书、翻页代替剪辑、再推进下一跨页。对标 Robert Sabuda、Matthew Reinhart 的立体书。避免：像实心模型的卡片；昏暗压抑的房间；卡通脸。","prompt_en":"A real pop-up book filmed on a desk. Every element: a flat die-cut card on parallel folds before a 90° backdrop page, printed with transparent watercolour and grainy coloured-pencil hatching; cut edges show a white core and grey board. Default light: bright window daylight from the upper left, soft shadows between layers. Print colours (sky blue, warm sand, greens) and room light stay daylight whatever the story's time of day; that time appears only in the print (e.g. a low sun, a night sky). Walnut desk #6B3E1E; the room a warm blur. Physical depth of field, focus on the hero's layer. Signature shot: a high three-quarter view of the whole spread. One continuous move: dive into a page, pull back, turn the page instead of cutting, push into the next spread. References: Robert Sabuda, Matthew Reinhart. Avoid: solid-looking cards; dark moody rooms; cartoon faces.","file":"风格提示词/O_奥斯卡98部/O67_阿甘正传.md","img":"风格提示词/O_奥斯卡98部/O67_阿甘正传.jpg","year":"1994","tags":["2.5D"],"extra":[{"h":"技法关键词","t":["Robert Sabuda 立体书结构","水彩、彩铅印刷质感","three.js 纸卡","物理景深"]},{"h":"导演说明","t":"Clawd 扮阿甘：长椅上捧着一盒巧克力，公路和船上戴红色棒球帽。12 拍一个镜头不切：羽毛把镜头带进书里，两次翻页（约 2.7 秒和 4.2 秒）代替剪辑。3.25 秒开始跑，紧接着停下、转身。"},{"h":"成片里的分镜","t":"1. 一镜到底：书桌上合着的书翻开，萨凡纳的广场立起来；镜头跟着一根飘落的白羽毛降到长椅，Clawd 把巧克力递给护士；拉远、翻页，推进到纪念碑谷的 US-163，戴红帽的 Clawd 领着一群胡子拉碴的跟跑者跑近、停下、转身面对他们；再拉远、翻页，推进到闪电交加的暴风雨里的捕虾船「珍妮号」。（5s）"},{"h":"参考出处","t":["Robert Zemeckis, Forrest Gump (1994)","Don Burgess (cinematography)","Forrest Gump (1994) poster","Robert Sabuda & Matthew Reinhart"]}]},{"id":"O68","s":"O","cat":"世纪末 1990–1999","name":"勇敢的心","en":"Braveheart","desc":"一页中世纪手抄本：带冲压点的磨光金箔、青金石蓝、朱红、哥特体字，中间一幅窗口似的战役细密画。《勇敢的心》是苏格兰传奇，片尾那声 FREEDOM 做成泥金首字母。","fit":"泥金手抄本 · 贴金细密画","prompt":"一页泥金装饰手抄本，取局部或双页填满画面。羊皮纸 #ECDCB4、褐色墨线 #2A1A10、青金石蓝 #27469A、朱红 #C43A20，加抛光金箔：石膏底隆起，有打孔小圆点花，一道烛光高光只在金上慢慢扫过。细密画背景多为金箔（夜景用青金石底加金星），金至少占画面一成。哥特式人物平涂加墨线。凯尔特编结纹、常春藤边框、页边怪诞小兽；正文写故事（拉丁文或用户的语言），宽头笔哥特体，红蓝行尾线，一个大金首字母。版式：细密画如一扇窗，约占半页，旁为文字栏；窗后分层，推进出视差；人物可破框。左上暖烛光，褐色暗角，淡颜料颗粒。对标《凯尔经》、摩根圣经、勒特雷尔诗篇。避免：平涂黄色代替金箔；现代字体；人脸上的高光。","prompt_en":"An illuminated manuscript page (cropped, or an open spread) filling the frame. Vellum #ECDCB4, brown ink outlines #2A1A10, lapis #27469A, vermilion #C43A20, burnished gold leaf on raised gesso, with punched dot rosettes; a slow candle glint sweeps the gold only. Miniature backgrounds are mostly gold (night: lapis with gold stars); gold fills at least a tenth of the frame. Gothic figures in flat colour and ink outline. Celtic interlace, ivy borders, marginal grotesques; the story's text (Latin or the user's language) in broad-nib textura, red-and-blue line fillers, one large gilded initial. Layout: the miniature a window about half the page beside the text column, layered for parallax on pushes; figures may break out. Warm candle from upper left, brown vignette, pigment grain. References: Book of Kells, Morgan Bible, Luttrell Psalter. Avoid: flat yellow for gold; modern typefaces; glints on faces.","file":"风格提示词/O_奥斯卡98部/O68_勇敢的心.md","img":"风格提示词/O_奥斯卡98部/O68_勇敢的心.jpg","year":"1995","tags":["2D"],"extra":[{"h":"技法关键词","t":["《凯尔经》编结纹","哥特细密画（摩根圣经）","《鲁特雷尔诗篇》页边画","磨光金箔"]},{"h":"导演说明","t":"Clawd 扮华莱士：双手大剑、格子呢披带、额头一道蓝色 woad。四个硬切：首字母、整页、桥、交锋。冲锋在中段越来越猛，最后一个镜头里头顶的卷轴展开 freedom。场景时间约为屏幕时间的 1.8 倍。"},{"h":"成片里的分镜","t":"1. 泥金首字母 F 的特写，字腔里是半边脸涂着蓝色 woad 的华莱士，一道金光扫过金箔。（0.7s）\n2. 硬切到整页：REEDOM、哥特体正文、页边，中间是斯特林桥细密画，Clawd 冲在最前面；镜头轻推。（0.6s）\n3. 硬切进细密画：英格兰兵挤过木桥，一名披方格马衣的骑士冲来，河里有人在挣扎。（0.6s）\n4. 硬切到 Clawd 的近景：它举起双手大剑迎向骑士的骑枪，头顶的说话卷轴展开，写着 freedom。（0.6s）"},{"h":"参考出处","t":["Mel Gibson, Braveheart (1995)","Braveheart (1995) poster","Book of Kells","Morgan Bible (Maciejowski Bible)","Luttrell Psalter"]}]},{"id":"O69","s":"O","cat":"世纪末 1990–1999","name":"英国病人","en":"The English Patient","desc":"贴在旧书里的水彩速写，夹着地图、照片、便条和压花，整体是海报的琥珀褐。艾玛殊那本塞满画和笔记的希罗多德是全片的框架，镜头就穿过一张水彩进入游泳者洞穴。","fit":"探险家剪贴本水彩","prompt":"旅人的剪贴本铺满画面，从边到边挤满 6–10 样互相压叠的东西，有的伸出画框：胶带贴的水彩画（主画面，约占四成）、手绘地图、深褐老照片、印刷页、手写便条、压花；每样带柔影和泛黄胶带。水彩画：湿中湿铺色，受光面暖赭，暗面是硬边紫玫瑰色，钢笔勾轮廓，积色边，明暗对比清楚。配色：琥珀纸 #E8D6B0、深褐 #6B4A2E、赭 #D08A3C、紫玫瑰 #9C6A86、墨 #2A1E16。画里：暗前景里一个暖光源（火把、灯）投下光池，外面是明亮的天。琥珀调色只轻压书页，画里保持干净不发脏；暗角约两成，纸纹淡。招牌动作：推进一张画，直到书页边缘从两侧滑出、人已在画里。对标摄影师 John Seale（《英国病人》，1996）。避免：平滑数码渐变；稀疏整齐的版面；书页还框着画时横摇。","prompt_en":"A traveller's scrapbook, crowded edge to edge with 6–10 overlapping items, some running off frame: a taped watercolour (the main image, about 40% of frame), a hand-drawn map, a sepia photo, printed pages, handwritten notes, a pressed flower; each softly shadowed, with yellowed tape. The watercolour: wet-in-wet washes, warm ochre lights, hard-edged violet-rose shadows, pen contours, pooled edges, clear value contrast. Palette: amber paper #E8D6B0, sepia #6B4A2E, ochre #D08A3C, rose-violet #9C6A86, ink #2A1E16. Inside the painting: one warm source (torch, lamp) pooling in a dark foreground, bright sky beyond. Light amber grade on the page only, never muddying the painting; vignette about 20%, faint grain. Signature move: push into the painting until the page edges slide out. Reference: cinematographer John Seale (*The English Patient*, 1996). Avoid: smooth gradients; sparse tidy layouts; panning while a page frames the painting.","file":"风格提示词/O_奥斯卡98部/O69_英国病人.md","img":"风格提示词/O_奥斯卡98部/O69_英国病人.jpg","year":"1996","tags":["2D"],"extra":[{"h":"技法关键词","t":["透明水彩","钢笔笔记和手写","剪贴拼贴：胶带、照片、地图","琥珀褐调色"]},{"h":"导演说明","t":"Clawd 扮艾玛殊：亚麻沙漠头巾，巾尾飘着，一手希罗多德、一手火把。推进画里的镜头本身就是转场；之后两个硬切都留在洞里，先壁画，再 Clawd。场景时间约为屏幕时间的 1.8 倍。"},{"h":"成片里的分镜","t":"1. 剪贴本摊在桌上，一个推镜推进那张水彩，直到书页从镜头两侧滑出：Clawd 举着火把站在画里的游泳者洞穴中。（1.2s）\n2. 硬切到横移，扫过洞壁上的游泳人壁画，火光摇晃；Clawd 不在画面里。（0.6s）\n3. 硬切到 Clawd 一手火把一手书站在左边，旁边是壁画，洞口外是沙丘；镜头缓慢后移。（0.7s）"},{"h":"参考出处","t":["Anthony Minghella, The English Patient (1996)","John Seale (cinematography)","The English Patient (1996) poster","Cave of Swimmers, Wadi Sura"]}]},{"id":"O70","s":"O","cat":"世纪末 1990–1999","name":"泰坦尼克号","en":"Titanic","desc":"普鲁士蓝晒图纸上的白线立起来、长出透视，再显影成夕阳下全彩的 3D 船，一路入夜。船本身就是这部片的标志，所以船厂图纸和实景用的是同一艘模型。","fit":"蓝图显影成 3D 实景","prompt":"一张工程蓝图变成偏写实的 3D。蓝图只占开头 1–2 秒、不超过全片 15%：普鲁士蓝晒图纸（#12306B 到 #244D8F）上的白色棱线，线宽约画面 1/800，被挡的线画虚线，人物和地形用等高线；曝光不匀，有折痕、手写标注和图签。滑动变焦让立面图立成透视，再从主角往外显出全彩，显影边是带暖光的软边，幽灵线一秒内淡掉。之后是风格主体：黄金时刻的真实 3D，低太阳，暖琥珀高光 #F2B860，深暖阴影 #3A2530，水面阳光碎金，薄雾，浅景深，轻泛光，细颗粒；再到蓝调时刻和夜晚，暖灯亮起。一个不间断运镜：推近、立起在蓝图段，之后低掠主角、升起环绕、下降平分余下时间。对标摄影师 Russell Carpenter（《泰坦尼克号》，1997）。避免：在图上停太久；硬切；平而干净的 CG 光。","prompt_en":"A blueprint turning into photoreal-leaning 3D. Opening only (1–2 s, under 15% of the film): white edge lines about 1/800 of frame width on Prussian-blue paper (#12306B to #244D8F), hidden lines dashed, figures and terrain as contours, uneven exposure, folds, lettering. A dolly-zoom stands the elevation up into perspective; colour spreads from the hero along a soft warm edge, ghost lines fading within a second. Then the signature look: golden-hour real 3D, low sun, amber highlights #F2B860, warm shadows #3A2530, sun glitter on water, soft mist, shallow focus, gentle bloom, fine grain; then blue hour and night, warm lights coming on. One unbroken move: push in and stand up (blueprint), then, in equal shares, drift low past the hero, rise and orbit, descend. Reference: cinematographer Russell Carpenter (*Titanic*, 1997). Avoid: lingering on the drawing; hard cuts; flat CG light.","file":"风格提示词/O_奥斯卡98部/O70_泰坦尼克号.md","img":"风格提示词/O_奥斯卡98部/O70_泰坦尼克号.jpg","year":"1997","tags":["3D"],"extra":[{"h":"技法关键词","t":["船厂总布置蓝图","按真实尺寸建模的 three.js 船","Russell Carpenter 的色彩","一镜到底"]},{"h":"导演说明","t":"Clawd 扮杰克，围一条藏青羊毛围巾。16 拍一个镜头不切：1.5 秒蓝图展开完，2.4 秒显影完，Clawd 在罗丝身旁张开双臂；从夕阳到夜晚是运镜中的延时，冰山在最后两秒出现，Clawd 转身报警落在最后几拍。"},{"h":"成片里的分镜","t":"1. 一镜到底：在总布置图上推向船头；线稿立起成透视，从两人身上向外显影成夕阳；低机位贴近罗丝的逆光剪影，Clawd 在她身旁张开双臂；镜头升起、绕过左舷船头，太阳沉下，船灯亮起；越过艏楼进入夜色，罗丝从栏杆上下来；再降到 Clawd 身后，冰山从海雾里出来，Clawd 转身举臂报警。（6.7s）"},{"h":"参考出处","t":["James Cameron, Titanic (1997)","Russell Carpenter (cinematography)","Titanic (1997) poster","Harland & Wolff general-arrangement drawings"]}]},{"id":"O71","s":"O","cat":"世纪末 1990–1999","name":"莎翁情史","en":"Shakespeare in Love","desc":"学尼古拉斯·希利亚德的伊丽莎白时代宫廷细密画：羊皮纸上的不透明水彩、群青底、贝壳金题字、白色野蔷薇。影片发生在莎士比亚的伦敦，细密画正是那个宫廷自己的肖像形式。","fit":"希利亚德伊丽莎白细密画","prompt":"伊丽莎白时代宫廷细密画，学尼古拉斯·希利亚德：暖色羊皮纸上平涂不透明水彩，暗面极细排线（线宽约画面宽度的 1/1000），受光边点铅白，红褐轮廓线。配色：群青底 #203E92、贝壳金 #D6B05C（细颗粒金点加几处抛光高光）、胭脂红 #A8202C、铅白 #F6F2E8、铜绿 #346C40。招牌画面：主体画在金边椭圆挂坠里，挂坠平放在锈红色锦缎上；一丛开满白花的野蔷薇铺满主体身后和四周，上沿一圈金色罗马大写短铭文。椭圆底色始终是群青，风景和天空放进去时画成平涂色带。大场景可离开挂坠，画法不变。镜头慢推、轻微下摇，只有花、布料和手势在动。对标希利亚德《玫瑰丛中的青年》（约 1587）。避免：喷枪渐变；厚油画笔触；平黄色的金。","prompt_en":"Elizabethan portrait miniature in Nicholas Hilliard's manner: opaque watercolour laid flat on warm vellum, very fine hatching in shadows (lines about 1/1000 of frame width), lead-white dots on lit edges, red-brown outlines. Palette: ultramarine ground #203E92, shell gold #D6B05C (granular flecks, a few burnished highlights), carmine #A8202C, lead white #F6F2E8, verdigris #346C40. Signature shot: the picture inside a gold-rimmed oval locket lying on rust-red damask; a flowering white eglantine briar fills the oval behind and around the subject; a short motto in gold Roman capitals arcs along the top. The oval's ground stays ultramarine; landscape and sky go in as flat colour bands. Wide scenes may leave the locket, same method, true perspective. Slow push, slight tilt; only flowers, cloth and gestures move. Reference: Hilliard, *Young Man Among Roses* (c. 1587). Avoid: airbrush gradients; thick oil strokes; flat yellow gold.","file":"风格提示词/O_奥斯卡98部/O71_莎翁情史.md","img":"风格提示词/O_奥斯卡98部/O71_莎翁情史.jpg","year":"1998","tags":["2D"],"extra":[{"h":"技法关键词","t":["宫廷细密肖像（limning）","羊皮纸上的不透明水彩","贝壳金","深红锦缎静物"]},{"h":"导演说明","t":"Clawd 扮莎士比亚：浆硬的轮状皱领、金耳环，细密画里拿羽毛笔，舞台上换成白玫瑰。四个镜头硬切，从私人的细密画一路走到公众的剧院，最后一拍女王慢慢点头，收住这一段。"},{"h":"成片里的分镜","t":"1. 近景：深红锦缎上的金色挂坠细密画，Clawd 扮莎士比亚站在白色野蔷薇里，戴轮状皱领，羽毛笔在写字；镜头慢慢推近，略往下摇。（0.8s）\n2. 全景：玫瑰剧院。镜头从上方的彩绘天幕和看台往下摇并推近到舞台，Clawd 拿着一朵白玫瑰站在台上，女王坐在右侧包厢里。（0.6s）\n3. 中景：阳台戏，朱丽叶在上方托腮，Clawd 在下面向她举起白玫瑰；镜头略推。（0.6s）\n4. 近景：华盖下包厢里的伊丽莎白女王，从看戏转过脸来，摇着扇子，慢慢点头；镜头略推。（0.6s）"},{"h":"参考出处","t":["John Madden, 1998","Nicholas Hilliard, Young Man Among Roses (c.1587)","Shakespeare in Love 1998 poster (red damask, amber light)"]}]},{"id":"O72","s":"O","cat":"世纪末 1990–1999","name":"美国丽人","en":"American Beauty","desc":"两种画面剪在一起：先是干净饱和、正面对称的郊区住宅（红门、红玫瑰），再切到带 REC 界面的低清 DV 录像。对应影片里莱斯特体面的郊区和里基拍下的那段塑料袋录像。","fit":"郊区对称电影画面 + DV 录像","prompt":"两种画面。主画面约七成：干净饱和的插画，正面对称，主角居中，身后是它的家或场景；形状有两三层柔和明暗，细节密（灌木、花丛、由许多小叶簇堆成的树冠）。默认明亮日光；其他光线下也要亮（日落偏金），不发暗。红门 #C3141F 一类红色点缀，白线脚，饱和的绿，橙红秋树；暖调、轻暗角、细颗粒。过渡：卷曲的红花瓣或落叶（约画宽 1/60）越积越密，一秒风暴扫过镜头藏住剪切。副画面约三成：同一世界的 90 年代 DV 家庭录像，发软、低清、色彩渗边、马赛克块、隔行线、噪点、曝光一呼一吸、暗部偏绿，屏显 REC、电量、日期。每帧只用一种。镜头缓推。对标摄影师 Conrad L. Hall（《美国丽人》，1999）。避免：干净画面带录像瑕疵；真实品牌屏显；扁平矢量形。","prompt_en":"Two registers. Primary, about 70%: a clean, saturated illustrated frame, dead-on symmetrical, the hero centred before its home or setting; every shape softly modelled in 2–3 tones, dense detail (shrubs, flowers, foliage of many small leaf clusters). Default bright daylight; under other light stay bright (gold at sunset), never dim. Red accents like a door #C3141F, white trim, saturated greens, orange-red autumn trees; warm grade, light vignette and grain. Transition: curled red petals or leaves (about 1/60 of frame width) thicken into a 1-second blizzard across the lens, hiding the cut. Second register, about 30%: the same world as 1990s DV home video: soft, low-res, chroma bleed, macroblocks, interlace, noise, breathing exposure, greenish shadows, REC/battery/date OSD. One register per frame. Slow push-ins. Reference: cinematographer Conrad L. Hall (*American Beauty*, 1999). Avoid: video artefacts in the clean part; real brands' OSD; flat vector shapes.","file":"风格提示词/O_奥斯卡98部/O72_美国丽人.md","img":"风格提示词/O_奥斯卡98部/O72_美国丽人.jpg","year":"1999","tags":["2D"],"extra":[{"h":"技法关键词","t":["Conrad Hall 式正面对称构图","玫瑰花瓣幻想","90 年代 DV 摄像机录像"]},{"h":"导演说明","t":"Clawd 扮莱斯特：白衬衫领尖、藏青底酒红斜纹领带，手里一枝红玫瑰。一个推镜头从房子推到近景，花瓣一路加密；到 1.3 秒，切到录像的那一刀藏在扫过镜头的花瓣里，幻想直接流进里基的录像带，看不出剪辑点。"},{"h":"成片里的分镜","t":"1. 正面对称的伯纳姆家全景，镜头不切，直接推到人行道上拿着长茎红玫瑰的 Clawd；花瓣越落越密，最后成片扫过镜头。（1.3s）\n2. 里基的摄像机画面（REC、OCT. 17 1998、12:07:33）：白色塑料袋和枯叶在红砖墙前打转；镜头慢推，往右漂。没有 Clawd。（1.2s）"},{"h":"参考出处","t":["Sam Mendes, 1999","Conrad L. Hall (cinematography)","American Beauty 1999 poster (the rose)"]}]},{"id":"O73","s":"O","cat":"新千年 2000–2009","name":"角斗士","en":"Gladiator","desc":"整幅画用方形石子和玻璃嵌片铺成：轮廓边的石子顺着形体排，平面处一行行直排，金箔玻璃片会闪。影片本身就在罗马，所以斗兽场和极乐麦田都做成罗马地面马赛克。","fit":"罗马地面马赛克","prompt":"罗马地面马赛克。先画平涂底稿，再铺小方石子，每粒约画面宽度的 1/150：轮廓边的石子顺着边排两三圈（opus vermiculatum），其余一行行横排；人物外面包一圈深色石子轮廓。颜色只用天然石头和玻璃，沉稳偏暖：焦金 #E2B24C、赭褐 #5B4332、陶红 #8E3C2B、暖大理石 #E9DDC4，帝王紫玻璃只做一处点缀；天空和水用浅灰蓝、奶油色石头，不要饱和的色带。每粒切口略不规则，左上受光，往 1–2px 宽的深色灰缝投小影；金箔玻璃片在光源处慢慢闪。人物正面、略僵，像庞贝马赛克；背景是大片褪色的细碎石子。镜头只短推短拉，动的是细节：手势、人群、草木、光柱。对标《亚历山大马赛克》、Zliten 马赛克。避免：整齐网格变像素画；石子太大；平滑渐变；灰缝太亮。","prompt_en":"Roman floor mosaic: over a flat underdrawing lay square tesserae about 1/150 of frame width: two to three courses follow each outline (opus vermiculatum), flat areas in straight rows, figures outlined with one course of dark stones. Muted, warm stone and glass: burnt gold #E2B24C, umber #5B4332, terracotta #8E3C2B, warm marble #E9DDC4, with imperial-purple glass for one accent only; sky and water in pale grey-blue and cream stone, never saturated bands. Tesserae slightly irregular, lit from the upper left, shadowing into dark 1–2 px grout; gold-leaf glass glints slowly on light sources. Frontal, slightly stiff Pompeian figures before a faded field of fine stones. Short pushes and pulls; motion from details (a gesture, a crowd, plants, a light shaft). References: *Alexander Mosaic*, Zliten mosaic. Avoid: a neat grid that reads as pixel art; oversized tiles; smooth gradients; bright grout.","file":"风格提示词/O_奥斯卡98部/O73_角斗士.md","img":"风格提示词/O_奥斯卡98部/O73_角斗士.jpg","year":"2000","tags":["2D"],"extra":[{"h":"技法关键词","t":["顺形排列的石子（opus vermiculatum）","金箔玻璃嵌片","Zliten 角斗士马赛克"]},{"h":"导演说明","t":"Clawd 扮麦克西姆斯：一只青铜肩甲、一把罗马短剑。开场是大拇指朝下；硬切到斗兽场，观众在 Clawd 四周站起来；最后一刀离开打斗，落到极乐世界安静的麦田。三个硬切，每个一秒左右。"},{"h":"成片里的分镜","t":"1. 近景：紫色的皇帝包厢，康茂德的大拇指从朝上转到朝下；镜头略推。（0.8s）\n2. 斗兽场海报式全景：Clawd 扮麦克西姆斯站在中央，短剑朝下，左边是拴着链子的老虎，右边是提格里斯，看台上的观众站起来；镜头略拉。（1s）\n3. 极乐世界全景：低垂的太阳下，Clawd 站在金色麦田里，地平线上是柏树和农庄；镜头慢推。（0.8s）"},{"h":"参考出处","t":["Ridley Scott, 2000","John Mathieson (cinematography)","Alexander Mosaic, Pompeii","Zliten mosaic"]}]},{"id":"O74","s":"O","cat":"新千年 2000–2009","name":"美丽心灵","en":"A Beautiful Mind","desc":"两种表面上的手写数学：哥特式图书馆窗玻璃上的白色油性笔、黑板上的粉笔，数字亮起，被金线连起来。这是片中纳什看见规律的方式：是他脑中的光，不是电脑界面。","fit":"窗上公式与黑板粉笔 + 金色连线","prompt":"手写就是画面：半透明白色蜡笔 #F1EFE6（笔画宽约画宽 1/300）在方格铅条窗玻璃上一笔笔写出来，写的是与题材有关的公式、数字或笔记，几小块字只占玻璃约四分之一。窗外是题材的世界，柔焦虚化，中间调、暖中性（阴天里的秋黄和柔和的绿），亮度不能超过字迹。暖色室内框住窗子：书架、绿罩台灯、琥珀灯光。关键时刻，选中的符号变亮，柔和的金线在它们之间连成星形或多边形，小光点沿线走。变体：深绿石板粉笔，带残影。配色：石板绿 #2F3E35、粉笔白 #F1EFE6、灯光琥珀 #E0A050、柔金 #D9B45A。镜头缓推，每次切换都离字更近。对标摄影师 Roger Deakins（《美丽心灵》，2001）。避免：HUD 或科幻界面；打字字体；字铺满玻璃；冷蓝色的窗外。","prompt_en":"Handwriting as the image: translucent white wax-marker strokes (about 1/300 of frame width) appear stroke by stroke on a window of square leaded panes: formulas, figures or notes about the subject, in small blocks on a quarter of the glass. Outside, the subject's world, soft-focus, mid-toned and warm (overcast gold, muted green), never brighter than the writing. A warm interior (shelves, green-shaded lamp, amber light) frames the window. At the key moment, chosen symbols brighten and soft gold lines join them into a star or polygon, lights running along. Variant: chalk on green slate with ghost writing. Palette: slate green #2F3E35, chalk white #F1EFE6, lamp amber #E0A050, soft gold #D9B45A. Camera: slow push-ins, each cut closer to the writing. Reference: cinematographer Roger Deakins (*A Beautiful Mind*, 2001). Avoid: HUD graphics; typed fonts; writing filling the glass; cold blue outside.","file":"风格提示词/O_奥斯卡98部/O74_美丽心灵.md","img":"风格提示词/O_奥斯卡98部/O74_美丽心灵.jpg","year":"2001","tags":["2D"],"extra":[{"h":"技法关键词","t":["玻璃上的白色油性笔","黑板粉笔","发光的金色连线","迪金斯式窗光"]},{"h":"导演说明","t":"Clawd 扮纳什：领口敞开的衬衫领、松着的针织领带，窗前拿一支油性笔。第一个镜头在写，后两个镜头是光；每次硬切都离数字更近，最后 Clawd 出画，只剩图案。"},{"h":"成片里的分镜","t":"1. 中全景：哥特式图书馆窗前，Clawd 扮纳什站在窗座上，用白色油性笔在玻璃上写博弈论公式，窗外是秋天的方院；镜头慢推。（1s）\n2. 近景：玻璃上的字迹，窗外虚焦，左下角露出 Clawd 的笔；字符亮起，金线把它们连成一颗星；镜头略推。（0.8s）\n3. 近景：黑板上五位一组的密码数字，数字一个个亮起，金色的七角星图案自己画出来；镜头略推。没有 Clawd。（0.8s）"},{"h":"参考出处","t":["Ron Howard, 2001","Roger Deakins (cinematography)","A Beautiful Mind 2001 poster"]}]},{"id":"O75","s":"O","cat":"新千年 2000–2009","name":"芝加哥","en":"Chicago","desc":"黑色舞台被硬边聚光切开：六间牢房里是勾红边的女囚剪影，背后霓虹 C，亮片和烟雾，Clawd 在白色追光里。这是电影版的「Cell Block Tango」，用海报的红黑。","fit":"福斯舞台：红黑聚光剪影","prompt":"鲍勃·福斯式百老汇歌舞舞台。黑底，但约四成画面发信号红 #D0202A：一排带栏杆的暗色格间，每格在烟雾里从背后打红光，中心最亮、向四周暗到黑，再加红幕；硬边聚光穿过烟雾。舞者是实心黑剪影，身形饱满、有服装轮廓，外面一圈 2–3px 红色边光。一个大霓虹字形（字母或图形），橙红 #FF5A3C，白热芯、微闪，要放在黑底上才读得出；黑色亮漆地板倒映它；台边一排跑马灯泡 #FFD9A0。主角站在暖白追光 #FFF1D6 里，是唯一被照亮、保留自身颜色的人。点缀：亮片、白手套。动作踩爵士拍子；灯格一间间啪地亮。镜头推进，收在追光里。对标 Rob Marshall《芝加哥》（2002）。避免：平涂匀光；多余颜色；剪影没有边光。","prompt_en":"Bob Fosse-style Broadway stage number. Black stage, but about 40% of the frame glows signal red #D0202A: a row of dark barred cells, each backlit red through haze, bright at centre, falling off to black, plus red curtains; hard-edged spots. Dancers are full-bodied black silhouettes with costume shapes and a 2–3 px red rim. One big neon shape (letter or pictogram) in orange-red #FF5A3C, white-hot core, slight flicker, set against black so it reads; glossy black floor reflects it; marquee bulbs #FFD9A0 at the stage edge. The hero, in a warm-white follow spot #FFF1D6, is the only lit figure in its own colours. Accents: sequins, white gloves. Moves on the jazz beat; cells snap on one by one. Push in to end in the follow spot. Reference: Rob Marshall, *Chicago* (2002). Avoid: flat even fills; extra colours; rimless silhouettes.","file":"风格提示词/O_奥斯卡98部/O75_芝加哥.md","img":"风格提示词/O_奥斯卡98部/O75_芝加哥.jpg","year":"2002","tags":["2D"],"extra":[{"h":"技法关键词","t":["鲍勃·福斯的舞台调度","勾红边的逆光剪影","霓虹与亮片","2002 年海报的红黑"]},{"h":"导演说明","t":"Clawd 戴福斯式圆顶礼帽（帽带一圈亮片）、白手套，拿黑手杖。第一个镜头里牢房跟着拍子一间间亮；快切一个女囚；然后 Clawd 独占追光，以 jazz hands 收尾。表演按真实速度走，不加速。"},{"h":"成片里的分镜","t":"1. 舞台全景，霓虹 C 在后面：六间牢房一间间亮起，每个女囚啪地摆出招牌姿势，Clawd 在台中央走福斯步；镜头慢推。（0.8s）\n2. 近景：一间牢房，铁栏后红光里 Velma 的剪影，扭胯、耸肩；镜头略推。没有 Clawd。（0.5s）\n3. 中近景：Clawd 独自站在白色追光里，身后是亮着的牢房：它走福斯步到脚灯前，然后放下手杖，双手 jazz hands 举起；镜头慢推。（1.2s）"},{"h":"参考出处","t":["Rob Marshall, 2002","Dion Beebe (cinematography)","Bob Fosse, Chicago (1975 stage)","Chicago 2002 poster"]}]},{"id":"O76","s":"O","cat":"新千年 2000–2009","name":"指环王：王者无敌","en":"The Lord of the Rings: The Return of the King","desc":"柔和的水彩加铅笔风景，空气透视很深，再加一张羊皮纸上的墨线地图。电影的概念画就是艾伦·李和约翰·豪画的，所以这段旅程按三部曲最初被画出来的样子来讲。","fit":"艾伦·李式水彩 + 托尔金地图","prompt":"奇幻概念设计式的水彩加铅笔，暖色纸。透明水彩要看得出颗粒（细碎颜料斑点，亮度起伏 ±6%），几朵回流花，水迹边缘积色更深；每条轮廓和山脊都有一道深褐铅笔线（约画面宽度的 1/800），暗面短排线。空气透视要强：3–5 层后退，越远越淡越冷。光就是主题：每场一个强光源（低太阳、火、灯、熔岩般的光）穿透雾气，余烬色光晕约占画面四分之一，约一半画面压在深褐和紫色暗部里。配色：羊皮纸 #E9DCC0、深褐 #3A2418、余烬橙 #E07A2E、炽红 #B23A1E 只用在光源核心、远景淡紫 #B8A8C8。旅程题材可插一段托尔金式地图，但不当主画面。镜头：长横摇扫过大地，缓推到主角。对标 Alan Lee、John Howe。避免：平滑的数码渐变；平涂矢量形；发白发灰的画面。","prompt_en":"Fantasy concept-art watercolour and pencil on warm paper. Transparent washes, granulated (pigment speckle, ±6% brightness), a few blooms, darker pooled edges; every contour and ridge carries a dark-brown pencil line (about 1/800 of frame width), short hatching on shadow sides. Aerial perspective: 3–5 receding planes, each paler and cooler. Light is the subject: one strong source per scene (sun, fire, lamp, molten glow) burning through haze, its ember glow on about a quarter of the frame, about half the frame in deep umber and violet shadow. Palette: parchment #E9DCC0, deep umber #3A2418, ember orange #E07A2E, hot red #B23A1E only at the light's core, lavender #B8A8C8 for distance. Journeys may cut to a Tolkien-style map, never the main look. Camera: long lateral pans, slow push-ins to the hero. References: Alan Lee, John Howe. Avoid: smooth digital gradients; vector shapes; pale frames.","file":"风格提示词/O_奥斯卡98部/O76_指环王：王者无敌.md","img":"风格提示词/O_奥斯卡98部/O76_指环王：王者无敌.jpg","year":"2003","tags":["2D"],"extra":[{"h":"技法关键词","t":["水彩加铅笔的概念插画","托尔金式羊皮纸地图","艾伦·李与约翰·豪"]},{"h":"导演说明","t":"Clawd 扮佛罗多：灰绿色斗篷领、罗瑞恩叶子胸针、链子上的魔戒。作为这十年的重点片给了 12 拍：地图交代整条路，烽火带着镜头扫过山脉，眼睛是一拍短促的威胁，最后举起魔戒收住。镜头之间硬切，每个镜头内部是长运动。"},{"h":"成片里的分镜","t":"1. 俯视羊皮纸地图：镜头从整张图推进夏尔，再沿红色虚线往魔多飞，Clawd 像一枚棋子那么小，沿着路线走。（1.3s）\n2. 全景：黄昏的雪山浮在云海上，近处的烽火先点着，镜头慢慢往右横移、略往后拉，山脊上的烽火一座接一座亮起。（1.9s）\n3. 近景：巴拉多塔顶的索伦之眼，镜头推近，它转过来扫出光束。没有 Clawd。（0.4s）\n4. 末日火山裂缝边：镜头从熔岩上方的玄武岩舌头全景推近到 Clawd，背后是火山和眼睛，它把发光的魔戒从深渊边提起，高高举起。（1.5s）"},{"h":"参考出处","t":["Peter Jackson, 2003","Andrew Lesnie (cinematography)","Alan Lee","John Howe","J.R.R. Tolkien's maps of Middle-earth"]}]},{"id":"O77","s":"O","cat":"新千年 2000–2009","name":"百万美元宝贝","en":"Million Dollar Baby","desc":"原创的 16-bit 街机格斗游戏画面：血条、回合计时、ROUND 1 / FIGHT!、连击数、命中停顿和巨大的 K.O.。一部拳击冠军赛的电影，变成用街机语法打完的一回合。","fit":"16-bit 像素格斗游戏","prompt":"原创的 16-bit 街机格斗游戏。画在 320×180 上，用最近邻放大到输出尺寸的整数倍（1080p 用 6 倍），加轻微 CRT 扫描线（隔行压暗约 15%）。横版场地取自题材：把题材的地点压成平的台面加一层背景（比如拳台配深紫观众带 #1D1435）。界面用自绘 5×7 点阵字：两条血条（黄色 #F5C53A，掉血时拖一段红色）、计时、横幅、ROUND 1 / FIGHT!、连击数。角色是方块胖像素，高约 50 像素，一像素高光加深色边，全画面约 32 色。故事改写成主角和一个对手的较量；题材里没有敌人，就把它世界里的阻碍拟人化当对手（风暴、截止期限）。打中有火花、停顿 3–4 帧、白闪，输家被打飞，然后 K.O. 和 WINNER。固定横版视角，不剪。对标 90 年代初街机格斗游戏。避免：照搬真实游戏的角色或 logo；像素抗锯齿。","prompt_en":"An original 16-bit arcade fighting game. Draw at 320×180 and nearest-neighbour upscale by a whole number (×6 for 1080p); CRT scanlines (alternate lines ~15% darker). A side-on arena from the subject's world, flattened into stage and backdrop (e.g. a ring with a dark purple crowd band #1D1435). UI in a self-drawn 5×7 pixel font: two health bars (yellow #F5C53A, red damage trail), timer, banner, ROUND 1 / FIGHT!, combo counter. Chunky sprites about 50 px tall, 1-px highlights, dark outlines, ~32 colours per frame. The story becomes a contest between the hero and a rival (if none exists, personify an obstacle: a storm, a deadline). Hits spark, freeze 3–4 frames and flash white; the loser is knocked back, then K.O. and WINNER. Fixed side-on camera, no cuts. Reference: early-1990s arcade fighters. Avoid: real games' characters or logos; anti-aliased pixels.","file":"风格提示词/O_奥斯卡98部/O77_百万美元宝贝.md","img":"风格提示词/O_奥斯卡98部/O77_百万美元宝贝.jpg","year":"2004","tags":["2D"],"extra":[{"h":"技法关键词","t":["16-bit 像素画","街机格斗游戏界面","CRT 扫描线"]},{"h":"导演说明","t":"Clawd 穿白边绿缎拳击袍、戴红拳套；对手是没有脸的深蓝色影子拳手 SHADOW。整场按时间编排：1.46 秒上勾拳命中并停顿，1.6 秒 K.O.，1.95 秒胜利。一镜到底，用游戏自己的镜头。"},{"h":"成片里的分镜","t":"1. 一个固定的横版游戏画面：ROUND 1、FIGHT!，影子拳手挥出勾拳，Clawd 低头躲过，冲上去刺拳、刺拳，再一记上勾拳，命中停顿加白闪；对手飞出去，K.O.，Clawd 举起拳套赢下比赛。（2.5s）"},{"h":"参考出处","t":["Clint Eastwood, 2004","Early-1990s arcade fighting games (genre grammar)","Million Dollar Baby: Maggie's green robe"]}]},{"id":"O78","s":"O","cat":"新千年 2000–2009","name":"撞车","en":"Crash","desc":"用代码画的精修夜景照片：高架上白色和红色的车灯光轨、钠灯橙对霓虹青、湿路面反光、焦外光斑，还有只在光里才看得见的雪。《撞车》的结尾正是洛杉矶难得的一场雪。","fit":"洛杉矶夜景光轨 + 飘雪","prompt":"长曝光夜景街拍。钠灯暖橙 #F2A24A 铺满建筑、招牌和湿地面（约一半画面在暖光里），对着青色霓虹 #3FD0D8，偶有红蓝警灯；黑色略偏青，不能发灰。构图分层：前景人行道有人，中景亮着的店面招牌，上三分之一横过道路或桥（不在城市就用主体所在地一条有路灯的路）。车灯沿这些路拉成细而连续的光带（约画宽 1/150），白 #FFF4E0 与红 #E0303A，带光晕和发烫的芯。雪分三层，短而柔的拖影，只在光锥里可见。收尾：两级泛光、蓝色横向光条、边缘焦外光斑、暗角、动态颗粒。主角清楚地站在画面中部一盏灯的光锥里，只有车流拖影。镜头：一个连续运镜，俯仰、横摇加转焦。对标摄影师 J. Michael Muro（《撞车》，2004）。避免：雪到处一样亮；大片空黑；光带断成点。","prompt_en":"Long-exposure night street photography. Sodium-vapour orange #F2A24A washes structures, signs and wet ground (about half the frame in warm light), against cyan neon #3FD0D8 and the odd red-blue emergency light; blacks cyan-tinged, never grey. Layered composition: foreground pavement with figures, lit shopfronts and signs mid-frame, roads or bridges crossing the upper third (away from cities, a lamp-lit road in the subject's own setting). Headlights become thin continuous ribbons (about 1/150 of frame width) along those roads, white #FFF4E0 and red #E0303A, glowing with hot cores. Snow: three layers of short soft streaks, seen only in light cones. Finish: two-level bloom, blue lens streaks, edge bokeh, vignette, moving grain. The hero stands sharp in a lamp cone mid-frame; only traffic streaks. Camera: one continuous tilt, pan and rack focus. Reference: cinematographer J. Michael Muro (*Crash*, 2004). Avoid: evenly lit snow; empty black frames; dotted trails.","file":"风格提示词/O_奥斯卡98部/O78_撞车.md","img":"风格提示词/O_奥斯卡98部/O78_撞车.jpg","year":"2005","tags":["2D"],"extra":[{"h":"技法关键词","t":["长曝光夜景摄影","钠灯橙配霓虹青","变形宽银幕光条与胶片颗粒"]},{"h":"导演说明","t":"Clawd 围一条手织的深青色围巾，站在路灯下仰头看雪。一个连续运镜从光轨到车祸再到 Clawd，快速移动的几段带运动模糊。镜头到它那里时雪变大，接雪的动作落在快结束的地方。"},{"h":"成片里的分镜","t":"1. 一镜到底：开场仰拍立交桥上的光轨，往下摇到警戒带后的追尾现场，焦点在事故上；再沿着路缘往右摇到钠灯下的 Clawd，焦点拉过来；Clawd 抬起手臂接一片雪，眨了下眼。（2.5s）"},{"h":"参考出处","t":["Paul Haggis, 2004","J. Michael Muro (cinematography)","Crash 2005 poster","Four Level Interchange long-exposure photography"]}]},{"id":"O79","s":"O","cat":"新千年 2000–2009","name":"无间行者","en":"The Departed","desc":"平涂的多层喷漆模板，有喷雾毛边和流挂，漆吃进砖缝，旁边一张撕破的糊贴海报。《无间行者》最后一个镜头是老鼠爬过州议会金顶下的栏杆，街头模板涂鸦也一直爱画老鼠。","fit":"波士顿红砖墙模板涂鸦","prompt":"老红砖墙上的街头模板涂鸦。每件作品用 3–5 块镂空模板喷成平色块，有照片感（最小镂空约画宽 1/200）：硬切口，模板翘起处有柔喷雾，散落喷点，流挂，以及模板必须留的连接筋。配色：黑 #151312、中灰 #8C8A85、金 #C99A2E、红 #C3261F；红砖 #7A3224，主要作品喷在刷上去的奶油色补丁上。砖面凹凸、灰缝阴影和雨痕透过漆显出来，让漆吃进砖缝。一面墙并排放好几件作品，加关于题材的手喷短标语（用观众的语言）、旧 tag 和一张撕角的半调糊贴海报。光：柔和的白天光斜扫过墙，反差适中，电线影子轻轻晃；不加重暗角。镜头：先让作品一层层喷出来，再切近景、横移。对标班克斯。避免：边缘干净像矢量；漆浮在砖上；颜色太多；墙面昏暗。","prompt_en":"Street stencil graffiti on an old red-brick wall. Each piece is 3–5 stencils sprayed as flat colour, photo-derived in look (smallest cut detail about 1/200 of frame width): hard cut edges, soft overspray where a stencil lifted, spray dots, drips, stencil bridges. Palette: black #151312, mid grey #8C8A85, gold #C99A2E, red #C3261F; brick #7A3224, cream painted patches under the main pieces. Brick relief, mortar and rain streaks show through, so paint sinks into the joints. A busy wall: several pieces side by side, short hand-sprayed slogans about the subject (user's language), old tags, a torn halftone paste-up. Light: soft raking daylight, mild contrast, a faint swaying wire shadow; no heavy vignette. Camera: pieces spray on layer by layer, then close-ups and lateral tracks. Reference: Banksy. Avoid: clean vector edges; paint floating on the brick; too many colours; a dark wall.","file":"风格提示词/O_奥斯卡98部/O79_无间行者.md","img":"风格提示词/O_奥斯卡98部/O79_无间行者.jpg","year":"2006","tags":["2D"],"extra":[{"h":"技法关键词","t":["多层喷漆模板","班克斯的老鼠","红砖墙肌理","半调糊贴海报"]},{"h":"导演说明","t":"Clawd 扮卧底警察，耳边贴着翻盖手机，本身也是墙上喷出来的一层。前两拍作品一层层喷出来，之后手机、老鼠、Clawd 挂电话，快切接连出现。没人说话，靠铃声和老鼠讲完。"},{"h":"成片里的分镜","t":"1. 全景：整面墙，模板画一层层喷出来：城市、金顶、栏杆、老鼠、拿手机的 Clawd、红色标语；镜头略推。（0.8s）\n2. 近景：两部喷漆翻盖手机隔空响铃，Clawd 耳边也贴着手机；它听着，眼睛往左瞟；镜头慢慢往右漂。（0.6s）\n3. 中景：老鼠沿着金顶下的栏杆跑过，左上角喷着「WHO'S THE RAT?」，警灯的红蓝光扫过砖墙；镜头跟着往右横移。（0.6s）\n4. 近景：Clawd 把手机往下一放，眼睛看向右边；镜头略推。（0.4s）"},{"h":"参考出处","t":["Martin Scorsese, 2006 (the final shot)","Michael Ballhaus (cinematography)","The Departed 2006 poster","Banksy"]}]},{"id":"O80","s":"O","cat":"新千年 2000–2009","name":"老无所依","en":"No Country for Old Men","desc":"实时 3D 的西德州黄昏荒原：太阳压在地平线上，长影子朝着镜头，低饱和的土黄和灰绿，细颗粒。照着迪金斯为科恩兄弟拍的光，和海报上逆光里提着箱子的人。","fit":"3D 西德州荒原黄昏（迪金斯光）","prompt":"偏写实的 3D 黄昏旷野（three.js）。天空很大，约占画面六成，地平线处尘土赭色 #D8A060，往上渐到淡奶油色，几缕细长云被下方照亮。太阳高出地平线 1–2°，仍能投影，光沿远处坡脊烧成一线亮边。低饱和：成百丛灰绿小灌木退向地平线，碎石和干草散在暗暖色泥土 #2A2622 上（默认干旱荒地，换别的地貌也保留稀疏成丛的植被）。主角逆光站在中景，约占画面高度三分之一，长影子朝镜头拉来。按天空曝光：太阳可以过曝，光晕不超过画面十分之一。调色：中性色调映射、暖高光、细颗粒、暗角。招牌镜头：基本固定，低机位广角（约 35mm）。对标摄影师 Roger Deakins（《老无所依》，2007）。避免：饱和的橙色晚霞；大片发白眩光；光秃的地面；忙乱的运镜。","prompt_en":"Photoreal-leaning 3D landscape at dusk. Sky fills 60% of the frame, dusty ochre #D8A060 at the horizon up to pale cream, thin streaked clouds lit from below. Sun 1–2° above the horizon, still casting shadows; its light burns along the far ridge. Low saturation: hundreds of grey-green scrub clumps receding to the horizon, stones, dry grass, dark warm earth #2A2622 (default arid; elsewhere keep sparse clumped growth). The hero stands backlit in the mid-ground, about a third of frame height, long shadow toward the lens. Expose for the sky: the sun may clip, its glow within a tenth of the frame. Grade: neutral tone mapping, warm highlights, fine grain, vignette. Signature shot: locked, low, wide (~35 mm). Reference: cinematographer Roger Deakins (*No Country for Old Men*, 2007). Avoid: saturated orange sunsets; blown-out glare; bare ground; busy camera moves.","file":"风格提示词/O_奥斯卡98部/O80_老无所依.md","img":"风格提示词/O_奥斯卡98部/O80_老无所依.jpg","year":"2007","tags":["3D"],"extra":[{"h":"技法关键词","t":["实时 3D（three.js）","罗杰·迪金斯的黄昏光","低饱和胶片调色"]},{"h":"导演说明","t":"Clawd 扮勒维林：浅褐色毡质牛仔帽、一只皮质文件箱。三个固定机位硬切：日落时提箱走路，中间是「猜吧」的硬币，最后夜里车灯压过来，危险到了。光线把时间从黄昏带到天黑。"},{"h":"成片里的分镜","t":"1. 低机位逆光全景：Clawd 扮勒维林，戴牛仔帽、提着钱箱走过小坡，太阳压在它左侧的地平线上，身后是被打烂的皮卡；固定机位。（0.8s）\n2. 微距：加油站柜台上转动的 25 美分硬币，背后是虚焦的奇古尔的腰带和手；硬币越晃越快，倒下；固定机位。没有 Clawd。（0.8s）\n3. 夜，低机位贴着空公路：Clawd 站在路肩上，一辆皮卡的车灯从坡顶压过来；固定机位。（0.8s）"},{"h":"参考出处","t":["Joel and Ethan Coen, 2007","Roger Deakins (cinematography)","No Country for Old Men 2007 poster"]}]},{"id":"O81","s":"O","cat":"新千年 2000–2009","name":"贫民窟的百万富翁","en":"Slumdog Millionaire","desc":"蓝紫色加金色高光的电视演播室，摇头灯光束、镜头光斑；然后切到饱和橙青色的孟买屋顶。影片本身就在答题节目的最后一题和贾马尔出身的贫民窟之间来回切。","fit":"答题节目演播室 + 孟买橙青","prompt":"两种画面。主画面约占七成：光鲜的插画式答题演播室，明亮饱满，略俯的四分之三视角：底光玻璃圆台和一圈圈蓝光环，背后坐满观众，摇头灯在烟雾里打出蓝紫光束 #5A3FD0，大屏上长六角形答案框，一个锁成琥珀色 #F0A020；加泛光和横向光斑；越紧张四周越暗，最多暗到一半，不全黑。人物圆润干净，柔和明暗。第二种画面约占三成，整屏硬切：主题所在地方的黄金时刻景象，饱和橙青，密而热闹（比如铁皮屋顶、晾衣绳、人群）。点缀：洋红 #E2206B、青 #0F7C7A、橘黄 #F06A14。镜头推向大屏和座位，光束收到一人身上；其余慢摇。对标摄影师 Anthony Dod Mantle（《贫民窟的百万富翁》，2008）。避免：真实节目 logo；大片漆黑的演播室；平均打光；灰暗空荡的场景。","prompt_en":"Two registers. Primary, about 70%: a glossy illustrated quiz-show studio, bright and full, seen three-quarter from slightly above: a glass stage lit from below with concentric blue rings, a packed audience behind, moving-head beams cutting blue-violet #5A3FD0 through haze, a big screen of elongated-hexagon answers, one locked in amber #F0A020; bloom and horizontal flares; as tension rises the edges dim to about half, never black. Characters rounded, softly shaded. Second register, about 30%, as full-frame hard cuts: golden-hour views of the subject's home ground, saturated orange and teal, busy (e.g. tin roofs, washing lines, crowds). Accents: magenta #E2206B, teal #0F7C7A, tangerine #F06A14. Camera: push in on screen and hot seat as beams close on one person; elsewhere slow pans. Reference: cinematographer Anthony Dod Mantle (*Slumdog Millionaire*, 2008). Avoid: real show logos; a mostly black studio; even lighting; grey, empty places.","file":"风格提示词/O_奥斯卡98部/O81_贫民窟的百万富翁.md","img":"风格提示词/O_奥斯卡98部/O81_贫民窟的百万富翁.jpg","year":"2008","tags":["2D"],"extra":[{"h":"技法关键词","t":["电视答题节目的灯光","蓝紫光束与镜头光斑","Anthony Dod Mantle 的橙青色调"]},{"h":"导演说明","t":"Clawd 扮贾马尔：浅蓝细格衬衫领加一只领夹麦。答案从第一帧就锁定；第二个镜头把全场压暗、收到热座上，答案变绿时放开；然后硬切到孟买屋顶，画面一下打开到整座城市。"},{"h":"成片里的分镜","t":"1. 近景：大屏上的最后一题，四个答案框，A: ARAMIS 锁定成琥珀色；镜头略推。没有 Clawd。（0.8s）\n2. 舞台全景：主持人坐在凳子上，Clawd 扮贾马尔坐在热座上；全场暗下来，光束收拢到 Clawd 身上，接着答案闪成绿色，观众欢呼；镜头慢推。（1s）\n3. 全景：黄金时刻的达拉维屋顶，Clawd 站在铁皮屋顶上，身后高架上一列挤满人的火车开过；镜头慢慢往右摇。（0.8s）"},{"h":"参考出处","t":["Danny Boyle, 2008","Anthony Dod Mantle (cinematography)","Slumdog Millionaire 2008 poster"]}]},{"id":"O82","s":"O","cat":"新千年 2000–2009","name":"拆弹部队","en":"The Hurt Locker","desc":"一页美军拆弹手册：均匀黑线、排线阴影、点描沙土、带圈编号和引线、IED 分解图，只有一点橄榄绿和沙色。《拆弹部队》讲高压下的程序，手册图就是画出来的程序。","fit":"拆弹教范线图","prompt":"军用技术手册插图。暖米白纸 #EFEADB 上一层很淡的工程网格，统一黑墨 #1B1A16（轮廓线宽约画面宽度的 1/700，排线更细），明暗只靠排线，地面用点刻，只在两三成的画面上平涂橄榄绿 #6C6D42 和沙色 #D9C79C；灯光画成放射线，不画光晕。主图：题材场景的一点透视画面，占页面大半，里面有人物和器物；四周是题材关键器物沿点划线轴展开的爆炸图、引线上的带圈数字、零件表、WARNING 和 CAUTION 框、打字机字体的标注（用观众的语言）和 FIG 编号，一块黑底章节卡。动画一拍二：零件滑开、工具动作、人物走路。镜头先看整页，再切到放大插图式的细节。对标美军技术手册，Kathryn Bigelow《拆弹部队》（2008）。避免：渐变明暗；颜色太多；花哨字体；空荡的页面。","prompt_en":"Military technical-manual illustration. Warm off-white paper #EFEADB with a faint engineering grid, uniform black ink #1B1A16 (outlines ~1/700 of frame width, hatching thinner), shading only by hatching, ground by stippling, flat tints of olive #6C6D42 and sand #D9C79C on 20–30% of the drawing; lights as ray lines, not glows. Main figure: a one-point-perspective view of the subject's setting filling most of the page; around it exploded views of the subject's key object along a dash-dot axis, circled numbers on leader lines, a parts table, WARNING and CAUTION boxes, typewriter labels (user's language) and FIG numbers, a black chapter card. Animate on twos: parts slide apart, a tool works, a figure walks. Camera: whole page, then cuts to enlarged insets. References: US Army technical manuals; Kathryn Bigelow, *The Hurt Locker* (2008). Avoid: gradient shading; too much colour; decorative fonts; sparse pages.","file":"风格提示词/O_奥斯卡98部/O82_拆弹部队.md","img":"风格提示词/O_奥斯卡98部/O82_拆弹部队.jpg","year":"2009","tags":["2D"],"extra":[{"h":"技法关键词","t":["军用技术手册线图","爆炸分解图","打字机字标注","橄榄绿与沙色平涂"]},{"h":"导演说明","t":"Clawd 戴橄榄绿拆弹头盔、面罩掀起，手拿剪线钳，站在六枚半埋的 155mm 炮弹中间。四个镜头从整页一路收紧到剪断：漫长的走路、面罩里的脸、Clawd 的眼睛、剪线。咔的一声落在这段快结束的地方。"},{"h":"成片里的分镜","t":"1. 整页手册，FIG 4-6「THE LONG WALK」：穿拆弹服的士兵沿巴格达土路朝镜头走来，Clawd 站在串起来的炮弹中间拿着剪线钳；镜头慢慢推向街道。（0.8s）\n2. 近景：穿拆弹服的士兵在走，面罩里是一张皱着眉的脸；镜头慢推。（0.6s）\n3. 近景：戴拆弹头盔、面罩掀起的 Clawd，眼睛往下看向起爆线，剪线钳举起来；镜头略推。（0.5s）\n4. 特写：剪线钳咬住炮弹上方的双绞起爆线，一捏、咔，线断开；镜头推近。（0.6s）"},{"h":"参考出处","t":["Kathryn Bigelow, 2008","Barry Ackroyd (cinematography)","The Hurt Locker 2008 poster","US Army EOD technical manuals"]}]},{"id":"O83","s":"O","cat":"独立年代 2010–2019","name":"国王的演讲","en":"The King's Speech","desc":"墙面肌理很重的油画质感室内：罗格诊室那面冷灰绿的多层斑驳墙，再到琥珀金的软包广播间、弹簧吊着的话筒和细细的金色声波。照着 Eve Stewart 设计的墙和海报的金黄。","fit":"斑驳墙 + 金色广播间","prompt":"墙面就是画面的油画质感室内（户外题材搬进相关的有窗屋子）。主调：菱形钉扣软包墙，金 #C9A050 压在深褐 #3A2610 上，扣子带黄铜高光，声源（比如吊着的话筒）后面一团暖金光。副调用于安静的场景：冷灰绿墙面，局部磨穿露出蓝、粉、赭和灰泥，有潮线和细裂纹；剥落块不规则，最多占墙面三分之一。形状边缘干净，只罩一层淡淡的笔触纹理（笔触约画宽 1/120，亮度起伏 ±5%）；脸和小物件画清楚。声音画成 4–8 条细金色示波线，扩过墙面，先带尖刺，后来平滑。人物偏到角落，留大片墙。镜头慢推，插一个声源特写。对标摄影师 Danny Cohen、美术指导 Eve Stewart（《国王的演讲》，2010）。避免：居中对称；粗糙点戳笔触；地图般的剥落；霓虹般亮的声波。","prompt_en":"Painterly interiors where the wall carries the image (outdoor subjects move into a related room with a window). Primary: a diamond-tufted padded wall in gold #C9A050 over deep brown #3A2610, brass button highlights, a warm glow behind the sound source (e.g. a hanging microphone). Secondary, for quiet scenes: a cool grey-green wall worn through to blue, pink, ochre and plaster, with damp lines and fine cracks; patches irregular, under a third of the wall. Clean-edged shapes under a subtle brush texture (strokes ~1/120 of frame width, ±5% brightness); faces, small objects crisp. Sound: 4–8 thin gold oscilloscope lines crossing the wall, spiky, later smooth. Figures in a corner, lots of wall. Camera: slow push-ins, one close-up of the source. References: cinematographer Danny Cohen, designer Eve Stewart (*The King's Speech*, 2010). Avoid: centred symmetry; coarse dabbed strokes; map-like peel; neon-bright waves.","file":"风格提示词/O_奥斯卡98部/O83_国王的演讲.md","img":"风格提示词/O_奥斯卡98部/O83_国王的演讲.jpg","year":"2010","tags":["2D"],"extra":[{"h":"技法关键词","t":["数字油画笔触","层层剥落的漆墙","30 年代广播间","金色声波细线"]},{"h":"导演说明","t":"Clawd 扮乔治六世：小王冠、翼领和深色领带，诊室里夹着烟，广播间里拿着打字稿。三个镜头硬切讲完治疗：缩在角落，声波从口吃变流畅，然后罗格打着拍子，演讲播出去。"},{"h":"成片里的分镜","t":"1. 全景：罗格的诊室，Clawd 缩在旧皮沙发左端夹着烟，上方是大片斑驳墙，右边一台喇叭留声机；镜头慢推。（0.8s）\n2. 大特写：弹簧吊环里的大理石话筒，左边是 Clawd 的王冠和眼睛；金色声波先是断断续续（口吃），然后变得流畅；镜头慢推。（0.9s）\n3. 中全景：1939 年的广播间，Clawd 拿着讲稿在左，话筒居中，罗格在右边用手打拍子，ON AIR 灯亮起；镜头略拉。（0.9s）"},{"h":"参考出处","t":["Tom Hooper, 2010","Danny Cohen (cinematography)","Eve Stewart (production design)","The King's Speech 2010 poster"]}]},{"id":"O84","s":"O","cat":"独立年代 2010–2019","name":"艺术家","en":"The Artist","desc":"干净发亮的黑白：高光明亮、灰阶柔和，装饰艺术边框的字幕卡，轻微闪烁和颗粒；Clawd 是唯一的颜色。《艺术家》是 2011 年写给默片好莱坞的情书，所以比第 1 部更精致。","fit":"2011 精致默片黑白","prompt":"致敬 20 年代末默片的现代黑白片。影调干净：发光的高光、柔和的中灰、深黑；温和的 S 曲线，灯周围有灰色光晕，轻微闪烁（±3%），细颗粒，偶有灰尘，16:9 里加 1.33 的左右黑边。字幕卡是黑底、装饰艺术风边框、字距拉开的大字，用观众的语言。场景：把题材的世界布置成宏大规整的室内或舞台布景（比如带铁艺栏杆的楼梯、金色台口、逆光剪影的人群），人物多取优雅侧面。故事围绕的那个主角是画面里唯一有颜色的东西，整个都用陶土橙 #D97757 的深浅来画；灯和火都保持灰色。镜头：平滑的推拉，字幕卡闪入，剪辑落在动作上（鞠躬、挥手）。对标摄影师 Guillaume Schiffman（《艺术家》，2011）。避免：重划痕；棕褐色调；颜色渗到灰色里。","prompt_en":"A modern homage to late-1920s silent film in black and white. Clean tones: glowing highlights, soft mid-greys, deep blacks; a gentle S-curve, grey halation around lights, slight flicker (±3%), fine grain, rare dust, a 1.33 pillarbox inside 16:9. Intertitles on black with an Art Deco border and spaced capitals, in the user's language. Settings: the subject's world staged as grand, ordered interiors or stage sets (e.g. a wrought-iron staircase, a gilt proscenium, a crowd in backlit silhouette); figures in elegant profile. The one hero subject the story centres on is the only coloured thing, wholly in tones of terracotta #D97757; lamps and fire stay grey. Camera: smooth push-ins and pull-backs, title cards flashed in, cuts landing on gestures (a bow, a wave). Reference: cinematographer Guillaume Schiffman (*The Artist*, 2011). Avoid: heavy scratches; sepia tint; colour bleeding into the greys.","file":"风格提示词/O_奥斯卡98部/O84_艺术家.md","img":"风格提示词/O_奥斯卡98部/O84_艺术家.jpg","year":"2011","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["20 年代末默片黑白","装饰艺术边框字幕卡","好莱坞片厂的魅力布光"]},{"h":"导演说明","t":"Clawd 扮乔治·瓦伦丁：白色翼领、黑领结、丝质高礼帽、手杖，还有杰克罗素梗 Uggie。五个快切，接近真实速度：楼梯上举帽，BANG! 字幕卡一闪，小狗倒地，最后观众起立时鞠躬。Clawd 是唯一的颜色。"},{"h":"成片里的分镜","t":"1. 楼梯全景往里推：Clawd 扮乔治站在平台上，向上楼的佩皮举起高礼帽致意，群演上下交错，Uggie 在它身边。（1s）\n2. 近景：Clawd 举起的手摘下帽子，Uggie 仰头看它；镜头略推。（0.5s）\n3. 全屏字幕卡：装饰艺术边框里写着 BANG!。（0.3s）\n4. 舞台上，Clawd 用手指比枪，Uggie 往后一倒装死；镜头慢推。（0.5s）\n5. 首映礼全景：银幕上是 THE END，右边 Constance 在鼓掌，观众剪影站起来，Clawd 举帽拄杖鞠躬，Uggie 在脚边；镜头略拉，大幕开始合上。（0.9s）"},{"h":"参考出处","t":["Michel Hazanavicius, 2011","Guillaume Schiffman (cinematography)","The Artist 2011 poster","Bradbury Building, Los Angeles"]}]},{"id":"O85","s":"O","cat":"独立年代 2010–2019","name":"逃离德黑兰","en":"Argo","desc":"摊在制片桌上的 70 年代柯比漫画：粗墨线、柯比能量泡、泛黄新闻纸上的四色网点。片中那部假科幻片用的正是柯比画的概念图，所以漫画从假史诗一路翻到真实的跑道出逃。","fit":"杰克·柯比 70 年代漫画页","prompt":"70 年代杰克·柯比漫画页。粗细变化的毛笔墨线，大块涂黑，透视夸张，黑色柯比能量泡，方块拟声字，手写对白框。CMYK 平涂用 45° 网点印出：青 #1696CD、品红 #DE2C70、黄 #FFD616、黑 #1C161A，泛黄新闻纸 #EEE2C2，色版错位 1 像素，纸有纤维和中缝阴影。分格叙事，镜头在格间推进、横移，推近时网点放大成波普圆点。避免：顺滑数码渐变、雪白的纸、僵硬的管状机械。","prompt_en":"1970s Jack Kirby comic page. Heavy tapered brush contours, feathered spot blacks, exaggerated perspective, Kirby Krackle energy bubbles, block sound effects, hand-lettered balloons and yellow captions. CMYK flats printed as 45° Ben-Day dots: cyan #1696CD, magenta #DE2C70, yellow #FFD616, black #1C161A on aged newsprint #EEE2C2, colour plates 1 px off register. Paper grain, browned edges, a gutter fold shadow, warm lamp falloff. Lay the story out in panels and move between them: push into the splash, pan along a strip. Dots stay round and grow into pop-art dots on push-ins. Avoid: smooth digital gradients, clean white paper, stiff tube-like machines.","file":"风格提示词/O_奥斯卡98部/O85_逃离德黑兰.md","img":"风格提示词/O_奥斯卡98部/O85_逃离德黑兰.jpg","year":"2012","tags":["2D"],"extra":[{"h":"技法关键词","t":["杰克·柯比宇宙漫画","Ben-Day 四色网点印刷","泛黄新闻纸","《光之王》概念图"]},{"h":"导演说明","t":"Clawd 扮漫画里的太空英雄：红里子高领、蓝披风、金护腕，手拿柯比式光枪。第一拍内光束开火，然后两刀硬切把书页从假史诗翻到真实出逃，最后 Clawd 卸下戏服，成了舷窗后的一名乘客。2.5 秒三格，像在读漫画。"},{"h":"成片里的分镜","t":"1. 宇宙跨页大格的中景，缓慢推进：披风太空英雄 Clawd 站在岩架上开光枪，光束打爆机器人的反应堆，「KRAKA-THOOM」。（0.9s）\n2. 硬切到红色胶片条那一格：航站楼里的几位人质和旁白「THE MOVIE WAS FAKE. THE MISSION WAS REAL.」，镜头轻微右移。（0.8s）\n3. 硬切到钢蓝色的夜间跑道格，从左往右横移，掠过追来的卡车和吉普，停在离地的客机；角上的舷窗小格里 Clawd 坐在窗后回望。（0.8s）"},{"h":"参考出处","t":["Ben Affleck, Argo (2012)","Jack Kirby, Lord of Light concept art (1979)","Jack Kirby, New Gods / Eternals (1970s)","Rodrigo Prieto (cinematography)"]}]},{"id":"O86","s":"O","cat":"独立年代 2010–2019","name":"为奴十二年","en":"12 Years a Slave","desc":"铜框丝绒盒里的 1850 年代银版照片，从空白显影：椅子上靠着小提琴，Clawd 低头站在旁边。这是所罗门·诺瑟普那个年代的照相术，只用一件物件讲这部片，不画人。","fit":"显影中的银版老照片","prompt":"1850 年代盒装银版照片在显影。招牌镜头：银版宽度占画面约 85%，外圈是带珠串的黄铜衬框 #8a6a2c、圆角矩形开口，红丝绒和皮盒只露在边上。银版是灰阶银色，从近黑 #1c1a18 到浅银 #ecebe6；蓝紫到琥珀的氧化晕只在开口边缘窄窄一圈。抛光旋纹、发丝划痕和斑点都要轻（亮度 ±4%）。左上方柔和窗光，主体静止摆姿，背后素色布景，户外地点画在布景上。一镜到底：前 1 秒左右镜头从打开的盒子推到招牌景别，然后停住；影像从空白的镜面灰开始，暗部先出，显影前沿从左扫到右，约 3 秒显完。只有故事围绕的那个主角手工上色：一层半透明平涂（如 #D97757），透出底下的明暗；灯保持灰色。避免：棕褐色、银版太小、快切。","prompt_en":"A cased 1850s daguerreotype, developing. Signature shot: the silver plate fills about 85% of the frame width inside a beaded brass mat #8a6a2c with a rounded-rectangle opening; velvet and leather only at the edges. Greyscale silver, near-black #1c1a18 to pale #ecebe6; a thin blue-violet to amber tarnish halo round the opening. Light swirls, hairline scratches, specks (±4% brightness). Soft window light from upper left; the subject poses still before a plain backdrop (an outdoor place is painted on it). One shot: the camera pushes from the open case to this framing in ~1 s, then holds; the image develops from blank mirror-grey, shadows first, a front sweeping left to right, done by ~3 s. Only the story's one hero is hand-tinted: a translucent flat wash (e.g. #D97757), shading showing through; lamps stay grey. Avoid: sepia, a small plate, fast cuts.","file":"风格提示词/O_奥斯卡98部/O86_为奴十二年.md","img":"风格提示词/O_奥斯卡98部/O86_为奴十二年.jpg","year":"2013","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["1850 年代带盒银版照片","手工上色锡版照片","影楼静物"]},{"h":"导演说明","t":"没有戏服，也不画人：Clawd 站在所罗门的小提琴旁，慢慢低头。整段只有三种动：影像显影、一次慢推、低头，2.5 秒一刀不剪。"},{"h":"成片里的分镜","t":"1. 一镜到底：开场是桌上整只照相盒，银版一片空白；画面从一侧显影出来（小提琴靠在梯背椅上，Clawd 站在一旁），镜头慢慢推进直到银版铺满画面，Clawd 低下头。（2.5s）"},{"h":"参考出处","t":["Steve McQueen, 12 Years a Slave (2013)","1850s cased daguerreotypes and ambrotypes","Solomon Northup, Twelve Years a Slave (1853)"]}]},{"id":"O87","s":"O","cat":"独立年代 2010–2019","name":"鸟人","en":"Birdman","desc":"细致的 3D 百老汇剧院后台，用手持长镜头拍：暖钨丝灯对冷日光灯，最后冲进时代广场的强光。《鸟人》最出名的就是假装一镜到底，所以这段的风格就是那条运镜。","fit":"3D 后台走廊长镜头","prompt":"实时 3D，仿摄影师埃马努埃尔·卢贝兹基（《鸟人》，2014），一条不断的手持长镜头。主体在窄而旧的通道里（默认后台走廊；户外题材放进最近的室内）：下三分之一是掉漆的血红搪瓷墙裙 #6e2a22，上面是带水渍的烟黄石膏墙 #cdb98e，头顶水管和桥架，墙上有门和告示。光只来自画内灯具，每两三米一盏：铁笼钨丝灯（暖）、一根在闪的日光灯（冷）、一盏红色出口灯 #ff2a1a；远处门外发亮。中等曝光：灯旁墙亮，灯间不低于中灰，地面看得清。广角 18–24 毫米，低频晃动约 ±1°，柔和环境光遮蔽、轻辉光、细颗粒（±3%）。运镜 20–40 秒，次序不限：倒退领路，甩向一侧的门洞，让主体擦过镜头，再转身跟上。避免：锁死机位、空白墙面、重复纹理、压得太黑。","prompt_en":"Real-time 3D, one unbroken handheld long take, after cinematographer Emmanuel Lubezki (*Birdman*, 2014). A narrow, lived-in passage (default a backstage corridor; an outdoor subject gets its nearest interior, e.g. a stairwell): chipped blood-red enamel dado #6e2a22 on the lower third, stained nicotine plaster #cdb98e above, pipes, cable trays, doors, pinned notices. Light only from practicals every 2–3 m: warm caged tungsten bulbs, one cold flickering fluorescent tube, a red exit sign #ff2a1a; the far door glows. Mid-key: plaster light near lamps, never below mid-grey between them; floor visible. Wide lens (18–24 mm), slow sway (±1°), soft ambient occlusion, light bloom, fine grain (±3%). Over 20–40 s, in any order: lead the subject walking backwards, whip aside to a doorway, let it brush past the lens, turn and follow. Avoid: a locked-off camera, blank walls, repeated textures, a crushed dark frame.","file":"风格提示词/O_奥斯卡98部/O87_鸟人.md","img":"风格提示词/O_奥斯卡98部/O87_鸟人.jpg","year":"2014","tags":["3D"],"extra":[{"h":"技法关键词","t":["实时 3D（three.js）","卢贝兹基手持长镜头","钨丝灯与日光灯","数字电影细颗粒"]},{"h":"导演说明","t":"Clawd 扮里根，戴一顶石板蓝的鸟人头盔，金色鸟喙、两侧羽翼。走廊是一条很快的手持运镜，鼓手的摇摆鼓点就在画面里；推开后门那一下卡在拍点上，切到时代广场，Clawd 停下抬头看。"},{"h":"成片里的分镜","t":"1. 手持中景，镜头在戴鸟人头盔的 Clawd 前面倒退着走，向左甩到小房间里打爵士鼓的鼓手，再甩回来，Clawd 走过鼓组、擦着镜头过去。（1.3s）\n2. 切到后门，从 Clawd 背后拍，头顶是红色 EXIT 灯；镜头轻轻侧移，Clawd 一把推开门，门外一片白光。（0.7s）\n3. 切到夜里的时代广场：全景，Clawd 站在人行道上，身后是成片的 LED 屏；它迈一步、抬头看屏幕，手持镜头轻轻漂移。（0.5s）"},{"h":"参考出处","t":["Alejandro G. Iñárritu, Birdman (2014)","Emmanuel Lubezki (cinematography)","Kevin Thompson (production design)","Antonio Sánchez (drum score)"]}]},{"id":"O88","s":"O","cat":"独立年代 2010–2019","name":"聚焦","en":"Spotlight","desc":"印成报纸网点的画面，放到缩微胶片阅读机的灰绿屏幕上：扫描线、滚动的扫描光带、玻璃上的灰尘。片中记者就在这种档案里挖出真相，换镜头也做成胶片横移。","fit":"缩微胶片阅读机 · 报纸网点","prompt":"2001 年报纸彩色网点，放在图书馆缩微胶片阅读机上看。招牌镜头：图片本身铺满画面，不要报头和文字栏；图里的线条和字（招牌、标签）保持实线。四色网点角度 15°、75°、0°、45°，网点约为画面宽度的 1/250，套色错 1 像素。整体转成低反差荧光绿单色，网点依然清楚可见：片基 #1b2320，帧间隙 #0c110f，高光不亮过 #a0dcaf。只有故事的主角整个人保留原色（如 #D97757），照样带网点，反差一样低；光源一律变绿。每 3 像素一条扫描线，每 4 秒滚过一道淡扫描带，一块柔和灯斑，玻璃上有灰和一根头发，圆角遮光罩只轻压外圈约 5%，一行小等宽胶片编号。换场把胶片横向滑过暗色帧间隙（0.5 秒）；镜头内慢推。避免：报纸版面、颜色外漏、硬切。","prompt_en":"A 2001 newspaper colour halftone on a library microfiche reader. Signature shot: the picture fills the frame, no headline or columns; lines and lettering inside it stay solid. CMYK screens at 15°, 75°, 0°, 45°, dots about 1/250 of frame width, 1 px misregistration. Convert to low-contrast phosphor-green monochrome, dots still clearly visible: film base #1b2320, frame gaps #0c110f, highlights no brighter than #a0dcaf. Only the story's one hero keeps its colour, whole figure (e.g. #D97757), screened and equally low-contrast; every light source turns green. Scan lines every 3 px, a faint scan bar every 4 s, a lamp hot-spot, dust, a hair, a light rounded hood vignette (outer ~5%), a small monospace fiche index. Scene changes slide the fiche sideways past a dark gap (0.5 s); slow push-ins. Avoid: newspaper layout, colour leaking, hard cuts.","file":"风格提示词/O_奥斯卡98部/O88_聚焦.md","img":"风格提示词/O_奥斯卡98部/O88_聚焦.jpg","year":"2015","tags":["2D"],"extra":[{"h":"技法关键词","t":["图书馆缩微胶片阅读机","2001 年报纸 CMYK 网点","磷光绿单色"]},{"h":"导演说明","t":"Clawd 扮 Spotlight 小组的记者：挂绳工作证、速记本，后面换成荧光笔。三帧缩微胶片，衔接不用硬切，而是阅读机里胶片的横向滑动，最后一拍落在头版上。"},{"h":"成片里的分镜","t":"1. 地下编辑部全景：记者围着堆满纸的桌子，头顶是荧光灯格栅，Clawd 站在前面，挂着工作证、拿着速记本；镜头慢慢拉开。（0.8s）\n2. 胶片横向滑到下一帧：俯拍打印的神父名单，玩具大小的 Clawd 推着一支大荧光笔一行行往下划，镜头跟着往下移。（0.8s）\n3. 再滑到印刷厂码头：中近景，Clawd 站在头版旁，标题是「Church allowed abuse by priest for years」，镜头慢推。（0.9s）"},{"h":"参考出处","t":["Tom McCarthy, Spotlight (2015)","Masanobu Takayanagi (cinematography)","The Boston Globe front page, 6 January 2002","Library microfiche readers"]}]},{"id":"O89","s":"O","cat":"独立年代 2010–2019","name":"月光男孩","en":"Moonlight","desc":"饱满的青绿、品红和月光蓝油画肖像，雕出来的头像再用顺着形体的笔触重新画一遍。直接照着片名那句「月光下，黑人男孩看起来是蓝色的」来画。","fit":"月光蓝调油画肖像","prompt":"夜色油画肖像。平滑实心体积上，顺着形体用两遍短笔触重画，笔触反差小（明度 ±8%）：海、天、衣服用宽笔，约为画面宽度的 1/60；脸用细笔 1/150，保持平滑。按用途分色：天、海、远处陆地用中等明度的蓝紫 #32377a，约占画面六成；受月光的面和沙地提亮成淡薰衣草蓝；青绿 #128a91 用在水里和受光一侧；轮廓光用品红 #7a2f86；最深暗部 #07071c。任何肤色顶面都受蓝光、带湿亮高光，眼睛睁开有光。默认夜晚，唯一主光是满月，水面铺出碎光；品红只是远处光源的柔和轮廓光；其他小光源只是一小点青白光。颗粒 ±3%。招牌镜头：人物平静，约占画高三分之二。慢推。参照巴里·詹金斯《月光男孩》（2016）。避免：粗块笔触、石膏像小黑眼、发闷的近黑画面。","prompt_en":"Night oil portraiture: smooth volumes repainted in two passes of short, low-contrast (±8% value) form-following strokes: broad (1/60 of frame width) on water, sky and cloth, fine (1/150) on faces, which stay smooth. Palette by role: sky, sea and far land mid blue-violet #32377a, about 60% of the frame; moonlit planes and sand pale lavender-blue; teal #128a91 in water and lit sides; magenta #7a2f86 rim; deepest shadows #07071c. Any skin takes blue top planes and a wet highlight, eyes open and lit. Default night: one key, a full moon with a broken glitter path on water; magenta only as a soft rim from a distant glow; other small light sources stay cyan-white points. Grain ±3%. Signature shot: the figure calm, ~2/3 of frame height. Slow push-ins. Reference: Barry Jenkins, *Moonlight* (2016). Avoid: coarse dabs, small dark statue eyes, a murky frame.","file":"风格提示词/O_奥斯卡98部/O89_月光男孩.md","img":"风格提示词/O_奥斯卡98部/O89_月光男孩.jpg","year":"2016","tags":["2D"],"extra":[{"h":"技法关键词","t":["油画肖像笔触","青绿 / 品红 / 蓝紫双色调","半水上半水下的机位"]},{"h":"导演说明","t":"Clawd 扮小喀戎，不穿戏服：先在游泳课上被托在水面，再站在三张脸之间，最后坐在凯文身边的沙滩上。三个章节三个镜头硬切；海里和海滩两个镜头都慢慢推近，让安静延续下去。"},{"h":"成片里的分镜","t":"1. 贴着碧绿海面的半水上半水下镜头：一个男人站在齐胸深的水里，用手掌托着 Clawd，水下能看见他的手；镜头慢推。（0.8s）\n2. 切到并排的三张油画肖像，青绿、品红、蓝紫各一张；镜头重新取景，三张脸滑拼成一个楔形拼贴，Clawd 站在青绿那一块里。（0.8s）\n3. 切到月光下的海滩：凯文和 Clawd 并排坐在蓝色沙滩上的双人镜头，满月在右上，浪花拍岸；镜头慢推。（0.9s）"},{"h":"参考出处","t":["Barry Jenkins, Moonlight (2016)","James Laxton (cinematography)","Moonlight (2016) three-face poster"]}]},{"id":"O90","s":"O","cat":"独立年代 2010–2019","name":"水形物语","en":"The Shape of Water","desc":"实时 3D 的被淹浴室和实验室水箱，整片浸在青绿里：流动的焦散、从上方落下的光束、气泡和几盏暖色灯。德尔·托罗这部片就泡在这种水里，所以整段在水中拍。","fit":"3D 水下青绿焦散","prompt":"实时 3D，全在水下（陆上题材就沉进淹水的屋子或水下遗迹），泡在青绿里：背景 #041414，半球光上方 #5fb3a6、下方 #0c2a24，青绿雾，红色随距离最先消失。水面上方一个强光源投下流动焦散：近处表面上的亮格子约为画面宽度的 1/20，滑过地面、墙面和主体。光柱向下散开，画面四边保持暗。气泡、微粒、从下仰看的波纹水面。暖金色给一到三处实际灯光，至少一处要大（亮窗或灯，约为画面宽度的 1/10），加青色生物荧光。平滑着色，环境光遮蔽、浅景深、适度辉光、颗粒（±3%）。招牌镜头：低机位仰拍，主体约占画面高度一半，偏在光源一侧；慢推。参照吉尔莫·德尔·托罗《水形物语》（2017）。避免：平板的水、焦散画成天上的条纹、暖色点缀太小。","prompt_en":"Real-time 3D, fully under water (land subjects sink into a flooded room or sunken place), in teal: background #041414, hemisphere light #5fb3a6 above and #0c2a24 below; teal fog, reds fading first with distance. A strong source above the surface projects moving caustics: bright cells about 1/20 of frame width on near surfaces, sliding over floor, walls and the subject. Shafts fan down; edges stay dark. Bubbles, motes, the rippled surface from below. Warm gold on 1–3 practicals, at least one large (a lit window or lamp ~1/10 of frame width), plus cyan bioluminescence. Smooth-shaded models, ambient occlusion, shallow focus, modest bloom, grain ±3%. Signature shot: low angle looking up, the subject half the frame height, off-centre beside the light; slow push-ins. Reference: Guillermo del Toro, *The Shape of Water* (2017). Avoid: flat water, caustics as sky stripes, tiny warm accents.","file":"风格提示词/O_奥斯卡98部/O90_水形物语.md","img":"风格提示词/O_奥斯卡98部/O90_水形物语.jpg","year":"2017","tags":["3D"],"extra":[{"h":"技法关键词","t":["实时 3D（three.js）","投射焦散与体积光束","Dan Laustsen 的青绿配暖金调色"]},{"h":"导演说明","t":"Clawd 扮埃莉莎，头上一条深红丝绒发带和蝴蝶结，后面手里拿一个白煮蛋。2.5 秒四刀，节奏稳定在 1.25 倍：光束下的拥抱、贴着的脸、水箱，最后是两只手，接触处亮起青光作为收尾的一拍。"},{"h":"成片里的分镜","t":"1. 被淹浴室里的低机位全景：两栖人在光束下抱着 Clawd，一只红鞋在下沉；镜头慢推。（0.9s）\n2. 切到脸部近景：他的头冠和鳃贴着 Clawd 的一角，红色发带蝴蝶结，气泡上升；镜头缓缓推近。（0.5s）\n3. 切到实验室：中景，Clawd 站在发光的水箱前，手里拿着白煮蛋，向后伸手贴上玻璃；镜头慢推。（0.6s）\n4. 切到特写：两只手隔着玻璃相贴，接触处亮起一团青光。（0.4s）"},{"h":"参考出处","t":["Guillermo del Toro, The Shape of Water (2017)","Dan Laustsen (cinematography)","Paul D. Austerberry (production design)","The Shape of Water (2017) poster"]}]},{"id":"O91","s":"O","cat":"独立年代 2010–2019","name":"绿皮书","en":"Green Book","desc":"一张「南方问候」亚麻纹明信片活了过来：布纹纸、喷枪上的饱和色、镀铬上的星形闪光。影片是 1962 年穿越美国南方的公路旅行，走的正是这种明信片上的路。","fit":"60 年代亚麻纹明信片","prompt":"五六十年代亚麻纹明信片，柯特·泰希出版社那一路。平纹布纹卡纸：油墨只落在凸起的经纬上，形成约为画面宽度 1/300 的细格纹，凹处露白点。手工分色的饱和色，喷枪柔和过渡：天蓝 #3fa0dc、草绿 #4fae57、粉红 #f08cb0，主体物或水面用青绿 #2fb5b8，奶油卡纸 #f6e4b8 作底色和白边。主体物要大，正侧面，约占卡片高度一半。亮面加四角星闪光；套色错位 1–2 像素。藏青立体大字带白描边，横在卡片上三分之一，写地名或片名（没有就按题材编一个），每个字母里嵌一小幅风景，上方配红飘带。开场明信片放在桌上，推进到满屏后画面活过来（水在动、人在走），再侧向横移。避免：没有布纹的渐变、发灰的颜色、照片式透视。","prompt_en":"A 1950s–60s linen postcard, Curt Teich manner. Linen-weave card: ink only on raised threads, a fine crosshatch about 1/300 of frame width, white specks in the hollows. Saturated hand-separated colour, airbrush blends: sky blue #3fa0dc, grass green #4fae57, pink #f08cb0, teal #2fb5b8 for the main object or water, cream card #f6e4b8 for paper and border. The main object large, side-on, about half the card's height. Star glints on shiny surfaces; registration off 1–2 px. Big navy 3D block letters with white outlines across the top third spell the place or title (invent one if needed), a small scene in each letter, a red ribbon banner above. Open on the card on a desk, push in until it fills the frame and comes alive (water, figures move), then track sideways. Avoid: weave-less gradients, greyish colour, photographic perspective.","file":"风格提示词/O_奥斯卡98部/O91_绿皮书.md","img":"风格提示词/
