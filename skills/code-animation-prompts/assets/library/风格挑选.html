O_奥斯卡98部/O91_绿皮书.jpg","year":"2018","tags":["2D"],"extra":[{"h":"技法关键词","t":["Curt Teich 亚麻纹明信片","「Greetings from」大字母","喷枪手工上色","胶印套色错位"]},{"h":"导演说明","t":"Clawd 扮托尼：油亮的黑色大背头、浅蓝短袖口、一支点着的烟，一手握方向盘。推进明信片的运镜直接带进公路，不切；唯一的一刀落在音乐厅，雪利博士弹琴，Clawd 在侧幕边看。"},{"h":"成片里的分镜","t":"1. 一个连续运镜：汽车旅馆书桌上的明信片，旁边是绿皮书和房门钥匙；镜头一路推进明信片，画面活过来，青绿色凯迪拉克开动，镜头往后拉开，变成侧面跟拍，Clawd 握着方向盘，雪利博士坐在后座。（1.9s）\n2. 唯一一刀切到音乐厅：全景，雪利博士和他的三重奏在红丝绒幕前演奏三角钢琴，Clawd 站在侧幕边看；镜头轻推。（0.6s）"},{"h":"参考出处","t":["Peter Farrelly, Green Book (2018)","Sean Porter (cinematography)","Curt Teich & Co. linen postcards (1931–59)","The Negro Motorist Green Book (1962)"]}]},{"id":"O92","s":"O","cat":"独立年代 2010–2019","name":"寄生虫","en":"Parasite","desc":"一张剖开首尔山坡的建筑剖面图：山顶的玻璃豪宅、地下的秘密掩体、一路通到被淹的半地下室，细线、柔和的材质色。《寄生虫》建在这种上下的阶级落差上，一张图装下整部片。","fit":"建筑剖面轴测图","prompt":"矢量建筑剖面轴测图，用低角度二等角视图：剖切面沿接近水平的 7° 轴正对观众，进深沿 42° 轴、按一半缩短；屋顶和近侧墙剖掉，露出房间。剖切穿过主体所在之处（房子、塔、船、山坡）。切面填涂黑：深色混凝土带骨料，土层画 45° 斜线夹小石块。任何缩放都是 1 像素深灰线。默认白天、淡色天空：混凝土 #b3ada2、橡木 #d6b58a、炭灰 #3e4146、松绿 #3f6b3e，白墙、绿草坪、半透明蓝水。房间配家具和简洁的小比例人。夜景或其他暗光只是变体：叠乘三到四成月光蓝，亮灯的房间涂回暖色。镜头沿剖面慢慢升降，框住两三个房间，跟主体走一条不断的路线，最后停在占画面约八成的整张图上。避免：30° 等轴测、粗卡通描边、楼层间切镜头、图太小。","prompt_en":"Vector section axonometric, low dimetric view: the cut face lies along the near-flat 7° axis, facing us, depth along the 42° axis at half scale; roof and near walls cut away to show the rooms. Cut through the subject's place (a house, a tower, a ship, a hillside). Poché on cut faces: dark concrete with aggregate, earth hatched at 45° with stones. 1 px dark-grey lines at every zoom. Default daylight under a pale sky: concrete #b3ada2, oak #d6b58a, charcoal #3e4146, pine #3f6b3e, white walls, green lawn, translucent blue water. Furnished rooms, simple scale figures. Night or other low light is a variation: multiply 30–40% moonlit blue, lit rooms painted back warm. Crane slowly framing 2–3 rooms along one continuous path; end on the whole drawing at ~80% of the frame. Avoid: 30° isometric, thick outlines, cuts between levels, a small drawing.","file":"风格提示词/O_奥斯卡98部/O92_寄生虫.md","img":"风格提示词/O_奥斯卡98部/O92_寄生虫.jpg","year":"2019","tags":["2D"],"extra":[{"h":"技法关键词","t":["二等角剖面轴测","建筑剖切填充与比例人","雨夜调色"]},{"h":"导演说明","t":"Clawd 扮基宇，山水石一路不离手：在草坪上举过头顶，暴雨夜躲在茶几边，再一路顶着它下山。全段只切两刀；每个镜头里镜头都沿剖面上下走，让富人和穷人在同一个画面里，12 拍最后停在整张剖面上。"},{"h":"成片里的分镜","t":"1. 白天的玻璃豪宅剖面和条纹草坪上的派对：Clawd 站在花园门口，双手把山水石举过头顶；镜头慢慢推近。（0.8s）\n2. 切到暴雨夜：朴家客厅，Clawd 躲在茶几边；镜头像升降机一样往下，穿过楼板和地下室，落到掩体，灯在按摩斯码闪。（1.3s）\n3. 切到雨中一路往下的长镜头：镜头跟着头顶山水石的 Clawd 从大门走下一段段长台阶，穿过马路底下的隧道，进到低处的街巷和正在被淹的半地下室，再升起拉开成整张剖面，豪宅在顶上，淹水在最底下。（2.9s）"},{"h":"参考出处","t":["Bong Joon-ho, Parasite (2019)","Hong Kyung-pyo (cinematography)","Lee Ha-jun (production design)","Parasite (2019) poster","Architectural section axonometrics"]}]},{"id":"O93","s":"O","cat":"此时此刻 2020–2025","name":"无依之地","en":"Nomadland","desc":"灰紫色纸上的粉质色粉笔触，一片开阔的平原和一辆旧房车，天空从金黄变成玫瑰色再到紫色。《无依之地》就活在黄昏那条又长又空的地平线上，色粉让它安静、柔和。","fit":"魔幻时刻色粉画","prompt":"灰紫色纸 #7d7079 上的软色粉画，纸的齿纹处处透出来，成细密颗粒（亮度 ±8%）。天空揉开抹平，只有几条细长的横向云带。质感集中在地面：干草赭色（金黄往纸的灰色压暗），上面铺满直立的细草笔，每笔宽约为画面宽度的 1/400、长约 1/40，明度起伏 ±15%，前景密，往地平线渐稀。物体用柔和的斜向排笔，边缘软而碎。按用途分色：地平线金黄 #f6cf7a，下层天空玫瑰 #c9738a，高空、云带和远处陆地用紫 #4b3f78，暗部用暮蓝 #2b2d5c。地平线长，在画面中线附近，下面是原野或水面；主体和身边的东西中等大小，放在下半幅。天色从金黄转玫瑰再转紫，越暗暖灯越亮。一个缓慢横移带轻推的镜头。避免：油画厚涂感、锐利数码边、光秃平滑的地面。","prompt_en":"Soft pastel on grey-violet toned paper #7d7079, tooth showing everywhere as fine speckle (±8% brightness). Sky blended smooth, a few long thin cloud bands. The land carries the texture: dry-grass ochre (gold dulled toward the paper grey) under fine upright grass strokes (1/400 of frame width wide, 1/40 long, ±15% value), dense in the foreground, thinning toward the horizon. Objects get soft diagonal hatching, broken edges. Palette by role: gold #f6cf7a at the horizon, rose #c9738a in the lower sky, violet #4b3f78 for high sky, clouds and far land, dusk blue #2b2d5c for shadows. A long horizon near mid-frame over open land or water; the subject mid-sized in the lower half. The sky drifts gold to rose to violet; lamps brighten as it darkens. One slow pan with a light push-in. Avoid: oily impasto, sharp edges, bare smooth ground.","file":"风格提示词/O_奥斯卡98部/O93_无依之地.md","img":"风格提示词/O_奥斯卡98部/O93_无依之地.jpg","year":"2020","tags":["2D"],"extra":[{"h":"技法关键词","t":["有色纸上的软色粉","魔幻时刻的黄昏配色","纸面颗粒肌理"]},{"h":"导演说明","t":"Clawd 扮弗恩，不拿道具，只有走、坐、看三个动作。整段一刀不剪：走路慢慢停在毯子上，坐下，再抬眼望向地平线；天色暗下来，露营灯和房车门口的光越来越暖。"},{"h":"成片里的分镜","t":"1. 一镜到底的全景：Clawd 从一辆侧门敞开的白色旧房车前走过，镜头跟着它横移并轻轻推近，平原和远处的孤丘缓缓滑过；它走到露营灯旁的条纹毯子上坐下，望向地平线，天色从金黄变成紫色。（2.5s）"},{"h":"参考出处","t":["Chloé Zhao, Nomadland (2020)","Joshua James Richards (cinematography)"]}]},{"id":"O94","s":"O","cat":"此时此刻 2020–2025","name":"健听女孩","en":"CODA","desc":"橡木桌上一颗抛光的抹香鲸牙，刻着细密的黑线，点缀红、蓝、黄：格洛斯特的渔船、收网的一家人、船头唱歌的鲁比。这是影片所在的新英格兰海岸自己的民间工艺。","fit":"鲸牙骨雕（Scrimshaw）","prompt":"19 世纪水手在抛光鲸牙上的针刻画。招牌镜头：宽而扁的鲸牙横躺在橡木桌上，占画面宽约 85%、高约 70%，墨水瓶和折刀在边上。用近黑墨 #17110c 刻：细针排线（线宽约画面宽的 1/800，线距约 1/500）、粗细起伏的轮廓线和点刻。刻线覆盖牙面约七成：海、主体和陆地密，天空轻排线；海是成排的程式化波浪。主角要大（约占牙面高三分之一）并上色；此外红 #9a2a22、蓝 #2b4a78、黄 #e9b526 只作点缀。暖象牙底、淡生长纹、抛光划痕、牙尖蜜黄。民间朴拙构图：绳纹边框、飘带题词、放射光芒的太阳、主体世界的图案。弧度靠边缘明暗和一道窗户反光，画面不变形。先拍整颗牙，推进后慢慢横移，波浪随之动起来。避免：粗线、实色填涂、细长的牛角形。","prompt_en":"Scrimshaw: 19th-century sailor's engraving on a whale tooth. Signature shot: a broad, flat-sided tooth lies horizontal on an oak table, about 85% of frame width and 70% of its height; ink bottle, jackknife beside. Engrave in near-black #17110c: needle hatching (lines 1/800 of frame width, spaced about 1/500), swelling outlines, stipple. Lines cover ~70% of the face, dense in sea, subject and land, sky lightly hatched; seas as rows of stylised waves. The hero is large (~1/3 of the tooth's height), coloured; otherwise red #9a2a22, blue #2b4a78, yellow #e9b526 only as small touches. Warm ivory, growth bands, scratches, honey tip. Folk layout: rope border, ribbon motto, rayed sun, motifs from the subject's world. Shade the edges, one gloss streak; don't warp the picture. Push in, then pan slowly as waves animate. Avoid: thick lines, solid fills, a slim horn.","file":"风格提示词/O_奥斯卡98部/O94_健听女孩.md","img":"风格提示词/O_奥斯卡98部/O94_健听女孩.jpg","year":"2021","tags":["2D"],"extra":[{"h":"技法关键词","t":["19 世纪捕鲸水手鲸骨雕","刻刀排线与点刻","桌面静物产品布光"]},{"h":"导演说明","t":"Clawd 扮鲁比，戴一顶黄色防水渔夫帽，站在船头的鱼箱上。只有一刀：从物件切进刻画，然后一次轻轻的横移，把视线从父亲的手语带到歌声上，五线谱跟着歌声展开。"},{"h":"成片里的分镜","t":"1. 全景：刻好的鲸牙放在橡木桌上，旁边是折刀和墨水瓶；镜头推进，直到鲸牙铺满画面。（0.8s）\n2. 切进刻画：渔船的中全景，镜头从左往右慢慢横移并轻推，从一边收网一边打出「我爱你」手语的弗兰克，移到船头唱歌的 Clawd，一行五线谱从它举起的手臂上展开。（1.7s）"},{"h":"参考出处","t":["Siân Heder, CODA (2021)","CODA (2021) poster","New Bedford Whaling Museum scrimshaw collection"]}]},{"id":"O95","s":"O","cat":"此时此刻 2020–2025","name":"瞬息全宇宙","en":"Everything Everywhere All at Once","desc":"四个宇宙四种画法，全部实时光线步进：冷绿的国税局、广告光下的热狗手指钢琴、贴大眼睛石头的寂静峡谷、变成黑洞的万物贝果。像电影里一样，靠大眼睛贴纸在宇宙间跳转。","fit":"光线步进多元宇宙跳切","prompt":"实时光线步进 3D 的多元宇宙蒙太奇：主体在三到四个宇宙之间跳转，各有画法，都从主体自己的世界变出来，例如：冷绿日光灯下的写实工作场所，陈设很满；带引力透镜光环的超现实宇宙；配白字幕的安静旷野远景；糖果粉背景、粉青轮廓光的广告产品照。每个停 2–4 秒，各自调色。贯穿始终的衔接物：主体身上的一只活动眼贴纸，约占画高十分之一。跳转 0.5–0.8 秒：推进这只眼睛，拖影、RGB 分离，再炸开一圈彩虹色块环（#e5322d、#f7c928、#1fa39a、#2a6fc0、#e0478f），环上嵌满活动眼和粉珠，扩到画高约八成后白闪。招牌画面：彩虹环围着主体绽开；第一次跳转在 1 秒左右。参照丹尼尔斯兄弟《瞬息全宇宙》（2022）。避免：宇宙都一个样、环太小太素。","prompt_en":"Ray-marched real-time 3D multiverse montage: the subject jumps through 3–4 universes, each its own look, invented from its world, e.g. a realistic workplace under cold green fluorescents, densely dressed; a surreal cosmic version with a gravitational-lens halo; a silent wide landscape with white subtitles; a candy-pink product shot with pink-and-cyan rims. Each holds 2–4 s with its own grade. One link through all: a googly-eye sticker on the subject, about 1/10 of frame height. Transition, 0.5–0.8 s: push into the eye, smear, split RGB, then a rainbow ring of colour segments (#e5322d, #f7c928, #1fa39a, #2a6fc0, #e0478f) studded with googly eyes and pink beads blooms to ~80% of frame height and bursts to white. Signature frame: the ring around the subject; first jump at ~1 s. Reference: Daniels, *Everything Everywhere All at Once* (2022). Avoid: look-alike universes, a small plain ring.","file":"风格提示词/O_奥斯卡98部/O95_瞬息全宇宙.md","img":"风格提示词/O_奥斯卡98部/O95_瞬息全宇宙.jpg","year":"2022","tags":["3D"],"extra":[{"h":"技法关键词","t":["GLSL 光线步进的多个宇宙","一个宇宙一种画法（写实办公室、超现实宇宙、风景、广告）","大眼睛彩虹曼陀罗"]},{"h":"导演说明","t":"Clawd 扮秀莲，额头贴大眼睛、腰挂腰包。每次跳宇宙都是先推进那只眼睛，再接拖影、RGB 分离和白闪，卡在切点上；每个宇宙一个不同的动作：站着、用脚踩琴键、陪石头坐着、被吸进贝果。最后回到起点，在曼陀罗里张开双臂。"},{"h":"成片里的分镜","t":"1. 国税局办公室全景，收据满天飞，镜头沿过道推向 Clawd；它额头贴着一只大眼睛，腰上挂着腰包。（0.8s）\n2. 切到审计员和她堆满收据的钢制办公桌，她举着一张收据；镜头慢推。（0.6s）\n3. 切到举起双臂的 Clawd，镜头猛推进它额头的大眼睛，跳宇宙的闪光炸开。（0.4s）\n4. 热狗手指宇宙：糖果粉光下的亮面钢琴全景，一只手的热狗手指软软地瘫在琴键上，Clawd 站在琴键上。（0.5s）\n5. 切近到 Clawd 的脚，一下下踩着琴键，两臂末端也长出小热狗。（0.5s）\n6. 再次推进大眼睛，接下一次跳宇宙。（0.4s）\n7. 寂静峡谷边的全景：两块贴着大眼睛的石头，Clawd 安静地坐在旁边，字幕「We're all small and stupid.」；镜头沿崖边慢慢漂移。（1s）\n8. 万物贝果：Clawd 仰望巨大的黑色贝果，镜头一路推进中间的黑洞，穿过视界，Clawd 被吸得往前倾。（1.7s）\n9. 回到办公室：Clawd 张开双臂，身后长出一圈带大眼睛的彩虹曼陀罗环；镜头轻轻拉开。（0.6s）"},{"h":"参考出处","t":["Daniels, Everything Everywhere All at Once (2022)","Larkin Seiple (cinematography)","Jason Kisvarday (production design)","Everything Everywhere All at Once (2022) poster"]}]},{"id":"O96","s":"O","cat":"此时此刻 2020–2025","name":"奥本海默","en":"Oppenheimer","desc":"用实时 3D 重建黎明前的三位一体试验场：约 72 万粒子的火球、轨道和波组成的量子幻象，深蓝夜色对橙金火光，加 IMAX 式颗粒。《奥本海默》就围着这一道光展开。","fit":"3D 粒子火球 · IMAX 颗粒","prompt":"实时 3D 夜景，主角光是一场巨大的粒子事件：几十万粒子的火球（或照明弹、火山喷发、山火），形状随时间走：白闪（0.5 秒），1 秒成翻滚的斑驳穹顶，再卷成环，尘墙外扫。在主体正后方像光环，约占画面四成：核心白金，大部分是有纹理的亮橙金火团 #ff9a50，黑烟只做细暗纹和顶边，不超一成半。火光照亮全场：暖色 #ffd8a0 铺满地面和云底，主体有热轮廓光，脸上仍有半强度暖光；长影子朝镜头拖来，火星飘飞。其余是黎明前的深蓝 #2a3654 和暗土 #16120e。只让核心过曝。IMAX 拷贝调色：细颗粒（±3%）、暖色光晕溢出、暗角、轻微片门晃动。低机位广角，主体居中，慢推。参照克里斯托弗·诺兰《奥本海默》（2023）。避免：光滑的 CG 光球、被黑烟裹住的火。","prompt_en":"Real-time 3D night lit by one huge particle event: a ~500k-particle fireball (or flare, eruption, wildfire) whose shape follows time: white flash (0.5 s), billowing dome by 1 s, a rolling toroid, a dust wall sweeping out. Right behind the subject like a halo, ~40% of the frame: white-gold core, bright orange-gold billows #ff9a50 with visible texture, black smoke only as thin veins and the top edge (under 15%). Its glow fills everything: warm #ffd8a0 on ground and cloud undersides, a hot rim on the subject, faces lit warm at half strength; long shadows toward camera. The rest is pre-dawn blue #2a3654 and dark earth #16120e. Clip only the core. IMAX grade: grain ±3%, warm halation, vignette, slight gate weave. Low wide angle, subject centred, slow push-ins. Reference: Christopher Nolan, *Oppenheimer* (2023). Avoid: a smooth CG ball, smoke-shrouded fire.","file":"风格提示词/O_奥斯卡98部/O96_奥本海默.md","img":"风格提示词/O_奥斯卡98部/O96_奥本海默.jpg","year":"2023","tags":["3D"],"extra":[{"h":"技法关键词","t":["实时 3D（three.js）","GPU 粒子模拟","IMAX 65mm 印片调色","三位一体试验高速照片"]},{"h":"导演说明","t":"Clawd 扮奥本海默：一顶浅驼色平顶软呢帽，手里一只冒烟的石楠烟斗。五个镜头硬切，垒出倒计时：铁塔、装置、幻象，白闪正好落在切进观察者的那一刀上；音乐不停，最后一秒火球在 Clawd 身后膨胀。"},{"h":"成片里的分镜","t":"1. 黎明前低机位仰拍被探照灯照亮的钢塔，倒计时的信号灯在闪，镜头慢推。（0.6s）\n2. 切到波纹铁皮小屋里的炸弹：缠满电缆的螺栓球体，暖色工作灯；固定机位。（0.4s）\n3. 切到黑底上的量子幻象：围绕核心的发光轨道、下方的干涉波、一颗坍缩的恒星。（0.4s）\n4. 一道白闪，接反打：戴帽子的观察者举着焊接玻璃，脸被火光照亮，Clawd 戴平顶软呢帽、拿着烟斗站在中间；固定机位。（0.8s）\n5. 低机位全景：Clawd 站在路中间，身后的火球像光环一样升起，火星在空中飘；镜头慢推。（1s）"},{"h":"参考出处","t":["Christopher Nolan, Oppenheimer (2023)","Hoyte van Hoytema (IMAX cinematography)","Berlyn Brixner, Trinity test photographs (1945)","Oppenheimer (2023) poster"]}]},{"id":"O97","s":"O","cat":"此时此刻 2020–2025","name":"阿诺拉","en":"Anora","desc":"粉、青、橙的霓虹灯管发着光，倒影拖在湿栈道上，落进飘雪里，加上辉光、虚焦光斑和颗粒。《阿诺拉》从布莱顿海滩的俄文霓虹走到维加斯的婚礼招牌，整段都用灯管照亮。","fit":"雪夜霓虹","prompt":"照片感的 2D 霓虹夜景。招牌是真实灯管：玻璃管、辉光、亮管、白热管芯，带卡子和深色跳线；轻微起伏，很少抖一下（5–10 秒一次）。粉 #ff4fa8、青 #4fdcff、橙 #ff9a2e、绿 #3dff9a，加暖色钠灯，压在深紫蓝夜色 #1e1838 上。霓虹放在主体世界里说得通的地方（店面、港口酒吧、主体自己那栋楼）。画面下四分之一留给湿地面：招牌拉成长长的竖向倒影，被木板缝、地砖缝或水纹打断；雪在下，边上积成雪堆，被溢光染色。主体脸上保留暖色主光（来自近处的灯、窗或它自己的灯），两侧各一条窄霓虹轮廓光；远处虚成光斑。辉光、暗角、颗粒（±3%）。每个短镜头 2–3 秒，同一地点换角度，各自慢推。参照肖恩·贝克《阿诺拉》（2024）。避免：平涂彩字式霓虹、干地面、频闪。","prompt_en":"Photographic 2D neon night. Real tubes: glass tube, glow, bright tube, white-hot core, clips, dark jumper wires; rare flicker (every 5–10 s). Neon pink #ff4fa8, cyan #4fdcff, orange #ff9a2e, green #3dff9a plus warm sodium light over a deep purple-blue night #1e1838. Put neon where the subject's world allows (shopfronts, a harbour bar, its own building). Wet ground fills the lower quarter: signs stretch into long vertical reflections broken by plank gaps, paving joints or ripples; snow falls and drifts at the edges, tinted by the spill. The subject keeps a warm key on the face (a lamp, a window, its own light), narrow neon rims on both sides; the distance melts into bokeh. Bloom, vignette, grain ±3%. Short 2–3 s shots, new angles on one place, each a slow push-in. Reference: Sean Baker, *Anora* (2024). Avoid: flat neon lettering, strobing.","file":"风格提示词/O_奥斯卡98部/O97_阿诺拉.md","img":"风格提示词/O_奥斯卡98部/O97_阿诺拉.jpg","year":"2024","tags":["2D"],"extra":[{"h":"技法关键词","t":["霓虹灯管招牌","湿地面倒影与积雪","35mm 夜景摄影"]},{"h":"导演说明","t":"Clawd 扮阿诺拉：奶油色毛皮护耳帽、竖起的毛领、一只大圆耳环。四个短镜头卡着拍子走，每个都带一点推拉：烟花、和万尼亚在栈道上、婚礼招牌，最后是安静的车里和落雪。"},{"h":"成片里的分镜","t":"1. 长焦拍海边亮灯的摩天轮和跳伞塔，一朵新年烟花炸开；镜头慢推。（0.6s）\n2. 切到下雪的栈道，旁边一排俄文霓虹店招：戴毛皮护耳帽和毛领的 Clawd 站在前面，万尼亚在它旁边大笑挥手，招牌倒映在湿木板上；镜头慢慢拉开。（0.7s）\n3. 切到拉斯维加斯：心形穿箭的「Wedding」招牌和 CHAPEL 灯箱铺满画面，旁边是白色小教堂；镜头慢推。（0.6s）\n4. 切到最后一场戏，停着的车里：Clawd 坐在仪表台上，背后挡风玻璃上的雪落下、积住，伊戈尔在前景握着方向盘；镜头慢推。（0.6s）"},{"h":"参考出处","t":["Sean Baker, Anora (2024)","Drew Daniels (cinematography)","Anora (2024) poster"]}]},{"id":"O98","s":"O","cat":"此时此刻 2020–2025","name":"一战再战","en":"One Battle After Another","desc":"实时 3D 的沙漠公路，像过山车一样一起一伏，三辆车翻着一道道坡追逐，用超长焦拍，带热浪、漂白的强光和细颗粒。复刻的是这部片最有名的段落：起伏公路追车。","fit":"3D 起伏公路追车 · 长焦压缩","prompt":"实时 3D，漂白般的沙漠日光。招牌镜头（3–5 秒）：一条笔直的路在连续起伏的坡谷上，水平视角 2–5°，让坡谷叠成波浪，行进的主体沉下去又冒出来；构图先保坡谷，天空最多留一条窄带。再接各 1–2 秒的坡顶低机位、车载或骑手机位。配色：天空 #7fb0e0，雾气 #ece4d2 只在最远的地平线，浅沙色 #d2ae80（不能发橙），硬朗阳光 #fff0d8 从高处侧打，主车是褪色海沫绿 #86b5ad。反差来自前景：开裂的深色沥青、清晰阴影、茂密的绿灌木、路边桩。默认正午，其他时段也保持硬光。热浪扭曲和路面蜃景随距离加重；落地扬尘；车过坡顶腾空、落地弹跳。大画幅细颗粒（±2%）。参照保罗·托马斯·安德森《一战再战》（2025）。避免：广角、发白发灰的画面、粘在路上的车。","prompt_en":"Real-time 3D, bleached desert daylight. Signature shot (3–5 s): a straight road over rolling dips and crests at a 2–5° horizontal field of view, stacking dips into waves; the travelling subject sinks and reappears; sky a thin band at most. Then 1–2 s each, a low camera at a crest, a mount on the vehicle or rider. Palette: sky #7fb0e0, haze #ece4d2 only at the far horizon, pale sand #d2ae80 (never orange), hard sun #fff0d8 from high to one side, the main vehicle faded seafoam #86b5ad. Contrast: dark cracked asphalt, crisp shadows, dense green scrub, roadside posts. Default midday; at other hours keep hard sun. Heat shimmer and mirage grow with distance; dust on landings; vehicles leave the ground over crests. Grain ±2%. Reference: Paul Thomas Anderson, *One Battle After Another* (2025). Avoid: wide lenses, a washed-out frame.","file":"风格提示词/O_奥斯卡98部/O98_一战再战.md","img":"风格提示词/O_奥斯卡98部/O98_一战再战.jpg","year":"2025","tags":["3D"],"extra":[{"h":"技法关键词","t":["实时 3D（three.js）","超长焦压缩","热浪与路面蜃景","VistaVision 细颗粒"]},{"h":"导演说明","t":"Clawd 扮鲍勃：格子浴袍的翻领、推到头顶的金框墨镜，开着最前面那辆车。追车按真实速度走，五个机位在长焦的波浪和近处的瞬间之间交替；最后一个镜头停在 Clawd 举起的手臂上，这个姿势定住，好让终章接过去。"},{"h":"成片里的分镜","t":"1. 超长焦从远处车队前方往回看公路：起伏压成一层层波浪，三辆车在波浪里沉下去又冒出来，柏油路面上热浪晃动。（1.2s）\n2. 切到引擎盖上的机位：Clawd 坐在海沫绿敞篷车的驾驶座，墨镜推在头顶，双手握紧方向盘，然后抬眼看后视镜。（0.8s）\n3. 切到坡顶路肩的低机位三脚架：敞篷车飞过坡顶，冲向镜头。（0.6s）\n4. 再切回长焦，这次在车队后方往前看，几辆车在一道道起伏里消失又出现。（1.1s）\n5. 切到车前方的长焦跟拍：Clawd 的敞篷车翻过坡顶离地，深绿和灰色两辆轿车从后面追上来；落地后 Clawd 把一只手伸出车外举起，一直举到最后一帧。（1.3s）"},{"h":"参考出处","t":["Paul Thomas Anderson, One Battle After Another (2025)","Michael Bauman (VistaVision cinematography)","One Battle After Another (2025) poster"]}]}]}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var META = DATA.meta, E = DATA.entries;
  var KEY = 'fy-styles-picks-v1';
  var state = { q: '', s: '', cat: '', img: '', only: false };
  var picks = new Set();
  try { JSON.parse(localStorage.getItem(KEY) || '[]').forEach(function (n) { picks.add(n); }); } catch (e) {}
  function savePicks() { try { localStorage.setItem(KEY, JSON.stringify(Array.from(picks))); } catch (e) {} }

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null) continue;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }
  // 文本里的 [字](https://…) 变成可点的链接；其余一律当纯文本，不当 HTML
  function rich(el, str) {
    var re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, last = 0, m;
    while ((m = re.exec(str))) {
      if (m.index > last) el.appendChild(document.createTextNode(str.slice(last, m.index)));
      el.appendChild(h('a', { href: m[2], target: '_blank', rel: 'noopener noreferrer', text: m[1] }));
      last = re.lastIndex;
    }
    if (last < str.length) el.appendChild(document.createTextNode(str.slice(last)));
    return el;
  }
  var metaOf = {}; META.forEach(function (m) { metaOf[m.id] = m; });
  var byId = {}; E.forEach(function (e) { byId[e.id] = e; });
  var hay = {};
  E.forEach(function (e) {
    hay[e.id] = [e.id, e.name, e.en, e.cat, e.desc, e.desc_en, e.fit, (e.tags || []).join(' '), e.prompt, e.year].join(' ').toLowerCase();
  });
  function count(f) { var n = 0; E.forEach(function (e) { if (f(e)) n++; }); return n; }

  // ---- 总数和各系列数量
  var total = E.length, ours = count(function (e) { return metaOf[e.s].grp === 'ours'; }), nw = total - ours;
  var withImg = count(function (e) { return !!e.img; });
  var stats = document.getElementById('stats');
  [[total, '个风格，总共', true], [ours, '个风格库（A–G、M、K、Z、H、L、V、X、R）'], [nw, '个奥斯卡最佳影片风格（O）'], [withImg, '个有静帧'], [total - withImg, '个只有文字']].forEach(function (s) {
    stats.appendChild(h('div', { class: 'stat' + (s[2] ? ' total' : '') }, h('b', { text: String(s[0]) }), h('span', { text: s[1] })));
  });
  document.getElementById('skillnote').textContent = '';

  // ---- 筛选
  var seriesBtns = {}, catMount = document.getElementById('f-cat');
  function pressed(btn, on) { btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  function addChip(mount, label, sub, onclick) {
    var b = h('button', { class: 'chip', 'aria-pressed': 'false', text: label });
    if (sub != null) b.appendChild(h('small', { text: String(sub) }));
    b.addEventListener('click', onclick); mount.appendChild(b); return b;
  }
  var sm = document.getElementById('f-series');
  seriesBtns[''] = addChip(sm, '全部', total, function () { setSeries(''); });
  META.forEach(function (m) {
    var b = addChip(sm, m.label, count(function (e) { return e.s === m.id; }), function () { setSeries(m.id); });
    var badge = h('i', { hidden: '' }); b.appendChild(badge); b._badge = badge; seriesBtns[m.id] = b;
  });
  pressed(seriesBtns[''], true);
  function setSeries(id) {
    state.s = id; state.cat = '';
    Object.keys(seriesBtns).forEach(function (k) { pressed(seriesBtns[k], k === id); });
    document.getElementById('snote').textContent = id ? metaOf[id].note : '';
    buildCats(); apply();
  }
  var catBtns = {};
  function buildCats() {
    catMount.textContent = ''; catBtns = {};
    var row = document.getElementById('catrow');
    if (!state.s) { row.hidden = true; return; }
    var cats = [], seen = {};
    E.forEach(function (e) { if (e.s === state.s && !seen[e.cat]) { seen[e.cat] = 1; cats.push(e.cat); } });
    if (cats.length < 2) { row.hidden = true; return; }
    row.hidden = false;
    catBtns[''] = addChip(catMount, '全部', count(function (e) { return e.s === state.s; }), function () { setCat(''); });
    pressed(catBtns[''], true);
    cats.forEach(function (c) {
      catBtns[c] = addChip(catMount, c, count(function (e) { return e.s === state.s && e.cat === c; }), function () { setCat(c); });
    });
  }
  function setCat(c) { state.cat = c; Object.keys(catBtns).forEach(function (k) { pressed(catBtns[k], k === c); }); apply(); }
  var imgBtns = {};
  var im = document.getElementById('f-img');
  [['', '图：全部'], ['y', '只看有静帧'], ['n', '只看没图']].forEach(function (x) {
    imgBtns[x[0]] = addChip(im, x[1], null, function () { state.img = x[0]; Object.keys(imgBtns).forEach(function (k) { pressed(imgBtns[k], k === x[0]); }); apply(); });
  });
  pressed(imgBtns[''], true);

  // ---- 卡片
  var grid = document.getElementById('grid'), cards = {};
  function shotBlock(e, cb) {
    var shot = h('div', { class: 'shot' });
    if (e.img) {
      var img = h('img', { src: e.img, alt: e.id + ' ' + e.name + ' 静帧' });
      img.addEventListener('click', function () { openLb(e.id); });
      img.addEventListener('error', function () { document.getElementById('noimg').hidden = false; });
      shot.appendChild(img);
    } else {
      shot.appendChild(h('div', { class: 'ph' }, h('div', { class: 'pid', text: e.id }), h('div', { class: 'pnm', text: e.name }), h('div', { class: 'pno', text: '只有文字' })));
    }
    shot.appendChild(h('label', { class: 'pick' }, cb, h('span', { text: '选' })));
    shot.appendChild(h('span', { class: 'sid', text: metaOf[e.s].label }));
    return shot;
  }
  E.forEach(function (e) {
    var cb = h('input', { type: 'checkbox', 'aria-label': '选 ' + e.id + ' ' + e.name });
    cb.addEventListener('change', function () { setPick(e.id, cb.checked); });
    var tags = h('div', { class: 'tags' });
    (e.tags || []).forEach(function (t) { tags.appendChild(h('span', { text: t })); });
    if (e.year) tags.appendChild(h('span', { text: e.year }));
    if (e.cat) tags.appendChild(h('span', { text: e.cat }));
    var desc = e.desc || e.desc_en || e.fit || '';
    var det = h('details'); det.appendChild(h('summary', { text: '提示词、做法、参考' }));
    var filled = false;
    det.addEventListener('toggle', function () { if (det.open && !filled) { filled = true; det.appendChild(buildDetail(e)); } });
    var title = h('h3', null, h('span', { class: 'id', text: e.id }), e.name);
    if (e.en) title.appendChild(h('small', { text: e.en }));
    var body = h('div', { class: 'body' }, title);
    if (e.fit && e.desc) body.appendChild(h('p', { class: 'fit', text: (e.s === 'O' ? '风格：' : '适合：') + e.fit }));
    body.appendChild(tags);
    if (desc) body.appendChild(h('p', { class: 'desc', text: (!e.desc && e.desc_en ? '（英文原文）' : '') + desc }));
    body.appendChild(det);
    var card = h('article', { class: 'card', id: 'c-' + e.id }, shotBlock(e, cb), body);
    cards[e.id] = { el: card, cb: cb };
    grid.appendChild(card);
  });
  var emptyEl = h('div', { class: 'empty', text: '没有符合的。换个条件，或点"全部"。' });
  emptyEl.hidden = true; grid.appendChild(emptyEl);

  function buildDetail(e) {
    var box = h('div', { class: 'detail-in' });
    function sec(title, node) { box.appendChild(h('div', null, h('h4', { text: title }), node)); }
    if (e.prompt) {
      var lang = 'zh', pre = rich(h('p'), e.prompt);
      var tabs = h('div', { class: 'ptabs' }, h('h4', { text: e.s === 'Z' || e.s === 'K' ? '提示词关键词' : '风格提示词（可复用）' }));
      function show(l) { lang = l; pre.textContent = ''; rich(pre, l === 'zh' ? e.prompt : e.prompt_en); }
      if (e.prompt_en) {
        tabs.appendChild(h('button', { class: 'chip', text: '中文', onclick: function () { show('zh'); } }));
        tabs.appendChild(h('button', { class: 'chip', text: 'EN', onclick: function () { show('en'); } }));
      }
      var cp = h('button', { class: 'act', text: '复制' });
      cp.addEventListener('click', function () {
        copyText(lang === 'zh' ? e.prompt : e.prompt_en, function (ok) { cp.textContent = ok ? '已复制' : '复制失败，请手动选中'; setTimeout(function () { cp.textContent = '复制'; }, 1500); });
      });
      tabs.appendChild(cp);
      box.appendChild(h('div', null, tabs, pre));
    }
    if (e.desc && e.desc_en) sec('英文简介', h('p', { text: e.desc_en }));
    (e.extra || []).forEach(function (x) { sec(x.h, rich(h('p'), x.t)); });
    if (e.file) sec('提示词全文（点开看）', h('p', null, h('a', { href: e.file, target: '_blank', text: e.file })));
    if (!box.firstChild) box.appendChild(h('p', { text: '这一条只有名字和简介，没有更多内容。' }));
    return box;
  }

  function copyText(t, done) {
    function fallback() {
      var ta = h('textarea', { style: 'position:fixed;opacity:0' }); ta.value = t; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { done(true); }, fallback);
    else fallback();
  }

  // ---- 勾选
  function setPick(id, on) { if (on) picks.add(id); else picks.delete(id); savePicks(); sync(); if (state.only) apply(); }
  function sync() {
    E.forEach(function (e) { var c = cards[e.id], on = picks.has(e.id); c.cb.checked = on; c.el.classList.toggle('picked', on); });
    META.forEach(function (m) {
      var n = 0; picks.forEach(function (id) { if (byId[id] && byId[id].s === m.id) n++; });
      var b = seriesBtns[m.id]._badge; b.hidden = !n; b.textContent = '选 ' + n;
    });
    updateCount();
    if (lbId) lbPick.textContent = picks.has(lbId) ? '✓ 已选（点此取消）' : '选这个';
  }

  // ---- 过滤
  var visible = E.map(function (e) { return e.id; });
  var countEl = document.getElementById('count');
  function updateCount() {
    countEl.textContent = '';
    countEl.appendChild(document.createTextNode('显示 ' + visible.length + ' / ' + total + ' · 已选 '));
    countEl.appendChild(h('b', { text: String(picks.size) }));
  }
  function apply() {
    var q = state.q.trim().toLowerCase(); visible = [];
    E.forEach(function (e) {
      var ok = (!state.s || e.s === state.s) && (!state.cat || e.cat === state.cat) &&
        (!state.img || (state.img === 'y' ? !!e.img : !e.img)) && (!state.only || picks.has(e.id)) && (!q || hay[e.id].indexOf(q) !== -1);
      cards[e.id].el.hidden = !ok; if (ok) visible.push(e.id);
    });
    emptyEl.hidden = visible.length > 0; updateCount();
  }
  document.getElementById('q').addEventListener('input', function (ev) { state.q = ev.target.value; apply(); });
  var onlyBtn = document.getElementById('only');
  onlyBtn.addEventListener('click', function () { state.only = !state.only; pressed(onlyBtn, state.only); apply(); });

  // ---- 放大
  var lb = document.getElementById('lb'), lbImg = document.getElementById('lb-img'), lbCap = document.getElementById('lb-cap');
  var lbPick = document.getElementById('lb-pick'), lbId = '';
  function openLb(id) {
    var e = byId[id]; lbId = id; lbImg.src = e.img; lbImg.alt = e.name;
    lbCap.textContent = e.id + ' · ' + e.name + (e.en ? ' ' + e.en : '') + (e.fit ? ' —— ' + e.fit : '');
    lb.classList.add('on'); sync();
  }
  function stepLb(d) {
    var list = visible.filter(function (id) { return byId[id].img; }); if (!list.length) return;
    var i = list.indexOf(lbId); if (i === -1) i = 0;
    openLb(list[(i + d + list.length) % list.length]);
  }
  function closeLb() { lb.classList.remove('on'); lbId = ''; }
  document.getElementById('lb-prev').addEventListener('click', function () { stepLb(-1); });
  document.getElementById('lb-next').addEventListener('click', function () { stepLb(1); });
  document.getElementById('lb-close').addEventListener('click', closeLb);
  lbPick.addEventListener('click', function () { setPick(lbId, !picks.has(lbId)); });
  lb.addEventListener('click', function (ev) { if (ev.target === lb) closeLb(); });

  // ---- 已选清单
  var dlg = document.getElementById('dlg'), dlgText = document.getElementById('dlg-text'), dlgMsg = document.getElementById('dlg-msg');
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function listText() {
    var d = new Date(), ds = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    var lines = ['我挑的风格（' + ds + '），共 ' + picks.size + ' 个', ''];
    META.forEach(function (m) {
      var ids = E.filter(function (e) { return e.s === m.id && picks.has(e.id); });
      if (!ids.length) return;
      lines.push('【' + m.label + '】' + ids.length + ' 个：' + ids.map(function (e) { return e.id; }).join(', '));
      ids.forEach(function (e) { lines.push('  ' + e.id + ' · ' + e.name + (e.en ? ' ' + e.en : '') + (e.year ? '（' + e.year + '）' : '') + (e.fit && e.s === 'O' ? ' · ' + e.fit : '')); });
      lines.push('');
    });
    if (!picks.size) lines.push('（还没选）');
    return lines.join('\n');
  }
  function openDlg() { dlgText.value = listText(); dlgMsg.textContent = ''; dlg.classList.add('on'); dlgText.focus(); dlgText.select(); }
  function closeDlg() { dlg.classList.remove('on'); }
  document.getElementById('export').addEventListener('click', openDlg);
  document.getElementById('dlg-close').addEventListener('click', closeDlg);
  dlg.addEventListener('click', function (ev) { if (ev.target === dlg) closeDlg(); });
  document.getElementById('dlg-copy').addEventListener('click', function () {
    copyText(dlgText.value, function (ok) { dlgMsg.textContent = ok ? '已复制' : '复制失败，请在框里全选后手动复制'; });
  });
  document.getElementById('dlg-dl').addEventListener('click', function () {
    var a = h('a', { href: URL.createObjectURL(new Blob([dlgText.value], { type: 'text/plain;charset=utf-8' })), download: 'style_picks.txt' });
    document.body.appendChild(a); a.click(); document.body.removeChild(a); dlgMsg.textContent = '已下载（在浏览器的下载文件夹里）';
  });
  document.getElementById('dlg-clear').addEventListener('click', function () {
    if (!picks.size) return;
    if (confirm('清空全部 ' + picks.size + ' 个已选？')) { picks.clear(); savePicks(); sync(); apply(); dlgText.value = listText(); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { if (dlg.classList.contains('on')) closeDlg(); else if (lb.classList.contains('on')) closeLb(); }
    else if (lb.classList.contains('on') && !dlg.classList.contains('on')) { if (ev.key === 'ArrowLeft') stepLb(-1); else if (ev.key === 'ArrowRight') stepLb(1); }
  });

  sync(); apply();
})();
</script>
</body>
</html>
