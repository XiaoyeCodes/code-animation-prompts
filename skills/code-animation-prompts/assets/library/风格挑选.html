<style>

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

.row .lbl { color: var(--muted); font-size: 12px; min-width: 3em; }

input[type="search"] { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; width: min(300px, 100%); }
.spacer { flex: 1; }
.count { font-size: 13px; color: var(--muted); }

button.act { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
button.act.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 40px 0; text-align: center; }

.overlay .ctl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.dialog { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 30; align-items: center; justify-content: center; padding: 16px; }

.dialog textarea { width: 100%; min-height: 300px; resize: vertical; font: 13px/1.6 ui-monospace, Consolas, monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }

@media (max-width: 760px) { .bar { position: static; } }
@media (max-width: 400px) { main { grid-template-columns: 1fr; } }

at":"B 粒子","name":"萤火光尘","desc":"暖色光点慢慢往上飘，有远有近。","fit":"温暖、回忆、找回光","img":"风格提示词/A-G_代码样片/B2_萤火光尘.jpg","tags":["萤火","光尘","暖"],"file":"风格提示词/A-G_代码样片/B2_萤火光尘.md"},{"id":"B3","s":"AG","cat":"B 粒子","name":"粒子聚形","desc":"粒子聚成心、房子、人，再散开。","fit":"讲具体的东西：家、关系、一个人","img":"风格提示词/A-G_代码样片/B3_粒子聚形.jpg","tags":["聚成","形状","散开"],"file":"风格提示词/A-G_代码样片/B3_粒子聚形.md","prompt":"你是一位前端动效工程师。请写**一个完整的 index.html 文件**：只用原生 HTML + JavaScript + Canvas 2D，不要任何外部库、字体文件或图片。做一段\"粒子聚形\"动画：几千颗发光的小粒子聚成一个形状，停住，散开，沿弧线流向下一个形状再聚拢，循环。\n\n## 内容\n\n- 四个形状依次是：心 → 房子 → 人 → 一个汉字（{{默认：家}}）。\n- 每个形状停住时，画面下方出现一行字幕，四句依次是：{{四句，用｜分开。默认：先有一颗心｜再有一个房子｜里面住进一个人｜合起来叫家}}。\n\n## 输出要求（必须照做）\n\n1. 只输出一个 html 代码块，不要解释。代码必须完整可运行：不要用省略号，不要写\"其余同上\"\"此处略\"。\n2. canvas 固定 1920×1080；用 CSS 让它在窗口里等比缩放并居中，多出来的部分是黑边。\n3. 画面是时间 t（秒）的纯函数 `draw(t)`。不要用 `Math.random`；所有随机都用带种子的 mulberry32(2026)，并且只在启动时生成一次。不要在 draw 里累积状态（不要用\"上一帧的残影\"）。这样同一个 t 每次画出来都一模一样。\n4. 默认循环播放（requestAnimationFrame，t = 已播放的秒数）；按空格暂停/继续；网址带 `?t=3.3` 时只显示第 3.3 秒那一帧（静止）。\n\n## 常量\n\nN = 5000 颗粒子；每个形状一个周期 PER = 4.8 秒，共 4 个形状，总循环 19.2 秒；形状的缩放 SC = 1080 × 0.36；形状中心在 (960, 520)。\n\n## 形状（坐标在 [-1,1] 的方块里，y 向下）\n\n```js\nconst heart  = (x,y)=>{ y=-y*1.15+.1; x*=1.15; return Math.pow(x*x+y*y-1,3)-x*x*y*y*y<=0; };\nconst house  = (x,y)=>(Math.abs(x)<=.6&&y>=-.1&&y<=.75&&!(Math.abs(x)<.14&&y>.38))||(y<-.1&&y>-.8&&Math.abs(x)<=.8*(y+.8)/.7);\nconst person = (x,y)=>(x*x+(y+.55)*(y+.55)<=.05)||(y>=-.28&&y<=.85&&Math.abs(x)<=.25+(y+.28)*.2);\n```\n\n- 心、房子、人：在 [-1,1]² 里用带种子的随机点做\"拒绝采样\"，落在形状里的留下，凑够 N 个。\n- 汉字：用一个 400×400 的离屏 canvas 画白色粗体字（`bold 340px \"Noto Serif SC\",\"Songti SC\",\"SimSun\",serif`，水平居中，`textBaseline='middle'`，y=210）；`getImageData` 之后每隔 2 个像素取一个 alpha>128 的点，换算到 [-1,1]；用带种子的洗牌后取 N 个（不够就重复取，并加 ±0.004 的抖动）。\n- 四组目标点各自洗牌一次。第 i 颗粒子在四个形状里分别去各自的第 i 个目标点——所以看起来是\"同一批粒子在换形状\"。\n\n## 每颗粒子的固定参数（启动时生成一次）\n\n角度 `a`（0–2π）、幅度 `m`（0–1）、相位 `ph`（0–2π）、闪烁频率 `f`（0.6–1.6）、大小 `s`（0–1）、是否带光晕 `glow`（20% 为 true）。\n\n## 位置（核心，照这个算）\n\n设 k = floor(t / PER) % 4（当前形状），n = (k+1) % 4（下一个形状），q = t % PER（形状内的时间）；A = 第 k 个形状里第 i 个目标点，B = 第 n 个形状里的第 i 个目标点。\n\n- 进度 e = smoothstep(2.4, 4.2, q)。q 在 0–2.4 秒时 e=0（停住）；2.4–4.2 秒在变形；4.2–4.8 秒 e=1（落定）。\n- 控制点 C = (A+B)/2 + (cos a, sin a) × (0.35 + 0.9·m)。\n- 位置 P = (1−e)²·A + 2(1−e)e·C + e²·B（二次贝塞尔，所以粒子走弧线，先炸开再汇聚）。\n- 微动：P 再加 (cos(ph + 1.3t), sin(1.7·ph + 1.1t)) × 0.012 × (1 − sin(π·e))。\n- 屏幕坐标 = (960 + P.x × SC, 520 + P.y × SC)；整体再以画面中心 (960, 540) 为基准乘 zoom = 1 + 0.015·sin(0.33t)。\n\n## 怎么画\n\n1. **背景**：#07080C 铺满；中心一个径向渐变（半径 800）从 `rgba(40,46,66,0.30)` 到 `rgba(7,8,12,0)`；再画 220 颗固定位置的暗星点（启动时随机一次，透明度 0.15–0.4，随 t 轻微闪烁）。\n2. **粒子**：用 `globalCompositeOperation = 'lighter'` 叠加发光。颜色：心 #F08A8A，房子 #F1C070，人 #A9C6FF，汉字 #F6EBD0；变形时按 e 在\"当前形状的颜色\"和\"下一个形状的颜色\"之间线性混合。\n3. 每颗粒子的亮度 L = 0.75 + 0.25·sin(f·t + ph)；半径 r = 1.1 + 1.6·s（像素）；基础透明度 0.55·L。\n4. **拖尾**：每颗粒子画 3 次，分别在时间 t、t−0.045、t−0.09（用同一个位置函数重新算，不要保存历史）；透明度依次 ×1、×0.5、×0.25，半径依次 ×1、×0.8、×0.6。\n5. **光晕**：glow=true 的粒子再多画一个半径 ×3、透明度 0.05 的大圆。\n6. **字幕**：每个形状停住时（q 从 0.3 到 1.0 淡入，q 从 2.1 到 2.5 淡出），在 (960, 960) 居中显示该形状对应的那一句，衬线体 46px，颜色 #EDE6D6，最大透明度 0.85。\n\n## 不要\n\n爆炸的闪光、镜头光晕、彩虹色、第二种背景、实时计时器驱动的随机、在 `draw` 里保存上一帧的状态。\n\n## 写完后自己过一遍（不要输出）\n\n- 同一个 t 刷新两次，画面是否一模一样？\n- t=1.8 时看到的是不是一颗由粒子拼成的心？t=3.3 时是不是正在炸开、向房子流去？\n- 一帧画 5000×3 次粒子，会不会卡？卡的话可以把光晕只给 glow 粒子画。","extra":[]},{"id":"B4","s":"AG","cat":"B 粒子","name":"星空连线","desc":"点和点连成网，中间那颗暖的是你。","fit":"人和人的关系、联结、孤独","img":"风格提示词/A-G_代码样片/B4_星空连线.jpg","tags":["星座","连线","网"],"file":"风格提示词/A-G_代码样片/B4_星空连线.md"},{"id":"B5","s":"AG","cat":"B 粒子","name":"呼吸的圆","desc":"一团粒子跟着呼吸胀大、缩小。","fit":"安抚、慢下来、冥想","img":"风格提示词/A-G_代码样片/B5_呼吸的圆.jpg","tags":["呼吸","胀缩","慢"],"file":"风格提示词/A-G_代码样片/B5_呼吸的圆.md"},{"id":"C1","s":"AG","cat":"C 线与墨","name":"水墨晕开","desc":"墨在宣纸上一团一团晕开。","fit":"中国感、回忆、哀伤","img":"风格提示词/A-G_代码样片/C1_水墨晕开.jpg","tags":["水墨","晕开","宣纸"],"file":"风格提示词/A-G_代码样片/C1_水墨晕开.md"},{"id":"C2","s":"AG","cat":"C 线与墨","name":"一笔画","desc":"一根线慢慢画出山、太阳和一个小人。","fit":"讲一个人、一件事的轮廓","img":"风格提示词/A-G_代码样片/C2_一笔画.jpg","tags":["一笔画","线描","生长"],"file":"风格提示词/A-G_代码样片/C2_一笔画.md"},{"id":"C3","s":"AG","cat":"C 线与墨","name":"心里的等高线","desc":"像地图上的等高线，一直在起伏。","fit":"情绪起伏、心里的地形","img":"风格提示词/A-G_代码样片/C3_心里的等高线.jpg","tags":["等高线","地形","起伏"],"file":"风格提示词/A-G_代码样片/C3_心里的等高线.md"},{"id":"C4","s":"AG","cat":"C 线与墨","name":"涟漪","desc":"一滴落下，一圈圈荡开。","fit":"一句话的影响、余波","img":"风格提示词/A-G_代码样片/C4_涟漪.jpg","tags":["涟漪","水滴","扩散"],"file":"风格提示词/A-G_代码样片/C4_涟漪.md"},{"id":"D1","s":"AG","cat":"D 光与天气","name":"雨窗","desc":"玻璃上的雨滴，后面是虚化的夜灯。","fit":"等待、夜里、想念","img":"风格提示词/A-G_代码样片/D1_雨窗.jpg","tags":["雨窗","夜","虚化灯光"],"file":"风格提示词/A-G_代码样片/D1_雨窗.md"},{"id":"D2","s":"AG","cat":"D 光与天气","name":"窗光与尘","desc":"一束光从窗照进来，灰尘在光里飘。","fit":"安静、时间、老房子","img":"风格提示词/A-G_代码样片/D2_窗光与尘.jpg","tags":["窗光","灰尘","光束"],"file":"风格提示词/A-G_代码样片/D2_窗光与尘.md"},{"id":"D3","s":"AG","cat":"D 光与天气","name":"雪与火星","desc":"雪往下落，几点火星往上飘。","fit":"告别、结束、冷里的一点热","img":"风格提示词/A-G_代码样片/D3_雪与火星.jpg","tags":["雪","火星","往上飘"],"file":"风格提示词/A-G_代码样片/D3_雪与火星.md"},{"id":"D4","s":"AG","cat":"D 光与天气","name":"天亮","desc":"天从深蓝慢慢变暖，太阳升起来。","fit":"结尾、希望、重新开始","img":"风格提示词/A-G_代码样片/D4_天亮.jpg","tags":["日出","渐变","天亮"],"file":"风格提示词/A-G_代码样片/D4_天亮.md"},{"id":"E1","s":"AG","cat":"E 图形与纸","name":"极简几何","desc":"圆、方、半圆在纯色上滚、落、长出来。","fit":"把复杂的事讲清楚","img":"风格提示词/A-G_代码样片/E1_极简几何.jpg","tags":["几何","扁平","色块"],"file":"风格提示词/A-G_代码样片/E1_极简几何.md"},{"id":"E2","s":"AG","cat":"E 图形与纸","name":"剪纸层叠","desc":"一层层纸片有阴影，前快后慢地移动。","fit":"童年、故事、温柔的段落","img":"风格提示词/A-G_代码样片/E2_剪纸层叠.jpg","tags":["剪纸","纸片","层叠"],"file":"风格提示词/A-G_代码样片/E2_剪纸层叠.md"},{"id":"E3","s":"AG","cat":"E 图形与纸","name":"字符画","desc":"画面全是字符拼成的，像老电脑屏幕。","fit":"科技、冷、记忆碎片","img":"风格提示词/A-G_代码样片/E3_字符画.jpg","tags":["字符画","终端","像素"],"file":"风格提示词/A-G_代码样片/E3_字符画.md"},{"id":"F1","s":"AG","cat":"F 讲解","name":"图表生长","desc":"柱子一根根长出来，数字跳动，再连成线。","fit":"讲数据、研究结论","img":"风格提示词/A-G_代码样片/F1_图表生长.jpg","tags":["图表","数字","生长"],"file":"风格提示词/A-G_代码样片/F1_图表生长.md"},{"id":"F2","s":"AG","cat":"F 讲解","name":"关系图","desc":"人和人之间的箭头一条条画出来，箭头上写着那句话。","fit":"家里的关系、因果","img":"风格提示词/A-G_代码样片/F2_关系图.jpg","tags":["节点","箭头","关系图"],"file":"风格提示词/A-G_代码样片/F2_关系图.md"},{"id":"F3","s":"AG","cat":"F 讲解","name":"分屏对比","desc":"左边以前，右边现在，中间一条线。","fit":"以前和现在、父母和孩子","img":"风格提示词/A-G_代码样片/F3_分屏对比.jpg","tags":["分屏","对比","左右"],"file":"风格提示词/A-G_代码样片/F3_分屏对比.md"},{"id":"G1","s":"AG","cat":"G 质感","name":"老胶片","desc":"颗粒、闪烁、划痕、边上的漏光。","fit":"回忆、旧时光、整片的统一质感","img":"风格提示词/A-G_代码样片/G1_老胶片.jpg","tags":["胶片","颗粒","漏光"],"file":"风格提示词/A-G_代码样片/G1_老胶片.md"},{"id":"G2","s":"AG","cat":"G 质感","name":"信号故障","desc":"画面错位、颜色分离，突然闪一下。","fit":"崩溃、混乱、话被打断","img":"风格提示词/A-G_代码样片/G2_信号故障.jpg","tags":["故障","错位","干扰"],"file":"风格提示词/A-G_代码样片/G2_信号故障.md"},{"id":"M1","s":"M","cat":"讲解类","name":"白板手绘讲解","desc":"白底，一只手（或一支笔）一边讲一边画，线条先画出来再上色。","fit":"讲概念、讲原理的段落。比如\"大语言模型是大脑，Harness 是手脚\"。","prompt":"你是一位前端动效工程师。请写**一个完整的 index.html 文件**：只用原生 HTML + JavaScript + Canvas，不要任何外部库、字体文件或图片。做一段白板手绘讲解动画。\n\n## 讲什么\n\n- 主题：{{主题，例：大语言模型是大脑，Harness 是手脚}}\n- 总时长：{{秒，默认 20}}\n- 画面里的字：{{3–6 个短词。例：标题\"AI 是怎么干活的\"；左边\"大语言模型\"，副标\"会想、会说\"；右边\"Harness\"，副标\"手和脚：真去做事\"；箭头上\"指令\"}}\n\n## 输出要求（必须照做）\n\n1. 只输出一个 html 代码块，不要解释。代码必须完整可运行：不要用省略号，不要写\"其余同上\"\"此处略\"。\n2. canvas 固定 1920×1080；用 CSS 让它在窗口里等比缩放并居中，窗口多出来的部分是黑边。\n3. 所有画面由函数 `draw(t)` 决定，`t` 是秒。不要用 `Math.random`；需要随机就用带种子的 mulberry32(seed)，这样同一个 `t` 每次画出来都一模一样。\n4. 默认循环播放；按空格暂停/继续；网址带 `?t=8.5` 时只显示第 8.5 秒那一帧（静止），方便截图。\n\n## 画面怎么画\n\n- 底色 #FBFAF7；再叠几条很淡的灰色擦痕（宽 40–90px，透明度 0.03–0.06）。\n- 线条是黑色马克笔 #1B1B1B，宽 10px，`lineCap` 和 `lineJoin` 都用 round。每一笔画两遍：第一遍透明度 0.93；第二遍宽 5.5px、透明度 0.55、位置偏移 ±1.5px。\n- 只有黑和**一个**强调色 #E5432B（用在标题下划线、箭头、副标题和笔帽）。不要第三种颜色。\n- 字体：`font-family: KaiTi, STKaiti, \"Kaiti SC\", \"Microsoft YaHei\", sans-serif`，粗体；标题 110px，标签 90px，副标题 56px。字用 `strokeText` 加 `fillText`，描边宽约字号的 3.5%。\n- 手绘感：每个点加 ±2.5px 的抖动，抖动用带种子的随机按\"点的序号\"取，不要每帧重新随机。\n- 要画的东西：\n  - 云朵形的\"脑\"：极坐标 r = R·(1 + 0.11·|sin(3.5θ)|)，里面画几条波浪线；\n  - 一个火柴人：圆头、一根线的身体、两条手臂（末端画一个圆当手）、两条腿；\n  - 一条弯曲的强调色箭头，箭头头部要顺着线尾的方向；\n  - 一支马克笔：黑杆、红帽，长约 330px，斜 55°，笔尖始终停在\"当前正在画的那一笔\"的末端；全部画完后滑出画面。\n\n## 动起来的规则\n\n- 每一笔是一个点列表。用 progress（0→1）决定画到第几个点，progress 用 ease-in-out；一笔 0.4–1.2 秒。\n- 顺序：标题 → 标题下划线（红）→ 左边的脑 → 右边的小人 → 红色箭头 → \"指令\"两个字 → 两处标签文字。同一时间只画一笔。\n- 全部画完后静止 1.5 秒，再循环。\n\n## 不要\n\n渐变、阴影、发光、3D、粒子、复杂配色、满屏文字、镜头晃动。\n\n## 写完后自己过一遍（不要输出）\n\n- `t=0` 时是不是几乎空白的白板？\n- `t=总时长−0.1` 时所有元素都在吗？\n- 文字有没有被线或笔压住？\n- 同一个 `t` 刷新两次，画面是不是一模一样？","extra":[],"img":"风格提示词/M_动态风格/M1_白板手绘讲解.jpg","file":"风格提示词/M_动态风格/M1_白板手绘讲解.md"},{"id":"M2","s":"M","cat":"讲解类","name":"纸感手写笔记","desc":"米白纸面，马克笔批注一笔一笔画出来，手写字，大号粗体标题字，偶尔整个画面\"啪\"一下切到深色。","fit":"列要点、讲方法、\"你可以这样做\"的段落。","prompt":"纸感手写笔记风格。米白纸面背景，配色只用纸色、墨黑和两个强调色，深色模式用炭灰。马克笔批注一笔一笔画出来，手写字用描边动画（stroke-dashoffset）写出来，标题用很大的粗体字。每 1.5 到 2 秒出一个新点子，每次转场只做一个主要动作。动作要有真实的缓动、挤压拉伸和跟随。不要出现播放条、时间码这些界面元素。","extra":[{"h":"参考","t":"[纸感产品发布片](https://prompt-motion.com/ik-builds-b8bdcf)（用 HyperFrames + GSAP 做的，提示词写得特别细）"}],"img":"","file":"风格提示词/M_动态风格/M2_纸感手写笔记.md"},{"id":"M18","s":"M","cat":"讲解类","name":"数学/科学讲解（3Blue1Brown 那种）","desc":"深色背景，公式和图形一点点变形、推导，讲得很清楚。","fit":"感知科普线，讲原理、讲数据。","prompt":"用 Manim 做一个讲 [概念] 的视频，要通俗易懂，有例子，能引人思考。配音用 edge-tts，中文。","extra":[{"h":"参考","t":"[用 Manim 讲导数](https://prompt-motion.com/linearuncle-5d2bae)（原提示词就是中文的）"},{"h":"配合 skill","t":"S4 Manim skill。"}],"img":"","file":"风格提示词/M_动态风格/M18_数学·科学讲解（3Blue1Brown 那种）.md"},{"id":"M19","s":"M","cat":"讲解类","name":"零基础科普","desc":"不限画风，重点是讲法：从生活里的例子讲起，一步步讲到专业词。","fit":"感知科普线的整期，或者感受线里\"先说清楚 X 是什么\"那一段。","prompt":"做一个讲 [主题] 的视频，要深入浅出，让一个完全没有相关基础的人也能看懂。先用一个生活里的例子开头，再讲专业的说法。要有声音，中文讲。需要什么工具可以自己装，可以上网查资料。","extra":[{"h":"参考","t":"[给零基础讲 Git](https://prompt-motion.com/yunn260414-60d996)（中文原提示词）、[把一篇文章做成教学视频](https://prompt-motion.com/henkvaness-0e06af)"}],"img":"","file":"风格提示词/M_动态风格/M19_零基础科普.md"},{"id":"M20","s":"M","cat":"讲解类","name":"时间线/历史","desc":"一条时间轴往前走，每个节点弹出一件事。","fit":"\"这三个月我是怎么走过来的\"、\"AI 是怎么发展到今天的\"。","prompt":"做一段时间线动画，讲 [从什么时候到什么时候] 的几个关键节点：[节点1、节点2、节点3]。时间轴从左往右推进，每到一个节点，画面放大讲这一件事，再缩回来继续走。","extra":[{"h":"参考","t":"[AI 发展史](https://prompt-motion.com/kloss-xyz-fe0c31)、[像素风的大模型历史](https://prompt-motion.com/pluginplay-3d4006)、[摩洛哥政治史](https://prompt-motion.com/triglyceee-bd5b08)"}],"img":"","file":"风格提示词/M_动态风格/M20_时间线·历史.md"},{"id":"M21","s":"M","cat":"讲解类","name":"原理拆解（它是怎么工作的）","desc":"把一个东西拆开，一步一步演示里面怎么运转。","fit":"抓公告那个例子（定时、抓取、筛选、总结、提醒），讲\"它到底是怎么做到的\"。","prompt":"做一段动态图形，讲清楚 [东西] 是怎么工作的。把过程拆成 [3 到 5] 步，每一步一个画面，前一步的结果变成下一步的开头，最后合起来看全貌。","extra":[{"h":"参考","t":"[讲橄榄球转播的黄线是怎么来的](https://prompt-motion.com/jayscambler-3f8889)、[讲限流算法](https://prompt-motion.com/parkerrex-1a54fe)、[AI 数据中心里面在干什么](https://prompt-motion.com/sayan-shanky-f850d8)"}],"img":"","file":"风格提示词/M_动态风格/M21_原理拆解（它是怎么工作的）.md"},{"id":"M22","s":"M","cat":"讲解类","name":"配方式步骤","desc":"像做鸡尾酒教程，从空杯子开始，每加一样东西就标出名字和分量，最后成品。","fit":"\"你只要这几步就能做出一个小工具\"这种教学段落。","prompt":"用讲解视频的风格，从 [起点] 一步步做到 [成品]。每加入一样东西，画面上同时标出它叫什么、加了多少。[N] 秒。","extra":[{"h":"参考","t":"[Negroni 鸡尾酒](https://prompt-motion.com/ror-fly-9950f1)、[White Russian](https://prompt-motion.com/sarut0bisasuke-cefa43)"}],"img":"","file":"风格提示词/M_动态风格/M22_配方式步骤.md"},{"id":"M23","s":"M","cat":"讲解类","name":"五幕讲解（万能讲解模板）","desc":"五个画面讲完一件事。","fit":"一期科普的骨架，或者感受线里讲一个工具的段落。","prompt":"你是一个资深动态设计师。用一个 HTML 页面做一段 [30] 秒的讲解动画，分 5 幕：1）观众遇到的问题；2）[东西] 是什么；3）怎么用，3 步；4）一个真实的例子；5）结尾卡片写 [频道名]。字要大要粗，转场要顺，用我们的配色。","extra":[{"h":"参考","t":"[商业讲解动画](https://prompt-motion.com/alex-prompter-1ea044)"}],"img":"","file":"风格提示词/M_动态风格/M23_五幕讲解（万能讲解模板）.md"},{"id":"M24","s":"M","cat":"讲解类","name":"四段式发布片","desc":"大环境、痛点、解决办法、好处，四段，最后 logo 动画收尾。","fit":"介绍一个新工具、一个 skill 的段落。","prompt":"你是一个资深动态设计师。做一段 [30] 秒的视频，4 到 5 个场景：为什么现在这件事重要、大家现在的麻烦、[工具] 怎么解决、用了以后的好处。文字逐词出现，用弹簧物理做动作，元素踩着节拍进场，不要突然冒出来。每出现一个元素配一个很轻的音效，其他时候安静。最后用 logo 动画加一句话收尾。做完自己渲染出来逐帧检查，有重叠、被裁掉、太赶的地方改好再给我。","extra":[{"h":"参考","t":"[SaaS 发布片](https://prompt-motion.com/aschapmann-131210)"}],"img":"","file":"风格提示词/M_动态风格/M24_四段式发布片.md"},{"id":"M8","s":"M","cat":"情绪和氛围类（感受线最常用）","name":"口播 + 逐字字幕","desc":"白底，一种字体，字幕跟着说话一个词一个词打出来，配真实的图片，镜头慢慢漂。","fit":"全片的主线。有人讲解、口播的片子，字幕必须对上。","prompt":"以口播录音为主线。字幕跟着说话逐词出现，时间用 Whisper 从录音里对出来，不按文案逐字对。白底，只用一种字体，黑字。镜头每段只做一次慢慢的漂移。图片在音乐的 16 分音符上换。屏幕上的字不要句号。不要给字加选中框一样的底色。音乐在关键那句话上起来，人声出来的时候音乐自动压低。响度统一到 -14 LUFS。","extra":[{"h":"参考","t":"[AI 图像模型发布片](https://prompt-motion.com/rossaxbt-3085b7)（ElevenLabs 配音 + Whisper 对字幕时间）、[把口播素材剪成有字幕有图形有音乐的片子](https://prompt-motion.com/sab8a-364a5a)"}],"img":"","file":"风格提示词/M_动态风格/M8_口播 + 逐字字幕.md"},{"id":"M9","s":"M","cat":"情绪和氛围类（感受线最常用）","name":"情绪弧线：混乱、掌控、清晰","desc":"全片一条弧线。开头画面乱，中间慢慢理顺，最后干干净净落在一句话上。转场靠同一个形状变过去，不硬切。","fit":"整期的结构。","prompt":"全片是一条连续的弧线：从混乱，到掌控，到清晰，最后落到 [结尾那句话]。场景之间用同一个物体、同一个形状变过去，不要硬切，除非有特别的理由。动作要有高级的缓动和错开的层次，有一点景深和光感。不要满屏模糊、不要弹来弹去的界面、不要粒子。每一个重要的画面单独截出来都能当海报用。","extra":[{"h":"参考","t":"[记账软件广告片](https://prompt-motion.com/daniel-haida-8691d4)（提示词里写着\"不是普通的软件讲解\"）"}],"img":"","file":"风格提示词/M_动态风格/M9_情绪弧线：混乱、掌控、清晰.md"},{"id":"M10","s":"M","cat":"情绪和氛围类（感受线最常用）","name":"把一个抽象概念、一种情绪做成画面","desc":"没有具体的人和物，用形状、文字、颜色的变化表现一种感觉。","fit":"讲恐惧、焦虑、不安、\"想太多\"这种情绪的段落。","prompt":"做一段 [15] 秒的动态图形，表现\"[情绪/概念]\"这个感觉，比如\"焦虑\"、\"对未知的恐惧\"。不要具体的人和物，用形状、文字和颜色的变化来表现。从 [一种状态] 慢慢变到 [另一种状态]。","extra":[{"h":"参考","t":"[主题是\"想太多\"](https://prompt-motion.com/gizakdag-cf4ae6)"}],"img":"","file":"风格提示词/M_动态风格/M10_把一个抽象概念、一种情绪做成画面.md"},{"id":"M11","s":"M","cat":"情绪和氛围类（感受线最常用）","name":"人生循环","desc":"同一个人从小到老，最后无缝接回开头。","fit":"\"学无止境\"、\"一直在学\"这种讲长时间的段落。","prompt":"做一段 [20] 秒的动画，同一个人从 [阶段1] 到 [阶段2] 到 [阶段3]……最后无缝接回开头，可以循环播放。","extra":[{"h":"参考","t":"[人生循环](https://prompt-motion.com/loicrambo-ad6830)"}],"img":"","file":"风格提示词/M_动态风格/M11_人生循环.md"},{"id":"M12","s":"M","cat":"情绪和氛围类（感受线最常用）","name":"剪纸皮影","desc":"纸剪的剪影在光后面演戏，配轻轻的声音。","fit":"讲\"家\"、讲回忆、讲温暖的段落。竖屏很合适。","prompt":"用纯 JavaScript 做一段 [30 到 60] 秒的竖屏 9:16 动画，剪纸皮影戏的风格。配轻柔合适的声音，声音也用代码做。主题是：[一个问题，比如\"是什么让一个地方变成家\"]。","extra":[{"h":"参考","t":"[剪纸皮影讲\"家\"](https://prompt-motion.com/x4b47x-9cc84f)"}],"img":"","file":"风格提示词/M_动态风格/M12_剪纸皮影.md"},{"id":"M13","s":"M","cat":"情绪和氛围类（感受线最常用）","name":"手绘定格，第一人称","desc":"手绘的、一帧一帧有点抖的定格动画，画面里的东西自己开口说话。","fit":"让一个东西替你说话。比如让\"那个抓公告的小工具\"自己介绍自己。","prompt":"做一段手绘定格动画。你就是 [东西]，用第一人称跟观众介绍你自己。","extra":[{"h":"参考","t":"[手绘定格讲产品](https://prompt-motion.com/nikolajankovic-ce4ff4)"}],"img":"","file":"风格提示词/M_动态风格/M13_手绘定格，第一人称.md"},{"id":"M27","s":"M","cat":"情绪和氛围类（感受线最常用）","name":"无对白短片，声音讲一半","desc":"没有台词，全靠画面和声音讲故事。","fit":"片头、片尾，或者两段之间的过渡小片段。","prompt":"做一个 [45] 秒的无对白短片，声音要讲出一半的故事。故事你来编，主题是 [主题]。","extra":[{"h":"参考","t":"[守灯塔的人](https://prompt-motion.com/kamstudiolabs-0b0824)"}],"img":"","file":"风格提示词/M_动态风格/M27_无对白短片，声音讲一半.md"},{"id":"M28","s":"M","cat":"情绪和氛围类（感受线最常用）","name":"对称暖色的电影感空镜","desc":"画面左右对称，粉嫩暖色，像一个精致的小舞台。比如火车窗外四季流过，桌上一杯咖啡。","fit":"讲时间流逝、讲停下来想一想的段落。比如\"停播这段时间\"。","prompt":"火车窗外四季流过，车厢很温暖，桌上放着一杯咖啡。画面左右对称，粉嫩暖色，像精致的舞台布景，镜头很稳。","extra":[{"h":"参考","t":"[窗外四季](https://prompt-motion.com/itsolelehmann-e47532)（原提示词点名了一部电影的风格，我改成了直接描述长相）"}],"img":"","file":"风格提示词/M_动态风格/M28_对称暖色的电影感空镜.md"},{"id":"M29","s":"M","cat":"情绪和氛围类（感受线最常用）","name":"日落天空的 3D 空镜加一句话","desc":"3D 场景，日落、紫色的云、海面反光，镜头慢慢飞，画面上写一句短话。","fit":"情绪最高的那一句话，比如\"现在不就是最好的时候吗\"。","prompt":"用网页 3D 做一个日落的海面，紫色积云、海面反光，镜头像动画电影那样慢慢飞过去。画面上写一句：[一句话]。","extra":[{"h":"参考","t":"[日落空战](https://prompt-motion.com/nft-chen-5f8bb0)（中文原提示词）"}],"img":"","file":"风格提示词/M_动态风格/M29_日落天空的 3D 空镜加一句话.md"},{"id":"M30","s":"M","cat":"情绪和氛围类（感受线最常用）","name":"东方意境","desc":"古典诗词里的画面，比如月夜、江水、楼阁，可以配可交互的网页。","fit":"讲心境、讲文化的段落，也适合做片头。","prompt":"根据你对我的了解，选一个我可能喜欢的东方古典意境（比如月夜、江水、楼阁），做一个 [30] 秒的视频，再做一个可以交互的网页版。","extra":[{"h":"参考","t":"[滕王阁月夜江景](https://prompt-motion.com/demitiyageekzen-7770ad)（中文原提示词）"}],"img":"","file":"风格提示词/M_动态风格/M30_东方意境.md"},{"id":"M31","s":"M","cat":"情绪和氛围类（感受线最常用）","name":"粘土定格 MV","desc":"粘土小人一帧一帧动，手作感很强。","fit":"轻松、好玩的段落；你自己的歌也可以做成这种 MV。","prompt":"做一个 [60] 秒的粘土定格动画风格的音乐视频，粘土小人有手指印和手作质感，动作一顿一顿的。顺便写一首适合这个画面的原创歌。","extra":[{"h":"参考","t":"[粘土风 MV](https://prompt-motion.com/davidshulmanfl-371638)"}],"img":"","file":"风格提示词/M_动态风格/M31_粘土定格 MV.md"},{"id":"M3","s":"M","cat":"文字和金句类","name":"文字建筑（口播金句专用）","desc":"只用文字。每个词有一个\"结构上的角色\"：有的是梁，有的是柱子，有的是地板。前面的词搭起来，最后一句话\"站\"在前面搭好的东西上。","fit":"结尾金句\"学习，相信自己\"。全片最值得做的一段。","prompt":"做一段 [20] 秒、只用文字的口播动画。台词按顺序是：[第1句]、[第2句]……每个关键词有一个结构上的角色，比如\"学习\"是地基，\"相信\"是柱子，\"自己\"是站在上面的人。文字用真实的字形轮廓搭出来，每一句都改变画面的结构。最后一句必须\"站\"在前面那些词搭好的东西上。配色：深色背景、纸色字、一个强调色。不要麦克风、人群、旗子这类俗套画面，不要素材视频。做完挑 8 帧检查，读起来顺序对，最后的平台确实是前面的元素搭起来的。","extra":[{"h":"参考","t":"[把一段话搭成建筑](https://prompt-motion.com/gdgtify-287ddf)"}],"img":"","file":"风格提示词/M_动态风格/M3_文字建筑（口播金句专用）.md"},{"id":"M25","s":"M","cat":"文字和金句类","name":"歌词卡点","desc":"歌词跟着人声和节拍一个字一个字跳出来。","fit":"你自己的歌，或者片子里有一段唱的部分。","prompt":"根据附上的歌做一个歌词动态视频，歌词和动画要和人声、节拍完全对上。","extra":[{"h":"参考","t":"[歌词卡点](https://prompt-motion.com/samaote-5e2fc2)"}],"img":"","file":"风格提示词/M_动态风格/M25_歌词卡点.md"},{"id":"M36","s":"M","cat":"文字和金句类","name":"破框","desc":"一张海报里的东西冲出了海报的边框。","fit":"\"跳出原来的想法\"、\"不再觉得跟我没关系\"这种转折。","prompt":"做一段动态设计：一张海报里的 [东西] 冲出海报自己的边框。","extra":[{"h":"参考","t":"[海报破框](https://prompt-motion.com/pankajkumar-dev-0bee87)"}],"img":"","file":"风格提示词/M_动态风格/M36_破框.md"},{"id":"M4","s":"M","cat":"结构和镜头类（用来把不同风格串起来）","name":"一个元素串全片","desc":"一个小东西（一个橙色圆点、一个白球）贯穿所有场景：它先是开关，再变成字母上的点，再变成曲线，再变成一个图形，最后回到结尾。","fit":"混搭风格时的\"线\"。比如可以用一个小圆点代表\"公告\"、代表\"想法\"，从头跟到尾。","prompt":"一个 [颜色] 小圆点串起每一个场景：[场景1里它是什么]，然后变成 [场景2里的什么]……最后回到结尾卡片。圆点不能瞬移，只能连续地动过去。动作干脆利落，弹簧回弹很小，没有空档。不用素材视频、渐变、发光、粒子爆炸、随机转场。最后一帧和第一帧一样，可以循环。","extra":[{"h":"参考","t":"[橙色圆点](https://prompt-motion.com/ultimaxbt-bbebf5)、[白色小球](https://prompt-motion.com/rossaxbt-94583b)"}],"img":"","file":"风格提示词/M_动态风格/M4_一个元素串全片.md"},{"id":"M5","s":"M","cat":"结构和镜头类（用来把不同风格串起来）","name":"一镜到底","desc":"从头到尾不切镜头，每个场景都是从上一个场景里\"长\"出来的。","fit":"讲变化的段落，比如\"以前要自己推，现在坐进去它自己走\"，一个画面变到另一个画面。","prompt":"一镜到底。每个场景都从上一个场景里变出来：文字从一条线里升起来，按钮展开成页面，用一种颜色铺满画面切到下一段。不要淡入淡出、不要模糊、不要硬切。每个场景镜头只做一次缓动。","extra":[{"h":"参考","t":"[照片打印 App 发布片](https://prompt-motion.com/twoclipping-221cab)、[网页 3D 飞越](https://prompt-motion.com/twoclipping-d89be5)、[外卖 App 发布片](https://prompt-motion.com/ultimaxbt-2ddf1e)"}],"img":"","file":"风格提示词/M_动态风格/M5_一镜到底.md"},{"id":"M33","s":"M","cat":"结构和镜头类（用来把不同风格串起来）","name":"从一个点拉远到宇宙","desc":"黑屏上一个点，慢慢展开成画面，再一直拉远，整个桌面变成太空里的一个点，再推进到另一个画面。","fit":"讲尺度、讲\"从一个小工具到一个系统\"。","prompt":"从黑屏上的一个点开始，展开成 [画面]，镜头在好几个尺度上推拉，一直拉远到整个画面像太空里的一个点，再推进到 [另一个画面]，最后落到 [一句话]。","extra":[{"h":"参考","t":"[交易终端](https://prompt-motion.com/dale-vaz-cc612a)"}],"img":"","file":"风格提示词/M_动态风格/M33_从一个点拉远到宇宙.md"},{"id":"M38","s":"M","cat":"结构和镜头类（用来把不同风格串起来）","name":"一个形状变到底","desc":"同一个形状不停变：按钮、加载圈、播放器、滑块、开关……每次变都是鼠标真的点了一下。","fit":"一口气列很多例子的段落，比如\"整理表格、写周报、批量改文件、做自媒体\"。","prompt":"一个形状从头到尾不切，依次变成 [例子1、例子2、例子3……]，变的是大小、圆角和颜色。每次变化都由鼠标真的点击或拖动触发。到处用弹簧，最多一点点回弹。镜头跟着放大，让每个状态填满画面。最后一帧和第一帧一样。","extra":[{"h":"参考","t":"[一个形状变遍界面](https://prompt-motion.com/twoclipping-5cba86)"}],"img":"","file":"风格提示词/M_动态风格/M38_一个形状变到底.md"},{"id":"M37","s":"M","cat":"结构和镜头类（用来把不同风格串起来）","name":"Logo 慢慢拼出来（片头片尾）","desc":"碎片慢慢聚拢，拼成 logo。","fit":"每期的片头或片尾，做一次以后反复用。","prompt":"做一段慢慢揭示的转场：碎片一点点聚拢，最后拼出你的 logo。","extra":[{"h":"参考","t":"[Logo 揭示](https://prompt-motion.com/tdinh-me-815acb)"}],"img":"","file":"风格提示词/M_动态风格/M37_Logo 慢慢拼出来（片头片尾）.md"},{"id":"M6","s":"M","cat":"节奏和快剪类","name":"苹果发布会风","desc":"柔和、白、亮蓝、玻璃质感，镜头从不停在静止画面上切。","fit":"展示工具、展示界面的段落。","prompt":"苹果发布会的感觉：柔和、白、亮蓝、玻璃质感。镜头从不在静止画面上切，每个镜头进来时已经在动，离开时加速或者带运动模糊。字体用 Inter。不要出现紫色、品红和橙色。","extra":[{"h":"参考","t":"[发布片对比](https://prompt-motion.com/notdwd-c2037d)、[Apple 风 30 秒](https://prompt-motion.com/gautam-mer1-2ae354)"}],"img":"","file":"风格提示词/M_动态风格/M6_苹果发布会风.md"},{"id":"M7","s":"M","cat":"节奏和快剪类","name":"极简卡点","desc":"一个镜头只讲一件事，大量留白，只用一个强调色，每一刀都在重拍上。","fit":"节奏快的段落，比如\"你每天要整理的表格、你每周要写的周报……\"。","prompt":"高级极简。一个镜头只讲一件事，大量留白，只用一个强调色，字距收紧的无衬线字体，文字用遮罩显出来，镜头稳。每一刀都切在重拍上，每个界面动作踩在拍子上。屏幕上的字不要句号。不要冲击波、粒子、RGB 分离、抖动、光晕、霓虹、闪烁、弹来弹去的缓动。只用可以商用的音乐和音效。","extra":[{"h":"参考","t":"[UGC 广告生成器](https://prompt-motion.com/twoclipping-6dd14e)（这条提示词会先反问你要哪些素材，很值得学）"}],"img":"","file":"风格提示词/M_动态风格/M7_极简卡点.md"},{"id":"M32","s":"M","cat":"节奏和快剪类","name":"竖屏快节奏 POV","desc":"竖屏，节奏很快、很碎，第一人称视角，动作和音效都很满。","fit":"竖屏版的开头 3 秒，抓住人。","prompt":"竖屏 9:16，快节奏碎剪，第一人称视角，讲 [主题]，动作和音效都要做得很好，加一点你自己的性格。","extra":[{"h":"参考","t":"[AI 视角的快剪](https://prompt-motion.com/kloss-xyz-15182a)"}],"img":"","file":"风格提示词/M_动态风格/M32_竖屏快节奏 POV.md"},{"id":"M34","s":"M","cat":"节奏和快剪类","name":"新闻快讯盘点","desc":"像新闻节目一样，一条一条过，每条点出看点。","fit":"以后做\"这周 AI 圈有什么新东西\"这种盘点。","prompt":"做一个约 60 秒、好看好懂的动态图形，像新闻快讯那样介绍 [时间段] 里 [领域] 的新东西，从普通用户的角度说清楚每一条有意思在哪。","extra":[{"h":"参考","t":"[Steam 新游盘点](https://prompt-motion.com/gigabit-million-16b3a0)（日文原提示词）"}],"img":"","file":"风格提示词/M_动态风格/M34_新闻快讯盘点.md"},{"id":"M14","s":"M","cat":"其他特别的风格","name":"","img":"","file":"风格提示词/M_动态风格/M14_.md"},{"id":"M15","s":"M","cat":"其他特别的风格","name":"","img":"","file":"风格提示词/M_动态风格/M15_.md"},{"id":"M16","s":"M","cat":"其他特别的风格","name":"","img":"","file":"风格提示词/M_动态风格/M16_.md"},{"id":"M17","s":"M","cat":"其他特别的风格","name":"","img":"","file":"风格提示词/M_动态风格/M17_.md"},{"id":"M26","s":"M","cat":"其他特别的风格","name":"","img":"","file":"风格提示词/M_动态风格/M26_.md"},{"id":"M35","s":"M","cat":"其他特别的风格","name":"","img":"","file":"风格提示词/M_动态风格/M35_.md"},{"id":"M39","s":"M","cat":"其他特别的风格","name":"","img":"","file":"风格提示词/M_动态风格/M39_.md"},{"id":"M40","s":"M","cat":"其他特别的风格","name":"","img":"","file":"风格提示词/M_动态风格/M40_.md"},{"id":"K1","s":"K","cat":"适合做\"我\"的","name":"扁平矢量","desc":"线条粗细一致，平涂没有阴影，颜色干净明亮","prompt":"扁平矢量插画，平涂，统一线宽，无阴影 / flat vector, consistent line weight, no shading","img":"风格提示词/K_卡通画风/K1_扁平矢量.jpg","file":"风格提示词/K_卡通画风/K1_扁平矢量.md"},{"id":"K2","s":"K","cat":"适合做\"我\"的","name":"Q 版","desc":"大头小身子，短手短脚，大眼睛，颜色软","prompt":"Q 版，大头小身，短四肢，大眼睛，柔和配色 / chibi, big head small body, pastel","img":"风格提示词/K_卡通画风/K2_Q 版.jpg","file":"风格提示词/K_卡通画风/K2_Q 版.md"},{"id":"K3","s":"K","cat":"适合做\"我\"的","name":"卡哇伊","desc":"圆滚滚，豆豆眼，小嘴巴，粉嫩色","prompt":"圆润造型，豆豆眼，小嘴，粉彩 / kawaii, rounded, dot eyes, pastel","img":"风格提示词/K_卡通画风/K3_卡哇伊.jpg","file":"风格提示词/K_卡通画风/K3_卡哇伊.md"},{"id":"K4","s":"K","cat":"适合做\"我\"的","name":"极简线条小人","desc":"几根线就是一个人，背景空","prompt":"极简线条，单色，留白 / minimalist line, monochrome","img":"","file":"风格提示词/K_卡通画风/K4_极简线条小 5","s":"K","cat":"画面风格","name":"旧学院风","desc":"泛黄、棕褐、老书的感觉","fit":"讲历史","img":"","file":"风格提示词/K_卡通画风/K35_旧学院风.md"},{"id":"K36","s":"K","cat":"画面风格","name":"丝网印刷","desc":"套色、平涂、有点错位","fit":"有设计感的海报画面","img":"","file":"风格提示词/K_卡通画风/K36_丝网印刷.md"},{"id":"K37","s":"K","cat":"画面风格","name":"哥特","desc":"细长、尖、黑紫暗红","fit":"讲恐惧、讲黑暗面","img":"","file":"风格提示词/K_卡通画风/K37_哥特.md"},{"id":"K38","s":"K","cat":"画面风格","name":"情景喜剧","desc":"像《辛普森一家》，平涂，动作少","fit":"生活小场景","img":"","file":"风格提示词/K_卡通画风/K38_情景喜剧.md"},{"id":"Z1","s":"Z","cat":"中国风","name":"水墨","desc":"水墨晕染，留白，竹林 / ink wash, negative space","img":"","file":"风格提示词/Z_中国风/Z1_水墨.md"},{"id":"Z2","s":"Z","cat":"中国风","name":"工笔","desc":"细腻笔触，色彩鲜艳，牡丹 / gongbi, fine brushwork","img":"","file":"风格提示词/Z_中国风/Z2_工笔.md"},{"id":"Z3","s":"Z","cat":"中国风","name":"写意","desc":"大笔挥洒，意到笔不到 / xieyi, expressive brush","img":"","file":"风格提示词/Z_中国风/Z3_写意.md"},{"id":"Z4","s":"Z","cat":"中国风","name":"山水","desc":"壮丽山景，流水，古亭 / shan shui, mountains, pavilions","img":"","file":"风格提示词/Z_中国风/Z4_山水.md"},{"id":"Z5","s":"Z","cat":"中国风","name":"剪纸","desc":"红纸镂空，民间纹样 / Chinese paper cutting","img":"风格提示词/Z_中国风/Z5_剪纸.jpg","file":"风格提示词/Z_中国风/Z5_剪纸.md","prompt":"你是一位前端动效工程师。请写**一个完整的 index.html 文件**：只用原生 HTML + JavaScript + Canvas，不要任何外部库、字体文件或图片。做一段\"中国剪纸\"风格的动画：红纸对折剪出来的圆形镂空窗花，一层层叠在窗户纸上，有投影。\n\n## 内容\n\n- 主题：{{主题，例：新人的片头}}\n- 总时长：{{秒，默认 12}}\n- 中心要镂出的字：{{默认\"囍\"}}\n\n## 输出要求（必须照做）\n\n1. 只输出一个 html 代码块，不要解释。代码必须完整可运行：不要用省略号，不要写\"其余同上\"\"此处略\"。\n2. canvas 固定 1920×1080，用 CSS 等比缩放居中，多出来的部分是黑边。\n3. 所有画面由函数 `draw(t)` 决定（`t` 是秒）。不要用 `Math.random`；需要随机就用带种子的 mulberry32(seed)，同一个 `t` 每次画出来都一样。\n4. 默认循环播放；空格暂停/继续；网址带 `?t=5` 时只显示第 5 秒那一帧。\n\n## 颜色\n\n窗户纸 #F1E8D4；主红 #C8102E；深红 #8F0B22。除这三色外不要别的颜色，不要金色、渐变、高光。\n\n## 怎么画（照这个步骤）\n\n1. **窗户纸**：用 #F1E8D4 铺满，再用带种子的随机画 2000 条长 8–34px 的细短线（一半 #B9A98A、一半 #FFFAF0，透明度 0.05–0.11）当纸纤维。这一层只画一次，放进离屏 canvas 缓存。\n2. **造两张红纸**（各用一个离屏 canvas，大小 1920×1080，坐标原点移到画面中心）：\n   - `layerBase`：深红 #8F0B22 的圆盘，半径 452；用 `destination-out` 挖外缘 48 个半径 10 的小孔（放在半径 428 处），再挖掉半径 400 以内的整个圆（只留一圈深红边）。\n   - `layerTop`：亮红 #C8102E 的圆盘，半径 404；用 `destination-out` 挖下面这些，**每一圈都是\"画 1/N，旋转复制 N 份\"**：\n     - 外缘 48 个小孔：半径 9，放在 r=378；\n     - 24 个小水滴：从 r=342 到 r=274，宽 22；\n     - 12 片大花瓣：从 r=244 到 r=74，宽 50；\n     - 12 个小菱形：每个先转 π/12，中心在 r=226，宽 32 高 48；\n     - 12 个小圆点：每个先转 π/12，半径 12，放在 r=170；\n     - 12 片内圈花瓣：从 r=78 到 r=148，宽 26；\n     - 再挖掉半径 66 的中心圆；然后用亮红在中心补一个半径 46 的小盘；最后用 `destination-out` 在小盘上写中心的字（粗体 66px，居中）。\n   - 花瓣之间必须留红色的\"桥\"，不要把红纸挖断。\n3. **四个角花**：用另一个离屏 canvas 画一块\"四分之一圆\"（半径 250，圆心在画面角上）的亮红，挖：9 个沿弧边的小孔（半径 7）、4 片水滴、一个半径 58 的圆窗。复制到四个角（翻转）。\n4. **合成**：先画窗户纸；再把 `layerBase`、`layerTop`、四个角花依次画上去，每一层画之前设置投影：`shadowColor='rgba(70,12,12,0.38)'`，`shadowBlur=16`，`shadowOffsetX=5`，`shadowOffsetY=9`。\n\n水滴形的路径可以直接用这个函数（原点在窗花中心，y 轴向上为负）：\n\n```js\nfunction drop(g, y0, y1, w) {\n  const d = y0 - y1;\n  g.beginPath(); g.moveTo(0, y0);\n  g.bezierCurveTo(w, y0 - d * .25, w * .9, y1 + d * .35, 0, y1);\n  g.bezierCurveTo(-w * .9, y1 + d * .35, -w, y0 - d * .25, 0, y0);\n  g.fill();\n}\nfunction ring(g, n, fn) { for (let i = 0; i < n; i++) { g.save(); g.rotate(i * Math.PI * 2 / n); fn(g, i); g.restore(); } }\n```\n\n## 动起来\n\n- 0–0.8 秒：深红底盘从半径 0 展开到满（ease-out）；0.25 秒后亮红主盘同样展开。\n- 1.2–4 秒：镂空由外向内一圈圈\"打开\"（每个孔的半径从 0 长到目标值，每圈晚 0.18 秒，每个孔 0.35 秒）；因为孔是挖出来的，所以实现时把\"孔的半径 × 进度\"传给上面的挖孔步骤，每帧重新生成 `layerTop`（可以缓存已经完成的圈）。\n- 4–4.4 秒：中心的字\"盖章\"：缩放 1.15 → 1.0。\n- 之后整张窗花以 ±0.6° 缓慢摆动（周期 6 秒），影子偏移跟着变 ±2px。\n- 最后一秒保持静止，然后循环。\n\n## 不要\n\n金色、渐变、塑料高光、3D、粒子、发光、过重的阴影、把字写在纸上（必须是镂出来的）。\n\n## 写完后自己过一遍（不要输出）\n\n- 镂空是 `destination-out` 挖的，不是用底色盖的吗？\n- 12 份是否完全对称？\n- 所有影子是否都向右下？\n- 同一个 `t` 刷新两次，画面是否一模一样？","extra":[]},{"id":"Z6","s":"Z","cat":"中国风","name":"年画","desc":"红灯笼，对联，喜庆 / New Year woodblock print","img":"","file":"风格提示词/Z_中国风/Z6_年画.md"},{"id":"Z7","s":"Z","cat":"中国风","name":"皮影","desc":"镂空剪影，光后面演，关节能动 / shadow puppetry（动起来见 M12）","img":"","file":"风格提示词/Z_中国风/Z7_皮影.md"},{"id":"Z8","s":"Z","cat":"中国风","name":"敦煌","desc":"壁画色，飞天，矿物颜料 / Dunhuang mural","img":"","file":"风格提示词/Z_中国风/Z8_敦煌.md"},{"id":"Z9","s":"Z","cat":"中国风","name":"青花","desc":"白底蓝花，瓷器纹样 / blue and white porcelain","img":"","file":"风格提示词/Z_中国风/Z9_青花.md"},{"id":"Z10","s":"Z","cat":"中国风","name":"木版画","desc":"木刻线条，套色 / woodblock print","img":"","file":"风格提示词/Z_中国风/Z10_木版画.md"},{"id":"Z11","s":"Z","cat":"中国风","name":"京剧脸谱","desc":"脸谱纹样，浓烈色块 / Peking opera mask","img":"","file":"风格提示词/Z_中国风/Z11_京剧脸谱.md"},{"id":"Z12","s":"Z","cat":"中国风","name":"书法","desc":"毛笔字一笔笔写出来 / calligraphy stroke animation","img":"","file":"风格提示词/Z_中国风/Z12_书法.md"},{"id":"Z13","s":"Z","cat":"中国风","name":"水墨漫画","desc":"毛笔线条加水墨晕染的漫画 / ink-brush comic","img":"","file":"风格提示词/Z_中国风/Z13_水墨漫画.md"},{"id":"Z14","s":"Z","cat":"中国风","name":"彩铅手绘","desc":"彩铅排线，纸张纹理 / colored pencil on textured paper","img":"","file":"风格提示词/Z_中国风/Z14_彩铅手绘.md"},{"id":"Z15","s":"Z","cat":"中国风","name":"温暖水彩科普卡","desc":"柔和水彩晕染，友好易懂的造型，适合做科普卡片 / warm friendly watercolor educational card","img":"","file":"风格提示词/Z_中国风/Z15_温暖水彩科普卡.md"},{"id":"H1","s":"H","cat":"现成版式","name":"Biennale Yellow","desc":"暖羊皮纸底，太阳黄光晕，衬线大标题，靛蓝墨色，细线","img":"风格提示词/H_现成版式/H1_Biennale Yellow.jpg","file":"风格提示词/H_现成版式/H1_Biennale Yellow.md","prompt":"你是一位前端动效工程师。请写**一个完整的 index.html 文件**：只用原生 HTML + JavaScript + Canvas，不要任何外部库、字体文件或图片。做一张\"艺术双年展杂志封面\"风格的动画标题卡。\n\n## 内容\n\n- 大标题（两行）：{{第一行，例：Biennale}} / {{第二行，例：Yellow}}（第二行用斜体）\n- 页眉左：{{例：THE TWELFTH BIENNALE · EDITORIAL SERIES}}；页眉右：{{例：N° 01}}\n- 页脚左（中文）：{{一句话说明}}；页脚右：{{编号}}\n- 总时长：{{秒，默认 6}}\n\n## 输出要求（必须照做）\n\n1. 只输出一个 html 代码块，不要解释。代码必须完整可运行：不要用省略号，不要写\"其余同上\"\"此处略\"。\n2. canvas 固定 1920×1080，用 CSS 等比缩放居中，多出来的部分是黑边。\n3. 所有画面由函数 `draw(t)` 决定（`t` 是秒）。不要用 `Math.random`；纸纹用带种子的 mulberry32(seed)。\n4. 默认循环；空格暂停/继续；网址带 `?t=3` 时只显示第 3 秒那一帧。\n\n## 颜色和线（只准用这些）\n\n- 底色 paper = #F2E9D2；加纸纹：5000 个 1–3px 的小方点，一半 #8C7A55、一半 #FFFAF0，透明度 0.045–0.095。纸纹只画一次，缓存到离屏 canvas。\n- 唯一的强调色 sun = #F6C23E。\n- 字和所有线都用 ink = #1D2A68，线宽 1.6–1.8px。\n\n## 字体\n\n`font-family: Georgia, \"Times New Roman\", \"Noto Serif SC\", \"Songti SC\", serif`。全片只用衬线体。大标题约 214px，`letterSpacing = '-4px'`；页眉 26px，大写，`letterSpacing = '6px'`；页脚中文 34px。（canvas 的 `ctx.letterSpacing` 在新版浏览器里可用；不支持就逐字绘制。）\n\n## 版面（坐标按 1920×1080）\n\n1. 外框：`strokeRect(64, 64, 1792, 952)`；再画两道横线：y=148 和 y=932，从 x=64 到 x=1856。\n2. 太阳，圆心 (1380, 470)：\n   - 光晕：径向渐变，半径 20→560，从 `rgba(246,194,62,1)` 到 `rgba(246,194,62,0.92)`（38% 处），再到 `rgba(246,214,120,0.35)`（70% 处），到 `rgba(246,214,120,0)`（100%）；\n   - 实心圆：半径 250，颜色 sun；\n   - 三道同心细圈：半径 250、330、410（ink，透明度 0.9、0.45、0.45）；\n   - 刻度环：半径 410 到 421（每 5 条一条长的，到 432），一共 120 条，ink，透明度 0.85。\n3. 大标题：左边 x=100，第一行基线 y=560，第二行（斜体）基线 y=770。注意标题的右端不要碰到刻度环（最左端约 x=948）。\n4. 页眉两行小字基线 y=118（左 x=104，右 x=1650）；页脚中文基线 y=980（左 x=104），编号右对齐到 x=1816。\n\n## 动起来\n\n- 0–0.8 秒：外框和两道横线从四角向中间\"画出来\"（用 `setLineDash` 或按进度截取）；\n- 0.4–1.8 秒：太阳从下方 300px 处升到位（ease-out），光晕透明度 0→1；\n- 1.0–2.4 秒：标题两行依次从下方 24px 处淡入，字距从 +20px 收到 −4px；\n- 2.0–2.8 秒：页眉页脚淡入；刻度环以每秒 1° 顺时针慢转；\n- 结尾 0.5 秒：整体淡出到纸色，然后循环。\n\n## 不要\n\n渐变色块、阴影、圆角卡片、第二种强调色、无衬线大标题、发光、粒子。\n\n## 写完后自己过一遍（不要输出）\n\n- 全片是否只有 sun 一个强调色？\n- 标题是否碰到了刻度环？\n- 同一个 `t` 刷新两次，画面是否一模一样？","extra":[]},{"id":"H2","s":"H","cat":"现成版式","name":"BlockFrame","desc":"新粗野主义，粗黑边框，硬投影，糖果色点缀","img":"","file":"风格提示词/H_现成版式/H2_BlockFrame.md"},{"id":"H3","s":"H","cat":"现成版式","name":"Blue Professional","desc":"羊皮纸底，钴蓝主色，Space Grotesk 标题","img":"","file":"风格提示词/H_现成版式/H3_Blue Professional.md"},{"id":"H4","s":"H","cat":"现成版式","name":"Bold Poster","desc":"倾斜的花体大字，奶油底红色强调，杂志封面感","img":"","file":"风格提示词/H_现成版式/H4_Bold Poster.md"},{"id":"H5","s":"H","cat":"现成版式","name":"Broadside","desc":"工业报纸海报，奶油色配墨色，火橙色点缀","img":"","file":"风格提示词/H_现成版式/H5_Broadside.md"},{"id":"H6","s":"H","cat":"现成版式","name":"Capsule","desc":"胶囊形状，奶油纸，糖果配色，Bodoni 衬线标题","img":"","file":"风格提示词/H_现成版式/H6_Capsule.md"},{"id":"H7","s":"H","cat":"现成版式","name":"Cartesian","desc":"极简留白，暖羊皮纸，墨色标题，灰褐点缀，细线","img":"","file":"风格提示词/H_现成版式/H7_Cartesian.md"},{"id":"H8","s":"H","cat":"现成版式","name":"Cobalt Grid","desc":"羊皮纸加钴蓝网格，Newsreader 标题","img":"","file":"风格提示词/H_现成版式/ "img":""},{"id":"X8","s":"X","cat":"code-video","name":"手账剪贴本","en":"Scrapbook","desc_en":"A making-of journal on a kraft desk: lined notebook pages, polaroids held by washi tape, torn paper labels, die-cut stickers, rubber stamps, and marker doodles.","fit":"记录这三个月","file":"风格提示词/X_code-video/X8_手账剪贴本.md","img":""},{"id":"X9","s":"X","cat":"code-video","name":"撕纸拼贴","en":"Torn-paper collage","desc_en":"Pictures built from torn scraps of watercolour-tinted paper, laid one by one on a sheet of cold-press paper: skies and seas in long strips, rocks and crowds in small shards, a sun as a torn disc. Calm, handmade, and warm.","fit":"回忆、拼凑","file":"风格提示词/X_code-video/X9_撕纸拼贴.md","img":""},{"id":"X10","s":"X","cat":"code-video","name":"粒子","en":"Particles","desc_en":"Thousands of glowing particles drift on a flow field, gather into words, logos, and numbers, then scatter and re-form. The purest \"drawn in code\" look.","fit":"氛围","file":"风格提示词/X_code-video/X10_粒子.md","img":""},{"id":"X11","s":"X","cat":"code-video","name":"翻牌显示板","en":"Split-flap board","desc_en":"A railway departures board: tiles clatter through the alphabet onto each message, amber lamps blink, and a station clock ticks.","fit":"机场那种翻牌，适合标题和数字","file":"风格提示词/X_code-video/X11_翻牌显示板.md","img":""},{"id":"X12","s":"X","cat":"code-video","name":"霓虹灯牌","en":"Neon sign","desc_en":"Glass tubes on a dark brick wall that buzz and flicker on, glow onto the wall, and reflect on a wet floor.","fit":"金句","file":"风格提示词/X_code-video/X12_霓虹灯牌.md","img":""},{"id":"X13","s":"X","cat":"code-video","name":"16-bit 街机","en":"16-bit arcade","desc_en":"A 16-bit console game come to life: a starry violet night, pixel sprites, CRT scanlines, and game UI that turns the story into a run from INSERT COIN to GAME CLEAR.","fit":"游戏感","file":"风格提示词/X_code-video/X13_16-bit 街机.md","img":""},{"id":"X14","s":"X","cat":"code-video","name":"CRT 终端","en":"CRT terminal","desc_en":"A green phosphor terminal on an old CRT: commands type themselves out, logs scroll, progress bars fill, and big block-letter banners glow for the name and the numbers.","fit":"讲代码、讲 AI","file":"风格提示词/X_code-video/X14_CRT 终端.md","img":""},{"id":"X15","s":"X","cat":"code-video","name":"热敏小票","en":"Thermal receipt","desc_en":"A thermal receipt printer on a teal desk: every scene prints a fresh slip that rises out of the printer, gets stamped, and is torn off. Works in 16:9 and 9:16.","fit":"清单、\"算一笔账\"","file":"风格提示词/X_code-video/X15_热敏小票.md","img":""},{"id":"X16","s":"X","cat":"code-video","name":"地铁线路图","en":"Transit map","desc_en":"A transit map and station signage: coloured lines are drawn across cream paper, stations light up one by one, a train runs the line, and the ending is the terminus sign.","fit":"讲一路怎么走过来的，适合 04 段","file":"风格提示词/X_code-video/X16_地铁线路图.md","img":""},{"id":"X17","s":"X","cat":"code-video","name":"蓝图","en":"Blueprint","desc_en":"A cyanotype engineering drawing: white linework on blueprint blue, dimension lines, numbered balloons, and a title block, as if the product were being specified on a drafting table.","fit":"讲结构","file":"风格提示词/X_code-video/X17_蓝图.md","img":""},{"id":"X18","s":"X","cat":"code-video","name":"漫画书","en":"Comic book issue","desc_en":"A video that stages its content as a physical vintage comic book being read on camera: a portrait-oriented comic page/spread sits centered in the landscape frame against a near-black vignette background, and a virtual camera pans and pushes into individual panels the way a motion-comic or Ken Burns documentary reveals a print page. The book opens with a magazine-style cover, then turns through several two-page spreads of a 2x2 panel grid, and closes on a colophon-style back cover. Panels are built from flat pop-art color blocks (red, gold/orange, blue), Ben-Day halftone dot textures, and sunburst ray backgrounds, with comic sound-effect bursts and a speech-bubble mascot giving it an energetic, Silver-Age-superhero-comic / 1960s advertising-comic feel. The mood is upbeat, punchy, and declarative, reinforced by a continuously driving instrumental music bed with frequent hard transient hits.","fit":"分格讲故事","file":"风格提示词/X_code-video/X18_漫画书.md","img":""},{"id":"X19","s":"X","cat":"code-video","name":"纪录片","en":"Documentary","desc_en":"A piece that reads like a serious investigative-documentary case file rather than a marketing reel: a near-black canvas holding a slowly turning low-poly \"network sphere\" emblem, chaptered like folder tabs (\"Chapter 1 — ...\", \"Chapter 2 — ...\"), with aged paper \"evidence cards\" laid under a desk lamp, minimal data-journalism bar charts, and one dramatized \"witness testimony\" segment shot as a backlit, explicitly-labeled graphic silhouette. Everything moves slowly and settles rather than snaps; captions build up phrase by phrase like narration being typed out; a hushed, low ambient bed with a slow recurring pluck tone underscores the whole thing, broken only by a hard opening hit and a bright closing chime. The net effect is hushed, credible, forensic — closer to a true-crime/60-Minutes case-file open than a tech-hype trailer.","fit":"认真讲一件事","file":"风格提示词/X_code-video/X19_纪录片.md","img":""},{"id":"X20","s":"X","cat":"code-video","name":"博物馆展览","en":"Museum exhibit","desc_en":"A piece that plays like a nighttime museum special-exhibit walkthrough: a single visitor moves room to room through a pitch-dark gallery where each \"diorama\" is picked out by one hanging spotlight, a low-poly artifact on a pedestal, a cream museum wall-label, and a docent's caption bar typing out commentary along the bottom. The overall feeling is hushed, reverent, and slightly theatrical — closer to an after-hours exhibit tour than a tech product demo, with warm sepia light carving objects out of near-total black.","fit":"把东西一件件摆出来讲","file":"风格提示词/X_code-video/X20_博物馆展览.md","img":""},{"id":"X21","s":"X","cat":"code-video","name":"突发新闻","en":"Breaking news","desc_en":"This clip resembles a cable-news \"breaking news\" graphics package — the kind of template a 24-hour news channel uses to announce a major story. It opens on a slowly-revealed rotating-globe title card, sweeps a diagonal tri-color ribbon across the screen for the headline stinger, cuts to a flat-vector illustrated news anchor at a desk with a persistent lower-third and scrolling ticker, pushes into a zooming world map (globe → country → city → geolocation pin), then alternates between data/stat cards and the anchor before closing on a minimal logo card. The feeling is urgent, corporate-broadcast, and info-dense: deep navy blues, hard red accents, bold condensed numerals, and a constant on-screen HUD (live clock, channel bug, ticker) that never disappears, evoking authority and immediacy rather than warmth.","fit":"快讯开场","file":"风格提示词/X_code-video/X21_突发新闻.md","img":""},{"id":"X22","s":"X","cat":"code-video","name":"侦探线索板","en":"Detective board","desc_en":"This clip reads like a detective's evidence corkboard being filmed and slowly revealed: a warm, lamp-lit cork bulletin board covered in pinned index cards and handwritten sticky notes, centered on a \"mugshot\" placeholder card for an unidentified suspect. Instead of cutting between shots, a single camera pans and tracks sideways across the board as new evidence cards appear one by one, each strung to the suspect card with taut red thread, building toward a wide \"conspiracy board\" pull-back. A camera-flash whiteout is the only hard cut in the video, swapping the mystery card for a clean \"identified\" result card stamped closed. The pacing feels like a true-crime documentary graphics package: steady ticking/pulsing music under a slow reveal, a stab of sharp hits, one big swell exactly on the flash-cut, then a fade to quiet.","fit":"把线索连起来，科普推理","file":"风格提示词/X_code-video/X22_侦探线索板.md","img":""},{"id":"X23","s":"X","cat":"code-video","name":"绘本","en":"Picture storybook","desc_en":"The video looks like a physical children's picture book filmed lying flat on a wooden desk: a leather-bound cover with gold ornamental corners opens like a real book, then the camera holds a flat, head-on view of each cream-paper spread as it \"reads itself\" — a circular illustration on the left breathing with small looping motion, and serif body copy typing itself in on the right. The mood is warm, nostalgic, and gentle: soft pastel scene-paintings inside a locket-shaped frame, muted earth-tone data callouts, and a plush round mascot that waves through every scene. It reads as a bedtime-story explainer: cozy rather than corporate, tactile rather than flat-UI.","fit":"温暖地讲故事","file":"风格提示词/X_code-video/X23_绘本.md","img":""},{"id":"X24","s":"X","cat":"code-video","name":"RPG 任务","en":"RPG quest","desc_en":"A clip that reads like a cutscene lifted from a 16-bit console RPG (SNES/Game Boy Advance era): a fixed-camera pixel-art diorama, a JRPG dialogue box with typewriter text, a \"quest log\" stat panel, a sword-and-slime battle vignette, a radial-burst level-up screen, and a loot-pickup card, bookended by a night title card and a sunset \"quest clear\" card. A thin scanline texture sits over every frame, and a chiptune-style pulsing melody drives the pacing. The overall feeling is nostalgic, toy-like, and gamified — factual/data content (benchmark scores, price changes) is translated one-to-one into RPG game-feel (quest completion bars, \"+EXP\" pickups, loot cards, stat increases).","fit":"学习像做任务","file":"风格提示词/X_code-video/X24_RPG 任务.md","img":""},{"id":"X25","s":"X","cat":"code-video","name":"天气预报","en":"Weather forecast","desc_en":"A short data video styled as a Korean TV nightly-weather-report broadcast graphics package repurposed for a status update. It opens with a satellite/radar-style storm-spiral animation, then cuts through a sequence of \"forecast card\" scenes — a temperature-style map, thermometers, wind/speed gauges, a multi-day forecast strip, and a sunny sign-off — each dressed with real broadcast chrome: a channel logo pill, a live date badge, and a scrolling breaking-news ticker along the bottom. The screen stays locked-off and flat; all motion lives inside the graphics (falling snow, twinkling stars, drifting wind lines, a fast diagonal wipe between scenes). A bright, plucky instrumental loop runs under it with an accented musical hit landing on every scene change, giving the whole thing a polished, on-air, slightly playful newsroom feel.","fit":"用天气讲情绪，感受讲解很合适","file":"风格提示词/X_code-video/X25_天气预报.md","img":""},{"id":"X26","s":"X","cat":"code-video","name":"电视购物","en":"Home-shopping infomercial","desc_en":"The video reads as a parody of a Korean late-night TV home-shopping / infomercial broadcast: a flat, rounded-vector cartoon world where each beat of the pitch gets its own full-bleed, single-hue \"sunburst\" backdrop, a chunky comic-shout headline slams onto the screen, and a persistent lower-third news-ticker bar keeps scrolling bullet claims underneath. A simple blob-shaped mascot character stands in for \"the customer,\" shown gloomy and gray before the pitch and pumped-up and colorful after it. There is no camera movement at all — it behaves like a slide deck of hard graphic cards, each card populated with big bold numbers, price tags, comparison panels, and cartoon icons (a ticking bomb, a ringing phone, a rocket, a green checkmark). The audio is a bright, dense, evenly-pulsing music-and-SFX bed that stays \"hot\" almost the entire runtime, occasionally spiking with comedic riser/whoosh effects timed to the hard cuts, giving the whole thing a caffeinated, game-show-auction energy.","fit":"讽刺卖课的，06 段可以试","file":"风格提示词/X_code-video/X26_电视购物.md","img":""},{"id":"X27","s":"X","cat":"code-video","name":"体育直播","en":"Sports broadcast","desc_en":"The clip reads like a cable-TV live-sports broadcast package — a night-match stadium open with floodlights and an LED-dot crowd, cut with the on-screen graphics package a network overlays during a match (score bug, \"LIVE\" badge, lower-third source ticker) — repurposed to walk through a head-to-head stat comparison instead of a game. Motion is entirely 2D broadcast-graphics motion (nothing pans or dollies; text counts up, bars fill, cards slide and glow) cut into short hard-cut chapters every few seconds. The audio is a rhythmic, plucked/percussive pulse that tightens and loosens with the on-screen drama — quieter during the analytical stat-sheet beat, swelling into a bright, confetti-timed climax at the finale — which together with the broadcast chrome gives it the feel of a TV \"match highlights\" reel rather than a slide deck.","fit":"解说感","file":"风格提示词/X_code-video/X27_体育直播.md","img":""},{"id":"X28","s":"X","cat":"code-video","name":"组装说明书","en":"Assembly manual","desc_en":"The video reads like a printed IKEA-style product-assembly instruction booklet that has been turned into a motion explainer: flat vector line art on aged cream paper, a giant chapter numeral opening every page, an isometric shipping-box \"hero\" object, a small stick-figure mascot for scale, and literal hardware metaphors (price tags, coin stacks, a conveyor belt, wall outlets) standing in for abstract data instead of ordinary charts. Pages slide over one another like leaves of a manual being turned rather than cutting, each diagram builds itself piece by piece before its number snaps in, and a steady rhythmic tick-track under occasional synth swells gives the whole thing a calm, deliberate, \"assembled and verified\" feeling that ends on a stamped checkmark held in a still frame.","fit":"讲步骤，宜家说明书那种","file":"风格提示词/X_code-video/X28_组装说明书.md","img":""},{"id":"X29","s":"X","cat":"code-video","name":"白板讲课","en":"Whiteboard lecture","desc_en":"A static \"desk-cam\" shot of a physical whiteboard, framed by its own aluminum bezel, on which a hand entering from the bottom-right corner writes, draws, underlines, circles, and erases with dry-erase markers and a block eraser — the classic hand-drawn whiteboard-explainer look. Everything is built stroke-by-stroke in real time rather than fading in, numbers get crossed out and replaced live, and nothing is ever fully wiped clean: every earlier section keeps ghosting through as a barely-visible watermark under the current one, giving the board a used, palimpsest-like texture. The mood is brisk, corporate-friendly, and a little playful (circled step numbers, a green checkmark shield, a red circled callout), riding a continuous, steady percussive beat underneath.","fit":"讲道理","file":"风格提示词/X_code-video/X29_白板讲课.md","img":""},{"id":"X30","s":"X","cat":"code-video","name":"电影预告片","en":"Movie trailer","desc_en":"A prestige announcement trailer that reads like a luxury-watch or car-launch teaser borrowed for a tech reveal: an ultra-wide cinematic letterbox holds a near-black, warm vignette sky sprinkled with slow-drifting dust motes, and every idea — a question, then a date, then a run of benchmark numbers, then the product name, then a release date — gets its own held, centered, fully-faded screen. Nothing cuts hard; everything breathes in as a soft bloom of light, holds, and dissolves through black into the next. The mood is confident and expensive rather than energetic: hushed opening, a rhythmic pulse of swelling hits under the numbers, one big flare-and-impact at the name reveal, then a slow decrescendo fade-out.","fit":"下期预告、频道预告，11 段可以试","file":"风格提示词/X_code-video/X30_电影预告片.md","img":""},{"id":"X31","s":"X","cat":"code-video","name":"数学证明讲课","en":"Math proof lecture","desc_en":"A dark, quiet, textbook-like explainer that stages an argument the way a math lecture stages a proof: a title card, a numbered \"lemma\" per claim, and a closing \"therefore\" statement with a QED mark. Everything sits on a near-black panel with a faint off-center glow, rendered as flat 2D vector graphics — thin-stroke bar and scatter charts, color-coded equations that build term by term, and small dim citation text in the corner. The mood is restrained and confident rather than flashy: no camera movement, no particle effects, just clean typography and numbers arriving in a steady, metronomic rhythm under a soft ambient pulse.","fit":"一步步推出结论","file":"风格提示词/X_code-video/X31_数学证明讲课.md","img":""},{"id":"R1","s":"R","cat":"赛博朋克（第一批）","name":"霓虹雨夜 · 电影感","desc":"一点透视的雨夜窄街，两边挂满竖招牌，青色的雾越远越浓，街尽头一团暖光；湿地面上的倒影占了半个画面。","img":"风格提示词/R_照参考学来的/R1_霓虹雨夜 · 电影感.jpg","extra":[{"h":"学的是哪张参考","t":"01 霓虹雨夜 · 电影概念"},{"h":"相近的旧编号","t":"D1 雨窗"},{"h":"定死的画法","t":"不描边；冷青做底，红粉招牌和尽头的橙光做主光；越远越被雾吃掉；倒影竖着拉长、被雨打出波纹；最近的几家拉着卷帘门，把前景压暗。招牌的字从洗过的词表里发，不重复。"}],"file":"风格提示词/R_照参考学来的/R1_霓虹雨夜 · 电影感.md"},{"id":"R2","s":"R","cat":"赛博朋克（第一批）","name":"80–90 年代复古日漫","desc":"赛璐珞画的人和车在夜里的高架上飞驰，仰着看的高楼，尾灯拖出两条光带，整片像老录像带放出来的。","img":"风格提示词/R_照参考学来的/R2_80–90 年代复古日漫.jpg","extra":[{"h":"学的是哪张参考","t":"02 复古日漫"},{"h":"相近的旧编号","t":"L46"},{"h":"定死的画法","t":"人和车是平涂 + 一块硬边阴影 + 一条硬边高光 + 有颜色的描边；背景是喷枪画、横向拉丝表示速度（招牌在拉丝之后画，字才看得清）；画面微微歪；最后过一遍录像带的色渗和扫描线。"}],"file":"风格提示词/R_照参考学来的/R2_80–90 年代复古日漫.md"},{"id":"R3","s":"R","cat":"赛博朋克（第一批）","name":"美式漫画 · 潮流涂鸦","desc":"黄底，品红和青的闪电劈开画面，网点、喷漆、往外炸的速度线；粗黑描边的人一拳打出画面，旁边一个大拟声字。","img":"风格提示词/R_照参考学来的/R3_美式漫画 · 潮流涂鸦.jpg","extra":[{"h":"学的是哪张参考","t":"04 美式漫画 · 潮流涂鸦"},{"h":"相近的旧编号","t":"K13、X18"},{"h":"定死的画法","t":"粗黑描边；只用黄、品红、青、蓝四个颜色平涂；阴影是整块的深紫，压一层网点；不发光、不虚化；人往动作的方向整个倾过去。"}],"file":"风格提示词/R_照参考学来的/R3_美式漫画 · 潮流涂鸦.md"},{"id":"R4","s":"R","cat":"赛博朋克（第一批）","name":"末日工业 · 暗黑科幻","desc":"几乎只有绿；巨大的机械结构一层层叠进雾里，远处一个大圆环，顶上漏下光柱；走道上一个穿红衣、背着包的小人背对镜头。","img":"风格提示词/R_照参考学来的/R4_末日工业 · 暗黑科幻.jpg","extra":[{"h":"学的是哪张参考","t":"05 末日工业 · 暗黑科幻"},{"h":"相近的旧编号","t":"—"},{"h":"定死的画法","t":"一个颜色分七层远近，越远越淡；唯一的暖色是小人和几盏小灯；最前面垂下来的铁链几乎全黑，再推远一层。"}],"file":"风格提示词/R_照参考学来的/R4_末日工业 · 暗黑科幻.md"},{"id":"R5","s":"R","cat":"赛博朋克（第一批）","name":"像素赛博 · 复古游戏","desc":"俯看一条满是招牌的街，天桥横过去，街尽头一块\"不夜城\"大屏，打伞的人、小车、飞车，下着像素雨。","img":"风格提示词/R_照参考学来的/R5_像素赛博 · 复古游戏.jpg","extra":[{"h":"学的是哪张参考","t":"07 像素赛博 · 复古游戏"},{"h":"相近的旧编号","t":"M14、L49、L50、X24"},{"h":"定死的画法","t":"先画在 480×270 的小画布上，整张压进 28 色调色板（拜耳抖动处理渐变和光晕），再放大 4 倍、不做平滑。动起来时不用一格一格跳的像素动画，每帧从连续的骨骼重画，动作一定要流畅。"}],"file":"风格提示词/R_照参考学来的/R5_像素赛博 · 复古游戏.md"},{"id":"R6","s":"R","cat":"赛博朋克（第一批）","name":"东方赛博 · 国风幻想","desc":"纸色的天，一轮大红日头，一行鹤飞过；水边一座五层飞檐楼阁，身上挂着\"不夜城\"\"酒家\"霓虹竖招牌和一块屏，塔尖套着青色的全息光环；后面是淡墨的未来塔楼和山，电缆上挂着一串串小红灯笼；水上一叶小船、一个戴斗笠的人，倒影像水墨一样化开。","img":"风格提示词/R_照参考学来的/R6_东方赛博 · 国风幻想.jpg","extra":[{"h":"学的是哪张参考","t":"08 东方赛博 · 国风幻想"},{"h":"相近的旧编号","t":"C1、Z1、L19、M30"},{"h":"定死的画法","t":"纸色底，墨分浓淡做远近；颜色只有墨、纸、朱红，霓虹只点一点青；墨块边上有洇开的淡墨，檐上有干笔擦痕；水边一带雾把楼脚化开；竖排题字和一方印章收住画面。"}],"file":"风格提示词/R_照参考学来的/R6_东方赛博 · 国风幻想.md"},{"id":"R7","s":"R","cat":"赛博朋克（第一批）","name":"扁平插画 · 黄昏屋顶","desc":"黄昏的大渐变天，三层平涂的城市剪影，屋顶上一块\"夜城\"大霓虹字，一个人和一只猫坐在楼边，后面一列轻轨开过。","img":"风格提示词/R_照参考学来的/R7_扁平插画 · 黄昏屋顶.jpg","extra":[{"h":"学的是哪张参考","t":"P&D Studio 的 Cyberpunk Neon City"},{"h":"相近的旧编号","t":"V3"},{"h":"定死的画法","t":"不描边；只有天是渐变，其他全是平涂；越远的楼越接近天的颜色；发光只给霓虹字、灯串和小灯。"}],"file":"风格提示词/R_照参考学来的/R7_扁平插画 · 黄昏屋顶.md"},{"id":"O1","s":"O","cat":"默片与有声 1927–1938","name":"翼","en":"Wings","desc":"用 three.js 搭的一战空战，按 1927 年正色片拷贝调色：天空发白、黑位很深、整体琥珀染色、片门抖动和划痕。《翼》最出名的是把摄影机绑在飞机上拍的空战，所以这里大部分机位都装在飞机上。","fit":"默片 3D 空战 · 正色片黑白 + 琥珀染色","prompt":"平滑着色的 3D 按默片正色片拷贝调色：高反差，红色发黑。天空近白，地面留清楚的中灰层次，深黑占画面 25%–35%，只在剪影里。染色：白位向琥珀 #FFCC80 混一半，天空是淡奶油琥珀，不要整片橙；黑位不变。只有故事围绕的那个主角留色，整个人都留，饱和度约七成（如 #D97757）；灯火和其他光源一律是灰的。叠 24 fps 片门抖动（±1 像素）、闪烁（±5%）、细颗粒（±4%）、一到三条细划痕、稀疏灰尘，片门圆角加柔和暗角，第一镜 1 秒圆形光圈打开。招牌镜头：机位绑在跟主角一起动的东西上，露出一截支架，轻微震动；再接跟拍和主观镜头。每 2–3 秒一切，穿过云、烟或强光白场转场。对标 William Wellman《翼》（1927）。避免：运动模糊、灰阶里有颜色。","prompt_en":"Smooth-shaded 3D graded as a silent-era orthochromatic print: high contrast, reds go black. Sky near-white, ground in readable mid-greys, deep blacks (25-35% of frame) only in silhouettes. Tint: blend whites half-way toward amber #FFCC80, so the sky is pale cream-amber, never solid orange; blacks stay black. Only the hero the story centres on keeps colour, whole figure at ~70% saturation (e.g. #D97757); every lamp, fire or other light source stays grey. 24 fps gate weave (±1 px), flicker (±5%), fine grain (±4%), 1-3 thin scratches, sparse dust, rounded corners, vignette; open on a 1 s iris. Signature shot: a camera rigged to something moving with the subject, rig in frame; then chase and POV. Cut every 2-3 s; white out through cloud, smoke or glare. Reference: William Wellman, *Wings* (1927). Avoid: motion blur, colour in the greys.","file":"风格提示词/O_奥斯卡98部/O1_翼.md","img":"风格提示词/O_奥斯卡98部/O1_翼.jpg","year":"1927/28","tags":["3D·B&W"],"extra":[{"h":"技法关键词","t":["three.js 三维","正色片黑白","默片染色","放映磨损和圆形光圈"]},{"h":"导演说明","t":"Clawd 扮美军飞行员：皮飞行帽、护目镜、白围巾，坐在 SPAD 座舱里。开场序幕接到第一镜，第 1 拍光圈打开；之后五刀硬切，大约两拍一切。第 5 拍前后它回头、机枪开火；最后穿云白场，接上第 2 部开头的奶油白。"},{"h":"成片里的分镜","t":"1. 机头正前方对着座舱：Clawd 戴皮飞行帽、护目镜推在额头，夹在两根支柱中间；圆形光圈打开，镜头缓缓推近。（0.9s）\n2. 大全景：机群在云间盘旋，下面是格子田和白垩战壕，一架福克拖着黑烟；镜头缓缓推近。（0.6s）\n3. 机头机位带发动机震动：Clawd 回头看咬尾的福克，抬起一只手，双挺维克斯机枪开火闪光。（0.8s）\n4. 从福克上翼看出去，敌机机枪开火，追着前方 Clawd 的 SPAD；机位固定在敌机上。（0.8s）\n5. 过 Clawd 肩头的俯冲镜头：前面是上翼和张线，弹坑和折线战壕迎面扑来。（1.1s）\n6. 云团里的 SPAD 像幽灵一样朝镜头飞来，雾越来越浓，画面白到奶油色。（0.8s）"},{"h":"参考出处","t":["William A. Wellman, 1927","Harry Perry (aerial photography)","Tinted silent-era release prints","RFC aerial photographs of the Somme, 1916–18"]}]},{"id":"O2","s":"O","cat":"默片与有声 1927–1938","name":"百老汇旋律","en":"The Broadway Melody","desc":"会动的黑金银装饰艺术歌舞海报：喷枪渐变、阶梯形台口、镀铬电容麦克风。1929 年的百老汇正是装饰艺术盛期，这部又是有声片降临的一部，所以让声波从麦克风里一圈圈放出来。","fit":"黑金银装饰艺术歌舞海报","prompt":"装饰艺术歌舞海报。黑漆底；金和银都用分带金属渐变做（每个面 3–5 条硬分界），喷枪光晕、放射线、阶梯形、流线型，场景外圈套一道层层退进的金线台口框，嵌一排灯泡。色板按用途：底 #0A0908，金 #D6B560，高光 #F3E2A2，银 #BFC4C9；皮肤用淡银奶油色；只有故事围绕的那个主角用一个饱和强调色（如 #D97757）。人物是 Erté 式修长造型，有五官表情，题材允许时加流苏、亮片或羽毛。细颗粒、闪光点、星星。正面对称，中间一束追光。动起来：灯泡流动，一排重复元素（舞者、浪头）向中心卷成波浪，主要声源或光源放射环纹；镜头慢推，踩音乐的拍子切，无乐每 2–3 秒一切。对标 A. M. Cassandre 的海报、Erté 的服装设计。避免：平涂黄色冒充金属、人物没脸、多余的颜色。","prompt_en":"Art Deco revue poster. Black lacquer ground; gold and silver from banded metallic gradients (3-5 hard bands); airbrush glows, sunbursts, ziggurat steps, streamlined curves; a stepped proscenium frame of gold lines and bulbs. Palette: ground #0A0908, gold #D6B560, highlight #F3E2A2, silver #BFC4C9; skin pale silver-cream; one saturated accent (e.g. #D97757) only on the hero the story centres on. Elongated Erté-style figures with real faces; fringe, sequins or feathers where the subject allows. Fine grain, glints, stars. Frontal symmetry, a central spotlight. Motion: chasing bulbs, a row of repeated elements (dancers, waves, columns) rippling toward the centre, rings radiating from the main sound or light source; slow pushes, cut on the music's beat (without music, every 2-3 s). References: A. M. Cassandre's posters, Erté's costumes. Avoid: flat yellow for metal, faceless figures, extra hues.","file":"风格提示词/O_奥斯卡98部/O2_百老汇旋律.md","img":"风格提示词/O_奥斯卡98部/O2_百老汇旋律.jpg","year":"1928/29","tags":["2D"],"extra":[{"h":"技法关键词","t":["装饰艺术海报","喷枪金属渐变","A. M. Cassandre","Erté 服装"]},{"h":"导演说明","t":"Clawd 是戴硬草帽、拿黑手杖的踢踏舞者，从头踢踏到尾。开头从第 1 部的白场里淡入；第 4 拍麦克风活过来，声波涌出（有声片来了）。四刀硬切：街口 → 舞台 → 麦克风 → 歌舞队 → Clawd。"},{"h":"成片里的分镜","t":"1. 从白场里淡入：Astor 剧院的雨棚招牌（THE BROADWAY MELODY / ALL TALKING · ALL SINGING · ALL DANCING），灯泡流动；Clawd 戴硬草帽、拿手杖站在左边；镜头缓缓拉远。（0.8s）\n2. 舞台全景：装饰艺术台口、台阶上的歌舞女郎，Clawd 在巨大的电容麦克风旁踢踏，麦克风开始一圈圈放出声波；镜头缓缓拉远。（1s）\n3. 镀铬弹簧环麦克风特写，声波放射、音符飞出；镜头推近。（0.5s）\n4. 沿着踢腿队列横移：羽毛头饰、亮片短裙，腿一排排踢成波浪。（0.5s）\n5. Clawd 近景，踢踏中草帽一歪一歪，身后是麦克风环；轻推。（0.5s）"},{"h":"参考出处","t":["Harry Beaumont, 1929","1929 MGM one-sheet","A. M. Cassandre","Erté"]}]},{"id":"O3","s":"O","cat":"默片与有声 1927–1938","name":"西线无战事","en":"All Quiet on the Western Front","desc":"珂勒惠支式木刻：大块的黑、刀刻的白轮廓、粗糙木纹，Clawd 用单独一块橙色版套印。珂勒惠支 1921–22 年的反战版画，和这部片出自同一场战争、同一种悲痛。","fit":"珂勒惠支式反战木刻","prompt":"仿凯绥·珂勒惠支《战争》组画（1921–22）的表现主义木刻。画面六到七成是实黑；形体之间用白色轮廓刀分开，刀宽为画幅宽的 1/300–1/150；人脸刻成白形，只留几笔黑五官；手要大。人物占满画面，被画框裁切。每刀都有尖的进刀收刀和碎木边，离光越近的刀越宽，刀痕成组排、节奏略不均。墨色 #17130F 印在 #E8DFCA 纸上；纹理只有木纹条和缺墨斑点（±5%）。只有故事围绕的那个主角套一块色版（如 #D97757），平铺在身体或衣服上，刀痕照样压在上面，黑仍占六成以上。光只从一个开口进来（窗、云缝）；灯只刻一小圈短刀痕。人物脚下的地面留不刻的黑。动作安静（呼吸、一个小手势）；慢摇、慢推。避免：灰雾灰调、排刀规整成条纹、血腥。","prompt_en":"Expressionist woodcut after Käthe Kollwitz, *Krieg* (1921-22). 60-70% solid black; white contour cuts 1/300-1/150 of frame width separate forms; faces are white shapes with a few black features; hands large. Figures fill the frame, cropped by its edges. Each cut tapers in and out with chipped edges, is wider the nearer it sits to the light, in slightly uneven bundles. Ink #17130F on paper #E8DFCA; texture is only wood-grain streaks and under-inked speckle (±5%). One colour block (e.g. #D97757) only on the hero the story centres on, flat on its body or clothes, cuts over it; black stays 60%+. Light enters through one opening (window, cloud gap); lamps get a short ring of cuts. The ground under figures stays uncut black. Quiet motion (breathing, a small gesture); slow pans and push-ins. Avoid: grey fog or midtones, even striped hatching, gore.","file":"风格提示词/O_奥斯卡98部/O3_西线无战事.md","img":"风格提示词/O_奥斯卡98部/O3_西线无战事.jpg","year":"1929/30","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["木刻版画","凯绥·珂勒惠支","德国表现主义","双版套印"]},{"h":"导演说明","t":"Clawd 扮保罗，戴德军钢盔。整段放慢（1.2 倍）、压得很静：第 3 拍前后开始伸手，用三拍慢慢伸到底；幻影士兵只在最后一镜出现。四刀硬切：战壕里的脸 → 保罗的手臂 → 蝴蝶 → 十字架墓地。"},{"h":"成片里的分镜","t":"1. 沿战壕横摇，扫过刻出来的脸：一个双手捂脸，一个惊恐地看着，一个睡着了。（0.7s）\n2. 钢盔下一张直视镜头的脸（致敬 1930 年原海报）；慢推。（0.4s）\n3. 中景：Clawd 戴德军钢盔站在射击台上，慢慢把手臂伸向射击孔，孔沿铁罐上停着一只白蝴蝶；镜头推近。（0.9s）\n4. 射击孔边白蝴蝶特写，Clawd 的橙色手臂从左边伸进来；推近。（0.7s）\n5. 大全景：照明弹下的无人地带和白十字架墓地，幻影士兵的队列淡入、往远处走去；缓缓拉远。（0.6s）"},{"h":"参考出处","t":["Lewis Milestone, 1930","Käthe Kollwitz, Krieg (1921–22)","1930 Universal poster"]}]},{"id":"O4","s":"O","cat":"默片与有声 1927–1938","name":"壮志千秋","en":"Cimarron","desc":"1889 年的金调色蛋白印相全景：柔焦、轻微的横向拖影、奶油高光和暖褐暗部、银盐颗粒，只有 Clawd 手工上色。片子开场就是 1889 年俄克拉何马圈地狂奔，用那一年的照片质感来拍，这一章也保持单色。","fit":"1889 棕褐蛋白印相全景","prompt":"会动的 1880 年代金调色蛋白照片。先画边缘柔和的平涂形，按亮度分：主体深（15%–30%），地面 50%–60%，天空约 90%；物面和草丛有看得见的排线（线宽约画幅宽 1/300）。再“印”：转灰度，轻柔焦（约画幅宽 1/800），三层横向错开的淡影随运镜拉长，乘奶油色 #F2DCB4，黑位抬成暖褐 #2E1C0F，显影不匀（±5%），暗角压到 #785634，每帧刷新颗粒（±4%），稀疏灰尘划痕。只给故事围绕的那个主角手工上色（如 #D97757），像透明染料，蒙版羽化 2–3 像素；灯光仍是棕褐。横向全景，中间一条带排满重复小元素：人物、动物、车辆，题材冷清就用篱笆、木桩、树；别让一整块大面占满画面。天空默认发白。运镜：从主角近景 4–5 秒缓出拉到全景。避免：硬墨线、主角以外的颜色、干净的数码天空、发灰的印相。","prompt_en":"A moving 1880s gold-toned albumen photograph. Paint soft-edged flat shapes by brightness: main subjects dark (15-30%), ground 50-60%, sky about 90%; visible hatching and grass tufts (lines ~1/300 of frame width). Then print: grayscale, slight blur (~1/800 of frame width), a faint smear of three horizontal offset copies growing with camera speed, multiply cream #F2DCB4, lift blacks to umber #2E1C0F, blotchy development (±5%), vignette to #785634, per-frame grain (±4%), dust, scratches. Hand-tint only the hero the story centres on (e.g. #D97757) as transparent dye, mask feathered 2-3 px; lamps stay sepia. Wide panorama: the middle band packed with repeated small elements (figures, animals, vehicles; for a lone subject fences, posts, trees), no big plane dominating. Camera: one 4-5 s ease-out pull back from the hero to the panorama. Avoid: hard ink outlines, colour beyond the hero, a flat grey print.","file":"风格提示词/O_奥斯卡98部/O4_壮志千秋.md","img":"风格提示词/O_奥斯卡98部/O4_壮志千秋.jpg","year":"1930/31","tags":["2D·Sepia"],"extra":[{"h":"技法关键词","t":["金调色蛋白印相","西部全景老照片","人物手工上色"]},{"h":"导演说明","t":"Clawd 扮扬西·克拉瓦特：白色宽边牛仔帽、领巾，骑黑马冲在最前。整段按 1.1 倍跑。先拉远看到更多的马，再一刀切回近景，第 5 拍拔枪朝天开火。"},{"h":"成片里的分镜","t":"1. 从骑黑马冲在最前的 Clawd 近景开始，一路拉到全景：篷车、驿站马车、尘土里一大片骑手。（1.5s）\n2. 切到 Clawd 骑马的近景：举起左轮朝天开枪，画面随着后坐力一震；轻推。（1s）"},{"h":"参考出处","t":["Wesley Ruggles, 1931","Gold-toned albumen prints, 1880s","Currier & Ives (the flying gallop)"]}]},{"id":"O5","s":"O","cat":"默片与有声 1927–1938","name":"大饭店","en":"Grand Hotel","desc":"用 three.js 建的圆形大堂，按米高梅的银色黑白调色，Clawd 的橙是唯一的颜色。这部片最出名的是从顶上笔直往下拍、回廊一圈圈收进去的镜头，整个布景就按这一镜来建。","fit":"米高梅银色黑白 3D 大堂","prompt":"真 3D 场景，默认装饰艺术风大堂（大理石、镀铬、吊灯、亮面棋盘格地面）；室外保留真实场景，表面做出光泽（湿路面、静水），构图对称。环境光遮蔽加柔和辉光，调成 30 年代片厂银色黑白：约四成画面深黑，白位亮度约九成，不发灰。光从一个高处光源成束落下。只有故事围绕的那个主角留色（如 #D97757），至少占画面高度六分之一；暖灯渲染成白光，辉光只在灯旁。颗粒（±3%），灯旁光晕。招牌镜头：平视大全景，望进对称纵深，地面和天花同时入画，地面有倒影；再接 4–6 秒的侧向跟拍；俯拍同心圆、人像棋子只用一次。年代人物有头、帽、四肢，按路线走。对标美术指导 Cedric Gibbons、摄影师 William Daniels。避免：原地踏步、抽象图案铺满画面、偏色。","prompt_en":"A real 3D set, by default an Art Deco interior (marble, chrome, chandelier, glossy checkerboard floor); outdoors keep the real setting with glossy surfaces (wet pavement, still water) and symmetrical framing. Ambient occlusion, soft bloom; 1930s studio silver: about 40% deep black, glossy whites near 90%, no washed-out greys. Light falls in shafts from one high source. All neutral grey except the hero the story centres on (e.g. #D97757), at least 1/6 of frame height; warm lamps render white, bloom only around them. Grain (±3%), halation. Signature shot: eye-height wide into a deep symmetrical set, floor and ceiling in frame, floor reflections; then 4-6 s tracks; one overhead on rings, figures as chess pieces. Period figures (heads, hats, limbs) walk routes. References: art director Cedric Gibbons, cinematographer William Daniels. Avoid: walking in place, frame-filling abstract patterns, colour casts.","file":"风格提示词/O_奥斯卡98部/O5_大饭店.md","img":"风格提示词/O_奥斯卡98部/O5_大饭店.jpg","year":"1931/32","tags":["3D·B&W"],"extra":[{"h":"技法关键词","t":["three.js 三维","米高梅银色黑白","装饰艺术室内","俯拍同心构图"]},{"h":"导演说明","t":"Clawd 扮门童，戴圆筒小帽，拎一只贴满旅馆标签的皮箱。它是真的在走：每秒 1.4 米、2.4 步，步子和位移对得上。整段 1:1 播放，1.08 秒处从俯拍一刀切到侧面跟拍。"},{"h":"成片里的分镜","t":"1. 从天窗下笔直往下看：六层回廊一圈圈收向钥匙塔，橙色门童是棋盘格大理石上唯一的一个点，正走过地面；镜头慢慢推近。（1.1s）\n2. 贴着 Clawd 身高的侧面跟拍：它拎着皮箱往前走，大堂从身后滑过，前方旋转门在转；镜头边跟边往前、往里靠。（1.4s）"},{"h":"参考出处","t":["Edmund Goulding, 1932","Cedric Gibbons (art direction)","William Daniels (cinematography)"]}]},{"id":"O6","s":"O","cat":"默片与有声 1927–1938","name":"乱世春秋","en":"Cavalcade","desc":"慕夏式新艺术装饰画：膨胀的褐色轮廓线、粉彩平涂、马赛克底，中心人物身后一个光环。电影开场就是 1899 年跨年夜一家人举杯迎接新世纪，所以光环做成敲十二点的钟面。","fit":"慕夏新艺术装饰画","prompt":"慕夏式彩色石印。褐色 #4B3326 轮廓线，宽约画幅宽 1/250，背光侧（光默认从左上来）加粗到两倍，两端收尖；粉彩平涂，每块在背光侧叠一层深一档的硬边色。色板：奶油 #F5ECD6 作纸和天空，鼠尾草绿 #A9B490 作植物衣褶，淡金 #CFA55A 作光环装饰，玫瑰 #DBA49C 作皮肤和花；故事围绕的那个主角用一个更浓的强调色（如 #D97757）。横幅：人物和细环纹大光环居中三分之一，两侧拱格，后面铺灰青（鼠尾草绿掺灰）方块马赛克；鞭线藤蔓和花草；底部一条衬线大写铭文，用用户语言，字高约画面 1/25。留白不超过画面八分之一。杏仁眼、厚眼睑；头发或衣料三色成束。石版颗粒、纸斑、暗角。慢摆；下摇到光环再拉远。避免：干净细线、饱和色、空荡背景。","prompt_en":"Alphonse Mucha colour lithograph. Brown contours #4B3326, about 1/250 of frame width, doubling on the shadow side (light from upper left), tapered ends; pastel flats, each with a hard-edged darker shadow tone. Palette: cream #F5ECD6 paper/sky, sage #A9B490 foliage/drapery, pale gold #CFA55A halo/ornament, rose #DBA49C skin/flowers; the hero the story centres on in one stronger accent (e.g. #D97757). Wide frame: figure and a big ring-filled halo in the middle third, arched panels either side, behind them a muted-teal (sage plus grey) square-tile mosaic; whiplash vines, local flowers; a bottom band of serif capitals in the user's language, 1/25 of frame height. No plain area over 1/8 of frame. Almond eyes, heavy lids; hair or cloth in three-tone strands. Litho grain, paper mottle, vignette. Slow sway; tilt down to the halo, pull back. Avoid: thin clean lines, saturated colour, empty backgrounds.","file":"风格提示词/O_奥斯卡98部/O6_乱世春秋.md","img":"风格提示词/O_奥斯卡98部/O6_乱世春秋.jpg","year":"1932/33","tags":["2D"],"extra":[{"h":"技法关键词","t":["阿尔丰斯·慕夏","彩色石印","新艺术装饰纹样"]},{"h":"导演说明","t":"Clawd 是举杯的马里奥特家一员：丝质高礼帽、白领结、手持香槟碟。第 3 拍钟敲十二点、光环一闪，紧接着切到举杯，Clawd 一跳把杯子举起来。1:1 播放，两刀硬切，最后一个拉远停在整张海报上。"},{"h":"成片里的分镜","t":"1. 从 CAVALCADE 标题和奔马横饰带往下摇到钟面光环并推近；指针合到 XII，敲钟那一下光环一闪。（1.1s）\n2. 举杯中景：戴高礼帽、白领结的 Clawd 一跳，举起香槟碟，两侧的简和罗伯特也举杯；轻拉。（0.8s）\n3. 拉远到整幅慕夏装饰画：三只杯子举着，玫瑰花瓣飘落，底部是 LONDON · XXXI DECEMBER MDCCCXCIX · A NEW CENTURY 铭文带。（0.6s）"},{"h":"参考出处","t":["Frank Lloyd, 1933","Alphonse Mucha, The Seasons (1896)","Alphonse Mucha, Zodiac (1896)","Fox 1933 poster (the galloping horses)"]}]},{"id":"O7","s":"O","cat":"默片与有声 1927–1938","name":"一夜风流","en":"It Happened One Night","desc":"1934 年的黑白橡皮管卡通：粗细变化的墨线、饼切眼、白手套，赛璐璐平涂叠在灰阶水彩背景上，带胶片颗粒。和电影同一年，公路喜剧的笑点也适合卡通的节奏。","fit":"30 年代黑白橡皮管卡通","prompt":"30 年代初的黑白橡皮管卡通。角色：软管四肢、白手套、饼切眼、圆脑袋，三到四头身；墨线 #141414 粗细变化（画幅宽 1/400–1/150），背光一侧变粗（默认光从左上）；角色平涂只用纯黑、纯白，加至多一种浅灰作硬阴影，黑面一道高光。背景只用中间灰（明度 30%–80%），不用纯黑白：铅笔线不擦，灰色水彩罩染，边缘积水有颗粒沉淀。只有故事围绕的那个主角带颜色（如 #D97757）：整个身体，主角是人时只给关键道具。加 ±1 像素片门抖动、24 fps 颗粒（±4%）、闪烁、划痕、灰尘。动作都有预备、冲过头再回落：落地压扁、快动拉长、吃惊时弹眼，碰撞时镜头轻震。对标弗莱舍工作室的 Betty Boop 短片、迪士尼《糊涂交响曲》的背景。避免：光滑矢量线、角色发灰和背景糊在一起。","prompt_en":"Early-1930s black-and-white rubber-hose cartoon. Characters: noodle limbs, white gloves, pie-cut eyes, round heads; thick-thin ink #141414 (1/400-1/150 of frame width) swelling away from the light (default upper left); fills pure black and white plus at most one light grey for the hard shadow, gloss on blacks. Backgrounds stay mid-grey (30-80%), never pure black/white: graphite lines left in, grey watercolour washes with pooled edges and granulation, paper grain. Only the hero the story centres on has colour (e.g. #D97757): its whole body, or its one key prop if the hero is human. ±1 px gate weave, grain (±4%), flicker, scratches, dust. Actions anticipate, overshoot, settle: squash on landing, stretch on fast moves, eyes pop when surprised, a camera jolt on hits. References: Fleischer's Betty Boop shorts; Disney's Silly Symphonies backgrounds. Avoid: smooth vector lines, grey characters merging with the background.","file":"风格提示词/O_奥斯卡98部/O7_一夜风流.md","img":"风格提示词/O_奥斯卡98部/O7_一夜风流.jpg","year":"1934","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["弗莱舍橡皮管","赛璐璐上色","糊涂交响曲水彩背景","放映胶片磨损"]},{"h":"导演说明","t":"Clawd 扮彼得：灰色软呢帽、松开的条纹领带、一撇小胡子，手臂末端戴白手套。第 3–4 拍艾莉撩裙子，第 5 拍车急刹停下（只有这一下放回 1 倍速），Clawd 的目瞪口呆正好卡在这一下。两刀硬切：拇指 → 双人 → 收尾。"},{"h":"成片里的分镜","t":"1. Clawd 竖起的白手套大拇指和得意的脸，身后是空路，一辆车从坡顶开过来；慢推。（0.7s）\n2. 双人镜头：Clawd 在路边竖拇指，艾莉坐在栅栏上把裙摆撩到小腿；轻拉。（0.7s）\n3. 收尾全景：车在两人中间急刹，司机眼珠弹出来；Clawd 瞪大眼、张开双手，帽子跳起；急停那一下镜头一震。（1.1s）"},{"h":"参考出处","t":["Frank Capra, 1934","Fleischer Studios, Betty Boop (1932–34)","Disney, Silly Symphonies backgrounds","1934 Columbia one-sheet"]}]},{"id":"O8","s":"O","cat":"默片与有声 1927–1938","name":"叛舰喋血记","en":"Mutiny on the Bounty","desc":"18 世纪英国海军部海图的铜版画：恒向线、罗盘玫瑰、水深数字、手工淡彩，邦蒂号是图上的一幅船舶插画。这部片讲的是一次航行，所以整段都留在海图上。","fit":"海军部海图铜版画","prompt":"18 世纪末的铜版地图，默认是英国海军部海图（内陆题材换成测绘图）。明暗全靠刻刀细排线和交叉排线，线宽约画幅宽的 1/1200；线宽设下限，细小处变暗而不是消失。墨色 #1C1610 印在 #EFE3C4 直纹纸上，带淡霉斑和折痕。只上很薄的手工淡彩：沿水边的海蓝 #9EBCBC，陆地 #B8C08C；故事围绕的那个主角（如 #D97757）是唯一的浓色。32 向罗盘玫瑰拉出恒向线网、刻度边框、晕滃山形、装饰图名框、一个装饰物（如海怪）、衬线字。情节放进一幅不加边框的排线插画，排线向纸面渐隐；推到底时插画占画面高度 60%–75%。运镜：一个 5–6 秒的镜头从整张图滑进插画，四周留着地图；一条虚线路线自己画出来。避免：切出纸面、浓重水彩、僵硬的人物。","prompt_en":"A late-18th-century copperplate map, default an Admiralty sea chart (inland: a survey map). Fine burin hatching and cross-hatching (lines ~1/1200 of frame width) give all tone; a minimum line width makes small detail darken, not vanish. Ink #1C1610 on laid paper #EFE3C4, light foxing, folds. Thin hand colour: water #9EBCBC along edges, land #B8C08C; the hero the story centres on (e.g. #D97757) is the one strong colour. Rhumb lines from 32-point roses, a graduated border, hachured hills, cartouche, one ornament (e.g. a sea monster), serif lettering. Put the action in an unboxed engraved vignette fading into the chart, filling 60-75% of frame height at the end of the move. Camera: one 5-6 s glide from the whole sheet into the vignette, chart still around it; a dotted route inks itself in. Avoid: cropping the paper, heavy washes, stiff figures.","file":"风格提示词/O_奥斯卡98部/O8_叛舰喋血记.md","img":"风格提示词/O_奥斯卡98部/O8_叛舰喋血记.jpg","year":"1935","tags":["2D"],"extra":[{"h":"技法关键词","t":["18 世纪海军部海图","铜版线刻","手工淡彩","Robert Dodd 的版画"]},{"h":"导演说明","t":"Clawd 扮弗莱彻·克里斯蒂安：横戴双角帽、手持弯刀。整段不离开海图，一个镜头滑进去，不切。第 4 拍举刀，紧接着刀锋一闪指向小艇；最后几拍小艇往船尾漂开。"},{"h":"成片里的分镜","t":"1. 一镜到底：从整张海图开始，邦蒂号沿虚线航迹前进，镜头滑进图上的船舶插画，四周仍是恒向线和罗盘玫瑰；甲板上 Clawd 举起弯刀、指着布莱让他下船，小艇落到船尾，驶向帝汶的航迹在图上一路画出来。（2.5s）"},{"h":"参考出处","t":["Frank Lloyd, 1935","Robert Dodd, The Mutineers turning Lieut. Bligh… adrift (1790)","British Admiralty and Cook-voyage charts, 1770s–80s","Thomas Rowlandson"]}]},{"id":"O9","s":"O","cat":"默片与有声 1927–1938","name":"歌舞大王齐格飞","en":"The Great Ziegfeld","desc":"用 three.js 建的旋转螺旋“婚礼蛋糕”舞台，米高梅银色黑白：缎面、雪纺和鸵鸟羽毛衬在深黑里，只有 Clawd 是颜色。《A Pretty Girl Is Like a Melody》那座 175 级的螺旋舞台是这部片的名场面。","fit":"银色黑白 3D 螺旋婚礼蛋糕舞台","prompt":"真 3D 舞台大场面，调成 30 年代片厂银色黑白：把题材的世界搭成圆形分层转台上的歌舞布景，慢慢转（每秒约 3 度），挂满垂幔花环；题材里的人变成一排排穿戏服、有脸有手的合唱队。灰阶：戏服浅缎灰，布景中灰，褶皱大幕更深，剧场深黑；白色不到纯白。正面柔和主光，轮廓光更亮，把缎子和羽毛的边勾到近白。淡光柱，颗粒（±3%）。只有故事围绕的那个主角留色（如 #D97757），灯都渲染成白光。招牌镜头：贴低的中景沿层台看过去，人物占画面高度四分之一到三分之一，主角在前排。再接帷幕升起（3 秒）、10 秒吊臂上升，落到平视主角的中景。对标 Robert Z. Leonard《歌舞大王齐格飞》（1936）。避免：平均打光、没脸的锥形人、转得太快。","prompt_en":"Real 3D stage spectacle in 1930s studio silver: the subject's world built as a revue set on a round tiered platform turning about 3° per second, draped and garlanded; its people become rows of costumed chorus figures with faces and arms. Costumes light satin grey, set mid-grey, pleated curtain backdrop darker, theatre deep black; whites below pure white. Soft front key; brighter rim lights edging satin and feathers near-white. Faint shafts, grain (±3%). All neutral grey except the hero the story centres on (e.g. #D97757); lamps render white. Signature shot: low medium along the tiers, figures 1/4-1/3 of frame height, the hero on the front tier. Then a 3 s curtain rise, a 10 s crane up to a level medium of the hero. Reference: Robert Z. Leonard, *The Great Ziegfeld* (1936). Avoid: flat lighting, faceless cones, fast spinning.","file":"风格提示词/O_奥斯卡98部/O9_歌舞大王齐格飞.md","img":"风格提示词/O_奥斯卡98部/O9_歌舞大王齐格飞.jpg","year":"1936","tags":["3D·B&W"],"extra":[{"h":"技法关键词","t":["three.js 三维","米高梅银色黑白","1936 年歌舞大场面","鸵鸟羽毛与雪纺"]},{"h":"导演说明","t":"Clawd 是蛋糕顶上的明星：水钻头带上一丛鸵鸟羽毛像喷泉一样翻落。场景按 1.2 倍跑；明星留到最后一刀才露脸，第 5 拍它转身、一跳、双臂甩成 V 字。两刀硬切连起帷幕、吊臂和顶层。"},{"h":"成片里的分镜","t":"1. 正面低机位：雪纺帷幕从旋转的蛋糕舞台上飞起，一层层举扇的女郎露出来，顶上是小小的 Clawd；镜头往上仰。（0.9s）\n2. 沿螺旋吊臂上升，扫过羽毛扇、白色三角钢琴和小提琴手，停在顶层之下。（0.8s）\n3. 几乎平视的中景：顶上的 Clawd 戴鸵鸟羽毛头饰，转身面对镜头，双臂甩成 V 字；慢推。（0.8s）"},{"h":"参考出处","t":["Robert Z. Leonard, 1936","Cedric Gibbons and John Harkrider (sets and costumes)","Oliver T. Marsh, Ray June, George Folsey (cinematography)"]}]},{"id":"O10","s":"O","cat":"默片与有声 1927–1938","name":"左拉传","en":"The Life of Emile Zola","desc":"报纸活字印刷加 1890 年代线刻插图：木活字大标题、密排铅字正文，泛黄新闻纸上的油墨外扩和缺墨，人物用排线画。这部片最有名的画面就是 1898 年 1 月 13 日《震旦报》的《我控诉》头版。","fit":"报纸活字印刷 + 线刻插图","prompt":"1890 年代的报纸印刷。文字先排成清晰墨版再“印”：约 1 像素模糊加噪声阈值切边，做出油墨外扩、字边毛糙、局部缺墨、淡淡的背面镜像透字。版面语法：报头、横贯全宽的木活字大标题（约画面高度 1/6）、3–6 栏小字正文（用用户的语言，字高约画面 1/80）夹着一幅大线刻插图。木活字一字一块，带木纹。所有画面都是线刻：线宽约画幅宽 1/1000、间距约 1/400，顺着形体走，交叉排线只用在暗部，背光一侧轮廓加粗，远处用淡墨。暖黑 #17130F 印在新闻纸 #E8E0CC 上；故事围绕的那个主角单独一块强调色版（如 #D97757），套印偏 1–2 像素。动起来：活字块砸下、回弹、留下印迹；一个反复的机械动作，报纸翻页。避免：干净的数码字体、平滑灰调、其他颜色。","prompt_en":"1890s newspaper print. Set text as a sharp mask, then print: ~1 px blur and a noisy threshold for ink spread, ragged edges, under-inked patches, faint mirrored show-through. Page grammar: masthead, a wood-type headline across the width (~1/6 of frame height), 3-6 columns of small type in the user's language (~1/80 of frame height) flanking one large engraved picture. Wood-type letters are grained blocks. Everything pictured is a line engraving: hatching lines about 1/1000 of frame width, spaced 1/400, following the form, cross-hatching only in darks, heavier shadow-side contours, paler distance. Warm black #17130F on newsprint #E8E0CC; the hero the story centres on gets one accent plate (e.g. #D97757), offset 1-2 px. Motion: type blocks slam down, bounce and leave their print; one repeating mechanical motion, pages turning. Avoid: clean digital type, smooth grey shading, other colours.","file":"风格提示词/O_奥斯卡98部/O10_左拉传.md","img":"风格提示词/O_奥斯卡98部/O10_左拉传.jpg","year":"1937","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["木活字大标题","新闻纸活字印刷","1890 年代线刻"]},{"h":"导演说明","t":"Clawd 扮左拉：夹鼻眼镜、鹅毛笔、手里拿着当天的报纸。第 2 拍最后一个字母落下，整版一震；第 3 拍它从报纸上抬头，鹅毛笔高高举起。场景按 1.05 倍跑，两刀硬切：大标题 → 左拉 → 印刷机。"},{"h":"成片里的分镜","t":"1. 《震旦报》头版特写（JEUDI 13 JANVIER 1898）：“J'Accuse…!”的木活字一个个砸下来，最后一个落下时整版一震；镜头推近。（0.9s）\n2. 中景：扮左拉的 Clawd 站在头版前，从手里的报纸上抬起头，一跳，把鹅毛笔高高举起，右边报童在叫卖；轻拉。（0.8s）\n3. 轮转印刷机在转，印刷工举起湿报纸，报纸一张张飞出来；镜头拉远并向右移。（0.8s）"},{"h":"参考出处","t":["William Dieterle, 1937","L'Aurore front page, 13 January 1898","Le Petit Journal and L'Illustration line engravings","Marinoni rotary press"]}]},{"id":"O11","s":"O","cat":"默片与有声 1927–1938","name":"浮生若梦","en":"You Can't Take It with You","desc":"30 年代 WPA 丝网海报：六色不透明平涂油墨、分色渐变、轻微套印错位，印在棉浆纸上。1936–39 年联邦艺术计划的海报就是这部片同年代的美国平面语言，也和第 10 部的报纸拉开距离。","fit":"WPA 丝网海报","prompt":"1936–39 年 WPA 联邦艺术计划的丝网海报。六色不透明油墨从浅到深套印，后印的版要在不该盖住的浅色形（云、太阳、高光）处镂空：奶油 #F0E2C0 给光和云，赭 #E0A842、朱红 #C84A2A 给天空和暖色面，青 #22686E 给水和阴影，主角专用色（如 #D97757，只用在故事围绕的那个主角身上），最后印深棕描边 #322018。阴影是深一色叠印，不用灰。大面积用分色渐变：两色 2–3 级粗台阶，中间一级是两色叠印。每版套偏 1–3 像素，模版边缘游移，刮板拖痕、漏印，平涂上都有暖色棉浆纸纹（±5%）。人物占画面高度二分之一到三分之二：大块面、月牙形暗面、棕色描边、脸有表情。留一条粗体大写标题，用用户的语言。慢推，一版一版弹出来。避免：网点、平滑渐变、干净的矢量平涂。","prompt_en":"A 1936-39 WPA (Federal Art Project) silkscreen poster. Six opaque inks printed light to dark, each later screen cut away around lighter shapes (clouds, sun): cream #F0E2C0 for light, ochre #E0A842 and vermilion #C84A2A for sky and warm planes, teal #22686E for water and shade, the hero's own ink (e.g. #D97757, only on the hero the story centres on), brown keyline #322018 last. Shadows: a darker ink overprinted, never grey. Big areas get split-fountain blends: two inks in 2-3 coarse steps, the middle one their overprint. Screens 1-3 px off register; wandering stencil edges, squeegee streaks, warm rag-paper grain (±5%) on every flat. Figures fill 1/2-2/3 of frame height: big planes, crescent shadows, expressive faces. A bold capital title band, user's language. Slow pushes; screens pop in one by one. Avoid: halftone dots, smooth gradients, clean vector flats.","file":"风格提示词/O_奥斯卡98部/O11_浮生若梦.md","img":"风格提示词/O_奥斯卡98部/O11_浮生若梦.jpg","year":"1938","tags":["2D"],"extra":[{"h":"技法关键词","t":["30 年代 WPA 丝网印","分色渐变","六色不透明平涂油墨"]},{"h":"导演说明","t":"Clawd 扮凡德霍夫爷爷：圆形金属框眼镜、口琴，拐杖靠在椅子边。一屋子人各干各的，地下室的烟花在最后一镜里越炸越大。两刀硬切：客厅 → 口琴 → 烟花。"},{"h":"成片里的分镜","t":"1. 整个凡德霍夫家客厅，像一张海报：Clawd 扮爷爷，戴圆眼镜坐在青色扶手椅里吹口琴，埃西在窗前踮脚跳舞，科伦科夫高喊拍子，德皮纳从地下室活板门里探出头；轻拉。（0.8s）\n2. Clawd 近景：圆眼镜、口琴，音符往上飘，德皮纳在画面边上；推近。（0.6s）\n3. 回到客厅，地下室的烟花炸开：火箭、星爆和烟柱填满屋子；镜头拉远。（1.1s）"},{"h":"参考出处","t":["Frank Capra, 1938","WPA Federal Art Project silkscreen posters, 1936–39","1938 Columbia one-sheet"]}]},{"id":"O12","s":"O","cat":"彩色与战争 1939–1949","name":"乱世佳人","en":"Gone with the Wind","desc":"厚涂油画：刮刀色块、颜料堆起的棱，Technicolor 的热度——从金色烧到血红的天空、红土、黑色剪影。全片的色彩从《乱世佳人》开始降临，第一张满色画面就是夕阳下的塔拉。","fit":"Technicolor 厚涂油画","prompt":"1939 年 Technicolor 配色的厚涂油画。刮刀色块：天空用长条横向色带（长为画幅宽的 1/15–1/6，厚约 1/60），地面和人物用顺形体的短笔触，之间留出平静、薄涂的区域；颜料棱受左上方的光，越亮越厚，薄处露布纹。默认是落日天空，从酒红 #3A0912 经大红 #A8241A、橙 #F27A22 烧到金 #FFD878；地面红褐 #6E2214；剪影是带暖意的近黑；故事围绕的那个主角保持看得清的暖中间调（如 #D97757），不做成剪影。强逆光，金色轮廓光；近景加一道暖色侧光照亮半边脸和手。构图像史诗海报：大块深色剪影（树、房子、岩石、人物）压在低地平线上。灯火用油画火焰。运镜：全景慢推，低机位推近主角，最后吊臂升起看大景。避免：大小一样的碎块铺满画面、脏棕色、平滑渐变。","prompt_en":"Impasto oil in a 1939 Technicolor palette. Palette-knife slabs: long horizontal sky bands (1/15-1/6 of frame width long, about 1/60 tall), shorter strokes following form on land and figures, calm thin areas between; ridges lit from upper left, paint thickest in highlights, canvas weave where thin. Default sunset sky: wine #3A0912, red #A8241A, orange #F27A22, gold #FFD878; ground red-brown #6E2214; warm near-black silhouettes. The hero the story centres on stays a readable warm mid-tone (e.g. #D97757), never a silhouette. Strong backlight, gold rims; in close shots a warm side light on half the face and hands. Epic-poster composition: big dark silhouettes (trees, buildings, rocks, figures) on a low horizon. Lamps as painted flames. Camera: slow push on the wide, low push-in on the hero, crane up to a vista. Avoid: tiled same-size strokes, muddy browns, smooth gradients.","file":"风格提示词/O_奥斯卡98部/O12_乱世佳人.md","img":"风格提示词/O_奥斯卡98部/O12_乱世佳人.jpg","year":"1939","tags":["2D"],"extra":[{"h":"技法关键词","t":["厚涂油画","刮刀","1939 年 Technicolor 配色","史诗海报画"]},{"h":"导演说明","t":"Clawd 扮斯嘉丽：系绿缎带的宽檐草帽，手里一根萝卜。前 7 拍天空从金色烧到血红，第 6 拍举起萝卜。四刀硬切走过塔拉、发誓、亚特兰大和车站，最后 5 拍是一条升降长镜头。"},{"h":"成片里的分镜","t":"1. 塔拉剪影全景：大橡树、白房子和雪松黑压压地立在从金色烧向血红的天空下，Clawd 站在红土丘上拿着萝卜；慢推。（1.7s）\n2. 压低地平线推近，背后是燃烧的天空：戴绿缎带宽檐草帽的 Clawd 把萝卜高高举起，逆光一圈金边。（1s）\n3. Clawd 脸和草帽的近景，缎带尾巴在风里翻飞。（0.4s）\n4. 亚特兰大大火：马车冲过燃烧的仓库和木构架，Clawd 坐在瑞德旁边的驾座上，后面是普莉西和梅兰妮；镜头跟着横移，前景火舌掠过。（1.5s）\n5. 火车站一条升降长镜头：从站在伤兵中间的 Clawd 一路升高后退，一排排伤兵铺满红土直到地平线，场中一面破旗，Clawd 只剩一个橙色小点。（2.1s）"},{"h":"参考出处","t":["Victor Fleming, 1939","Ernest Haller and Ray Rennahan (Technicolor cinematography)","William Cameron Menzies (production design)","1939 poster"]}]},{"id":"O13","s":"O","cat":"彩色与战争 1939–1949","name":"蝴蝶梦","en":"Rebecca","desc":"粗纹纸上的炭笔画：天鹅绒般的黑、抹开的灰，月光和雾用橡皮擦出来。希区柯克的《蝴蝶梦》是一场黑白哥特梦，庄园先在雾里、后在火里，炭笔两样都画得出来。","fit":"哥特炭笔画","prompt":"有纹的纸上画炭笔。纸纹细（颗粒约画幅宽 1/600）：轻压只挂纹峰，重压填满纹谷。颗粒只在中间调；黑如天鹅绒，擦白是干净纸面。明暗：约六成画面暗到中灰，一成半深黑，在最近的前景和最大块面上，亮处少。炭色 #121111，纸色 #EEECE7。笔法：藤炭干笔断线，炭条侧锋顺形体宽扫（宽为画幅宽 1/60–1/30），排线，手指抹，橡皮擦出边光和光晕；雾是在铺好的灰调上横向擦出来的（如 William Kentridge 的动画素描）。只有故事围绕的那个主角用粉彩（如 #D97757），铺得较实、透点纸纹，炭笔勾边；火焰保持炭黑和纸白。月光从上方来，两三层雾带不同速横漂。运镜：主观镜头慢推，前景向两边分开。避免：数码噪点、光滑的数码光晕、发灰的黑、空亮的天空。","prompt_en":"Charcoal on toothed paper. Fine tooth (grain ~1/600 of frame width): light pressure catches only the peaks, heavy pressure fills the valleys. Grain only in midtones; velvet blacks, clean-paper lifts. Values: ~60% dark-to-mid grey, 15% deep black in the nearest foreground and largest masses, lights small. Charcoal #121111 on paper #EEECE7. Marks: broken vine lines, side-of-the-stick sweeps (1/60-1/30 of frame width) following form, hatching, finger smudges, eraser lifts for edges and glows; mist is horizontal streaks erased out of a toned area (as in William Kentridge's animated drawings). Only the hero the story centres on is in pastel (e.g. #D97757), laid fairly solid, tooth peeking through, outlined in charcoal; flames stay charcoal-and-paper. Moonlight from above; 2-3 fog bands drift at different speeds. Camera: slow subjective push, foreground parting. Avoid: digital noise, smooth digital glows, grey blacks, empty bright skies.","file":"风格提示词/O_奥斯卡98部/O13_蝴蝶梦.md","img":"风格提示词/O_奥斯卡98部/O13_蝴蝶梦.jpg","year":"1940","tags":["2D·B&W"],"extra":[{"h":"技法关键词","t":["藤炭笔","橡皮擦白与手指抹开","William Kentridge","哥特悬疑"]},{"h":"导演说明","t":"Clawd 扮第二任德温特夫人：天鹅绒发箍、开衫，仰望庄园。开场的梦境推进里没有它；接着三刀硬切：Clawd → 起火的庄园 → 丹弗斯太太。每一镜都在往里推，2.5 秒一路推向大火。"},{"h":"成片里的分镜","t":"1. 沿着荒草蔓生的月下车道主观推进，树林分开，雾里露出曼德利，几扇本不该亮的窗亮着灯。（0.9s）\n2. Clawd 近景，扮第二任德温特夫人：天鹅绒发箍、开衫翻领，身后是曼德利；慢推。（0.6s）\n3. 月光下的曼德利，镜头推近，火从一扇扇窗里烧起来。（0.5s）\n4. 丹弗斯太太一动不动站在燃烧的窗口，双手交叠，冷脸被平光照着；镜头往她脸上推。（0.5s）"},{"h":"参考出处","t":["Alfred Hitchcock, 1940","George Barnes (cinematography)","William Kentridge (charcoal animation)","Odilon Redon, the noirs"]}]},{"id":"O14","s":"O","cat":"彩色与战争 1939–1949","name":"青山翠谷","en":"How Green Was My Valley","desc":"用 1941 年原海报金黄加绿配色的不透明水粉：扎实的色块、煤黑的渣山、Kyffin Williams 式厚重的深色山体和断续描边。用水粉而不用木刻，和第 3 部区分开；画的是矿工唱着歌走下山谷回家。","fit":"威尔士山谷水粉","prompt":"仿威尔士画家 Kyffin Williams 的不透明水粉。方向性笔触宽为画幅宽 1/80–1/40，长是宽的 2–5 倍，边缘毛糙，完全覆盖；房子、墙、山脊用断续深色短线勾边；暗山上刮几笔亮绿或灰蓝。色板：天空和光淡金 #F1C565（别成芥末黄），田野绿 #86A03F，暗部煤黑 #1D1B1E，远山和水面灰蓝 #48505E，小点缀黄 #F6CF2F，其他颜色由这几色调出；故事围绕的那个主角用 #D97757，至少占画面高八分之一。田野和天空偏亮（约六成），山和房子偏暗。暖色调色不超过一成，暗角，颗粒。默认傍晚低角度侧光，田野受光，山脊有轮廓光。从高处真透视取景，一条路把视线引下去；小房子（或墙、石块）顺山坡一级级排开。动起来：烟或云循环飘动，横向跟拍。避免：水彩透明感、矢量平涂、发暗发脏。","prompt_en":"Opaque gouache after Welsh painter Kyffin Williams. Directional strokes 1/80-1/40 of frame width, 2-5 times as long, ragged, fully covering; broken dark dashes outline buildings, walls and ridges; dark hills flecked with lighter green or slate knife marks. Palette: sky and light pale gold #F1C565 (not mustard), fields green #86A03F, darks coal #1D1B1E, far hills and water slate #48505E, small accents yellow #F6CF2F, other colours mixed from these; the hero the story centres on #D97757, at least 1/8 of frame height. Fields and sky light (~60%), hills and buildings dark. Warm grade under 10%, vignette, grain. Default low late-afternoon side light: fields lit, ridges rim-lit. From high ground in true perspective, a path leading the eye down; small repeated buildings (or walls, rocks) stepping along slopes. Motion: looping smoke or cloud, a lateral track. Avoid: watercolour transparency, vector fills, mud.","file":"风格提示词/O_奥斯卡98部/O14_青山翠谷.md","img":"风格提示词/O_奥斯卡98部/O14_青山翠谷.jpg","year":"1941","tags":["2D"],"extra":[{"h":"技法关键词","t":["不透明水粉","Kyffin Williams 刮刀风景","1941 原海报配色"]},{"h":"导演说明","t":"Clawd 扮少年休：粗花呢平顶帽、打结的红围巾、一枝黄水仙。先坐在山顶看山谷，再跟着唱歌的矿工齐步走下街。两刀硬切：山谷 → 井架大轮 → 街道。"},{"h":"成片里的分镜","t":"1. 山顶黄水仙丛里俯瞰：戴
